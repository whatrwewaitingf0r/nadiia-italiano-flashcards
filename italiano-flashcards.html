 · DOCX paragraph 6936"},{"it":"la maledizione","other":"curse","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-10","sourceParagraph":6936,"note":"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6937"},{"it":"il bosco","other":"forest","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-10","sourceParagraph":6937,"note":"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6938"},{"it":"l’anziana","other":"elderly woman","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-10","sourceParagraph":6938,"note":"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6939"},{"it":"il camino","other":"fireplace","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-10","sourceParagraph":6939,"note":"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6940"},{"it":"Parte 5 – Triora: il paese delle streghe","other":"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"reading","reading":"lettura-11","sourceParagraph":7029,"note":"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7030","sourceText":"🧙 Le Grandi Leggende delle Streghe Italiane\nParte 5 – Triora: il paese delle streghe\nNota storica\n\nTra il 1587 e il 1589 il piccolo borgo ligure di Triora fu teatro di uno dei più celebri processi per stregoneria della storia italiana. I fatti principali – la carestia, le indagini e i processi – sono documentati da fonti storiche. Le presunte attività delle streghe, invece, appartengono alle accuse dell’epoca e alle leggende nate successivamente.\n\n🌞 Prima di leggere\nVocabolario\n🏰 il borgo = village\n🌾 la carestia = famine\n🍞 il raccolto = harvest\n⚖️ il processo = trial\n👩‍⚖️ il magistrato = magistrate\n⛓️ la prigione = prison\n🗣️ la diceria = rumor\n😨 il sospetto = suspicion\n📜 il verbale = official record\n👥 la folla = crowd\n\n📖 L’inizio della paura\nTra le montagne della Liguria occidentale si trova Triora, un piccolo borgo medievale costruito su uno sperone di roccia.\nOggi è un luogo tranquillo, visitato da turisti provenienti da tutto il mondo.\nPiù di quattrocento anni fa, però, la situazione era molto diversa.\nNegli anni 1587–1588 la popolazione attraversò un periodo molto difficile.\nIl raccolto fu scarso.\nIl prezzo del grano aumentò.\nMolte famiglie facevano fatica a procurarsi il pane.\nQuando una comunità vive una crisi così grave, spesso cerca qualcuno da incolpare.\nA Triora iniziarono a circolare strane voci.\nAlcuni abitanti dicevano che certe donne si riunissero di notte.\nAltri sostenevano che praticassero la magia e fossero responsabili della carestia.\nLe dicerie si diffusero rapidamente.\nBen presto le autorità decisero di aprire un’inchiesta.\n\n📖 Il processo\nDiversi abitanti del paese furono interrogati.\nAlcune donne vennero arrestate.\nI verbali raccontano accuse molto diverse tra loro.\nC’era chi affermava di aver visto riunioni notturne.\nChi sosteneva che alcune persone avessero lanciato maledizioni.\nChi raccontava di animali misteriosi e di strani rumori nei boschi.\nCome accadeva spesso nei processi dell’epoca, molte testimonianze si basavano su racconti sentiti da altri e non su fatti osservati direttamente.\nIn alcuni casi gli interrogatori furono accompagnati dalla tortura.\nPer questo motivo gli storici ritengono che molte confessioni non possano essere considerate attendibili.\nNonostante ciò, il processo continuò per mesi.\nAlcuni imputati morirono durante la prigionia.\nAltri vennero trasferiti a Genova per ulteriori interrogatori.\n\n📖 La nascita della leggenda\nCon il passare del tempo il processo terminò.\nMa la storia non fu dimenticata.\nAnzi.\nOgni generazione aggiunse nuovi particolari.\nSi iniziò a raccontare che le streghe si incontrassero nei boschi.\nChe preparassero pozioni misteriose.\nChe evocassero spiriti durante la notte.\nMolte di queste storie non compaiono nei documenti del processo.\nNacquero molto tempo dopo.\nCosì la storia reale e il folclore finirono per mescolarsi.\nÈ proprio questo che rende Triora così affascinante.\n\n🌍 Triora oggi\nPasseggiando per il paese si incontrano ancora:\n🧙 statue dedicate alle streghe.\n🏛️ il Museo Regionale Etnografico e della Stregoneria, che racconta la storia dei processi e delle tradizioni popolari.\n🪨 antichi vicoli medievali.\n🏰 case in pietra quasi immutate da secoli.\nOgni anno molti visitatori arrivano per conoscere la vera storia di Triora e distinguere i fatti documentati dalle leggende.\n\n🌍 Curiosità\n🏰 La Salem italiana?\nTriora viene spesso chiamata “la Salem d’Italia”.\nIl paragone nasce perché entrambe le località sono famose per i processi alle streghe.\nTuttavia i fatti avvennero in epoche diverse: quelli di Triora si svolsero alla fine del Cinquecento, mentre i celebri processi di Salem, nel Massachusetts, risalgono al 1692.\n\n📚 Un museo dedicato alla storia\nIl museo di Triora non cerca di dimostrare l’esistenza delle streghe.\nEspone invece documenti, oggetti e ricostruzioni che aiutano a comprendere la mentalità dell’epoca e le cause storiche dei processi.\n\n🌫️ Un paese perfetto per una leggenda\nTriora è circondata da boschi e montagne.\nQuando arriva la nebbia, il borgo assume un’atmosfera molto suggestiva.\nMolti scrittori e registi hanno scelto questo luogo come ambientazione per racconti misteriosi.\n\n📜 Documento storico\nNegli archivi sono conservati i verbali originali dei processi di Triora.\nEssi mostrano che molte accuse nacquero durante un periodo di grave crisi economica e alimentare.\nPer gli storici questi documenti rappresentano una testimonianza preziosa del modo in cui paura, fame e tensioni sociali possano influenzare il comportamento di una comunità.\n\n⭐ Conclusione dell’Unità\nAbbiamo viaggiato attraverso cinque delle storie più famose della stregoneria italiana.\nAbbiamo conosciuto il misterioso Noce di Benevento, il processo di Matteuccia di Todi, le inquietanti Janare, le enigmatiche Masche del Piemonte e, infine, il borgo di Triora.\nIn ogni lezione abbiamo scoperto che dietro le leggende si nascondono persone reali, documenti storici, paure collettive e tradizioni tramandate per secoli.\nForse il vero mistero non è capire se le streghe siano mai esistite.\nIl vero mistero è comprendere perché, in epoche e luoghi diversi, così tante persone abbiano creduto alle stesse storie.\nEd è proprio questo che rende il folclore una finestra straordinaria sulla storia, sull’antropologia e sulla natura umana."},{"it":"il borgo","other":"village","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-11","sourceParagraph":7037,"note":"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7038"},{"it":"la carestia","other":"famine","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-11","sourceParagraph":7038,"note":"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7039"},{"it":"il raccolto","other":"harvest","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-11","sourceParagraph":7039,"note":"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7040"},{"it":"il processo","other":"trial","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-11","sourceParagraph":7040,"note":"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7041"},{"it":"il magistrato","other":"magistrate","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-11","sourceParagraph":7041,"note":"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7042"},{"it":"la prigione","other":"prison","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-11","sourceParagraph":7042,"note":"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7043"},{"it":"la diceria","other":"rumor","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-11","sourceParagraph":7043,"note":"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7044"},{"it":"il sospetto","other":"suspicion","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-11","sourceParagraph":7044,"note":"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7045"},{"it":"il verbale","other":"official record","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-11","sourceParagraph":7045,"note":"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7046"},{"it":"la folla","other":"crowd","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"vocabulary","reading":"lettura-11","sourceParagraph":7046,"note":"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7047"},{"it":"Parte 6 – I luoghi più misteriosi d’Italia","other":"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"reading","reading":"lettura-12","sourceParagraph":7125,"note":"Liam · Lettura · Parte 6 – I luoghi più misteriosi d’Italia · DOCX paragraph 7126","sourceText":"🧙 Le Grandi Leggende delle Streghe Italiane\nParte 6 – I luoghi più misteriosi d’Italia\nNota storica\n\nI luoghi descritti in questa lezione esistono realmente. Le leggende che li riguardano fanno parte del patrimonio culturale italiano. Alcune si basano su eventi storici, altre su racconti popolari tramandati per secoli. Gli elementi soprannaturali non sono confermati da prove storiche.\n\n🌊 1. Il Lago di Pilato (Marche)\nTra le montagne dei Monti Sibillini, a oltre 1.900 metri di altitudine, si trova uno dei laghi più misteriosi d’Italia.\nSecondo una leggenda medievale, dopo la morte di Ponzio Pilato, il governatore romano che autorizzò la crocifissione di Gesù, il suo corpo fu caricato su un carro trainato da buoi.\nGli animali, impazziti, avrebbero percorso montagne e vallate fino a precipitare nel lago.\nDa quel momento il luogo sarebbe stato maledetto.\nNel Medioevo molti credevano che maghi e negromanti raggiungessero il lago durante la notte per evocare demoni e imparare formule magiche.\nLe autorità dell’epoca presero queste storie molto sul serio.\nIn alcuni periodi fu addirittura vietato avvicinarsi al lago.\nOggi gli storici ritengono che queste leggende siano nate dall’isolamento del luogo e dal fascino che il lago esercitava sui viaggiatori medievali.\n\n⛰️ 2. La Grotta della Sibilla\nSempre nei Monti Sibillini si trova un’altra delle grandi leggende italiane.\nPer oltre settecento anni i viaggiatori raccontarono dell’esistenza di una grotta nascosta nella montagna.\nLì avrebbe vissuto la Sibilla Appenninica, una donna dotata di poteri straordinari.\nSecondo alcuni racconti era una profetessa.\nSecondo altri era una fata.\nAltri ancora la descrivevano come una potente maga.\nNel XV secolo il cavaliere francese Antoine de La Sale scrisse un celebre racconto di viaggio nel quale descrisse la montagna e riportò le storie ascoltate dagli abitanti.\nAncora oggi migliaia di escursionisti percorrono i sentieri del Monte Sibilla per raggiungere l’ingresso della grotta.\n\n🌲 3. Il Bosco del Cansiglio\nTra Veneto e Friuli-Venezia Giulia si estende il grande Bosco del Cansiglio.\nPer secoli i boscaioli raccontarono di udire voci tra gli alberi durante la notte.\nAlcuni sostenevano di vedere piccole luci muoversi nel bosco.\nAltri parlavano di donne misteriose vestite di bianco.\nOggi sappiamo che fenomeni naturali, come il vento, gli animali notturni o i giochi di luce, possono creare impressioni molto suggestive.\nTuttavia il Cansiglio continua ancora oggi a essere uno dei boschi più misteriosi d’Italia.\n\n🪨 4. Le incisioni della Val Camonica\nIn Lombardia, nella Val Camonica, si trovano oltre 140.000 incisioni rupestri, realizzate nell’arco di migliaia di anni.\nMolte raffigurano uomini armati, animali, scene di caccia e simboli misteriosi.\nPer secoli gli abitanti pensarono che quei segni fossero stati lasciati da streghe, giganti o creature soprannaturali.\nSolo nell’Ottocento gli archeologi iniziarono a comprenderne la vera origine.\nOggi sappiamo che furono incisi da popolazioni preistoriche.\nLa Val Camonica è stata il primo sito italiano inserito nella lista del Patrimonio Mondiale dell’UNESCO.\n\n🌋 5. L’Etna e le streghe\nAnche il vulcano Etna, in Sicilia, è protagonista di numerose leggende.\nAlcuni racconti popolari narrano che, durante le notti di tempesta, le streghe si riunissero sulle sue pendici.\nAltri sostenevano di vedere strane luci tra la lava.\nOggi sappiamo che molte di queste luci possono essere spiegate dai fenomeni vulcanici.\nMa il vulcano continua ad alimentare l’immaginazione di chi lo osserva.\n\n🌍 Perché questi luoghi sono diventati leggendari?\nQuasi tutti hanno qualcosa in comune.\nSono:\n🌲 isolati.\n🌫️ avvolti dalla nebbia.\n🏔️ difficili da raggiungere.\n🌋 caratterizzati da fenomeni naturali insoliti.\nNel passato questi ambienti apparivano misteriosi.\nQuando non esistevano spiegazioni scientifiche, era naturale creare racconti per spiegare ciò che sembrava inspiegabile.\nPer questo motivo montagne, boschi e laghi sono presenti nelle leggende di quasi tutte le culture del mondo.\n\n📜 Un viaggiatore del Quattrocento\nNel XV secolo molti pellegrini raccontavano di aver sentito dire che il Lago di Pilato fosse un luogo proibito.\nAlcuni scrivevano di aver visto persone evitare quelle acque anche durante il giorno.\nNon sappiamo quanto vi fosse di vero.\nMa sappiamo che la fama del lago era già diffusa in tutta Europa.\n\n⭐ Curiosità finali\n🏔️ Il Monte Sibilla ha dato il nome all’intera catena dei Monti Sibillini.\n🌊 Il Lago di Pilato è l’unico lago naturale delle Marche.\n🪨 Le incisioni della Val Camonica raccontano la vita di popolazioni vissute migliaia di anni prima dei Romani.\n🌲 Il Bosco del Cansiglio è uno dei boschi meglio conservati d’Italia.\n🧙 Quasi tutte le regioni italiane possiedono almeno una leggenda legata a streghe, fate, spiriti o creature misteriose.\n\n🎓 Fine del viaggio\nAbbiamo visitato processi realmente documentati, antiche leggende, villaggi medievali, montagne, laghi e boschi che hanno alimentato l’immaginazione degli italiani per secoli.\nLa cosa più interessante è che queste storie ci parlano molto meno della magia e molto di più delle persone.\nCi raccontano come gli esseri umani affrontavano la paura, cercavano spiegazioni per ciò che non comprendevano e trasformavano gli eventi più misteriosi in racconti destinati a sopravvivere per generazioni.\nForse è proprio questo il vero incantesimo delle leggende: non quello di cambiare il mondo, ma quello di continuare a farci immaginare."},{"it":"Parte 7 – Le streghe nel mondo","other":"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"reading","reading":"lettura-13","sourceParagraph":7203,"note":"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7204","sourceText":"🧙 Le Grandi Leggende delle Streghe\nParte 7 – Le streghe nel mondo\nNota\n\nQuasi ogni civiltà della storia ha creato racconti su streghe, maghe, spiriti femminili o esseri soprannaturali. Alcune figure derivano dalla religione, altre dal folclore popolare. In questa lezione scopriremo come culture molto lontane abbiano inventato personaggi sorprendentemente simili.\n\n🌍 Perché esistono le streghe in quasi tutte le culture?\nGli antropologi si sono posti questa domanda per molti anni.\nCom’è possibile che popoli separati da migliaia di chilometri abbiano inventato storie così simili?\nSecondo molti studiosi esistono diverse spiegazioni.\nLe persone avevano paura delle malattie, delle tempeste, della morte e dell’ignoto.\nQuando non esistevano spiegazioni scientifiche, era naturale attribuire questi eventi a esseri soprannaturali.\nLe leggende servivano anche a trasmettere insegnamenti.\nMolte storie mettevano in guardia i bambini dal pericolo di allontanarsi da casa o di entrare nei boschi da soli.\nAltre spiegavano perché fosse importante rispettare certe regole della comunità.\nCosì nacquero figure diverse, ma con caratteristiche spesso molto simili.\n\n🇷🇺 Baba Jaga\nUna delle figure più famose del folclore slavo è Baba Jaga.\nVive in una capanna costruita su enormi zampe di gallina.\nSecondo le leggende vola dentro un mortaio gigante e usa un pestello per dirigere il volo.\nA volte aiuta gli eroi.\nAltre volte li mette alla prova.\nPuò essere crudele oppure sorprendentemente saggia.\nPer questo motivo Baba Jaga è molto diversa dall’immagine moderna della strega cattiva.\n\n🇷🇴 Gli Strigoi\nIn Romania esistono gli Strigoi.\nSecondo il folclore sono spiriti o persone che ritornano dopo la morte.\nSi diceva che potessero tormentare le famiglie, provocare malattie o portare sfortuna.\nMolte tradizioni rumene nacquero per proteggere i villaggi da questi esseri.\nGli studiosi ritengono che queste leggende abbiano influenzato anche il mito moderno dei vampiri.\n\n🇬🇷 Lamia\nNell’antica Grecia si raccontava la storia di Lamia.\nSecondo il mito era una regina trasformata in mostro.\nCon il passare dei secoli divenne una creatura che spaventava i bambini e viveva lontano dalle città.\nIn alcune versioni era un mostro.\nIn altre una maga.\nIl suo racconto cambiò molte volte nel corso della storia.\n\n🇯🇵 Yamauba\nTra le montagne del Giappone vive, secondo il folclore, la Yamauba.\nÈ descritta come una vecchia donna che abita nei boschi.\nAlcune storie la presentano come un mostro pericoloso.\nAltre raccontano che aiuti i viaggiatori smarriti.\nAnche questa figura, come Baba Jaga, non è completamente buona né completamente cattiva.\n\n🇫🇷 Le sorcières\nIn Francia le streghe vengono chiamate sorcières.\nDurante il Medioevo e l’età moderna molte donne furono accusate di praticare la magia.\nLe loro storie sono molto simili a quelle italiane.\nAnche qui gli storici ritengono che paura, superstizione e tensioni sociali abbiano avuto un ruolo importante nelle accuse.\n\n🇩🇪 Le Hexen\nIn Germania le streghe sono chiamate Hexen.\nLa tradizione tedesca racconta che nella notte del 30 aprile, chiamata Notte di Valpurga (Walpurgisnacht), le streghe si riunissero sul monte Brocken, la cima più alta dei monti Harz.\nQuesta leggenda è diventata così famosa da ispirare libri, opere teatrali e persino il Faust di Johann Wolfgang von Goethe.\nAncora oggi in alcune città tedesche si organizzano feste popolari dedicate a questa antica tradizione.\n\n🌎 Che cosa hanno in comune?\nQuasi tutte queste figure:\n🌙 vivono vicino alla natura.\n🌲 frequentano boschi o montagne.\n🌿 conoscono le erbe.\n🦉 sono attive soprattutto di notte.\n😨 fanno paura, ma non sempre sono malvagie.\n📚 raccontano qualcosa delle paure e delle speranze delle persone che le hanno immaginate.\n\n🤔 Una domanda per gli antropologi\nGli studiosi non cercano di capire se queste creature siano realmente esistite.\nSi chiedono invece:\nPerché popoli che non si conoscevano hanno inventato storie così simili?\nForse gli esseri umani, ovunque vivano, condividono le stesse paure.\nLa notte.\nI boschi.\nLe malattie.\nL’ignoto.\nPer questo motivo le leggende cambiano nome e lingua, ma spesso raccontano la stessa storia.\n\n⭐ Curiosità finali\n📚 La parola italiana strega deriva dal latino strix.\n🧙 L’inglese witch deriva dall’antico inglese wicce (forma femminile) e wicca (forma maschile).\n🇫🇷 In francese sorcière deriva dal latino sortiarius, legato al destino e agli incantesimi.\n🇩🇪 Il tedesco Hexe deriva da un’antica parola germanica che indicava una figura associata alla magia.\n🌍 Nonostante le differenze culturali, quasi ogni civiltà ha creato racconti su donne misteriose, maghe o esseri soprannaturali.\n\n🎓 Conclusione finale\nDopo questo viaggio possiamo capire che la figura della strega è molto più complessa di quella che vediamo nelle fiabe.\nPer alcuni era una guaritrice.\nPer altri una saggia.\nPer altri ancora una persona da temere.\nLe storie cambiano da un Paese all’altro, ma ci insegnano tutte la stessa cosa: ogni società usa le leggende per spiegare ciò che ancora non comprende.\nEd è proprio per questo che, dopo migliaia di anni, continuiamo ancora a raccontarle.\n"},{"it":"La formula attribuita a Matteuccia","other":"Ointment, ointment, send me to the walnut tree of Benevento, above the water and above the wind, and above every other bad weather. The reading warns that the words may have been recorded under interrogation pressure.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-08","sourceParagraph":6803,"note":"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6804","sourceExcerpt":"«Unguento, unguento, mandami al noce di Benevento, sopra l’acqua e sopra il vento, e sopra ogni altro maltempo.»"},{"it":"Guaritrice o strega?","other":"In the Middle Ages, the boundary between folk medicine, superstition and magic was often unclear. Some respected the women who made natural remedies; others feared them.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-08","sourceParagraph":6770,"note":"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6771","sourceExcerpt":"Nel Medioevo il confine tra medicina popolare, superstizione e magia era spesso poco chiaro."},{"it":"Gli Strigoi","other":"In Romanian folklore, spirits or people said to return after death, trouble families and bring disease or bad luck. The reading links these legends to the modern vampire myth.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-13","sourceParagraph":7230,"note":"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7231","sourceExcerpt":"In Romania esistono gli Strigoi."},{"it":"Lamia","other":"In the Greek myth presented here, a queen transformed into a monster; later versions describe her as a monster or sorceress who frightened children.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-13","sourceParagraph":7237,"note":"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7238","sourceExcerpt":"Nell’antica Grecia si raccontava la storia di Lamia."},{"it":"Yamauba","other":"A woman of Japanese mountain folklore, portrayed as a dangerous monster in some stories and a helper of lost travellers in others.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-13","sourceParagraph":7245,"note":"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7246","sourceExcerpt":"Tra le montagne del Giappone vive, secondo il folclore, la Yamauba."},{"it":"Le sorcières","other":"The French word for witches. The reading associates accusations in France with fear, superstition and social tensions.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-13","sourceParagraph":7252,"note":"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7253","sourceExcerpt":"In Francia le streghe vengono chiamate sorcières."},{"it":"Baba Jaga","other":"A Slavic folklore figure living in a hut on chicken legs and flying in a mortar with a pestle; she may help or test heroes, and may be cruel or wise.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-13","sourceParagraph":7221,"note":"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7222","sourceExcerpt":"Una delle figure più famose del folclore slavo è Baba Jaga."},{"it":"Le Hexen e la Notte di Valpurga","other":"Hexen means witches in German. According to the tradition in the reading, they gather on the Brocken on 30 April, Walpurgis Night.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-13","sourceParagraph":7258,"note":"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7259","sourceExcerpt":"In Germania le streghe sono chiamate Hexen."},{"it":"Etimologia: strega","other":"The reading traces Italian strega to Latin strix, a nocturnal bird associated with unsettling ancient stories.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-13","sourceParagraph":7284,"note":"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7285","sourceExcerpt":"📚 La parola italiana strega deriva dal latino strix."},{"it":"Etimologia: witch","other":"The reading traces English witch to Old English wicce (feminine) and wicca (masculine).","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-13","sourceParagraph":7285,"note":"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7286","sourceExcerpt":"🧙 L’inglese witch deriva dall’antico inglese wicce (forma femminile) e wicca (forma maschile)."},{"it":"Etimologia: sorcière","other":"The reading traces French sorcière to Latin sortiarius, connected with fate and spells.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-13","sourceParagraph":7286,"note":"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7287","sourceExcerpt":"🇫🇷 In francese sorcière deriva dal latino sortiarius, legato al destino e agli incantesimi."},{"it":"Etimologia: Hexe","other":"The reading traces German Hexe to an old Germanic word denoting a figure associated with magic; it does not supply that older word.","lang":"EN","group":"Liam · Lettura","tags":["liam","lettura"],"kind":"source-fact","reading":"lettura-13","sourceParagraph":7287,"note":"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7288","sourceExcerpt":"🇩🇪 Il tedesco Hexe deriva da un’antica parola germanica che indicava una figura associata alla magia."}];
