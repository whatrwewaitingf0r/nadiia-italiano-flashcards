 __________ da lei per chiedere aiuto.\\n (andare)\"},{\"index\":6796,\"text\":\"Gli storici __________ ancora oggi questo processo.\\n (studiare)\"},{\"index\":6797,\"text\":\"Durante il Medioevo molti abitanti __________ alle streghe.\\n (credere)\"},{\"index\":6798,\"text\":\"Matteuccia __________ rimedi con le erbe.\\n (preparare)\"},{\"index\":6799,\"text\":\"Tu __________ mai sentito parlare di questo processo?\\n (avere)\"},{\"index\":6800,\"text\":\"\"},{\"index\":6801,\"text\":\"📜 Documento storico\"},{\"index\":6802,\"text\":\"Negli atti del processo compare questa frase, attribuita a Matteuccia:\"},{\"index\":6803,\"text\":\"«Unguento, unguento, mandami al noce di Benevento, sopra l’acqua e sopra il vento, e sopra ogni altro maltempo.»\"},{\"index\":6804,\"text\":\"Questa è una delle testimonianze più celebri della stregoneria italiana.\"},{\"index\":6805,\"text\":\"Gli storici ricordano però che non sappiamo se queste parole siano state davvero pronunciate da Matteuccia o se siano state registrate sotto pressione durante gli interrogatori.\"},{\"index\":6806,\"text\":\"\"},{\"index\":6807,\"text\":\"⭐ Curiosità finale\"},{\"index\":6808,\"text\":\"Il processo di Matteuccia avvenne quasi settant’anni prima che il fenomeno delle grandi cacce alle streghe raggiungesse il suo apice in molte regioni d’Europa.\"},{\"index\":6809,\"text\":\"Per questo motivo è considerato uno dei casi più antichi e importanti della storia della stregoneria italiana.\"},{\"index\":6810,\"text\":\"➡️ Nella prossima lezione entreremo nelle case delle Janare di Benevento e leggeremo alcune testimonianze raccolte tra il Seicento e l’Ottocento da persone convinte di averle incontrate durante la notte.\"}],\"questions\":[{\"prompt\":\"Chi era Matteuccia?\",\"translation\":\"Who was Matteuccia?\",\"answer\":\"Matteuccia di Francesco, a woman from Todi who knew medicinal herbs and prepared remedies; she was tried in 1428.\",\"type\":\"comprehension\",\"sourceParagraph\":6777},{\"prompt\":\"Perché molte persone si rivolgevano a lei?\",\"translation\":\"Why did many people turn to her?\",\"answer\":\"For remedies and help with illnesses, particularly when no doctor was nearby.\",\"type\":\"comprehension\",\"sourceParagraph\":6778},{\"prompt\":\"Che cosa racconta la confessione?\",\"translation\":\"What does the confession describe?\",\"answer\":\"An ointment, a magical formula and a supposed night flight on a he-goat to meet other witches; these are recorded allegations, not proven events.\",\"type\":\"comprehension\",\"sourceParagraph\":6779},{\"prompt\":\"Perché gli storici non la considerano una prova affidabile?\",\"translation\":\"Why do historians not consider it reliable evidence?\",\"answer\":\"Interrogations could involve pressure or torture, and confessions could repeat existing stories or suggestions.\",\"type\":\"comprehension\",\"sourceParagraph\":6780},{\"prompt\":\"Che cosa ci insegna questo processo?\",\"translation\":\"What does this trial teach us?\",\"answer\":\"How justice worked in the fifteenth century and what fears existed in society, not that magic existed.\",\"type\":\"comprehension\",\"sourceParagraph\":6781},{\"prompt\":\"Perché il caso di Matteuccia è ancora studiato oggi?\",\"translation\":\"Why is Matteuccia’s case still studied today?\",\"answer\":\"It is an early documented case, important for the history of trials, beliefs and the developing image of the witch.\",\"type\":\"comprehension\",\"sourceParagraph\":6782},{\"prompt\":\"Matteuccia visse nel Quindicesimo secolo.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6785},{\"prompt\":\"Era conosciuta per l’uso delle erbe medicinali.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6786},{\"prompt\":\"Gli storici credono che la confessione dimostri l’esistenza della magia.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6787},{\"prompt\":\"Il processo è documentato da fonti storiche.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6788},{\"prompt\":\"Nel Medioevo gli interrogatori erano identici a quelli moderni.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6789},{\"prompt\":\"Il caso di Matteuccia è ancora studiato dagli storici.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6790}]},{\"id\":\"lettura-09\",\"title\":\"Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case\",\"startParagraph\":6811,\"endParagraph\":6921,\"paragraphs\":[{\"index\":6811,\"text\":\"🧙 Le Grandi Leggende delle Streghe Italiane\"},{\"index\":6812,\"text\":\"Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case\"},{\"index\":6813,\"text\":\"Nota storica\"},{\"index\":6814,\"text\":\"\"},{\"index\":6815,\"text\":\"Le Janare appartengono al folclore della Campania, soprattutto della zona di Benevento. Le storie che seguono provengono da racconti popolari tramandati per secoli e da testimonianze raccolte tra il Seicento e l’Ottocento. Non esistono prove storiche che gli eventi soprannaturali descritti siano realmente accaduti.\"},{\"index\":6816,\"text\":\"\"},{\"index\":6817,\"text\":\"🌞 Prima di leggere\"},{\"index\":6818,\"text\":\"Vocabolario\"},{\"index\":6819,\"text\":\"🏠 la soglia = doorstep\"},{\"index\":6820,\"text\":\"🧹 la scopa = broom\"},{\"index\":6821,\"text\":\"🧂 il sale = salt\"},{\"index\":6822,\"text\":\"🛏️ il letto = bed\"},{\"index\":6823,\"text\":\"😱 la paralisi = paralysis\"},{\"index\":6824,\"text\":\"🌙 l’incubo = nightmare\"},{\"index\":6825,\"text\":\"🔑 la serratura = lock\"},{\"index\":6826,\"text\":\"🚪 la porta = door\"},{\"index\":6827,\"text\":\"👣 l’impronta = footprint\"},{\"index\":6828,\"text\":\"🌑 il buio = darkness\"},{\"index\":6829,\"text\":\"\"},{\"index\":6830,\"text\":\"📖 «La Janara è entrata in casa»\"},{\"index\":6831,\"text\":\"Nel Settecento un contadino della provincia di Benevento raccontò una storia che sarebbe stata ripetuta per generazioni.\"},{\"index\":6832,\"text\":\"Una sera chiuse bene porte e finestre.\"},{\"index\":6833,\"text\":\"Prima di andare a dormire, sua moglie lasciò una scopa davanti all’ingresso della casa.\"},{\"index\":6834,\"text\":\"Era un gesto che molte famiglie facevano quasi automaticamente.\"},{\"index\":6835,\"text\":\"Secondo la tradizione, se durante la notte fosse arrivata una Janara, sarebbe stata costretta a fermarsi per contare tutti i fili della scopa.\"},{\"index\":6836,\"text\":\"Il contadino rise.\"},{\"index\":6837,\"text\":\"Disse che erano soltanto superstizioni.\"},{\"index\":6838,\"text\":\"Quella notte, però, accadde qualcosa che lo spaventò.\"},{\"index\":6839,\"text\":\"Si svegliò all’improvviso.\"},{\"index\":6840,\"text\":\"La stanza era silenziosa.\"},{\"index\":6841,\"text\":\"Sentiva chiaramente qualcuno camminare vicino al letto.\"},{\"index\":6842,\"text\":\"Provò ad alzarsi.\"},{\"index\":6843,\"text\":\"Non ci riuscì.\"},{\"index\":6844,\"text\":\"Tentò di gridare.\"},{\"index\":6845,\"text\":\"Nessun suono uscì dalla sua bocca.\"},{\"index\":6846,\"text\":\"Raccontò di aver visto una figura femminile vicino alla finestra.\"},{\"index\":6847,\"text\":\"Pochi istanti dopo tutto scomparve.\"},{\"index\":6848,\"text\":\"La mattina seguente disse ai vicini:\"},{\"index\":6849,\"text\":\"«La Janara è entrata in casa.»\"},{\"index\":6850,\"text\":\"Da quel giorno nessuno della famiglia dimenticò più di lasciare la scopa davanti alla porta.\"},{\"index\":6851,\"text\":\"\"},{\"index\":6852,\"text\":\"📖 Il sale sul pavimento\"},{\"index\":6853,\"text\":\"In un altro paese della Campania circolava una storia simile.\"},{\"index\":6854,\"text\":\"Una donna anziana sosteneva che una Janara cercasse spesso di entrare nella sua casa.\"},{\"index\":6855,\"text\":\"Un vicino le consigliò un rimedio molto semplice.\"},{\"index\":6856,\"text\":\"«Lascia cadere un pugno di sale davanti alla porta.»\"},{\"index\":6857,\"text\":\"Secondo la credenza popolare, la Janara avrebbe dovuto raccogliere o contare tutti i granelli di sale uno per uno.\"},{\"index\":6858,\"text\":\"La donna raccontò che, il mattino seguente, il sale era ancora sul pavimento ma nessuno aveva aperto la porta durante la notte.\"},{\"index\":6859,\"text\":\"Per lei quella era la prova che il rimedio aveva funzionato.\"},{\"index\":6860,\"text\":\"Oggi gli storici interpretano racconti come questo come esempi di tradizioni popolari tramandate oralmente per secoli.\"},{\"index\":6861,\"text\":\"\"},{\"index\":6862,\"text\":\"📖 Una spiegazione moderna\"},{\"index\":6863,\"text\":\"Molte testimonianze sulle Janare hanno un elemento in comune.\"},{\"index\":6864,\"text\":\"Le persone raccontavano di:\"},{\"index\":6865,\"text\":\"svegliarsi improvvisamente;\"},{\"index\":6866,\"text\":\"non riuscire a muoversi;\"},{\"index\":6867,\"text\":\"sentire una presenza nella stanza;\"},{\"index\":6868,\"text\":\"avere paura;\"},{\"index\":6869,\"text\":\"vedere figure oscure.\"},{\"index\":6870,\"text\":\"Oggi la medicina conosce un fenomeno chiamato paralisi del sonno.\"},{\"index\":6871,\"text\":\"Durante questo episodio una persona può essere cosciente ma incapace di muoversi per alcuni secondi o minuti.\"},{\"index\":6872,\"text\":\"Alcune persone riferiscono anche allucinazioni molto realistiche.\"},{\"index\":6873,\"text\":\"Molti studiosi ritengono che almeno una parte delle antiche storie sulle Janare possa essere spiegata in questo modo.\"},{\"index\":6874,\"text\":\"Naturalmente non possiamo sapere che cosa abbiano realmente vissuto le persone che raccontarono queste esperienze secoli fa.\"},{\"index\":6875,\"text\":\"\"},{\"index\":6876,\"text\":\"🌍 Curiosità\"},{\"index\":6877,\"text\":\"🧹 Perché proprio una scopa?\"},{\"index\":6878,\"text\":\"In molte tradizioni europee si pensava che alcuni spiriti o esseri soprannaturali fossero ossessionati dal contare.\"},{\"index\":6879,\"text\":\"Lasciare una scopa davanti alla porta significava costringerli a contare tutti i fili di saggina prima di entrare.\"},{\"index\":6880,\"text\":\"Con l’arrivo dell’alba sarebbero stati costretti ad andarsene.\"},{\"index\":6881,\"text\":\"Questa credenza esiste, con alcune varianti, anche in altri Paesi europei.\"},{\"index\":6882,\"text\":\"\"},{\"index\":6883,\"text\":\"🧂 Il sale\"},{\"index\":6884,\"text\":\"Il sale era considerato un simbolo di protezione molto prima del Cristianesimo.\"},{\"index\":6885,\"text\":\"Per questo motivo compare in moltissime superstizioni italiane.\"},{\"index\":6886,\"text\":\"\"},{\"index\":6887,\"text\":\"👵 Le Janare oggi\"},{\"index\":6888,\"text\":\"Ancora oggi, soprattutto nella zona di Benevento, la figura della Janara è presente nella cultura locale.\"},{\"index\":6889,\"text\":\"Esistono:\"},{\"index\":6890,\"text\":\"🧙 statue\"},{\"index\":6891,\"text\":\"🎭 festival\"},{\"index\":6892,\"text\":\"📚 libri\"},{\"index\":6893,\"text\":\"🍷 prodotti tipici che richiamano questa antica leggenda.\"},{\"index\":6894,\"text\":\"\"},{\"index\":6895,\"text\":\"💬 Hai capito?\"},{\"index\":6896,\"text\":\"Perché alcune famiglie lasciavano una scopa davanti alla porta?\"},{\"index\":6897,\"text\":\"Che cosa raccontò il contadino dopo quella notte?\"},{\"index\":6898,\"text\":\"Quale rimedio consigliò il vicino alla donna anziana?\"},{\"index\":6899,\"text\":\"Che cos’è la paralisi del sonno?\"},{\"index\":6900,\"text\":\"Perché gli studiosi collegano questo fenomeno alle Janare?\"},{\"index\":6901,\"text\":\"Le Janare fanno ancora parte della cultura campana?\"},{\"index\":6902,\"text\":\"\"},{\"index\":6903,\"text\":\"✅ Vero o falso?\"},{\"index\":6904,\"text\":\"Il contadino era convinto dell’esistenza delle Janare fin dall’inizio.\"},{\"index\":6905,\"text\":\"Secondo la leggenda, la Janara doveva contare i fili della scopa.\"},{\"index\":6906,\"text\":\"Alcune persone usavano il sale come protezione.\"},{\"index\":6907,\"text\":\"La medicina moderna conosce la paralisi del sonno.\"},{\"index\":6908,\"text\":\"Tutte le testimonianze dimostrano che le Janare esistevano davvero.\"},{\"index\":6909,\"text\":\"La leggenda è ancora conosciuta oggi.\"},{\"index\":6910,\"text\":\"\"},{\"index\":6911,\"text\":\"📜 Testimonianza popolare\"},{\"index\":6912,\"text\":\"Lo scrittore e folklorista Giuseppe Pitrè (1841–1916), che raccolse numerose tradizioni popolari italiane, riportò vari racconti in cui le persone descrivevano esseri notturni capaci di entrare nelle case e immobilizzare chi dormiva. Racconti simili erano diffusi anche in Campania e contribuirono alla fama delle Janare.\"},{\"index\":6913,\"text\":\"Gli studiosi considerano queste testimonianze preziose per capire le credenze popolari dell’epoca, non come prove dell’esistenza di fenomeni soprannaturali.\"},{\"index\":6914,\"text\":\"\"},{\"index\":6915,\"text\":\"⭐ Curiosità finale\"},{\"index\":6916,\"text\":\"La leggenda delle Janare è sorprendentemente simile a racconti presenti in molte altre culture.\"},{\"index\":6917,\"text\":\"In Scandinavia si parlava della Mara, uno spirito che si sedeva sul petto delle persone addormentate.\"},{\"index\":6918,\"text\":\"In Terranova (Canada) si raccontava della Old Hag.\"},{\"index\":6919,\"text\":\"In Giappone esistono racconti di spiriti notturni che immobilizzano chi dorme.\"},{\"index\":6920,\"text\":\"Oggi molti ricercatori ritengono che tutte queste storie possano essere collegate allo stesso fenomeno: la paralisi del sonno, interpretata in modi diversi dalle varie culture.\"},{\"index\":6921,\"text\":\"➡️ Nella prossima lezione saliremo tra le montagne del Piemonte per conoscere le misteriose Masche, donne che, secondo le leggende, potevano trasformarsi in animali e lanciare maledizioni.\"}],\"questions\":[{\"prompt\":\"Perché alcune famiglie lasciavano una scopa davanti alla porta?\",\"translation\":\"Why did some families leave a broom at the door?\",\"answer\":\"According to the legend, a Janara would have to count every broom bristle, delaying her until dawn.\",\"type\":\"comprehension\",\"sourceParagraph\":6896},{\"prompt\":\"Che cosa raccontò il contadino dopo quella notte?\",\"translation\":\"What did the farmer say after that night?\",\"answer\":\"That a Janara had entered his house: he reported a presence, inability to move or speak and a female figure.\",\"type\":\"comprehension\",\"sourceParagraph\":6897},{\"prompt\":\"Quale rimedio consigliò il vicino alla donna anziana?\",\"translation\":\"What remedy did the neighbour suggest to the elderly woman?\",\"answer\":\"To scatter a handful of salt in front of the door, supposedly forcing the Janara to count the grains.\",\"type\":\"comprehension\",\"sourceParagraph\":6898},{\"prompt\":\"Che cos’è la paralisi del sonno?\",\"translation\":\"What is sleep paralysis?\",\"answer\":\"In the reading, a state in which someone is conscious but briefly unable to move, sometimes with vivid hallucinations.\",\"type\":\"comprehension\",\"sourceParagraph\":6899},{\"prompt\":\"Perché gli studiosi collegano questo fenomeno alle Janare?\",\"translation\":\"Why do researchers connect this phenomenon with the Janare?\",\"answer\":\"The reported immobility, fear, sensed presence and dark figures resemble some sleep-paralysis experiences; this is an interpretation, not proof about each old account.\",\"type\":\"comprehension\",\"sourceParagraph\":6900},{\"prompt\":\"Le Janare fanno ancora parte della cultura campana?\",\"translation\":\"Are the Janare still part of Campanian culture?\",\"answer\":\"Yes: the reading mentions statues, festivals, books and local products, especially around Benevento.\",\"type\":\"comprehension\",\"sourceParagraph\":6901},{\"prompt\":\"Il contadino era convinto dell’esistenza delle Janare fin dall’inizio.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6904},{\"prompt\":\"Secondo la leggenda, la Janara doveva contare i fili della scopa.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6905},{\"prompt\":\"Alcune persone usavano il sale come protezione.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6906},{\"prompt\":\"La medicina moderna conosce la paralisi del sonno.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6907},{\"prompt\":\"Tutte le testimonianze dimostrano che le Janare esistevano davvero.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6908},{\"prompt\":\"La leggenda è ancora conosciuta oggi.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6909}]},{\"id\":\"lettura-10\",\"title\":\"Parte 4 – Le Masche del Piemonte: donne, animali e misteri\",\"startParagraph\":6922,\"endParagraph\":7028,\"paragraphs\":[{\"index\":6922,\"text\":\"🧙 Le Grandi Leggende delle Streghe Italiane\"},{\"index\":6923,\"text\":\"Parte 4 – Le Masche del Piemonte: donne, animali e misteri\"},{\"index\":6924,\"text\":\"Nota storica\"},{\"index\":6925,\"text\":\"\"},{\"index\":6926,\"text\":\"Le Masche appartengono al folclore del Piemonte, soprattutto delle province di Cuneo, Asti e Torino. I racconti che seguono furono tramandati oralmente per secoli e vennero raccolti da studiosi del folclore tra il XIX e il XX secolo. Non esistono prove storiche che i fenomeni soprannaturali descritti siano realmente avvenuti.\"},{\"index\":6927,\"text\":\"\"},{\"index\":6928,\"text\":\"🌞 Prima di leggere\"},{\"index\":6929,\"text\":\"Vocabolario\"},{\"index\":6930,\"text\":\"🐈 il gatto = cat\"},{\"index\":6931,\"text\":\"🐺 il lupo = wolf\"},{\"index\":6932,\"text\":\"🌫️ la nebbia = fog\"},{\"index\":6933,\"text\":\"🌾 il raccolto = harvest\"},{\"index\":6934,\"text\":\"🥛 il latte = milk\"},{\"index\":6935,\"text\":\"🐄 il bestiame = livestock\"},{\"index\":6936,\"text\":\"🪄 la maledizione = curse\"},{\"index\":6937,\"text\":\"🌲 il bosco = forest\"},{\"index\":6938,\"text\":\"👵 l’anziana = elderly woman\"},{\"index\":6939,\"text\":\"🔥 il camino = fireplace\"},{\"index\":6940,\"text\":\"\"},{\"index\":6941,\"text\":\"📖 Il gatto della signora Caterina\"},{\"index\":6942,\"text\":\"Per molti anni, in un piccolo villaggio delle Langhe, si raccontò una storia che quasi tutti conoscevano.\"},{\"index\":6943,\"text\":\"Ai margini del paese viveva una donna anziana chiamata Caterina.\"},{\"index\":6944,\"text\":\"Era vedova.\"},{\"index\":6945,\"text\":\"Viveva da sola.\"},{\"index\":6946,\"text\":\"Conosceva molte erbe medicinali e trascorreva gran parte del tempo nel suo orto.\"},{\"index\":6947,\"text\":\"Alcuni abitanti la rispettavano.\"},{\"index\":6948,\"text\":\"Altri, invece, la evitavano.\"},{\"index\":6949,\"text\":\"Dicevano che fosse una Masca.\"},{\"index\":6950,\"text\":\"Ogni sera, raccontavano i bambini del paese, un grosso gatto nero usciva dalla sua casa e spariva nel bosco.\"},{\"index\":6951,\"text\":\"Una notte tre giovani decisero di seguirlo.\"},{\"index\":6952,\"text\":\"Camminarono per quasi un’ora.\"},{\"index\":6953,\"text\":\"Il gatto sembrava aspettarli.\"},{\"index\":6954,\"text\":\"Poi sparì dietro alcuni alberi.\"},{\"index\":6955,\"text\":\"Uno dei ragazzi raccontò di avergli lanciato un sasso.\"},{\"index\":6956,\"text\":\"Sentì un miagolio.\"},{\"index\":6957,\"text\":\"Poi più nulla.\"},{\"index\":6958,\"text\":\"La mattina seguente Caterina uscì di casa zoppicando.\"},{\"index\":6959,\"text\":\"Aveva una fasciatura sulla gamba.\"},{\"index\":6960,\"text\":\"Per molti abitanti quella era la prova.\"},{\"index\":6961,\"text\":\"Dicevano:\"},{\"index\":6962,\"text\":\"«Il gatto e Caterina sono la stessa persona.»\"},{\"index\":6963,\"text\":\"La storia si diffuse rapidamente.\"},{\"index\":6964,\"text\":\"Anche chi non aveva visto nulla iniziò a raccontarla.\"},{\"index\":6965,\"text\":\"Con il passare degli anni nacquero decine di versioni diverse.\"},{\"index\":6966,\"text\":\"\"},{\"index\":6967,\"text\":\"📖 Il latte scomparso\"},{\"index\":6968,\"text\":\"Un’altra storia veniva raccontata nelle campagne piemontesi.\"},{\"index\":6969,\"text\":\"Ogni mattina un allevatore trovava le sue mucche strane.\"},{\"index\":6970,\"text\":\"Erano nervose.\"},{\"index\":6971,\"text\":\"Producevano molto meno latte del solito.\"},{\"index\":6972,\"text\":\"L’uomo non riusciva a capirne il motivo.\"},{\"index\":6973,\"text\":\"Una sera decise di nascondersi nella stalla.\"},{\"index\":6974,\"text\":\"Aspettò tutta la notte.\"},{\"index\":6975,\"text\":\"Il giorno dopo raccontò di aver visto una donna entrare nel cortile.\"},{\"index\":6976,\"text\":\"Disse che la donna parlò sottovoce agli animali.\"},{\"index\":6977,\"text\":\"Poi scomparve nel buio.\"},{\"index\":6978,\"text\":\"Da quel momento molti abitanti del villaggio credettero che una Masca stesse lanciando una maledizione sul bestiame.\"},{\"index\":6979,\"text\":\"Oggi gli storici ritengono che racconti come questo riflettano le difficoltà della vita contadina.\"},{\"index\":6980,\"text\":\"Quando una malattia colpiva gli animali e nessuno ne conosceva la causa, era naturale cercare una spiegazione.\"},{\"index\":6981,\"text\":\"\"},{\"index\":6982,\"text\":\"📖 La nebbia delle Langhe\"},{\"index\":6983,\"text\":\"Le colline piemontesi sono spesso avvolte dalla nebbia.\"},{\"index\":6984,\"text\":\"Per secoli i viandanti raccontarono di essersi persi durante il cammino.\"},{\"index\":6985,\"text\":\"Alcuni dicevano di aver visto una donna camminare davanti a loro.\"},{\"index\":6986,\"text\":\"La seguivano.\"},{\"index\":6987,\"text\":\"Ma dopo pochi minuti la figura spariva.\"},{\"index\":6988,\"text\":\"Molti erano convinti che fosse una Masca.\"},{\"index\":6989,\"text\":\"Secondo gli studiosi, la nebbia, l’oscurità e la fatica potevano facilmente creare illusioni o errori di orientamento.\"},{\"index\":6990,\"text\":\"Ma, per chi viveva trecento anni fa, il mistero sembrava molto più convincente di una spiegazione naturale.\"},{\"index\":6991,\"text\":\"\"},{\"index\":6992,\"text\":\"🌍 Curiosità\"},{\"index\":6993,\"text\":\"🐈 Le Masche si trasformavano davvero?\"},{\"index\":6994,\"text\":\"Secondo il folclore piemontese, le Masche potevano assumere l’aspetto di:\"},{\"index\":6995,\"text\":\"🐈 gatti\"},{\"index\":6996,\"text\":\"🐺 lupi\"},{\"index\":6997,\"text\":\"🐇 lepri\"},{\"index\":6998,\"text\":\"🦉 gufi\"},{\"index\":6999,\"text\":\"Gli storici considerano queste trasformazioni elementi tipici delle leggende europee.\"},{\"index\":7000,\"text\":\"Racconti simili esistono anche in Francia, Germania e Svizzera.\"},{\"index\":7001,\"text\":\"\"},{\"index\":7002,\"text\":\"🌫️ La nebbia\"},{\"index\":7003,\"text\":\"La Pianura Padana e le colline piemontesi sono famose per la nebbia autunnale.\"},{\"index\":7004,\"text\":\"In passato era facile perdere l’orientamento.\"},{\"index\":7005,\"text\":\"Questo contribuì probabilmente alla nascita di molte storie misteriose.\"},{\"index\":7006,\"text\":\"\"},{\"index\":7007,\"text\":\"🌿 Le guaritrici\"},{\"index\":7008,\"text\":\"Come in molte altre regioni italiane, alcune donne conoscevano le proprietà delle erbe medicinali.\"},{\"index\":7009,\"text\":\"La popolazione poteva considerarle persone molto sagge oppure temerle.\"},{\"index\":7010,\"text\":\"Spesso bastava una cattiva reputazione perché nascessero nuove leggende.\"},{\"index\":7011,\"text\":\"\"},{\"index\":7012,\"text\":\"📜 Una testimonianza raccolta dagli studiosi\"},{\"index\":7013,\"text\":\"Tra la fine dell’Ottocento e l’inizio del Novecento diversi studiosi di tradizioni popolari piemontesi raccolsero racconti secondo cui alcune Masche erano capaci di trasformarsi in animali durante la notte.\"},{\"index\":7014,\"text\":\"Queste testimonianze venivano tramandate oralmente e cambiavano da paese a paese.\"},{\"index\":7015,\"text\":\"Gli antropologi le studiano oggi come esempi della cultura contadina e dell’immaginazione popolare.\"},{\"index\":7016,\"text\":\"\"},{\"index\":7017,\"text\":\"⭐ Curiosità finale\"},{\"index\":7018,\"text\":\"Nelle Langhe esiste ancora un proverbio:\"},{\"index\":7019,\"text\":\"“Di notte non tutto è come sembra.”\"},{\"index\":7020,\"text\":\"Non sappiamo quando sia nato.\"},{\"index\":7021,\"text\":\"Forse non parlava davvero delle Masche.\"},{\"index\":7022,\"text\":\"Ma descrive perfettamente l’atmosfera delle campagne piemontesi nelle fredde notti di nebbia.\"},{\"index\":7023,\"text\":\"Molte persone, tornando a casa dopo il tramonto, vedevano forme indistinte tra gli alberi.\"},{\"index\":7024,\"text\":\"Alcuni pensavano fossero animali.\"},{\"index\":7025,\"text\":\"Altri erano convinti di aver incontrato una Masca.\"},{\"index\":7026,\"text\":\"Oggi sappiamo che la nebbia può ingannare facilmente i nostri occhi.\"},{\"index\":7027,\"text\":\"Ma proprio questi racconti rendono il folclore piemontese uno dei più ricchi e affascinanti d’Italia.\"},{\"index\":7028,\"text\":\"➡️ Nell’ultima lezione visiteremo Triora, il “paese delle streghe”, dove un vero processo del XVI secolo trasformò un piccolo borgo ligure in uno dei luoghi più misteriosi d’Europa.\"}],\"questions\":[]},{\"id\":\"lettura-11\",\"title\":\"Parte 5 – Triora: il paese delle streghe\",\"startParagraph\":7029,\"endParagraph\":7124,\"paragraphs\":[{\"index\":7029,\"text\":\"🧙 Le Grandi Leggende delle Streghe Italiane\"},{\"index\":7030,\"text\":\"Parte 5 – Triora: il paese delle streghe\"},{\"index\":7031,\"text\":\"Nota storica\"},{\"index\":7032,\"text\":\"\"},{\"index\":7033,\"text\":\"Tra il 1587 e il 1589 il piccolo borgo ligure di Triora fu teatro di uno dei più celebri processi per stregoneria della storia italiana. I fatti principali – la carestia, le indagini e i processi – sono documentati da fonti storiche. Le presunte attività delle streghe, invece, appartengono alle accuse dell’epoca e alle leggende nate successivamente.\"},{\"index\":7034,\"text\":\"\"},{\"index\":7035,\"text\":\"🌞 Prima di leggere\"},{\"index\":7036,\"text\":\"Vocabolario\"},{\"index\":7037,\"text\":\"🏰 il borgo = village\"},{\"index\":7038,\"text\":\"🌾 la carestia = famine\"},{\"index\":7039,\"text\":\"🍞 il raccolto = harvest\"},{\"index\":7040,\"text\":\"⚖️ il processo = trial\"},{\"index\":7041,\"text\":\"👩‍⚖️ il magistrato = magistrate\"},{\"index\":7042,\"text\":\"⛓️ la prigione = prison\"},{\"index\":7043,\"text\":\"🗣️ la diceria = rumor\"},{\"index\":7044,\"text\":\"😨 il sospetto = suspicion\"},{\"index\":7045,\"text\":\"📜 il verbale = official record\"},{\"index\":7046,\"text\":\"👥 la folla = crowd\"},{\"index\":7047,\"text\":\"\"},{\"index\":7048,\"text\":\"📖 L’inizio della paura\"},{\"index\":7049,\"text\":\"Tra le montagne della Liguria occidentale si trova Triora, un piccolo borgo medievale costruito su uno sperone di roccia.\"},{\"index\":7050,\"text\":\"Oggi è un luogo tranquillo, visitato da turisti provenienti da tutto il mondo.\"},{\"index\":7051,\"text\":\"Più di quattrocento anni fa, però, la situazione era molto diversa.\"},{\"index\":7052,\"text\":\"Negli anni 1587–1588 la popolazione attraversò un periodo molto difficile.\"},{\"index\":7053,\"text\":\"Il raccolto fu scarso.\"},{\"index\":7054,\"text\":\"Il prezzo del grano aumentò.\"},{\"index\":7055,\"text\":\"Molte famiglie facevano fatica a procurarsi il pane.\"},{\"index\":7056,\"text\":\"Quando una comunità vive una crisi così grave, spesso cerca qualcuno da incolpare.\"},{\"index\":7057,\"text\":\"A Triora iniziarono a circolare strane voci.\"},{\"index\":7058,\"text\":\"Alcuni abitanti dicevano che certe donne si riunissero di notte.\"},{\"index\":7059,\"text\":\"Altri sostenevano che praticassero la magia e fossero responsabili della carestia.\"},{\"index\":7060,\"text\":\"Le dicerie si diffusero rapidamente.\"},{\"index\":7061,\"text\":\"Ben presto le autorità decisero di aprire un’inchiesta.\"},{\"index\":7062,\"text\":\"\"},{\"index\":7063,\"text\":\"📖 Il processo\"},{\"index\":7064,\"text\":\"Diversi abitanti del paese furono interrogati.\"},{\"index\":7065,\"text\":\"Alcune donne vennero arrestate.\"},{\"index\":7066,\"text\":\"I verbali raccontano accuse molto diverse tra loro.\"},{\"index\":7067,\"text\":\"C’era chi affermava di aver visto riunioni notturne.\"},{\"index\":7068,\"text\":\"Chi sosteneva che alcune persone avessero lanciato maledizioni.\"},{\"index\":7069,\"text\":\"Chi raccontava di animali misteriosi e di strani rumori nei boschi.\"},{\"index\":7070,\"text\":\"Come accadeva spesso nei processi dell’epoca, molte testimonianze si basavano su racconti sentiti da altri e non su fatti osservati direttamente.\"},{\"index\":7071,\"text\":\"In alcuni casi gli interrogatori furono accompagnati dalla tortura.\"},{\"index\":7072,\"text\":\"Per questo motivo gli storici ritengono che molte confessioni non possano essere considerate attendibili.\"},{\"index\":7073,\"text\":\"Nonostante ciò, il processo continuò per mesi.\"},{\"index\":7074,\"text\":\"Alcuni imputati morirono durante la prigionia.\"},{\"index\":7075,\"text\":\"Altri vennero trasferiti a Genova per ulteriori interrogatori.\"},{\"index\":7076,\"text\":\"\"},{\"index\":7077,\"text\":\"📖 La nascita della leggenda\"},{\"index\":7078,\"text\":\"Con il passare del tempo il processo terminò.\"},{\"index\":7079,\"text\":\"Ma la storia non fu dimenticata.\"},{\"index\":7080,\"text\":\"Anzi.\"},{\"index\":7081,\"text\":\"Ogni generazione aggiunse nuovi particolari.\"},{\"index\":7082,\"text\":\"Si iniziò a raccontare che le streghe si incontrassero nei boschi.\"},{\"index\":7083,\"text\":\"Che preparassero pozioni misteriose.\"},{\"index\":7084,\"text\":\"Che evocassero spiriti durante la notte.\"},{\"index\":7085,\"text\":\"Molte di queste storie non compaiono nei documenti del processo.\"},{\"index\":7086,\"text\":\"Nacquero molto tempo dopo.\"},{\"index\":7087,\"text\":\"Così la storia reale e il folclore finirono per mescolarsi.\"},{\"index\":7088,\"text\":\"È proprio questo che rende Triora così affascinante.\"},{\"index\":7089,\"text\":\"\"},{\"index\":7090,\"text\":\"🌍 Triora oggi\"},{\"index\":7091,\"text\":\"Passeggiando per il paese si incontrano ancora:\"},{\"index\":7092,\"text\":\"🧙 statue dedicate alle streghe.\"},{\"index\":7093,\"text\":\"🏛️ il Museo Regionale Etnografico e della Stregoneria, che racconta la storia dei processi e delle tradizioni popolari.\"},{\"index\":7094,\"text\":\"🪨 antichi vicoli medievali.\"},{\"index\":7095,\"text\":\"🏰 case in pietra quasi immutate da secoli.\"},{\"index\":7096,\"text\":\"Ogni anno molti visitatori arrivano per conoscere la vera storia di Triora e distinguere i fatti documentati dalle leggende.\"},{\"index\":7097,\"text\":\"\"},{\"index\":7098,\"text\":\"🌍 Curiosità\"},{\"index\":7099,\"text\":\"🏰 La Salem italiana?\"},{\"index\":7100,\"text\":\"Triora viene spesso chiamata “la Salem d’Italia”.\"},{\"index\":7101,\"text\":\"Il paragone nasce perché entrambe le località sono famose per i processi alle streghe.\"},{\"index\":7102,\"text\":\"Tuttavia i fatti avvennero in epoche diverse: quelli di Triora si svolsero alla fine del Cinquecento, mentre i celebri processi di Salem, nel Massachusetts, risalgono al 1692.\"},{\"index\":7103,\"text\":\"\"},{\"index\":7104,\"text\":\"📚 Un museo dedicato alla storia\"},{\"index\":7105,\"text\":\"Il museo di Triora non cerca di dimostrare l’esistenza delle streghe.\"},{\"index\":7106,\"text\":\"Espone invece documenti, oggetti e ricostruzioni che aiutano a comprendere la mentalità dell’epoca e le cause storiche dei processi.\"},{\"index\":7107,\"text\":\"\"},{\"index\":7108,\"text\":\"🌫️ Un paese perfetto per una leggenda\"},{\"index\":7109,\"text\":\"Triora è circondata da boschi e montagne.\"},{\"index\":7110,\"text\":\"Quando arriva la nebbia, il borgo assume un’atmosfera molto suggestiva.\"},{\"index\":7111,\"text\":\"Molti scrittori e registi hanno scelto questo luogo come ambientazione per racconti misteriosi.\"},{\"index\":7112,\"text\":\"\"},{\"index\":7113,\"text\":\"📜 Documento storico\"},{\"index\":7114,\"text\":\"Negli archivi sono conservati i verbali originali dei processi di Triora.\"},{\"index\":7115,\"text\":\"Essi mostrano che molte accuse nacquero durante un periodo di grave crisi economica e alimentare.\"},{\"index\":7116,\"text\":\"Per gli storici questi documenti rappresentano una testimonianza preziosa del modo in cui paura, fame e tensioni sociali possano influenzare il comportamento di una comunità.\"},{\"index\":7117,\"text\":\"\"},{\"index\":7118,\"text\":\"⭐ Conclusione dell’Unità\"},{\"index\":7119,\"text\":\"Abbiamo viaggiato attraverso cinque delle storie più famose della stregoneria italiana.\"},{\"index\":7120,\"text\":\"Abbiamo conosciuto il misterioso Noce di Benevento, il processo di Matteuccia di Todi, le inquietanti Janare, le enigmatiche Masche del Piemonte e, infine, il borgo di Triora.\"},{\"index\":7121,\"text\":\"In ogni lezione abbiamo scoperto che dietro le leggende si nascondono persone reali, documenti storici, paure collettive e tradizioni tramandate per secoli.\"},{\"index\":7122,\"text\":\"Forse il vero mistero non è capire se le streghe siano mai esistite.\"},{\"index\":7123,\"text\":\"Il vero mistero è comprendere perché, in epoche e luoghi diversi, così tante persone abbiano creduto alle stesse storie.\"},{\"index\":7124,\"text\":\"Ed è proprio questo che rende il folclore una finestra straordinaria sulla storia, sull’antropologia e sulla natura umana.\"}],\"questions\":[]},{\"id\":\"lettura-12\",\"title\":\"Parte 6 – I luoghi più misteriosi d’Italia\",\"startParagraph\":7125,\"endParagraph\":7202,\"paragraphs\":[{\"index\":7125,\"text\":\"🧙 Le Grandi Leggende delle Streghe Italiane\"},{\"index\":7126,\"text\":\"Parte 6 – I luoghi più misteriosi d’Italia\"},{\"index\":7127,\"text\":\"Nota storica\"},{\"index\":7128,\"text\":\"\"},{\"index\":7129,\"text\":\"I luoghi descritti in questa lezione esistono realmente. Le leggende che li riguardano fanno parte del patrimonio culturale italiano. Alcune si basano su eventi storici, altre su racconti popolari tramandati per secoli. Gli elementi soprannaturali non sono confermati da prove storiche.\"},{\"index\":7130,\"text\":\"\"},{\"index\":7131,\"text\":\"🌊 1. Il Lago di Pilato (Marche)\"},{\"index\":7132,\"text\":\"Tra le montagne dei Monti Sibillini, a oltre 1.900 metri di altitudine, si trova uno dei laghi più misteriosi d’Italia.\"},{\"index\":7133,\"text\":\"Secondo una leggenda medievale, dopo la morte di Ponzio Pilato, il governatore romano che autorizzò la crocifissione di Gesù, il suo corpo fu caricato su un carro trainato da buoi.\"},{\"index\":7134,\"text\":\"Gli animali, impazziti, avrebbero percorso montagne e vallate fino a precipitare nel lago.\"},{\"index\":7135,\"text\":\"Da quel momento il luogo sarebbe stato maledetto.\"},{\"index\":7136,\"text\":\"Nel Medioevo molti credevano che maghi e negromanti raggiungessero il lago durante la notte per evocare demoni e imparare formule magiche.\"},{\"index\":7137,\"text\":\"Le autorità dell’epoca presero queste storie molto sul serio.\"},{\"index\":7138,\"text\":\"In alcuni periodi fu addirittura vietato avvicinarsi al lago.\"},{\"index\":7139,\"text\":\"Oggi gli storici ritengono che queste leggende siano nate dall’isolamento del luogo e dal fascino che il lago esercitava sui viaggiatori medievali.\"},{\"index\":7140,\"text\":\"\"},{\"index\":7141,\"text\":\"⛰️ 2. La Grotta della Sibilla\"},{\"index\":7142,\"text\":\"Sempre nei Monti Sibillini si trova un’altra delle grandi leggende italiane.\"},{\"index\":7143,\"text\":\"Per oltre settecento anni i viaggiatori raccontarono dell’esistenza di una grotta nascosta nella montagna.\"},{\"index\":7144,\"text\":\"Lì avrebbe vissuto la Sibilla Appenninica, una donna dotata di poteri straordinari.\"},{\"index\":7145,\"text\":\"Secondo alcuni racconti era una profetessa.\"},{\"index\":7146,\"text\":\"Secondo altri era una fata.\"},{\"index\":7147,\"text\":\"Altri ancora la descrivevano come una potente maga.\"},{\"index\":7148,\"text\":\"Nel XV secolo il cavaliere francese Antoine de La Sale scrisse un celebre racconto di viaggio nel quale descrisse la montagna e riportò le storie ascoltate dagli abitanti.\"},{\"index\":7149,\"text\":\"Ancora oggi migliaia di escursionisti percorrono i sentieri del Monte Sibilla per raggiungere l’ingresso della grotta.\"},{\"index\":7150,\"text\":\"\"},{\"index\":7151,\"text\":\"🌲 3. Il Bosco del Cansiglio\"},{\"index\":7152,\"text\":\"Tra Veneto e Friuli-Venezia Giulia si estende il grande Bosco del Cansiglio.\"},{\"index\":7153,\"text\":\"Per secoli i boscaioli raccontarono di udire voci tra gli alberi durante la notte.\"},{\"index\":7154,\"text\":\"Alcuni sostenevano di vedere piccole luci muoversi nel bosco.\"},{\"index\":7155,\"text\":\"Altri parlavano di donne misteriose vestite di bianco.\"},{\"index\":7156,\"text\":\"Oggi sappiamo che fenomeni naturali, come il vento, gli animali notturni o i giochi di luce, possono creare impressioni molto suggestive.\"},{\"index\":7157,\"text\":\"Tuttavia il Cansiglio continua ancora oggi a essere uno dei boschi più misteriosi d’Italia.\"},{\"index\":7158,\"text\":\"\"},{\"index\":7159,\"text\":\"🪨 4. Le incisioni della Val Camonica\"},{\"index\":7160,\"text\":\"In Lombardia, nella Val Camonica, si trovano oltre 140.000 incisioni rupestri, realizzate nell’arco di migliaia di anni.\"},{\"index\":7161,\"text\":\"Molte raffigurano uomini armati, animali, scene di caccia e simboli misteriosi.\"},{\"index\":7162,\"text\":\"Per secoli gli abitanti pensarono che quei segni fossero stati lasciati da streghe, giganti o creature soprannaturali.\"},{\"index\":7163,\"text\":\"Solo nell’Ottocento gli archeologi iniziarono a comprenderne la vera origine.\"},{\"index\":7164,\"text\":\"Oggi sappiamo che furono incisi da popolazioni preistoriche.\"},{\"index\":7165,\"text\":\"La Val Camonica è stata il primo sito italiano inserito nella lista del Patrimonio Mondiale dell’UNESCO.\"},{\"index\":7166,\"text\":\"\"},{\"index\":7167,\"text\":\"🌋 5. L’Etna e le streghe\"},{\"index\":7168,\"text\":\"Anche il vulcano Etna, in Sicilia, è protagonista di numerose leggende.\"},{\"index\":7169,\"text\":\"Alcuni racconti popolari narrano che, durante le notti di tempesta, le streghe si riunissero sulle sue pendici.\"},{\"index\":7170,\"text\":\"Altri sostenevano di vedere strane luci tra la lava.\"},{\"index\":7171,\"text\":\"Oggi sappiamo che molte di queste luci possono essere spiegate dai fenomeni vulcanici.\"},{\"index\":7172,\"text\":\"Ma il vulcano continua ad alimentare l’immaginazione di chi lo osserva.\"},{\"index\":7173,\"text\":\"\"},{\"index\":7174,\"text\":\"🌍 Perché questi luoghi sono diventati leggendari?\"},{\"index\":7175,\"text\":\"Quasi tutti hanno qualcosa in comune.\"},{\"index\":7176,\"text\":\"Sono:\"},{\"index\":7177,\"text\":\"🌲 isolati.\"},{\"index\":7178,\"text\":\"🌫️ avvolti dalla nebbia.\"},{\"index\":7179,\"text\":\"🏔️ difficili da raggiungere.\"},{\"index\":7180,\"text\":\"🌋 caratterizzati da fenomeni naturali insoliti.\"},{\"index\":7181,\"text\":\"Nel passato questi ambienti apparivano misteriosi.\"},{\"index\":7182,\"text\":\"Quando non esistevano spiegazioni scientifiche, era naturale creare racconti per spiegare ciò che sembrava inspiegabile.\"},{\"index\":7183,\"text\":\"Per questo motivo montagne, boschi e laghi sono presenti nelle leggende di quasi tutte le culture del mondo.\"},{\"index\":7184,\"text\":\"\"},{\"index\":7185,\"text\":\"📜 Un viaggiatore del Quattrocento\"},{\"index\":7186,\"text\":\"Nel XV secolo molti pellegrini raccontavano di aver sentito dire che il Lago di Pilato fosse un luogo proibito.\"},{\"index\":7187,\"text\":\"Alcuni scrivevano di aver visto persone evitare quelle acque anche durante il giorno.\"},{\"index\":7188,\"text\":\"Non sappiamo quanto vi fosse di vero.\"},{\"index\":7189,\"text\":\"Ma sappiamo che la fama del lago era già diffusa in tutta Europa.\"},{\"index\":7190,\"text\":\"\"},{\"index\":7191,\"text\":\"⭐ Curiosità finali\"},{\"index\":7192,\"text\":\"🏔️ Il Monte Sibilla ha dato il nome all’intera catena dei Monti Sibillini.\"},{\"index\":7193,\"text\":\"🌊 Il Lago di Pilato è l’unico lago naturale delle Marche.\"},{\"index\":7194,\"text\":\"🪨 Le incisioni della Val Camonica raccontano la vita di popolazioni vissute migliaia di anni prima dei Romani.\"},{\"index\":7195,\"text\":\"🌲 Il Bosco del Cansiglio è uno dei boschi meglio conservati d’Italia.\"},{\"index\":7196,\"text\":\"🧙 Quasi tutte le regioni italiane possiedono almeno una leggenda legata a streghe, fate, spiriti o creature misteriose.\"},{\"index\":7197,\"text\":\"\"},{\"index\":7198,\"text\":\"🎓 Fine del viaggio\"},{\"index\":7199,\"text\":\"Abbiamo visitato processi realmente documentati, antiche leggende, villaggi medievali, montagne, laghi e boschi che hanno alimentato l’immaginazione degli italiani per secoli.\"},{\"index\":7200,\"text\":\"La cosa più interessante è che queste storie ci parlano molto meno della magia e molto di più delle persone.\"},{\"index\":7201,\"text\":\"Ci raccontano come gli esseri umani affrontavano la paura, cercavano spiegazioni per ciò che non comprendevano e trasformavano gli eventi più misteriosi in racconti destinati a sopravvivere per generazioni.\"},{\"index\":7202,\"text\":\"Forse è proprio questo il vero incantesimo delle leggende: non quello di cambiare il mondo, ma quello di continuare a farci immaginare.\"}],\"questions\":[]},{\"id\":\"lettura-13\",\"title\":\"Parte 7 – Le streghe nel mondo\",\"startParagraph\":7203,\"endParagraph\":7297,\"paragraphs\":[{\"index\":7203,\"text\":\"🧙 Le Grandi Leggende delle Streghe\"},{\"index\":7204,\"text\":\"Parte 7 – Le streghe nel mondo\"},{\"index\":7205,\"text\":\"Nota\"},{\"index\":7206,\"text\":\"\"},{\"index\":7207,\"text\":\"Quasi ogni civiltà della storia ha creato racconti su streghe, maghe, spiriti femminili o esseri soprannaturali. Alcune figure derivano dalla religione, altre dal folclore popolare. In questa lezione scopriremo come culture molto lontane abbiano inventato personaggi sorprendentemente simili.\"},{\"index\":7208,\"text\":\"\"},{\"index\":7209,\"text\":\"🌍 Perché esistono le streghe in quasi tutte le culture?\"},{\"index\":7210,\"text\":\"Gli antropologi si sono posti questa domanda per molti anni.\"},{\"index\":7211,\"text\":\"Com’è possibile che popoli separati da migliaia di chilometri abbiano inventato storie così simili?\"},{\"index\":7212,\"text\":\"Secondo molti studiosi esistono diverse spiegazioni.\"},{\"index\":7213,\"text\":\"Le persone avevano paura delle malattie, delle tempeste, della morte e dell’ignoto.\"},{\"index\":7214,\"text\":\"Quando non esistevano spiegazioni scientifiche, era naturale attribuire questi eventi a esseri soprannaturali.\"},{\"index\":7215,\"text\":\"Le leggende servivano anche a trasmettere insegnamenti.\"},{\"index\":7216,\"text\":\"Molte storie mettevano in guardia i bambini dal pericolo di allontanarsi da casa o di entrare nei boschi da soli.\"},{\"index\":7217,\"text\":\"Altre spiegavano perché fosse importante rispettare certe regole della comunità.\"},{\"index\":7218,\"text\":\"Così nacquero figure diverse, ma con caratteristiche spesso molto simili.\"},{\"index\":7219,\"text\":\"\"},{\"index\":7220,\"text\":\"🇷🇺 Baba Jaga\"},{\"index\":7221,\"text\":\"Una delle figure più famose del folclore slavo è Baba Jaga.\"},{\"index\":7222,\"text\":\"Vive in una capanna costruita su enormi zampe di gallina.\"},{\"index\":7223,\"text\":\"Secondo le leggende vola dentro un mortaio gigante e usa un pestello per dirigere il volo.\"},{\"index\":7224,\"text\":\"A volte aiuta gli eroi.\"},{\"index\":7225,\"text\":\"Altre volte li mette alla prova.\"},{\"index\":7226,\"text\":\"Può essere crudele oppure sorprendentemente saggia.\"},{\"index\":7227,\"text\":\"Per questo motivo Baba Jaga è molto diversa dall’immagine moderna della strega cattiva.\"},{\"index\":7228,\"text\":\"\"},{\"index\":7229,\"text\":\"🇷🇴 Gli Strigoi\"},{\"index\":7230,\"text\":\"In Romania esistono gli Strigoi.\"},{\"index\":7231,\"text\":\"Secondo il folclore sono spiriti o persone che ritornano dopo la morte.\"},{\"index\":7232,\"text\":\"Si diceva che potessero tormentare le famiglie, provocare malattie o portare sfortuna.\"},{\"index\":7233,\"text\":\"Molte tradizioni rumene nacquero per proteggere i villaggi da questi esseri.\"},{\"index\":7234,\"text\":\"Gli studiosi ritengono che queste leggende abbiano influenzato anche il mito moderno dei vampiri.\"},{\"index\":7235,\"text\":\"\"},{\"index\":7236,\"text\":\"🇬🇷 Lamia\"},{\"index\":7237,\"text\":\"Nell’antica Grecia si raccontava la storia di Lamia.\"},{\"index\":7238,\"text\":\"Secondo il mito era una regina trasformata in mostro.\"},{\"index\":7239,\"text\":\"Con il passare dei secoli divenne una creatura che spaventava i bambini e viveva lontano dalle città.\"},{\"index\":7240,\"text\":\"In alcune versioni era un mostro.\"},{\"index\":7241,\"text\":\"In altre una maga.\"},{\"index\":7242,\"text\":\"Il suo racconto cambiò molte volte nel corso della storia.\"},{\"index\":7243,\"text\":\"\"},{\"index\":7244,\"text\":\"🇯🇵 Yamauba\"},{\"index\":7245,\"text\":\"Tra le montagne del Giappone vive, secondo il folclore, la Yamauba.\"},{\"index\":7246,\"text\":\"È descritta come una vecchia donna che abita nei boschi.\"},{\"index\":7247,\"text\":\"Alcune storie la presentano come un mostro pericoloso.\"},{\"index\":7248,\"text\":\"Altre raccontano che aiuti i viaggiatori smarriti.\"},{\"index\":7249,\"text\":\"Anche questa figura, come Baba Jaga, non è completamente buona né completamente cattiva.\"},{\"index\":7250,\"text\":\"\"},{\"index\":7251,\"text\":\"🇫🇷 Le sorcières\"},{\"index\":7252,\"text\":\"In Francia le streghe vengono chiamate sorcières.\"},{\"index\":7253,\"text\":\"Durante il Medioevo e l’età moderna molte donne furono accusate di praticare la magia.\"},{\"index\":7254,\"text\":\"Le loro storie sono molto simili a quelle italiane.\"},{\"index\":7255,\"text\":\"Anche qui gli storici ritengono che paura, superstizione e tensioni sociali abbiano avuto un ruolo importante nelle accuse.\"},{\"index\":7256,\"text\":\"\"},{\"index\":7257,\"text\":\"🇩🇪 Le Hexen\"},{\"index\":7258,\"text\":\"In Germania le streghe sono chiamate Hexen.\"},{\"index\":7259,\"text\":\"La tradizione tedesca racconta che nella notte del 30 aprile, chiamata Notte di Valpurga (Walpurgisnacht), le streghe si riunissero sul monte Brocken, la cima più alta dei monti Harz.\"},{\"index\":7260,\"text\":\"Questa leggenda è diventata così famosa da ispirare libri, opere teatrali e persino il Faust di Johann Wolfgang von Goethe.\"},{\"index\":7261,\"text\":\"Ancora oggi in alcune città tedesche si organizzano feste popolari dedicate a questa antica tradizione.\"},{\"index\":7262,\"text\":\"\"},{\"index\":7263,\"text\":\"🌎 Che cosa hanno in comune?\"},{\"index\":7264,\"text\":\"Quasi tutte queste figure:\"},{\"index\":7265,\"text\":\"🌙 vivono vicino alla natura.\"},{\"index\":7266,\"text\":\"🌲 frequentano boschi o montagne.\"},{\"index\":7267,\"text\":\"🌿 conoscono le erbe.\"},{\"index\":7268,\"text\":\"🦉 sono attive soprattutto di notte.\"},{\"index\":7269,\"text\":\"😨 fanno paura, ma non sempre sono malvagie.\"},{\"index\":7270,\"text\":\"📚 raccontano qualcosa delle paure e delle speranze delle persone che le hanno immaginate.\"},{\"index\":7271,\"text\":\"\"},{\"index\":7272,\"text\":\"🤔 Una domanda per gli antropologi\"},{\"index\":7273,\"text\":\"Gli studiosi non cercano di capire se queste creature siano realmente esistite.\"},{\"index\":7274,\"text\":\"Si chiedono invece:\"},{\"index\":7275,\"text\":\"Perché popoli che non si conoscevano hanno inventato storie così simili?\"},{\"index\":7276,\"text\":\"Forse gli esseri umani, ovunque vivano, condividono le stesse paure.\"},{\"index\":7277,\"text\":\"La notte.\"},{\"index\":7278,\"text\":\"I boschi.\"},{\"index\":7279,\"text\":\"Le malattie.\"},{\"index\":7280,\"text\":\"L’ignoto.\"},{\"index\":7281,\"text\":\"Per questo motivo le leggende cambiano nome e lingua, ma spesso raccontano la stessa storia.\"},{\"index\":7282,\"text\":\"\"},{\"index\":7283,\"text\":\"⭐ Curiosità finali\"},{\"index\":7284,\"text\":\"📚 La parola italiana strega deriva dal latino strix.\"},{\"index\":7285,\"text\":\"🧙 L’inglese witch deriva dall’antico inglese wicce (forma femminile) e wicca (forma maschile).\"},{\"index\":7286,\"text\":\"🇫🇷 In francese sorcière deriva dal latino sortiarius, legato al destino e agli incantesimi.\"},{\"index\":7287,\"text\":\"🇩🇪 Il tedesco Hexe deriva da un’antica parola germanica che indicava una figura associata alla magia.\"},{\"index\":7288,\"text\":\"🌍 Nonostante le differenze culturali, quasi ogni civiltà ha creato racconti su donne misteriose, maghe o esseri soprannaturali.\"},{\"index\":7289,\"text\":\"\"},{\"index\":7290,\"text\":\"🎓 Conclusione finale\"},{\"index\":7291,\"text\":\"Dopo questo viaggio possiamo capire che la figura della strega è molto più complessa di quella che vediamo nelle fiabe.\"},{\"index\":7292,\"text\":\"Per alcuni era una guaritrice.\"},{\"index\":7293,\"text\":\"Per altri una saggia.\"},{\"index\":7294,\"text\":\"Per altri ancora una persona da temere.\"},{\"index\":7295,\"text\":\"Le storie cambiano da un Paese all’altro, ma ci insegnano tutte la stessa cosa: ogni società usa le leggende per spiegare ciò che ancora non comprende.\"},{\"index\":7296,\"text\":\"Ed è proprio per questo che, dopo migliaia di anni, continuiamo ancora a raccontarle.\"},{\"index\":7297,\"text\":\"\"}],\"questions\":[]}],\"cards\":[{\"it\":\"Parte 1 – Chi erano davvero?\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-01\",\"sourceParagraph\":5912,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5913\",\"sourceText\":\"🧙 Folclore Italiano\\nUnità 1\\nLe Streghe d’Italia\\nParte 1 – Chi erano davvero?\\n\\n🌙 Prima di leggere\\nVocabolario\\n🧙 la strega = witch\\n🪄 la magia = magic\\n🌿 l’erba medicinale = medicinal herb\\n🍄 il fungo = mushroom\\n🌕 la luna piena = full moon\\n🔥 il rogo = stake, bonfire \\n⚖️ il processo = trial\\n🙏 la superstizione = superstition\\n📖 la leggenda = legend\\n🏔️ il villaggio = village\\n🌲 il bosco = forest\\n\\n📖 Lettura\\nQuando sentiamo la parola strega, molti pensano subito a una donna con il cappello a punta, una scopa volante (flying) e un gatto nero. 🐈‍⬛ Tuttavia, questa immagine è abbastanza (enough) moderna e deriva soprattutto dalle fiabe e dalla cultura popolare.\\nNel passato la parola strega aveva un significato molto diverso.\\nIn molte regioni d’Italia si credeva (it was believed) che alcune donne conoscessero le proprietà delle erbe medicinali, sapessero assistere le partorienti (le donne in cinta) oppure preparassero rimedi contro alcune malattie (diseases). 🌿 Alcune di loro erano guaritrici (healers), levatrici (midwives) o semplicemente donne molto esperte della natura.\\nCon il passare dei secoli, però, molte superstizioni si diffusero in Europa. Alcune persone iniziarono ad accusare queste donne di praticare la magia o di avere rapporti (relations) con il diavolo.\\nTra (between) il Quattrocento e il Seicento si svolsero (conduct) numerosi processi per stregoneria(witchcraft) anche in alcune zone dell’Italia. Molte persone furono interrogate, imprigionate e, in alcuni casi, condannate a morte.\\nOggi gli storici ritengono (believe) che una parte di queste accuse fosse basata sulla paura, sulle superstizioni o su conflitti tra vicini, piuttosto (instead) che su prove reali.\\nPer questo motivo, quando studiamo le streghe, non studiamo soltanto il folclore, ma anche il modo in cui le persone interpretavano il mondo molti secoli fa.\\n\\n🇮🇹 Curiosità\\n🧹 Da dove viene la scopa?\\nL’idea della strega che vola sulla scopa non nasce in Italia.\\nSi diffuse in Europa tra la fine del Medioevo e l’inizio dell’età moderna, entrando poi nelle fiabe e nell’arte.\\n\\n🐈‍⬛ Perché il gatto nero?\\nNel Medioevo molti credevano che i gatti neri portassero sfortuna o fossero legati (connected) alle streghe.\\nOggi, naturalmente, sappiamo che si tratta solo di una superstizione.\\n\\n🌿 Le erbe\\nMolte presunte “streghe” conoscevano davvero le piante medicinali.\\nIn un’epoca in cui la medicina era poco sviluppata (developed), questi saperi erano molto preziosi.\\n\\n💬 Hai capito?\\nDa dove deriva l’immagine moderna della strega?\\nChe cosa facevano molte donne considerate streghe?\\nPerché alcune persone le accusavano?\\nIn quale periodo si svolsero molti processi?\\nChe cosa pensano oggi gli storici?\\nChe cosa possiamo imparare studiando la stregoneria?\\n\\n📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel Medioevo molte persone ___credevano_______ alle streghe.\\n (credere)\\nAlcune donne __conoscevano________ le erbe medicinali.\\n (conoscere)\\nGli storici ____studiano______ questo fenomeno ancora oggi.\\n (studiare)\\nNel passato molti processi ____si svolgevano______ in Europa.\\n (svolgersi)\\nAlcune donne __lavoravano________ come levatrici.\\n (lavorare)\\nTu ___hai_______ mai letto un libro sulle streghe?\\n (avere)\\n\\n🔄 Ripasso dei tempi verbali\\nTrasforma la frase usando il tempo richiesto.\\nPresente\\nLe donne conoscono le erbe.\\nImperfetto\\n conoscevano\\nPassato prossimo\\nHanno conosciuto\\nPassato remoto\\nconobbero\\n🗣️ Parliamone\\nPensi che nel passato le persone fossero più superstiziose di oggi?\\nConosci qualche leggenda del tuo Paese?\\nPerché la gente aveva paura delle streghe?\\nOggi esistono ancora superstizioni?\\n\\n///////////////////////////////////////////////\\n///////////////////////\\n//////\\n\\n✍️ Scrittura\\nScrivi 12–15 frasi.\\nPerché nascono le leggende?\\nPuoi parlare di:\\n🌙 la paura\\n🌲 la natura\\n📖 la religione\\n👵 le tradizioni\\n🧙 le streghe\\n\\n⭐ Lo sapevi?\\nLa parola italiana strega deriva dal latino strix, il nome di un uccello notturno che, secondo gli antichi Romani, si nutriva del sangue dei bambini. Con il passare dei secoli, il significato della parola cambiò e finì per indicare una donna associata alla magia e al soprannaturale.\\n➡️ Nella prossima lezione esploreremo alcune delle streghe più famose del folclore italiano, come la Befana, le Janare di Benevento e le Masche del Piemonte, cercando di capire come nacquero queste leggende.\\n30-09-26 – Nadia\"},{\"it\":\"la strega\",\"other\":\"witch\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5919,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5920\"},{\"it\":\"la magia\",\"other\":\"magic\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5920,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5921\"},{\"it\":\"l’erba medicinale\",\"other\":\"medicinal herb\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5921,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5922\"},{\"it\":\"il fungo\",\"other\":\"mushroom\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5922,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5923\"},{\"it\":\"la luna piena\",\"other\":\"full moon\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5923,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5924\"},{\"it\":\"il rogo\",\"other\":\"stake, bonfire\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5924,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5925\"},{\"it\":\"il processo\",\"other\":\"trial\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5925,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5926\"},{\"it\":\"la superstizione\",\"other\":\"superstition\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5926,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5927\"},{\"it\":\"la leggenda\",\"other\":\"legend\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5927,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5928\"},{\"it\":\"il villaggio\",\"other\":\"village\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5928,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5929\"},{\"it\":\"il bosco\",\"other\":\"forest\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5929,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5930\"},{\"it\":\"Da dove deriva l’immagine moderna della strega?\",\"other\":\"Where does the modern image of the witch come from?\\n\\nSuggested response based on the reading: Mainly from fairy tales and popular culture.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5954,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5955\"},{\"it\":\"Che cosa facevano molte donne considerate streghe?\",\"other\":\"What did many women considered witches do?\\n\\nSuggested response based on the reading: They knew medicinal herbs, helped women give birth and prepared remedies; some were healers or midwives.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5955,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5956\"},{\"it\":\"Perché alcune persone le accusavano?\",\"other\":\"Why did some people accuse them?\\n\\nSuggested response based on the reading: Fear and superstition led people to suspect magic or dealings with the devil.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5956,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5957\"},{\"it\":\"In quale periodo si svolsero molti processi?\",\"other\":\"During what period did many trials take place?\\n\\nSuggested response based on the reading: Between the fifteenth and seventeenth centuries.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5957,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5958\"},{\"it\":\"Che cosa pensano oggi gli storici?\",\"other\":\"What do historians think today?\\n\\nSuggested response based on the reading: Many accusations reflected fear, superstition and conflicts between neighbours rather than real evidence.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5958,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5959\"},{\"it\":\"Che cosa possiamo imparare studiando la stregoneria?\",\"other\":\"What can we learn by studying witchcraft?\\n\\nSuggested response based on the reading: How people interpreted the world, and how fears and beliefs shaped past societies.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5959,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5960\"},{\"it\":\"Pensi che nel passato le persone fossero più superstiziose di oggi?\",\"other\":\"Do you think people in the past were more superstitious than people today?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-01\",\"sourceParagraph\":5981,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5982\"},{\"it\":\"Conosci qualche leggenda del tuo Paese?\",\"other\":\"Do you know any legends from your country?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-01\",\"sourceParagraph\":5982,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5983\"},{\"it\":\"Perché la gente aveva paura delle streghe?\",\"other\":\"Why were people afraid of witches?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-01\",\"sourceParagraph\":5983,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5984\"},{\"it\":\"Oggi esistono ancora superstizioni?\",\"other\":\"Do superstitions still exist today?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-01\",\"sourceParagraph\":5984,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5985\"},{\"it\":\"Perché nascono le leggende?\",\"other\":\"Why do legends arise?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-01\",\"sourceParagraph\":5992,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5993\"},{\"it\":\"📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel Medioevo molte persone ___credevano_______ alle streghe.\\n (credere)\\nAlcune donne __conoscevano________ le erbe medicinali.\\n (conoscere)\\nGli storici ____studiano______ questo fenomeno ancora oggi.\\n (studiare)\\nNel passato molti processi ____si svolgevano______ in Europa.\\n (svolgersi)\\nAlcune donne __lavoravano________ come levatrici.\\n (lavorare)\\nTu ___hai_______ mai letto un libro sulle streghe?\\n (avere)\\n\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-01\",\"sourceParagraph\":5961,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5962\"},{\"it\":\"🔄 Ripasso dei tempi verbali\\nTrasforma la frase usando il tempo richiesto.\\nPresente\\nLe donne conoscono le erbe.\\nImperfetto\\n conoscevano\\nPassato prossimo\\nHanno conosciuto\\nPassato remoto\\nconobbero\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-01\",\"sourceParagraph\":5970,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5971\"},{\"it\":\"Parte 2 – Le streghe più famose del folclore italiano\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-02\",\"sourceParagraph\":6004,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6005\",\"sourceText\":\"🧙 Folclore Italiano\\nUnità 1\\nLe Streghe d’Italia\\nParte 2 – Le streghe più famose del folclore italiano\\n\\n🌞 Prima di leggere\\nVocabolario\\n🧹 la scopa = broom\\n🎁 il regalo = gift\\n👵 l’anziana = elderly woman\\n🌰 il noce = walnut tree\\n🌙 il sabba = witches’ gathering (secondo il folclore)\\n🧚 la fata = fairy\\n🪄 l’incantesimo = spell\\n🪶 la leggenda popolare = folk legend\\n🦉 il gufo = owl\\n🏞️ il folklore = folklore\\n\\n📖 Lettura\\nL’Italia non ha una sola leggenda sulle streghe. Ogni regione ha creato le proprie storie, spesso molto diverse tra loro.\\nUna delle figure più conosciute è la Befana. Oggi è una simpatica vecchietta che, nella notte tra il 5 e il 6 gennaio, porta dolci ai bambini buoni e carbone a quelli che si sono comportati male. 🎁\\nMolti studiosi pensano che la Befana abbia origini molto antiche, forse precedenti al Cristianesimo. Alcuni elementi ricordano antichi riti agricoli legati alla fine dell’inverno e all’inizio di un nuovo ciclo della natura.\\nMolto diversa è la leggenda delle Janare, diffuse soprattutto nella zona di Benevento, in Campania. Secondo il folclore, le Janare erano donne che uscivano di notte e si riunivano vicino a un grande albero di noce. Si diceva che conoscessero formule magiche e che potessero lanciare incantesimi.\\nGli storici, però, ritengono che queste storie siano il risultato di antiche credenze popolari, trasformate nel corso dei secoli dalla fantasia e dalla paura.\\nNel Piemonte, invece, si raccontavano le storie delle Masche. Le Masche non erano sempre malvagie: in alcune leggende aiutavano le persone, in altre provocavano scherzi o piccoli dispetti. Potevano trasformarsi in animali, scomparire all’improvviso(disappear suddenly) oppure(or) confondere(confuse) i viaggiatori durante la notte.\\nQueste leggende cambiavano da paese a paese. Non esisteva una sola storia “ufficiale”: ogni famiglia raccontava i propri episodi e aggiungeva nuovi particolari.\\nPer questo motivo il folclore italiano è così ricco e vario.\\n\\n🌍 Curiosità\\n🎁 La Befana è una strega?\\nMolti bambini la chiamano “strega”, ma in realtà la Befana è una figura del folclore italiano.\\nNon è considerata malvagia: porta regali, dolci e speranza per il nuovo anno.\\n\\n🌰 Il Noce di Benevento\\nPer secoli si raccontò che vicino a Benevento crescesse un enorme noce dove le Janare si riunivano durante la notte.\\nGli storici non hanno prove che questi incontri siano realmente avvenuti, ma la leggenda è diventata una delle più famose d’Italia.\\n\\n🦉 Animali misteriosi\\nNelle antiche leggende le streghe erano spesso accompagnate da:\\n🐈‍⬛ gatti neri\\n🦉 gufi\\n🐺 lupi\\nQuesti animali erano associati alla notte e al mistero.\\n\\n💬 Hai capito?\\nRispondi.\\nChi è la Befana?\\nQuali potrebbero essere le origini della Befana?\\nDove vivevano, secondo la leggenda, le Janare?\\nChi erano le Masche?\\nPerché esistono tante versioni delle stesse leggende?\\nQuali animali compaiono spesso nelle storie di streghe?\\n\\n✅ Vero o falso?\\nLa Befana porta i regali il giorno di Natale.\\nLe Janare appartengono al folclore della Campania.\\nLe Masche sono legate al Piemonte.\\nTutte le leggende raccontano la stessa storia.\\nIl noce di Benevento è famoso nella tradizione popolare.\\nIl folclore cambia da una regione all’altra.\\n\\n📚 Ripassiamo la grammatica\\nScegli il tempo corretto.\\nQuando Nadia era bambina, __________ molte fiabe.\\na) leggeva\\nb) ha letto\\nc) lesse\\n\\nNel Medioevo molte persone __________ nelle streghe.\\na) credono\\nb) credevano\\nc) hanno creduto\\n\\nLa Befana __________ uno dei simboli del folclore italiano.\\na) è\\nb) era\\nc) fu\\n\\nI nonni mi __________ questa leggenda quando ero piccolo.\\na) raccontavano\\nb) hanno raccontato\\nc) racconteranno\\n\\nNel Cinquecento molte persone __________ accuse di stregoneria.\\na) subirono\\nb) hanno subito\\nc) subiscono\\n\\n🔄 Trasforma la frase\\nFrase:\\nLe Janare si riunivano sotto il noce.\\n➡️ Presente:\\n\\n➡️ Passato prossimo:\\n\\n➡️ Passato remoto:\\n\\n🗣️ Parliamone\\nQuale leggenda ti sembra più interessante?\\nNel tuo Paese esiste una figura simile alla Befana?\\nPerché le persone inventano storie sul soprannaturale?\\nTi piace il folclore oppure preferisci la storia documentata?\\n\\n✍️ Scrittura\\nUna leggenda della mia città\\nScrivi 12–15 frasi.\\nParla di:\\n📍 dove nasce la leggenda\\n👥 i personaggi\\n🌙 che cosa succede\\n🤔 perché pensi che questa storia sia nata\\n\\n⭐ Lo sapevi?\\nLa parola folclore deriva dall’inglese folklore, formato da folk (“popolo”) e lore (“sapere”, “tradizione”). Indica l’insieme delle leggende, dei racconti, delle feste, delle credenze e delle tradizioni tramandate oralmente da una generazione all’altra.\\n➡️ Nella prossima lezione scopriremo i veri processi alle streghe in Italia: chi veniva accusato, perché accadeva e che cosa ci raccontano oggi gli storici su quel periodo.\\n30-09-26 – Nadia\"},{\"it\":\"la scopa\",\"other\":\"broom\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6011,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6012\"},{\"it\":\"il regalo\",\"other\":\"gift\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6012,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6013\"},{\"it\":\"l’anziana\",\"other\":\"elderly woman\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6013,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6014\"},{\"it\":\"il noce\",\"other\":\"walnut tree\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6014,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6015\"},{\"it\":\"il sabba\",\"other\":\"witches’ gathering (secondo il folclore)\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6015,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6016\"},{\"it\":\"la fata\",\"other\":\"fairy\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6016,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6017\"},{\"it\":\"l’incantesimo\",\"other\":\"spell\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6017,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6018\"},{\"it\":\"la leggenda popolare\",\"other\":\"folk legend\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6018,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6019\"},{\"it\":\"il gufo\",\"other\":\"owl\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6019,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6020\"},{\"it\":\"il folklore\",\"other\":\"folklore\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6020,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6021\"},{\"it\":\"Chi è la Befana?\",\"other\":\"Who is the Befana?\\n\\nSuggested response based on the reading: An Italian folklore figure who brings sweets to well-behaved children and coal to those who misbehave, on the night of 5–6 January.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6050,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6051\"},{\"it\":\"Quali potrebbero essere le origini della Befana?\",\"other\":\"What might the origins of the Befana be?\\n\\nSuggested response based on the reading: Possibly ancient, pre-Christian agricultural rituals connected with the end of winter and a new natural cycle.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6051,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6052\"},{\"it\":\"Dove vivevano, secondo la leggenda, le Janare?\",\"other\":\"Where did the Janare live, according to the legend?\\n\\nSuggested response based on the reading: Around Benevento in Campania; they supposedly gathered near a large walnut tree.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6052,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6053\"},{\"it\":\"Chi erano le Masche?\",\"other\":\"Who were the Masche?\\n\\nSuggested response based on the reading: Figures of Piedmontese folklore who could supposedly transform into animals; some helped people, others played tricks.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6053,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6054\"},{\"it\":\"Perché esistono tante versioni delle stesse leggende?\",\"other\":\"Why are there so many versions of the same legends?\\n\\nSuggested response based on the reading: Stories were passed down orally; each village and family added new details.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6054,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6055\"},{\"it\":\"Quali animali compaiono spesso nelle storie di streghe?\",\"other\":\"Which animals often appear in stories about witches?\\n\\nSuggested response based on the reading: Black cats, owls and wolves.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6055,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6056\"},{\"it\":\"Quale leggenda ti sembra più interessante?\",\"other\":\"Which legend seems most interesting to you?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-02\",\"sourceParagraph\":6102,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6103\"},{\"it\":\"Nel tuo Paese esiste una figura simile alla Befana?\",\"other\":\"Is there a figure similar to the Befana in your country?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-02\",\"sourceParagraph\":6103,\"note\":\"Liam · Lettura · Parte 2 – L
