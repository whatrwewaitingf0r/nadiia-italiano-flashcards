<!DOCTYPE html>
<html lang="it">
<head>
<meta name="build-version" content="v5">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#345b55">
<title>Italiano in tasca · Flashcard per Nadiia</title>
<style>
:root{--laguna:#345b55;--laguna2:#23423e;--cielo:#dceff1;--limone:#f3d45b;--carta:#fffdf8;--inchiostro:#17302d;--corallo:#e87962;--muted:#6a7a77;--shadow:0 18px 50px rgba(20,55,50,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:linear-gradient(180deg,var(--cielo),#eef7f4 42%,#f7f1dd);color:var(--inchiostro);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select{font:inherit} button{touch-action:manipulation}
.app{width:100%;max-width:720px;min-height:100vh;margin:auto;padding:18px clamp(14px,4vw,30px) 28px;display:flex;flex-direction:column}
.app>*{min-width:0;max-width:100%}
header{display:flex;min-width:0;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--laguna);font-weight:800}
h1{min-width:0;font-size:clamp(1.5rem,7vw,2.4rem);line-height:.96;margin:.32rem 0 0;letter-spacing:-.055em;max-width:12ch}
.counter{font-variant-numeric:tabular-nums;font-weight:800;background:rgba(255,255,255,.62);padding:8px 11px;border-radius:999px;white-space:nowrap}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;margin-bottom:12px}
.deck-picker{min-width:0;display:flex;flex-direction:column;gap:5px}.deck-picker label{padding-left:4px;font-size:.72rem;letter-spacing:.06em;font-weight:850;color:var(--laguna)}
.toolbar select{min-width:0;width:100%;max-width:100%}
select,.mode{border:1px solid rgba(35,66,62,.16);background:rgba(255,255,255,.75);color:var(--inchiostro);border-radius:14px;min-height:44px;padding:0 12px;font-weight:700}
.mode{min-width:0;max-width:88px;padding-left:8px;padding-right:8px;display:flex;align-items:center;gap:7px;cursor:pointer}.mode span{color:var(--corallo)}
.track{height:5px;background:rgba(52,91,85,.14);border-radius:9px;overflow:hidden;margin-bottom:14px}.track i{display:block;height:100%;width:0;background:var(--corallo);transition:width .25s ease}
.scene{width:100%;min-width:0;perspective:1200px;min-height:clamp(340px,54vh,470px);cursor:pointer;outline:none}
.card{position:relative;width:100%;height:100%;min-height:inherit;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.22,.7,.25,1)}
.scene.flipped .card{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;padding:26px clamp(22px,7vw,50px);background:var(--carta);box-shadow:var(--shadow);border:1px solid rgba(35,66,62,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.face:before{content:"";position:absolute;width:130px;height:130px;border:26px solid var(--limone);border-radius:50%;right:-74px;top:-72px;opacity:.75}
.back{transform:rotateY(180deg);background:var(--laguna);color:white}.back:before{border-color:var(--corallo)}
.label{position:absolute;top:22px;left:24px;font-size:.7rem;letter-spacing:.17em;text-transform:uppercase;font-weight:850;color:var(--muted)}.back .label{color:#cde0dc}
.word{font-size:clamp(2rem,9vw,4rem);font-weight:850;line-height:1.04;letter-spacing:-.045em;overflow-wrap:anywhere}.back .word{font-size:clamp(1.8rem,8vw,3.6rem)}
.note{position:absolute;bottom:24px;left:24px;right:24px;font-size:.78rem;line-height:1.35;color:var(--muted);font-weight:650}.back .note{color:#cde0dc}
.hint{margin:15px 0 12px;text-align:center;color:var(--muted);font-size:.78rem}.hint b{color:var(--laguna)}
.controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px}
.controls button{min-width:0;padding-left:5px;padding-right:5px;font-size:.88rem}
.controls button,.shuffle{border:0;border-radius:16px;min-height:54px;font-weight:850;color:var(--inchiostro);background:rgba(255,255,255,.72);box-shadow:0 5px 16px rgba(20,55,50,.09);cursor:pointer}
.controls .flip{background:var(--limone)}.controls button:active,.shuffle:active{transform:translateY(1px)}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.shuffle{min-height:42px;padding:0 16px}.status{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.75rem;color:var(--muted);text-align:right}
@media(max-height:650px){.scene{min-height:300px}.face{padding-top:48px}.hint{margin:9px 0}.controls button{min-height:48px}}
@media(prefers-reduced-motion:reduce){.card,.track i{transition:none}}
</style>
</head>
<body>
<main class="app">
 <header><div><div class="eyebrow">Italiano in tasca · v5</div><h1>Una carta alla volta.</h1></div><div class="counter" id="counter">1 / 1</div></header>
 <div class="toolbar">
  <div class="deck-picker"><label for="filter">Mazzo / урок</label><select id="filter" aria-label="Mazzo / урок"></select></div>
  <button class="mode" id="direction" aria-label="Cambia direzione"><b id="dirText">EN→IT</b><span>⇄</span></button>
 </div>
 <div class="track"><i id="progress"></i></div>
 <section class="scene" id="scene" tabindex="0" role="button" aria-label="Tocca per girare la carta">
  <div class="card">
   <article class="face front"><div class="label" id="frontLabel"></div><div class="word" id="frontWord"></div><div class="note" id="frontNote"></div></article>
   <article class="face back"><div class="label" id="backLabel"></div><div class="word" id="backWord"></div><div class="note" id="backNote"></div></article>
  </div>
 </section>
 <div class="hint">Tocca la carta oppure <b>Gira</b></div>
 <nav class="controls" aria-label="Navigazione">
  <button id="prev" aria-label="Carta precedente">←</button><button class="flip" id="flip">Gira</button><button id="next" aria-label="Carta successiva">→</button>
 </nav>
 <div class="footer"><button class="shuffle" id="shuffle">Mescola ⤨</button><div class="status" id="status">Funziona offline · v5</div></div>
</main>

const $=id=>document.getElementById(id);
let pool=ALL.slice(), index=0, reverse=false, flipped=false;
const groups=[
 ['liam-all','Liam · все слова'],
 ['chiara-all','Chiara · все']
];
const filter=$('filter');
groups.forEach(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;filter.appendChild(o)});
const CHIARA_12_GROUPS=new Set(['Mesi','Giorni','Data','Compleanno','Interrogativi']);
function matches(c,g){
 if(g==='liam-all')return c.lang==='RU'&&c.group==='Vocabolario';
 if(g==='chiara-all')return CHIARA_12_GROUPS.has(c.group)||c.note.startsWith('Lezione 26 agosto · Chiara');
 return false;
}
function deckLanguage(){return filter.value==='liam-all'?'RU':'EN'}
function setFlip(v){flipped=v;$('scene').classList.toggle('flipped',v)}
function updateDirectionLabel(){const otherLang=deckLanguage();$('dirText').textContent=reverse?otherLang+'→IT':'IT→'+otherLang}
function render(){const c=pool[index];if(!c)return;
 updateDirectionLabel(c);
 const first=reverse?c.other:c.it, second=reverse?c.it:c.other;
 $('frontWord').textContent=first;$('backWord').textContent=second;
 const otherLang=deckLanguage();
 $('frontLabel').textContent=reverse?(otherLang==='RU'?'Русский → Italiano':'English → Italiano'):'Italiano → '+otherLang;
 $('backLabel').textContent=reverse?'Italiano':otherLang;
 $('frontNote').textContent=c.group;$('backNote').textContent=c.note;
 $('counter').textContent=(index+1)+' / '+pool.length;$('progress').style.width=((index+1)/pool.length*100)+'%';setFlip(false)}
function move(delta){index=(index+delta+pool.length)%pool.length;render()}
function shufflePool(){for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}}
$('scene').onclick=()=>setFlip(!flipped);$('flip').onclick=()=>setFlip(!flipped);$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
$('direction').onclick=()=>{reverse=!reverse;render()};
filter.onchange=()=>{pool=ALL.filter(c=>matches(c,filter.value));shufflePool();index=0;reverse=false;$('status').textContent=pool.length+' carte · mescolate · offline · v5';render()};
$('shuffle').onclick=()=>{shufflePool();index=0;$('status').textContent='Mazzo mescolato · v5';render()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' '||e.key==='Enter'){e.preventDefault();setFlip(!flipped)}});
pool=ALL.filter(c=>matches(c,filter.value));shufflePool();$('status').textContent=pool.length+' carte · mescolate · offline · v5';render();
