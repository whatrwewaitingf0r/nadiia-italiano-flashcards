a in tutta la lettura\u003c/label>\u003cdiv class=\"search-row\">\u003cinput id=\"search\" type=\"search\" placeholder=\"Matteuccia, Strigoi, formula…\">\u003cbutton id=\"find\" type=\"button\">Trova\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cnav class=\"navigation\" aria-label=\"Navigazione lettura\">\u003cbutton id=\"previous\" type=\"button\">← Prima\u003c/button>\u003cbutton id=\"next\" type=\"button\">Dopo →\u003c/button>\u003cspan class=\"status\" id=\"status\" aria-live=\"polite\">\u003c/span>\u003c/nav>\n\u003cdiv class=\"source-note\">Testo originale integrale del DOCX, comprese le due versioni della Parte 4, il programma, i documenti storici e gli esercizi. Le leggende e le confessioni non sono prove di eventi soprannaturali. Le risposte suggerite in inglese sono materiale di studio ricavato dal testo, non una chiave originale del documento.\u003c/div>\n\u003cdiv class=\"layout\">\u003carticle class=\"passage\">\u003ch2 id=\"title\">\u003c/h2>\u003cdiv id=\"paragraphs\">\u003c/div>\u003c/article>\u003caside class=\"practice\">\u003ch2>Hai capito? · Parliamone\u003c/h2>\u003cdiv class=\"save-status\" id=\"save-status\" aria-live=\"polite\">Le tue risposte restano su questo dispositivo, quando lo spazio locale è disponibile.\u003c/div>\u003cdiv id=\"questions\">\u003c/div>\u003c/aside>\u003c/div>\n\u003cp style=\"font-size:.8rem\">\u003ca href=\"index.html#carte\">Carte · tutti i mazzi →\u003c/a>\u003c/p>\n\u003cscript type=\"application/json\" id=\"reading-data\">{\"owner\":\"Liam\",\"title\":\"Le streghe: lettura integrale\",\"source\":{\"filename\":\"Copy_of_test---8746b41d-eb5a-4e13-a04e-8e0ca58130f5.docx\",\"sha256\":\"acdc3691327eda6e7bc9495606dfd84358171d5a835b69b92b51e321ada2d24c\",\"startParagraph\":5912,\"paragraphCount\":1386,\"extraction\":\"Every body paragraph, including tables, in document order. Zero-based source indices.\",\"answerPolicy\":\"Suggested study responses generated from the reading, not an original answer key. Historical statements remain attributed to the source.\"},\"sections\":[{\"id\":\"lettura-01\",\"title\":\"Parte 1 – Chi erano davvero?\",\"startParagraph\":5912,\"endParagraph\":6003,\"paragraphs\":[{\"index\":5912,\"text\":\"🧙 Folclore Italiano\"},{\"index\":5913,\"text\":\"Unità 1\"},{\"index\":5914,\"text\":\"Le Streghe d’Italia\"},{\"index\":5915,\"text\":\"Parte 1 – Chi erano davvero?\"},{\"index\":5916,\"text\":\"\"},{\"index\":5917,\"text\":\"🌙 Prima di leggere\"},{\"index\":5918,\"text\":\"Vocabolario\"},{\"index\":5919,\"text\":\"🧙 la strega = witch\"},{\"index\":5920,\"text\":\"🪄 la magia = magic\"},{\"index\":5921,\"text\":\"🌿 l’erba medicinale = medicinal herb\"},{\"index\":5922,\"text\":\"🍄 il fungo = mushroom\"},{\"index\":5923,\"text\":\"🌕 la luna piena = full moon\"},{\"index\":5924,\"text\":\"🔥 il rogo = stake, bonfire \"},{\"index\":5925,\"text\":\"⚖️ il processo = trial\"},{\"index\":5926,\"text\":\"🙏 la superstizione = superstition\"},{\"index\":5927,\"text\":\"📖 la leggenda = legend\"},{\"index\":5928,\"text\":\"🏔️ il villaggio = village\"},{\"index\":5929,\"text\":\"🌲 il bosco = forest\"},{\"index\":5930,\"text\":\"\"},{\"index\":5931,\"text\":\"📖 Lettura\"},{\"index\":5932,\"text\":\"Quando sentiamo la parola strega, molti pensano subito a una donna con il cappello a punta, una scopa volante (flying) e un gatto nero. 🐈‍⬛ Tuttavia, questa immagine è abbastanza (enough) moderna e deriva soprattutto dalle fiabe e dalla cultura popolare.\"},{\"index\":5933,\"text\":\"Nel passato la parola strega aveva un significato molto diverso.\"},{\"index\":5934,\"text\":\"In molte regioni d’Italia si credeva (it was believed) che alcune donne conoscessero le proprietà delle erbe medicinali, sapessero assistere le partorienti (le donne in cinta) oppure preparassero rimedi contro alcune malattie (diseases). 🌿 Alcune di loro erano guaritrici (healers), levatrici (midwives) o semplicemente donne molto esperte della natura.\"},{\"index\":5935,\"text\":\"Con il passare dei secoli, però, molte superstizioni si diffusero in Europa. Alcune persone iniziarono ad accusare queste donne di praticare la magia o di avere rapporti (relations) con il diavolo.\"},{\"index\":5936,\"text\":\"Tra (between) il Quattrocento e il Seicento si svolsero (conduct) numerosi processi per stregoneria(witchcraft) anche in alcune zone dell’Italia. Molte persone furono interrogate, imprigionate e, in alcuni casi, condannate a morte.\"},{\"index\":5937,\"text\":\"Oggi gli storici ritengono (believe) che una parte di queste accuse fosse basata sulla paura, sulle superstizioni o su conflitti tra vicini, piuttosto (instead) che su prove reali.\"},{\"index\":5938,\"text\":\"Per questo motivo, quando studiamo le streghe, non studiamo soltanto il folclore, ma anche il modo in cui le persone interpretavano il mondo molti secoli fa.\"},{\"index\":5939,\"text\":\"\"},{\"index\":5940,\"text\":\"🇮🇹 Curiosità\"},{\"index\":5941,\"text\":\"🧹 Da dove viene la scopa?\"},{\"index\":5942,\"text\":\"L’idea della strega che vola sulla scopa non nasce in Italia.\"},{\"index\":5943,\"text\":\"Si diffuse in Europa tra la fine del Medioevo e l’inizio dell’età moderna, entrando poi nelle fiabe e nell’arte.\"},{\"index\":5944,\"text\":\"\"},{\"index\":5945,\"text\":\"🐈‍⬛ Perché il gatto nero?\"},{\"index\":5946,\"text\":\"Nel Medioevo molti credevano che i gatti neri portassero sfortuna o fossero legati (connected) alle streghe.\"},{\"index\":5947,\"text\":\"Oggi, naturalmente, sappiamo che si tratta solo di una superstizione.\"},{\"index\":5948,\"text\":\"\"},{\"index\":5949,\"text\":\"🌿 Le erbe\"},{\"index\":5950,\"text\":\"Molte presunte “streghe” conoscevano davvero le piante medicinali.\"},{\"index\":5951,\"text\":\"In un’epoca in cui la medicina era poco sviluppata (developed), questi saperi erano molto preziosi.\"},{\"index\":5952,\"text\":\"\"},{\"index\":5953,\"text\":\"💬 Hai capito?\"},{\"index\":5954,\"text\":\"Da dove deriva l’immagine moderna della strega?\"},{\"index\":5955,\"text\":\"Che cosa facevano molte donne considerate streghe?\"},{\"index\":5956,\"text\":\"Perché alcune persone le accusavano?\"},{\"index\":5957,\"text\":\"In quale periodo si svolsero molti processi?\"},{\"index\":5958,\"text\":\"Che cosa pensano oggi gli storici?\"},{\"index\":5959,\"text\":\"Che cosa possiamo imparare studiando la stregoneria?\"},{\"index\":5960,\"text\":\"\"},{\"index\":5961,\"text\":\"📚 Ripassiamo la grammatica\"},{\"index\":5962,\"text\":\"Completa con il tempo corretto.\"},{\"index\":5963,\"text\":\"Nel Medioevo molte persone ___credevano_______ alle streghe.\\n (credere)\"},{\"index\":5964,\"text\":\"Alcune donne __conoscevano________ le erbe medicinali.\\n (conoscere)\"},{\"index\":5965,\"text\":\"Gli storici ____studiano______ questo fenomeno ancora oggi.\\n (studiare)\"},{\"index\":5966,\"text\":\"Nel passato molti processi ____si svolgevano______ in Europa.\\n (svolgersi)\"},{\"index\":5967,\"text\":\"Alcune donne __lavoravano________ come levatrici.\\n (lavorare)\"},{\"index\":5968,\"text\":\"Tu ___hai_______ mai letto un libro sulle streghe?\\n (avere)\"},{\"index\":5969,\"text\":\"\"},{\"index\":5970,\"text\":\"🔄 Ripasso dei tempi verbali\"},{\"index\":5971,\"text\":\"Trasforma la frase usando il tempo richiesto.\"},{\"index\":5972,\"text\":\"Presente\"},{\"index\":5973,\"text\":\"Le donne conoscono le erbe.\"},{\"index\":5974,\"text\":\"Imperfetto\"},{\"index\":5975,\"text\":\" conoscevano\"},{\"index\":5976,\"text\":\"Passato prossimo\"},{\"index\":5977,\"text\":\"Hanno conosciuto\"},{\"index\":5978,\"text\":\"Passato remoto\"},{\"index\":5979,\"text\":\"conobbero\"},{\"index\":5980,\"text\":\"🗣️ Parliamone\"},{\"index\":5981,\"text\":\"Pensi che nel passato le persone fossero più superstiziose di oggi?\"},{\"index\":5982,\"text\":\"Conosci qualche leggenda del tuo Paese?\"},{\"index\":5983,\"text\":\"Perché la gente aveva paura delle streghe?\"},{\"index\":5984,\"text\":\"Oggi esistono ancora superstizioni?\"},{\"index\":5985,\"text\":\"\"},{\"index\":5986,\"text\":\"///////////////////////////////////////////////\"},{\"index\":5987,\"text\":\"///////////////////////\"},{\"index\":5988,\"text\":\"//////\"},{\"index\":5989,\"text\":\"\"},{\"index\":5990,\"text\":\"✍️ Scrittura\"},{\"index\":5991,\"text\":\"Scrivi 12–15 frasi.\"},{\"index\":5992,\"text\":\"Perché nascono le leggende?\"},{\"index\":5993,\"text\":\"Puoi parlare di:\"},{\"index\":5994,\"text\":\"🌙 la paura\"},{\"index\":5995,\"text\":\"🌲 la natura\"},{\"index\":5996,\"text\":\"📖 la religione\"},{\"index\":5997,\"text\":\"👵 le tradizioni\"},{\"index\":5998,\"text\":\"🧙 le streghe\"},{\"index\":5999,\"text\":\"\"},{\"index\":6000,\"text\":\"⭐ Lo sapevi?\"},{\"index\":6001,\"text\":\"La parola italiana strega deriva dal latino strix, il nome di un uccello notturno che, secondo gli antichi Romani, si nutriva del sangue dei bambini. Con il passare dei secoli, il significato della parola cambiò e finì per indicare una donna associata alla magia e al soprannaturale.\"},{\"index\":6002,\"text\":\"➡️ Nella prossima lezione esploreremo alcune delle streghe più famose del folclore italiano, come la Befana, le Janare di Benevento e le Masche del Piemonte, cercando di capire come nacquero queste leggende.\"},{\"index\":6003,\"text\":\"30-09-26 – Nadia\"}],\"questions\":[{\"prompt\":\"Da dove deriva l’immagine moderna della strega?\",\"translation\":\"Where does the modern image of the witch come from?\",\"answer\":\"Mainly from fairy tales and popular culture.\",\"type\":\"comprehension\",\"sourceParagraph\":5954},{\"prompt\":\"Che cosa facevano molte donne considerate streghe?\",\"translation\":\"What did many women considered witches do?\",\"answer\":\"They knew medicinal herbs, helped women give birth and prepared remedies; some were healers or midwives.\",\"type\":\"comprehension\",\"sourceParagraph\":5955},{\"prompt\":\"Perché alcune persone le accusavano?\",\"translation\":\"Why did some people accuse them?\",\"answer\":\"Fear and superstition led people to suspect magic or dealings with the devil.\",\"type\":\"comprehension\",\"sourceParagraph\":5956},{\"prompt\":\"In quale periodo si svolsero molti processi?\",\"translation\":\"During what period did many trials take place?\",\"answer\":\"Between the fifteenth and seventeenth centuries.\",\"type\":\"comprehension\",\"sourceParagraph\":5957},{\"prompt\":\"Che cosa pensano oggi gli storici?\",\"translation\":\"What do historians think today?\",\"answer\":\"Many accusations reflected fear, superstition and conflicts between neighbours rather than real evidence.\",\"type\":\"comprehension\",\"sourceParagraph\":5958},{\"prompt\":\"Che cosa possiamo imparare studiando la stregoneria?\",\"translation\":\"What can we learn by studying witchcraft?\",\"answer\":\"How people interpreted the world, and how fears and beliefs shaped past societies.\",\"type\":\"comprehension\",\"sourceParagraph\":5959},{\"prompt\":\"Pensi che nel passato le persone fossero più superstiziose di oggi?\",\"translation\":\"Do you think people in the past were more superstitious than people today?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":5981},{\"prompt\":\"Conosci qualche leggenda del tuo Paese?\",\"translation\":\"Do you know any legends from your country?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":5982},{\"prompt\":\"Perché la gente aveva paura delle streghe?\",\"translation\":\"Why were people afraid of witches?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":5983},{\"prompt\":\"Oggi esistono ancora superstizioni?\",\"translation\":\"Do superstitions still exist today?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":5984},{\"prompt\":\"Perché nascono le leggende?\",\"translation\":\"Why do legends arise?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":5992}]},{\"id\":\"lettura-02\",\"title\":\"Parte 2 – Le streghe più famose del folclore italiano\",\"startParagraph\":6004,\"endParagraph\":6119,\"paragraphs\":[{\"index\":6004,\"text\":\"🧙 Folclore Italiano\"},{\"index\":6005,\"text\":\"Unità 1\"},{\"index\":6006,\"text\":\"Le Streghe d’Italia\"},{\"index\":6007,\"text\":\"Parte 2 – Le streghe più famose del folclore italiano\"},{\"index\":6008,\"text\":\"\"},{\"index\":6009,\"text\":\"🌞 Prima di leggere\"},{\"index\":6010,\"text\":\"Vocabolario\"},{\"index\":6011,\"text\":\"🧹 la scopa = broom\"},{\"index\":6012,\"text\":\"🎁 il regalo = gift\"},{\"index\":6013,\"text\":\"👵 l’anziana = elderly woman\"},{\"index\":6014,\"text\":\"🌰 il noce = walnut tree\"},{\"index\":6015,\"text\":\"🌙 il sabba = witches’ gathering (secondo il folclore)\"},{\"index\":6016,\"text\":\"🧚 la fata = fairy\"},{\"index\":6017,\"text\":\"🪄 l’incantesimo = spell\"},{\"index\":6018,\"text\":\"🪶 la leggenda popolare = folk legend\"},{\"index\":6019,\"text\":\"🦉 il gufo = owl\"},{\"index\":6020,\"text\":\"🏞️ il folklore = folklore\"},{\"index\":6021,\"text\":\"\"},{\"index\":6022,\"text\":\"📖 Lettura\"},{\"index\":6023,\"text\":\"L’Italia non ha una sola leggenda sulle streghe. Ogni regione ha creato le proprie storie, spesso molto diverse tra loro.\"},{\"index\":6024,\"text\":\"Una delle figure più conosciute è la Befana. Oggi è una simpatica vecchietta che, nella notte tra il 5 e il 6 gennaio, porta dolci ai bambini buoni e carbone a quelli che si sono comportati male. 🎁\"},{\"index\":6025,\"text\":\"Molti studiosi pensano che la Befana abbia origini molto antiche, forse precedenti al Cristianesimo. Alcuni elementi ricordano antichi riti agricoli legati alla fine dell’inverno e all’inizio di un nuovo ciclo della natura.\"},{\"index\":6026,\"text\":\"Molto diversa è la leggenda delle Janare, diffuse soprattutto nella zona di Benevento, in Campania. Secondo il folclore, le Janare erano donne che uscivano di notte e si riunivano vicino a un grande albero di noce. Si diceva che conoscessero formule magiche e che potessero lanciare incantesimi.\"},{\"index\":6027,\"text\":\"Gli storici, però, ritengono che queste storie siano il risultato di antiche credenze popolari, trasformate nel corso dei secoli dalla fantasia e dalla paura.\"},{\"index\":6028,\"text\":\"Nel Piemonte, invece, si raccontavano le storie delle Masche. Le Masche non erano sempre malvagie: in alcune leggende aiutavano le persone, in altre provocavano scherzi o piccoli dispetti. Potevano trasformarsi in animali, scomparire all’improvviso(disappear suddenly) oppure(or) confondere(confuse) i viaggiatori durante la notte.\"},{\"index\":6029,\"text\":\"Queste leggende cambiavano da paese a paese. Non esisteva una sola storia “ufficiale”: ogni famiglia raccontava i propri episodi e aggiungeva nuovi particolari.\"},{\"index\":6030,\"text\":\"Per questo motivo il folclore italiano è così ricco e vario.\"},{\"index\":6031,\"text\":\"\"},{\"index\":6032,\"text\":\"🌍 Curiosità\"},{\"index\":6033,\"text\":\"🎁 La Befana è una strega?\"},{\"index\":6034,\"text\":\"Molti bambini la chiamano “strega”, ma in realtà la Befana è una figura del folclore italiano.\"},{\"index\":6035,\"text\":\"Non è considerata malvagia: porta regali, dolci e speranza per il nuovo anno.\"},{\"index\":6036,\"text\":\"\"},{\"index\":6037,\"text\":\"🌰 Il Noce di Benevento\"},{\"index\":6038,\"text\":\"Per secoli si raccontò che vicino a Benevento crescesse un enorme noce dove le Janare si riunivano durante la notte.\"},{\"index\":6039,\"text\":\"Gli storici non hanno prove che questi incontri siano realmente avvenuti, ma la leggenda è diventata una delle più famose d’Italia.\"},{\"index\":6040,\"text\":\"\"},{\"index\":6041,\"text\":\"🦉 Animali misteriosi\"},{\"index\":6042,\"text\":\"Nelle antiche leggende le streghe erano spesso accompagnate da:\"},{\"index\":6043,\"text\":\"🐈‍⬛ gatti neri\"},{\"index\":6044,\"text\":\"🦉 gufi\"},{\"index\":6045,\"text\":\"🐺 lupi\"},{\"index\":6046,\"text\":\"Questi animali erano associati alla notte e al mistero.\"},{\"index\":6047,\"text\":\"\"},{\"index\":6048,\"text\":\"💬 Hai capito?\"},{\"index\":6049,\"text\":\"Rispondi.\"},{\"index\":6050,\"text\":\"Chi è la Befana?\"},{\"index\":6051,\"text\":\"Quali potrebbero essere le origini della Befana?\"},{\"index\":6052,\"text\":\"Dove vivevano, secondo la leggenda, le Janare?\"},{\"index\":6053,\"text\":\"Chi erano le Masche?\"},{\"index\":6054,\"text\":\"Perché esistono tante versioni delle stesse leggende?\"},{\"index\":6055,\"text\":\"Quali animali compaiono spesso nelle storie di streghe?\"},{\"index\":6056,\"text\":\"\"},{\"index\":6057,\"text\":\"✅ Vero o falso?\"},{\"index\":6058,\"text\":\"La Befana porta i regali il giorno di Natale.\"},{\"index\":6059,\"text\":\"Le Janare appartengono al folclore della Campania.\"},{\"index\":6060,\"text\":\"Le Masche sono legate al Piemonte.\"},{\"index\":6061,\"text\":\"Tutte le leggende raccontano la stessa storia.\"},{\"index\":6062,\"text\":\"Il noce di Benevento è famoso nella tradizione popolare.\"},{\"index\":6063,\"text\":\"Il folclore cambia da una regione all’altra.\"},{\"index\":6064,\"text\":\"\"},{\"index\":6065,\"text\":\"📚 Ripassiamo la grammatica\"},{\"index\":6066,\"text\":\"Scegli il tempo corretto.\"},{\"index\":6067,\"text\":\"Quando Nadia era bambina, __________ molte fiabe.\"},{\"index\":6068,\"text\":\"a) leggeva\"},{\"index\":6069,\"text\":\"b) ha letto\"},{\"index\":6070,\"text\":\"c) lesse\"},{\"index\":6071,\"text\":\"\"},{\"index\":6072,\"text\":\"Nel Medioevo molte persone __________ nelle streghe.\"},{\"index\":6073,\"text\":\"a) credono\"},{\"index\":6074,\"text\":\"b) credevano\"},{\"index\":6075,\"text\":\"c) hanno creduto\"},{\"index\":6076,\"text\":\"\"},{\"index\":6077,\"text\":\"La Befana __________ uno dei simboli del folclore italiano.\"},{\"index\":6078,\"text\":\"a) è\"},{\"index\":6079,\"text\":\"b) era\"},{\"index\":6080,\"text\":\"c) fu\"},{\"index\":6081,\"text\":\"\"},{\"index\":6082,\"text\":\"I nonni mi __________ questa leggenda quando ero piccolo.\"},{\"index\":6083,\"text\":\"a) raccontavano\"},{\"index\":6084,\"text\":\"b) hanno raccontato\"},{\"index\":6085,\"text\":\"c) racconteranno\"},{\"index\":6086,\"text\":\"\"},{\"index\":6087,\"text\":\"Nel Cinquecento molte persone __________ accuse di stregoneria.\"},{\"index\":6088,\"text\":\"a) subirono\"},{\"index\":6089,\"text\":\"b) hanno subito\"},{\"index\":6090,\"text\":\"c) subiscono\"},{\"index\":6091,\"text\":\"\"},{\"index\":6092,\"text\":\"🔄 Trasforma la frase\"},{\"index\":6093,\"text\":\"Frase:\"},{\"index\":6094,\"text\":\"Le Janare si riunivano sotto il noce.\"},{\"index\":6095,\"text\":\"➡️ Presente:\"},{\"index\":6096,\"text\":\"\"},{\"index\":6097,\"text\":\"➡️ Passato prossimo:\"},{\"index\":6098,\"text\":\"\"},{\"index\":6099,\"text\":\"➡️ Passato remoto:\"},{\"index\":6100,\"text\":\"\"},{\"index\":6101,\"text\":\"🗣️ Parliamone\"},{\"index\":6102,\"text\":\"Quale leggenda ti sembra più interessante?\"},{\"index\":6103,\"text\":\"Nel tuo Paese esiste una figura simile alla Befana?\"},{\"index\":6104,\"text\":\"Perché le persone inventano storie sul soprannaturale?\"},{\"index\":6105,\"text\":\"Ti piace il folclore oppure preferisci la storia documentata?\"},{\"index\":6106,\"text\":\"\"},{\"index\":6107,\"text\":\"✍️ Scrittura\"},{\"index\":6108,\"text\":\"Una leggenda della mia città\"},{\"index\":6109,\"text\":\"Scrivi 12–15 frasi.\"},{\"index\":6110,\"text\":\"Parla di:\"},{\"index\":6111,\"text\":\"📍 dove nasce la leggenda\"},{\"index\":6112,\"text\":\"👥 i personaggi\"},{\"index\":6113,\"text\":\"🌙 che cosa succede\"},{\"index\":6114,\"text\":\"🤔 perché pensi che questa storia sia nata\"},{\"index\":6115,\"text\":\"\"},{\"index\":6116,\"text\":\"⭐ Lo sapevi?\"},{\"index\":6117,\"text\":\"La parola folclore deriva dall’inglese folklore, formato da folk (“popolo”) e lore (“sapere”, “tradizione”). Indica l’insieme delle leggende, dei racconti, delle feste, delle credenze e delle tradizioni tramandate oralmente da una generazione all’altra.\"},{\"index\":6118,\"text\":\"➡️ Nella prossima lezione scopriremo i veri processi alle streghe in Italia: chi veniva accusato, perché accadeva e che cosa ci raccontano oggi gli storici su quel periodo.\"},{\"index\":6119,\"text\":\"30-09-26 – Nadia\"}],\"questions\":[{\"prompt\":\"Chi è la Befana?\",\"translation\":\"Who is the Befana?\",\"answer\":\"An Italian folklore figure who brings sweets to well-behaved children and coal to those who misbehave, on the night of 5–6 January.\",\"type\":\"comprehension\",\"sourceParagraph\":6050},{\"prompt\":\"Quali potrebbero essere le origini della Befana?\",\"translation\":\"What might the origins of the Befana be?\",\"answer\":\"Possibly ancient, pre-Christian agricultural rituals connected with the end of winter and a new natural cycle.\",\"type\":\"comprehension\",\"sourceParagraph\":6051},{\"prompt\":\"Dove vivevano, secondo la leggenda, le Janare?\",\"translation\":\"Where did the Janare live, according to the legend?\",\"answer\":\"Around Benevento in Campania; they supposedly gathered near a large walnut tree.\",\"type\":\"comprehension\",\"sourceParagraph\":6052},{\"prompt\":\"Chi erano le Masche?\",\"translation\":\"Who were the Masche?\",\"answer\":\"Figures of Piedmontese folklore who could supposedly transform into animals; some helped people, others played tricks.\",\"type\":\"comprehension\",\"sourceParagraph\":6053},{\"prompt\":\"Perché esistono tante versioni delle stesse leggende?\",\"translation\":\"Why are there so many versions of the same legends?\",\"answer\":\"Stories were passed down orally; each village and family added new details.\",\"type\":\"comprehension\",\"sourceParagraph\":6054},{\"prompt\":\"Quali animali compaiono spesso nelle storie di streghe?\",\"translation\":\"Which animals often appear in stories about witches?\",\"answer\":\"Black cats, owls and wolves.\",\"type\":\"comprehension\",\"sourceParagraph\":6055},{\"prompt\":\"Quale leggenda ti sembra più interessante?\",\"translation\":\"Which legend seems most interesting to you?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6102},{\"prompt\":\"Nel tuo Paese esiste una figura simile alla Befana?\",\"translation\":\"Is there a figure similar to the Befana in your country?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6103},{\"prompt\":\"Perché le persone inventano storie sul soprannaturale?\",\"translation\":\"Why do people invent stories about the supernatural?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6104},{\"prompt\":\"Ti piace il folclore oppure preferisci la storia documentata?\",\"translation\":\"Do you enjoy folklore, or do you prefer documented history?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6105},{\"prompt\":\"La Befana porta i regali il giorno di Natale.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6058},{\"prompt\":\"Le Janare appartengono al folclore della Campania.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6059},{\"prompt\":\"Le Masche sono legate al Piemonte.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6060},{\"prompt\":\"Tutte le leggende raccontano la stessa storia.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6061},{\"prompt\":\"Il noce di Benevento è famoso nella tradizione popolare.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6062},{\"prompt\":\"Il folclore cambia da una regione all’altra.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6063}]},{\"id\":\"lettura-03\",\"title\":\"Parte 3 – I processi alle streghe: storia o paura?\",\"startParagraph\":6120,\"endParagraph\":6243,\"paragraphs\":[{\"index\":6120,\"text\":\"🧙 Folclore Italiano\"},{\"index\":6121,\"text\":\"Unità 1\"},{\"index\":6122,\"text\":\"//////////////////////////////////////\"},{\"index\":6123,\"text\":\"\"},{\"index\":6124,\"text\":\"///////\"},{\"index\":6125,\"text\":\"Le Streghe d’Italia\"},{\"index\":6126,\"text\":\"Parte 3 – I processi alle streghe: storia o paura?\"},{\"index\":6127,\"text\":\"\"},{\"index\":6128,\"text\":\"🌞 Prima di leggere\"},{\"index\":6129,\"text\":\"Vocabolario\"},{\"index\":6130,\"text\":\"⚖️ il tribunale = court\"},{\"index\":6131,\"text\":\"👨‍⚖️ il giudice = judge\"},{\"index\":6132,\"text\":\"📜 l’accusa = accusation\"},{\"index\":6133,\"text\":\"🛡️ la difesa = defense\"},{\"index\":6134,\"text\":\"😨 la paura = fear\"},{\"index\":6135,\"text\":\"🙏 l’eresia = heresy\"},{\"index\":6136,\"text\":\"🔥 il rogo = stake\"},{\"index\":6137,\"text\":\"⛓️ il carcere = prison\"},{\"index\":6138,\"text\":\"🗣️ la confessione = confession\"},{\"index\":6139,\"text\":\"📚 la testimonianza = testimony\"},{\"index\":6140,\"text\":\"\"},{\"index\":6141,\"text\":\"📖 Lettura\"},{\"index\":6142,\"text\":\"Quando pensiamo ai processi alle streghe, immaginiamo spesso migliaia di donne condannate ovunque in Europa. La realtà storica, però, è più complessa.\"},{\"index\":6143,\"text\":\"Tra il XV e il XVII secolo si svolsero numerosi processi per stregoneria in varie parti dell’Europa. Anche alcuni territori italiani conobbero questi processi, ma furono generalmente meno numerosi rispetto ad alcune regioni dell’Europa centrale e settentrionale.\"},{\"index\":6144,\"text\":\"Le persone accusate erano soprattutto donne, anche se in alcuni casi furono processati anche uomini. Bastavano talvolta un litigio tra vicini, una malattia improvvisa del bestiame, un raccolto andato male o la reputazione di conoscere erbe medicinali perché qualcuno iniziasse a sospettare.\"},{\"index\":6145,\"text\":\"Durante gli interrogatori gli accusati dovevano difendersi da accuse molto gravi. In alcuni tribunali europei veniva usata anche la tortura per ottenere confessioni. Oggi gli storici sottolineano che confessioni ottenute in questo modo non possono essere considerate affidabili.\"},{\"index\":6146,\"text\":\"In Italia la situazione variava molto da uno Stato all’altro. Alcuni tribunali erano più severi, altri chiedevano prove più solide prima di emettere una condanna. Per questo motivo il numero delle esecuzioni fu generalmente inferiore rispetto ad altre zone d’Europa.\"},{\"index\":6147,\"text\":\"Con il passare del tempo, lo sviluppo della scienza, della medicina e di un approccio più razionale contribuì a ridurre la credenza nella stregoneria. Nel XVIII secolo questi processi divennero sempre più rari e infine scomparvero.\"},{\"index\":6148,\"text\":\"Oggi gli storici studiano questo periodo per capire come la paura, la superstizione e le tensioni sociali possano influenzare il comportamento di un’intera comunità.\"},{\"index\":6149,\"text\":\"\"},{\"index\":6150,\"text\":\"🌍 Curiosità\"},{\"index\":6151,\"text\":\"📖 Il\"},{\"index\":6152,\"text\":\"Malleus Maleficarum\"},{\"index\":6153,\"text\":\"Nel 1487 fu pubblicato il Malleus Maleficarum (“Il martello delle streghe”), un trattato scritto dai religiosi Heinrich Kramer e Jacob Sprenger. Il libro descriveva come individuare e processare le presunte streghe.\"},{\"index\":6154,\"text\":\"Molti storici lo considerano uno dei testi che contribuirono a diffondere la paura della stregoneria in alcune parti d’Europa, anche se la sua influenza variò da regione a regione.\"},{\"index\":6155,\"text\":\"\"},{\"index\":6156,\"text\":\"🇮🇹 Italia ed Europa\"},{\"index\":6157,\"text\":\"Le grandi persecuzioni furono particolarmente intense in alcune aree dell’attuale Germania, Svizzera, Francia orientale e Scozia.\"},{\"index\":6158,\"text\":\"Anche in Italia si svolsero processi, ma nella maggior parte delle regioni il numero delle condanne fu inferiore rispetto a quello registrato in alcune zone dell’Europa centrale.\"},{\"index\":6159,\"text\":\"\"},{\"index\":6160,\"text\":\"🌿 Guaritrici o streghe?\"},{\"index\":6161,\"text\":\"Molte donne conoscevano davvero le proprietà delle piante medicinali.\"},{\"index\":6162,\"text\":\"Oggi gli studiosi ritengono che alcune di loro fossero semplicemente guaritrici, levatrici o persone esperte di rimedi tradizionali.\"},{\"index\":6163,\"text\":\"\"},{\"index\":6164,\"text\":\"💬 Hai capito?\"},{\"index\":6165,\"text\":\"Rispondi.\"},{\"index\":6166,\"text\":\"In quali secoli si svolsero i processi alle streghe?\"},{\"index\":6167,\"text\":\"Chi veniva accusato più spesso?\"},{\"index\":6168,\"text\":\"Quali situazioni potevano far nascere un’accusa?\"},{\"index\":6169,\"text\":\"Perché gli storici non considerano affidabili molte confessioni?\"},{\"index\":6170,\"text\":\"Perché i processi diminuirono nel XVIII secolo?\"},{\"index\":6171,\"text\":\"Perché oggi si studia ancora questo periodo?\"},{\"index\":6172,\"text\":\"\"},{\"index\":6173,\"text\":\"✅ Vero o falso?\"},{\"index\":6174,\"text\":\"I processi alle streghe avvennero solo in Italia.\"},{\"index\":6175,\"text\":\"Anche alcuni uomini furono accusati di stregoneria.\"},{\"index\":6176,\"text\":\"La tortura era usata in tutti i tribunali italiani.\"},{\"index\":6177,\"text\":\"Lo sviluppo della scienza contribuì a ridurre la credenza nella stregoneria.\"},{\"index\":6178,\"text\":\"Il Malleus Maleficarum fu pubblicato nel Quindicesimo secolo.\"},{\"index\":6179,\"text\":\"Gli storici continuano a studiare questo fenomeno.\"},{\"index\":6180,\"text\":\"\"},{\"index\":6181,\"text\":\"📚 Ripassiamo la grammatica\"},{\"index\":6182,\"text\":\"Scegli il tempo corretto.\"},{\"index\":6183,\"text\":\"Nel XVI secolo molte persone __________ alle streghe.\"},{\"index\":6184,\"text\":\"a) credono\"},{\"index\":6185,\"text\":\"b) credevano\"},{\"index\":6186,\"text\":\"c) hanno creduto\"},{\"index\":6187,\"text\":\"\"},{\"index\":6188,\"text\":\"Gli storici oggi __________ questo periodo.\"},{\"index\":6189,\"text\":\"a) studiano\"},{\"index\":6190,\"text\":\"b) studiavano\"},{\"index\":6191,\"text\":\"c) studiarono\"},{\"index\":6192,\"text\":\"\"},{\"index\":6193,\"text\":\"Nel 1487 Kramer __________ il Malleus Maleficarum insieme a Jacob Sprenger.\"},{\"index\":6194,\"text\":\"a) pubblicò\"},{\"index\":6195,\"text\":\"b) ha pubblicato\"},{\"index\":6196,\"text\":\"c) pubblicava\"},{\"index\":6197,\"text\":\"\"},{\"index\":6198,\"text\":\"Quando vivevano nei villaggi, alcune donne __________ le erbe medicinali.\"},{\"index\":6199,\"text\":\"a) conoscevano\"},{\"index\":6200,\"text\":\"b) hanno conosciuto\"},{\"index\":6201,\"text\":\"c) conosceranno\"},{\"index\":6202,\"text\":\"\"},{\"index\":6203,\"text\":\"La scienza __________ molte spiegazioni più razionali.\"},{\"index\":6204,\"text\":\"a) offrì\"},{\"index\":6205,\"text\":\"b) offre\"},{\"index\":6206,\"text\":\"c) offriva\"},{\"index\":6207,\"text\":\"\"},{\"index\":6208,\"text\":\"🔄 Trasforma la frase\"},{\"index\":6209,\"text\":\"Frase:\"},{\"index\":6210,\"text\":\"Molte persone accusavano le guaritrici di stregoneria.\"},{\"index\":6211,\"text\":\"➡️ Presente\"},{\"index\":6212,\"text\":\"\"},{\"index\":6213,\"text\":\"➡️ Passato prossimo\"},{\"index\":6214,\"text\":\"\"},{\"index\":6215,\"text\":\"➡️ Passato remoto\"},{\"index\":6216,\"text\":\"\"},{\"index\":6217,\"text\":\"📖 Leggiamo insieme\"},{\"index\":6218,\"text\":\"Leggi ad alta voce.\"},{\"index\":6219,\"text\":\"«Nel passato molte persone avevano paura di ciò che non riuscivano a spiegare. Una malattia improvvisa, una tempesta o un cattivo raccolto potevano sembrare eventi misteriosi. Oggi sappiamo che esistono spiegazioni scientifiche per molti fenomeni che un tempo venivano attribuiti alla magia.»\"},{\"index\":6220,\"text\":\"\"},{\"index\":6221,\"text\":\"🗣️ Parliamone\"},{\"index\":6222,\"text\":\"Perché pensi che la paura possa influenzare il giudizio delle persone?\"},{\"index\":6223,\"text\":\"Conosci altri esempi storici in cui la paura ha portato ad accusare persone innocenti?\"},{\"index\":6224,\"text\":\"Perché è importante studiare la storia anche quando è difficile o ingiusta?\"},{\"index\":6225,\"text\":\"Pensi che oggi esistano ancora superstizioni diffuse?\"},{\"index\":6226,\"text\":\"\"},{\"index\":6227,\"text\":\"✍️ Scrittura\"},{\"index\":6228,\"text\":\"La paura e la conoscenza\"},{\"index\":6229,\"text\":\"Scrivi 12–15 frasi.\"},{\"index\":6230,\"text\":\"Puoi parlare di:\"},{\"index\":6231,\"text\":\"😨 la paura dell’ignoto\"},{\"index\":6232,\"text\":\"📚 l’importanza della scienza\"},{\"index\":6233,\"text\":\"🌿 le guaritrici\"},{\"index\":6234,\"text\":\"⚖️ la giustizia\"},{\"index\":6235,\"text\":\"🧠 ciò che hai imparato da questa lezione\"},{\"index\":6236,\"text\":\"\"},{\"index\":6237,\"text\":\"⭐ Curiosità finale\"},{\"index\":6238,\"text\":\"La parola strega deriva dal latino strix, un uccello notturno che, secondo gli antichi Romani, era associato a racconti inquietanti. Con il passare dei secoli il significato cambiò, fino a indicare una persona ritenuta capace di praticare la magia.\"},{\"index\":6239,\"text\":\"Molte storie sulle streghe ci parlano meno della magia e molto di più delle paure, delle credenze e della mentalità delle società del passato. Studiare queste vicende significa comprendere meglio la storia dell’Europa e il modo in cui le idee possono cambiare nel tempo.\"},{\"index\":6240,\"text\":\"➡️ Nell’ultima lezione esploreremo le superstizioni italiane più curiose: il malocchio, il corno rosso, il numero 17, il sale, gli specchi, i gatti neri e molte altre credenze popolari che, in alcuni casi, sopravvivono ancora oggi.\"},{\"index\":6241,\"text\":\"\"},{\"index\":6242,\"text\":\"\"},{\"index\":6243,\"text\":\"30-09-26 – Nadia\"}],\"questions\":[{\"prompt\":\"In quali secoli si svolsero i processi alle streghe?\",\"translation\":\"In which centuries did witch trials take place?\",\"answer\":\"Mainly between the fifteenth and seventeenth centuries.\",\"type\":\"comprehension\",\"sourceParagraph\":6166},{\"prompt\":\"Chi veniva accusato più spesso?\",\"translation\":\"Who was accused most often?\",\"answer\":\"Women, although some men were also tried.\",\"type\":\"comprehension\",\"sourceParagraph\":6167},{\"prompt\":\"Quali situazioni potevano far nascere un’accusa?\",\"translation\":\"What situations could give rise to an accusation?\",\"answer\":\"A quarrel between neighbours, sick livestock, a failed harvest or a reputation for knowing medicinal herbs.\",\"type\":\"comprehension\",\"sourceParagraph\":6168},{\"prompt\":\"Perché gli storici non considerano affidabili molte confessioni?\",\"translation\":\"Why do historians consider many confessions unreliable?\",\"answer\":\"Some were obtained under threats or torture, rather than freely given.\",\"type\":\"comprehension\",\"sourceParagraph\":6169},{\"prompt\":\"Perché i processi diminuirono nel XVIII secolo?\",\"translation\":\"Why did trials decline in the eighteenth century?\",\"answer\":\"Developments in science, medicine and more rational approaches weakened belief in witchcraft.\",\"type\":\"comprehension\",\"sourceParagraph\":6170},{\"prompt\":\"Perché oggi si studia ancora questo periodo?\",\"translation\":\"Why is this period still studied today?\",\"answer\":\"To understand how fear, superstition and social tensions influence communities.\",\"type\":\"comprehension\",\"sourceParagraph\":6171},{\"prompt\":\"Perché pensi che la paura possa influenzare il giudizio delle persone?\",\"translation\":\"Why do you think fear can influence people’s judgment?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6222},{\"prompt\":\"Conosci altri esempi storici in cui la paura ha portato ad accusare persone innocenti?\",\"translation\":\"Do you know other historical examples in which fear led to accusations against innocent people?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6223},{\"prompt\":\"Perché è importante studiare la storia anche quando è difficile o ingiusta?\",\"translation\":\"Why is it important to study history even when it is difficult or unjust?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6224},{\"prompt\":\"Pensi che oggi esistano ancora superstizioni diffuse?\",\"translation\":\"Do you think widespread superstitions still exist today?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6225},{\"prompt\":\"I processi alle streghe avvennero solo in Italia.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6174},{\"prompt\":\"Anche alcuni uomini furono accusati di stregoneria.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6175},{\"prompt\":\"La tortura era usata in tutti i tribunali italiani.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6176},{\"prompt\":\"Lo sviluppo della scienza contribuì a ridurre la credenza nella stregoneria.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6177},{\"prompt\":\"Il Malleus Maleficarum fu pubblicato nel Quindicesimo secolo.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6178},{\"prompt\":\"Gli storici continuano a studiare questo fenomeno.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6179}]},{\"id\":\"lettura-04\",\"title\":\"Parte 4 – Superstizioni italiane: tra passato e presente\",\"startParagraph\":6244,\"endParagraph\":6353,\"paragraphs\":[{\"index\":6244,\"text\":\"🧙 Folclore Italiano\"},{\"index\":6245,\"text\":\"Unità 1\"},{\"index\":6246,\"text\":\"Le Streghe d’Italia\"},{\"index\":6247,\"text\":\"Parte 4 – Superstizioni italiane: tra passato e presente\"},{\"index\":6248,\"text\":\"\"},{\"index\":6249,\"text\":\"🌞 Prima di leggere\"},{\"index\":6250,\"text\":\"Vocabolario\"},{\"index\":6251,\"text\":\"🧿 il malocchio = evil eye\"},{\"index\":6252,\"text\":\"🌶️ il corno rosso = red horn amulet\"},{\"index\":6253,\"text\":\"🧂 il sale = salt\"},{\"index\":6254,\"text\":\"🪞 lo specchio = mirror\"},{\"index\":6255,\"text\":\"🐈‍⬛ il gatto nero = black cat\"},{\"index\":6256,\"text\":\"🍀 il portafortuna = lucky charm\"},{\"index\":6257,\"text\":\"🤞 incrociare le dita = to cross one’s fingers\"},{\"index\":6258,\"text\":\"🎭 la credenza popolare = popular belief\"},{\"index\":6259,\"text\":\"🍞 il pane = bread\"},{\"index\":6260,\"text\":\"🔮 il destino = destiny\"},{\"index\":6261,\"text\":\"\"},{\"index\":6262,\"text\":\"📖 Lettura\"},{\"index\":6263,\"text\":\"Anche se oggi viviamo in un’epoca dominata dalla scienza e dalla tecnologia, molte superstizioni continuano a far parte della cultura italiana.\"},{\"index\":6264,\"text\":\"Una delle più famose è il malocchio. Secondo un’antica credenza popolare, alcune persone potevano provocare sfortuna o malessere semplicemente con uno sguardo invidioso. Ancora oggi qualcuno porta piccoli amuleti per proteggersi, anche se la maggior parte degli italiani considera il malocchio soltanto una tradizione.\"},{\"index\":6265,\"text\":\"Nel Sud Italia è molto diffuso il corno rosso, chiamato anche cornicello. 🌶️ Molti lo tengono in casa, lo appendono all’automobile oppure lo portano come portachiavi. Secondo la tradizione dovrebbe proteggere dalla sfortuna.\"},{\"index\":6266,\"text\":\"Un’altra superstizione riguarda il sale. Se il sale cade accidentalmente sul tavolo o sul pavimento, alcune persone prendono un pizzico di sale e lo lanciano dietro la spalla sinistra. Si pensa che questo gesto possa allontanare la cattiva sorte.\"},{\"index\":6267,\"text\":\"Molti italiani evitano anche di aprire un ombrello in casa ☂️ o di appoggiare un cappello sul letto. Queste credenze sono molto antiche e probabilmente hanno origini pratiche o religiose, anche se oggi vengono seguite soprattutto per tradizione.\"},{\"index\":6268,\"text\":\"A differenza di altri Paesi, in Italia il numero considerato sfortunato è spesso il 17, non il 13. Una delle spiegazioni più conosciute riguarda il numero romano XVII. Riorganizzando le lettere si ottiene VIXI, parola latina che significa “ho vissuto”, cioè “la mia vita è finita”. Per questo motivo il 17 è stato associato alla sfortuna fin dall’antichità.\"},{\"index\":6269,\"text\":\"Nonostante queste credenze, la maggior parte degli italiani non prende sul serio queste superstizioni. Molti continuano a rispettarle per gioco, per tradizione familiare o semplicemente “per non rischiare”. È un esempio interessante di come il passato possa continuare a influenzare alcune abitudini del presente.\"},{\"index\":6270,\"text\":\"\"},{\"index\":6271,\"text\":\"🌍 Curiosità\"},{\"index\":6272,\"text\":\"🧿 Il malocchio esiste solo in Italia?\"},{\"index\":6273,\"text\":\"No.\"},{\"index\":6274,\"text\":\"Credenze simili esistono anche in:\"},{\"index\":6275,\"text\":\"🇬🇷 Grecia\"},{\"index\":6276,\"text\":\"🇹🇷 Turchia\"},{\"index\":6277,\"text\":\"🇪🇸 Spagna\"},{\"index\":6278,\"text\":\"🇵🇹 Portogallo\"},{\"index\":6279,\"text\":\"🌍 Medio Oriente\"},{\"index\":6280,\"text\":\"Molte culture hanno creato amuleti diversi per proteggersi dalla sfortuna.\"},{\"index\":6281,\"text\":\"\"},{\"index\":6282,\"text\":\"🪞 Lo specchio\"},{\"index\":6283,\"text\":\"Secondo una superstizione molto diffusa, rompere uno specchio porta sette anni di sfortuna.\"},{\"index\":6284,\"text\":\"Questa credenza esiste in molti Paesi europei.\"},{\"index\":6285,\"text\":\"\"},{\"index\":6286,\"text\":\"🍞 Il pane\"},{\"index\":6287,\"text\":\"In molte famiglie italiane il pane è considerato un simbolo di rispetto.\"},{\"index\":6288,\"text\":\"Alcune persone evitano ancora oggi di appoggiarlo capovolto sul tavolo, perché lo considerano un gesto di cattivo auspicio.\"},{\"index\":6289,\"text\":\"\"},{\"index\":6290,\"text\":\"💬 Hai capito?\"},{\"index\":6291,\"text\":\"Rispondi.\"},{\"index\":6292,\"text\":\"Che cos’è il malocchio?\"},{\"index\":6293,\"text\":\"A che cosa serve il cornicello?\"},{\"index\":6294,\"text\":\"Che cosa fanno alcune persone se cade il sale?\"},{\"index\":6295,\"text\":\"Perché il numero 17 è considerato sfortunato?\"},{\"index\":6296,\"text\":\"Tutti gli italiani credono davvero a queste superstizioni?\"},{\"index\":6297,\"text\":\"Quale superstizione ti ha sorpreso di più?\"},{\"index\":6298,\"text\":\"\"},{\"index\":6299,\"text\":\"✅ Vero o falso?\"},{\"index\":6300,\"text\":\"Il malocchio è una credenza diffusa solo in Italia.\"},{\"index\":6301,\"text\":\"Il cornicello è spesso di colore rosso.\"},{\"index\":6302,\"text\":\"In Italia il numero 17 è considerato fortunato.\"},{\"index\":6303,\"text\":\"Molti italiani evitano di aprire un ombrello in casa.\"},{\"index\":6304,\"text\":\"Rompere uno specchio è considerato un segno di buona fortuna.\"},{\"index\":6305,\"text\":\"Oggi la maggior parte degli italiani considera queste credenze soprattutto tradizioni popolari.\"},{\"index\":6306,\"text\":\"\"},{\"index\":6307,\"text\":\"📚 Ripassiamo la grammatica\"},{\"index\":6308,\"text\":\"Completa con il tempo corretto.\"},{\"index\":6309,\"text\":\"Nel passato molte persone __________ al malocchio.\\n (credere)\"},{\"index\":6310,\"text\":\"Oggi alcuni italiani __________ ancora il cornicello.\\n (portare)\"},{\"index\":6311,\"text\":\"Mia nonna __________ sempre il sale dietro la spalla.\\n (lanciare)\"},{\"index\":6312,\"text\":\"Quando ero bambino, non __________ mai un ombrello in casa.\\n (aprire)\"},{\"index\":6313,\"text\":\"Nel Medioevo molte superstizioni __________ parte della vita quotidiana.\\n (fare)\"},{\"index\":6314,\"text\":\"Tu __________ mai sentito parlare del malocchio?\\n (avere)\"},{\"index\":6315,\"text\":\"\"},{\"index\":6316,\"text\":\"🔄 Ripasso dei tempi\"},{\"index\":6317,\"text\":\"Trasforma la frase.\"},{\"index\":6318,\"text\":\"Frase\"},{\"index\":6319,\"text\":\"Molti italiani portano il cornicello.\"},{\"index\":6320,\"text\":\"➡️ Imperfetto\"},{\"index\":6321,\"text\":\"\"},{\"index\":6322,\"text\":\"➡️ Passato prossimo\"},{\"index\":6323,\"text\":\"\"},{\"index\":6324,\"text\":\"➡️ Passato remoto\"},{\"index\":6325,\"text\":\"\"},{\"index\":6326,\"text\":\"📖 Leggiamo insieme\"},{\"index\":6327,\"text\":\"Leggi ad alta voce.\"},{\"index\":6328,\"text\":\"«Le superstizioni raccontano molto di una società. Anche quando non ci crediamo più, continuano a vivere nelle parole, nei gesti e nelle tradizioni tramandate dalle generazioni precedenti. Per questo motivo gli antropologi le studiano ancora oggi.»\"},{\"index\":6329,\"text\":\"\"},{\"index\":6330,\"text\":\"🗣️ Parliamone\"},{\"index\":6331,\"text\":\"Quali superstizioni esistono nel tuo Paese?\"},{\"index\":6332,\"text\":\"Pensi che alcune superstizioni abbiano un’origine pratica?\"},{\"index\":6333,\"text\":\"Perché le tradizioni sopravvivono anche quando la società cambia?\"},{\"index\":6334,\"text\":\"C’è una superstizione che segui “per sicurezza”, anche se non ci credi?\"},{\"index\":6335,\"text\":\"\"},{\"index\":6336,\"text\":\"✍️ Scrittura\"},{\"index\":6337,\"text\":\"Una superstizione del mio Paese\"},{\"index\":6338,\"text\":\"Scrivi 12–15 frasi.\"},{\"index\":6339,\"text\":\"Parla di:\"},{\"index\":6340,\"text\":\"🌍 dove è diffusa\"},{\"inde ex\":6461,\"text\":\"👥 chi ci crede\"},{\"index\":6462,\"text\":\"🤔 che cosa ne pensi\"},{\"index\":6463,\"text\":\"\"},{\"index\":6464,\"text\":\"⭐ Curiosità finali\"},{\"index\":6465,\"text\":\"🧙 La parola strega deriva dal latino strix, mentre magia deriva dal greco mageía, che indicava l’arte attribuita agli antichi sacerdoti persiani.\"},{\"index\":6466,\"text\":\"📚 Oggi le streghe sono studiate soprattutto da storici, antropologi e studiosi di folklore, perché le leggende raccontano come vivevano e pensavano le persone del passato.\"},{\"index\":6467,\"text\":\"🌍 Ogni regione italiana possiede racconti, creature fantastiche e superstizioni proprie. Studiarle significa conoscere non solo la fantasia popolare, ma anche la storia, la religione, la lingua e la cultura delle comunità che le hanno tramandate.\"},{\"index\":6468,\"text\":\"🎓 Fine dell’Unità\"},{\"index\":6469,\"text\":\"In queste quattro lezioni abbiamo scoperto che le “streghe” non appartengono soltanto al mondo delle fiabe. Attraverso la loro storia abbiamo parlato di antiche tradizioni, medicina popolare, processi storici, superstizioni e antropologia. Abbiamo anche ripassato il presente, l’imperfetto, il passato prossimo e il passato remoto, imparando a usarli per raccontare sia il presente sia il passato.\"},{\"index\":6470,\"text\":\"➡️ Nella prossima unità esploreremo un’altra pagina affascinante della cultura italiana: i castelli, i fantasmi e le leggende medievali, oppure uno dei grandi miti dell’antica Roma.\"},{\"index\":6471,\"text\":\"\"}],\"questions\":[{\"prompt\":\"Che cos’è il malocchio?\",\"translation\":\"What is the evil eye?\",\"answer\":\"A folk belief that an envious look can cause bad luck or illness; the reading presents it as a belief, not an established fact.\",\"type\":\"comprehension\",\"sourceParagraph\":6407},{\"prompt\":\"A che cosa serve il cornicello?\",\"translation\":\"What is the cornicello used for?\",\"answer\":\"Traditionally, the red horn amulet is supposed to protect against bad luck.\",\"type\":\"comprehension\",\"sourceParagraph\":6408},{\"prompt\":\"Che cosa fanno alcune persone se cade il sale?\",\"translation\":\"What do some people do when salt is spilled?\",\"answer\":\"They throw a pinch of salt over their left shoulder.\",\"type\":\"comprehension\",\"sourceParagraph\":6409},{\"prompt\":\"Perché il numero 17 è considerato sfortunato?\",\"translation\":\"Why is the number 17 considered unlucky?\",\"answer\":\"The reading links Roman XVII to VIXI, Latin for “I have lived”, interpreted as “my life is over”.\",\"type\":\"comprehension\",\"sourceParagraph\":6410},{\"prompt\":\"Tutti gli italiani credono davvero a queste superstizioni?\",\"translation\":\"Do all Italians really believe in these superstitions?\",\"answer\":\"No. The reading says most consider them traditions, followed for fun or “just in case”.\",\"type\":\"comprehension\",\"sourceParagraph\":6411},{\"prompt\":\"Quale superstizione ti ha sorpreso di più?\",\"translation\":\"Which superstition surprised you most?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6412},{\"prompt\":\"Quali superstizioni esistono nel tuo Paese?\",\"translation\":\"What superstitions exist in your country?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6446},{\"prompt\":\"Pensi che alcune superstizioni abbiano un’origine pratica?\",\"translation\":\"Do you think some superstitions have a practical origin?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6447},{\"prompt\":\"Perché le tradizioni sopravvivono anche quando la società cambia?\",\"translation\":\"Why do traditions survive even when society changes?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6448},{\"prompt\":\"C’è una superstizione che segui “per sicurezza”, anche se non ci credi?\",\"translation\":\"Is there a superstition you follow “just in case”, even though you do not believe in it?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6449},{\"prompt\":\"Il malocchio è una credenza diffusa solo in Italia.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6415},{\"prompt\":\"Il cornicello è spesso di colore rosso.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6416},{\"prompt\":\"In Italia il numero 17 è considerato fortunato.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6417},{\"prompt\":\"Molti italiani evitano di aprire un ombrello in casa.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6418},{\"prompt\":\"Rompere uno specchio è considerato un segno di buona fortuna.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6419},{\"prompt\":\"Oggi la maggior parte degli italiani considera queste credenze soprattutto tradizioni popolari.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6420}]},{\"id\":\"lettura-06\",\"title\":\"Le Grandi Leggende · programma completo\",\"startParagraph\":6472,\"endParagraph\":6595,\"paragraphs\":[{\"index\":6472,\"text\":\"📚 Le Grandi Leggende delle Streghe Italiane\"},{\"index\":6473,\"text\":\"\"},{\"index\":6474,\"text\":\"📖 Parte 1 — Il Noce di Benevento 🌰\"},{\"index\":6475,\"text\":\"\"},{\"index\":6476,\"text\":\"La leggenda più famosa d'Italia sulle streghe.\"},{\"index\":6477,\"text\":\"\"},{\"index\":6478,\"text\":\"Argomenti:\"},{\"index\":6479,\"text\":\"• La storia del Noce di Benevento.\"},{\"index\":6480,\"text\":\"• I racconti delle persone che dicevano di vedere luci e danze notturne.\"},{\"index\":6481,\"text\":\"• Il sabba delle streghe.\"},{\"index\":6482,\"text\":\"• Le possibili origini longobarde e pagane della leggenda.\"},{\"index\":6483,\"text\":\"• Come il mito è cambiato nel corso dei secoli.\"},{\"index\":6484,\"text\":\"• Che cosa pensano oggi gli storici.\"},{\"index\":6485,\"text\":\"\"},{\"index\":6486,\"text\":\"────────────────────────\"},{\"index\":6487,\"text\":\"\"},{\"index\":6488,\"text\":\"📖 Parte 2 — Matteuccia di Todi 🐐\"},{\"index\":6489,\"text\":\"\"},{\"index\":6490,\"text\":\"Una delle prime donne realmente processate per stregoneria in Italia.\"},{\"index\":6491,\"text\":\"\"},{\"index\":6492,\"text\":\"Argomenti:\"},{\"index\":6493,\"text\":\"• Chi era Matteuccia.\"},{\"index\":6494,\"text\":\"• Il processo del 1428.\"},{\"index\":6495,\"text\":\"• Le accuse.\"},{\"index\":6496,\"text\":\"• L'unguento magico.\"},{\"index\":6497,\"text\":\"• Il presunto volo sul caprone.\"},{\"index\":6498,\"text\":\"• La formula magica riportata negli atti del processo.\"},{\"index\":6499,\"text\":\"• Perché oggi gli storici ritengono poco affidabili queste confessioni.\"},{\"index\":6500,\"text\":\"\"},{\"index\":6501,\"text\":\"────────────────────────\"},{\"index\":6502,\"text\":\"\"},{\"index\":6503,\"text\":\"📖 Parte 3 — Le Janare di Benevento 🏠\"},{\"index\":6504,\"text\":\"\"},{\"index\":6505,\"text\":\"Le storie più inquietanti del folclore campano.\"},{\"index\":6506,\"text\":\"\"},{\"index\":6507,\"text\":\"Argomenti:\"},{\"index\":6508,\"text\":\"• Le Janare che entravano nelle case.\"},{\"index\":6509,\"text\":\"• Le scope lasciate davanti alla porta.\"},{\"index\":6510,\"text\":\"• Il sale per fermare le Janare.\"},{\"index\":6511,\"text\":\"• I racconti delle persone che dicevano di essersi svegliate senza riuscire a muoversi.\"},{\"index\":6512,\"text\":\"• Il collegamento moderno con la paralisi del sonno.\"},{\"index\":6513,\"text\":\"• Perché questa leggenda è sopravvissuta così a lungo.\"},{\"index\":6514,\"text\":\"\"},{\"index\":6515,\"text\":\"────────────────────────\"},{\"index\":6516,\"text\":\"\"},{\"index\":6517,\"text\":\"📖 Parte 4 — Le Masche del Piemonte 🐈\"},{\"index\":6518,\"text\":\"\"},{\"index\":6519,\"text\":\"Le misteriose streghe delle montagne.\"},{\"index\":6520,\"text\":\"\"},{\"index\":6521,\"text\":\"Argomenti:\"},{\"index\":6522,\"text\":\"• Le Masche.\"},{\"index\":6523,\"text\":\"• Le trasformazioni in animali.\"},{\"index\":6524,\"text\":\"• I gatti neri.\"},{\"index\":6525,\"text\":\"• I lupi.\"},{\"index\":6526,\"text\":\"• Le maledizioni.\"},{\"index\":6527,\"text\":\"• I racconti dei contadini.\"},{\"index\":6528,\"text\":\"• I processi realmente avvenuti.\"},{\"index\":6529,\"text\":\"• Le interpretazioni degli antropologi.\"},{\"index\":6530,\"text\":\"\"},{\"index\":6531,\"text\":\"────────────────────────\"},{\"index\":6532,\"text\":\"\"},{\"index\":6533,\"text\":\"📖 Parte 5 — Triora, il paese delle streghe 🏰\"},{\"index\":6534,\"text\":\"\"},{\"index\":6535,\"text\":\"La \\\"Salem italiana\\\".\"},{\"index\":6536,\"text\":\"\"},{\"index\":6537,\"text\":\"Argomenti:\"},{\"index\":6538,\"text\":\"• Il piccolo borgo ligure di Triora.\"},{\"index\":6539,\"text\":\"• I processi del 1587–1589.\"},{\"index\":6540,\"text\":\"• Le confessioni.\"},{\"index\":6541,\"text\":\"• Le accuse tra vicini.\"},{\"index\":6542,\"text\":\"• La carestia che alimentò la paura.\"},{\"index\":6543,\"text\":\"• Le prigioni.\"},{\"index\":6544,\"text\":\"• Le presunte apparizioni.\"},{\"index\":6545,\"text\":\"• Il Museo Regionale Etnografico e della Stregoneria.\"},{\"index\":6546,\"text\":\"• Come il paese conserva ancora oggi questa parte della sua storia.\"},{\"index\":6547,\"text\":\"\"},{\"index\":6548,\"text\":\"────────────────────────\"},{\"index\":6549,\"text\":\"\"},{\"index\":6550,\"text\":\"📖 Parte 6 — I luoghi più misteriosi d'Italia 🌙\"},{\"index\":6551,\"text\":\"\"},{\"index\":6552,\"text\":\"Un viaggio tra storia e leggenda.\"},{\"index\":6553,\"text\":\"\"},{\"index\":6554,\"text\":\"Argomenti:\"},{\"index\":6555,\"text\":\"• Il Noce di Benevento.\"},{\"index\":6556,\"text\":\"• Triora.\"},{\"index\":6557,\"text\":\"• Il Lago di Pilato.\"},{\"index\":6558,\"text\":\"• Il Monte Sibilla.\"},{\"index\":6559,\"text\":\"• Il Bosco del Cansiglio.\"},{\"index\":6560,\"text\":\"• La Val Camonica.\"},{\"index\":6561,\"text\":\"• Le leggende nate in questi luoghi.\"},{\"index\":6562,\"text\":\"• Che cosa raccontano oggi gli abitanti.\"},{\"index\":6563,\"text\":\"\"},{\"index\":6564,\"text\":\"────────────────────────\"},{\"index\":6565,\"text\":\"\"},{\"index\":6566,\"text\":\"📖 Parte 7 (Bonus) — Le streghe nel mondo 🌍\"},{\"index\":6567,\"text\":\"\"},{\"index\":6568,\"text\":\"Confronto tra le tradizioni.\"},{\"index\":6569,\"text\":\"\"},{\"index\":6570,\"text\":\"• Italia – Janare\"},{\"index\":6571,\"text\":\"• Francia – Sorcières\"},{\"index\":6572,\"text\":\"• Germania – Hexen\"},{\"index\":6573,\"text\":\"• Russia – Baba Jaga\"},{\"index\":6574,\"text\":\"• Romania – Strigoi\"},{\"index\":6575,\"text\":\"• Grecia – Lamia\"},{\"index\":6576,\"text\":\"• Giappone – Yamauba\"},{\"index\":6577,\"text\":\"\"},{\"index\":6578,\"text\":\"Domande:\"},{\"index\":6579,\"text\":\"• Perché quasi tutte le culture hanno inventato figure simili?\"},{\"index\":6580,\"text\":\"• Quali elementi hanno in comune?\"},{\"index\":6581,\"text\":\"• Quali sono le differenze?\"},{\"index\":6582,\"text\":\"• Che cosa ci raccontano queste leggende sulle paure e sulle credenze delle diverse società?\"},{\"index\":6583,\"text\":\"\"},{\"index\":6584,\"text\":\"────────────────────────\"},{\"index\":6585,\"text\":\"\"},{\"index\":6586,\"text\":\"💡 Idea extra\"},{\"index\":6587,\"text\":\"\"},{\"index\":6588,\"text\":\"Alla fine di ogni lezione inserire un \\\"Documento storico\\\" con brevi estratti autentici (di pubblico dominio) da:\"},{\"index\":6589,\"text\":\"\"},{\"index\":6590,\"text\":\"• Verbali dei processi alle streghe.\"},{\"index\":6591,\"text\":\"• Cronache medievali.\"},{\"index\":6592,\"text\":\"• Raccolte di leggende popolari dell'Ottocento.\"},{\"index\":6593,\"text\":\"• Opere come il Malleus Maleficarum (1487), sempre presentandolo come documento storico e non come prova dell'esistenza della stregoneria.\"},{\"index\":6594,\"text\":\"\"},{\"index\":6595,\"text\":\"\"}],\"questions\":[{\"prompt\":\"• Perché quasi tutte le culture hanno inventato figure simili?\",\"translation\":\"Why have almost all cultures invented similar figures?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6579},{\"prompt\":\"• Quali elementi hanno in comune?\",\"translation\":\"What elements do they have in common?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6580},{\"prompt\":\"• Quali sono le differenze?\",\"translation\":\"What are the differences?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6581},{\"prompt\":\"• Che cosa ci raccontano queste leggende sulle paure e sulle credenze delle diverse società?\",\"translation\":\"What do these legends tell us about the fears and beliefs of different societies?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6582}]},{\"id\":\"lettura-07\",\"title\":\"Parte 1 – Il Noce di Benevento\",\"startParagraph\":6596,\"endParagraph\":6715,\"paragraphs\":[{\"index\":6596,\"text\":\"🧙 Le Grandi Leggende delle Streghe Italiane\"},{\"index\":6597,\"text\":\"Parte 1 – Il Noce di Benevento\"},{\"index\":6598,\"text\":\"Nota storica\"},{\"index\":6599,\"text\":\"\"},{\"index\":6600,\"text\":\"La storia che leggerai è basata su una delle più famose leggende italiane. Esistono documenti storici che dimostrano come questa leggenda fosse molto diffusa già nel Medioevo, ma non esistono prove storiche che gli eventi soprannaturali siano realmente accaduti.\"},{\"index\":6601,\"text\":\"\"},{\"index\":6602,\"text\":\"🌞 Prima di leggere\"},{\"index\":6603,\"text\":\"Vocabolario\"},{\"index\":6604,\"text\":\"\"},{\"index\":6605,\"text\":\"🌰 il noce = walnut tree\"},{\"index\":6606,\"text\":\"🌕 la luna piena = full moon\"},{\"index\":6607,\"text\":\"🧙 il sabba = witches’ gathering (secondo il folclore)\"},{\"index\":6608,\"text\":\"🪄 l’incantesimo = spell\"},{\"index\":6609,\"text\":\"🌙 il crepuscolo = twilight\"},{\"index\":6610,\"text\":\"🔥 il falò = bonfire\"},{\"index\":6611,\"text\":\"🌲 il bosco = forest\"},{\"index\":6612,\"text\":\"👀 il testimone = witness\"},{\"index\":6613,\"text\":\"🏇 il cavaliere = horseman\"},{\"index\":6614,\"text\":\"📜 la cronaca = chronicle\"},{\"index\":6615,\"text\":\"\"},{\"index\":6616,\"text\":\"📖 Il mistero del Noce di Benevento\"},{\"index\":6617,\"text\":\"Per oltre mille anni, nessun luogo in Italia è stato associato alle streghe quanto la città di Benevento, in Campania.\"},{\"index\":6618,\"text\":\"Tutto iniziò molti secoli fa.\"},{\"index\":6619,\"text\":\"Secondo alcune antiche cronache, vicino alla città cresceva un enorme albero di noce.\"},{\"index\":6620,\"text\":\"Di giorno sembrava un albero come tutti gli altri.\"},{\"index\":6621,\"text\":\"Ma quando arrivava la notte…\"},{\"index\":6622,\"text\":\"…cominciavano i racconti.\"},{\"index\":6623,\"text\":\"Alcuni contadini dicevano di aver visto strane luci muoversi tra i rami.\"},{\"index\":6624,\"text\":\"Altri raccontavano di aver sentito musica provenire dal bosco, anche se nessun musicista era presente.\"},{\"index\":6625,\"text\":\"Qualcuno giurava perfino di aver visto donne vestite di bianco danzare intorno all’albero.\"},{\"index\":6626,\"text\":\"Secondo queste testimonianze, esse arrivavano quando la luna era piena.\"},{\"index\":6627,\"text\":\"Accendevano grandi falò.\"},{\"index\":6628,\"text\":\"Cantavano.\"},{\"index\":6629,\"text\":\"Ballavano.\"},{\"index\":6630,\"text\":\"Poi, poco prima dell’alba, scomparivano senza lasciare traccia.\"},{\"index\":6631,\"text\":\"Con il passare dei secoli, la leggenda divenne sempre più ricca.\"},{\"index\":6632,\"text\":\"Si iniziò a raccontare che quelle donne fossero streghe.\"},{\"index\":6633,\"text\":\"Alcuni dicevano che cavalcassero animali fantastici.\"},{\"index\":6634,\"text\":\"Altri sostenevano che il diavolo apparisse sotto forma di un grande caprone nero.\"},{\"index\":6635,\"text\":\"Ogni generazione aggiungeva nuovi particolari.\"},{\"index\":6636,\"text\":\"Così il racconto diventava sempre più misterioso.\"},{\"index\":6637,\"text\":\"/////////////////////////////////////////////////////////////////////////////\"},{\"index\":6638,\"text\":\"///////////////////////////\"},{\"index\":6639,\"text\":\"\"},{\"index\":6640,\"text\":\"📖 Da dove nasce questa leggenda?\"},{\"index\":6641,\"text\":\"Gli storici hanno cercato di capire perché proprio Benevento sia diventata la città delle streghe.\"},{\"index\":6642,\"text\":\"Una teoria riguarda(is about, concerns) i Longobardi, un popolo germanico che conquistò Benevento nel VI secolo.\"},{\"index\":6643,\"text\":\"Alcuni autori medievali raccontavano che i Longobardi praticassero riti religiosi vicino a un albero sacro.\"},{\"index\":6644,\"text\":\"Secondo queste cronache, i guerrieri appendevano pelli di animali ai rami e compivano cerimonie in onore delle loro antiche divinità.\"},{\"index\":6645,\"text\":\"Quando il Cristianesimo si diffuse nella regione, questi riti furono considerati pagani.\"},{\"index\":6646,\"text\":\"Con il passare del tempo, la memoria di quelle antiche cerimonie potrebbe essersi trasformata nella leggenda del sabba delle streghe.\"},{\"index\":6647,\"text\":\"Gli storici, però, non possono confermare che questo sia realmente accaduto: si tratta di una delle spiegazioni (explainations) proposte per l’origine del mito.\"},{\"index\":6648,\"text\":\"\"},{\"index\":6649,\"text\":\"🌍 Curiosità\"},{\"index\":6650,\"text\":\"🌰 Esiste ancora il famoso noce?\"},{\"index\":6651,\"text\":\"No.\"},{\"index\":6652,\"text\":\"Non sappiamo con certezza dove si trovasse l’albero originale.\"},{\"index\":6653,\"text\":\"Secondo alcune tradizioni fu abbattuto molti secoli fa.\"},{\"index\":6654,\"text\":\"Oggi nessuno può dire con certezza quale fosse il vero “Noce di Benevento”.\"},{\"index\":6655,\"text\":\"\"},{\"index\":6656,\"text\":\"🧙 Perché proprio un noce?\"},{\"index\":6657,\"text\":\"In molte culture europee il noce era considerato un albero misterioso.\"},{\"index\":6658,\"text\":\"La sua ombra era molto fitta e si credeva che fosse abitato da spiriti o creature soprannaturali.\"},{\"index\":6659,\"text\":\"Per questo compare (appears) spesso nelle antiche leggende.\"},{\"index\":6660,\"text\":\"\"},{\"index\":6661,\"text\":\"🏛️ Benevento oggi\"},{\"index\":6662,\"text\":\"Oggi Benevento ricorda questa tradizione con:\"},{\"index\":6663,\"text\":\"🌰 statue\"},{\"index\":6664,\"text\":\"🧙 eventi culturali\"},{\"index\":6665,\"text\":\"🎭 spettacoli\"},{\"index\":6666,\"text\":\"🏛️ negozi dedicati alle Janare\"},{\"index\":6667,\"text\":\"La città considera questa leggenda parte del proprio patrimonio storico e culturale.\"},{\"index\":6668,\"text\":\"\"},{\"index\":6669,\"text\":\"💬 Hai capito?\"},{\"index\":6670,\"text\":\"Rispondi.\"},{\"index\":6671,\"text\":\"Dove si trovava il famoso noce?\"},{\"index\":6672,\"text\":\"Che cosa raccontavano i contadini?\"},{\"index\":6673,\"text\":\"Che cosa facevano, secondo la leggenda, le streghe?\"},{\"index\":6674,\"text\":\"Perché la storia cambiava nel corso dei secoli?\"},{\"index\":6675,\"text\":\"Quale popolo potrebbe aver dato origine alla leggenda?\"},{\"index\":6676,\"text\":\"Gli storici possono dimostrare che il sabba sia realmente esistito?\"},{\"index\":6677,\"text\":\"\"},{\"index\":6678,\"text\":\"////////////////////////////////////////////////////////////////////////////\"},{\"index\":6679,\"text\":\"//////////////////////////////////////////////////////////\"},{\"index\":6680,\"text\":\"//////////////////////////\"},{\"index\":6681,\"text\":\"\"},{\"index\":6682,\"text\":\"✅ Vero o falso?\"},{\"index\":6683,\"text\":\"Il Noce di Benevento si trovava in Toscana.\"},{\"index\":6684,\"text\":\"Molte persone dicevano di aver visto luci misteriose.\"},{\"index\":6685,\"text\":\"Le cronache raccontano di antichi riti longobardi.\"},{\"index\":6686,\"text\":\"Gli storici sono certi che le streghe si riunissero davvero sotto il noce.\"},{\"index\":6687,\"text\":\"Oggi Benevento valorizza questa leggenda come parte della sua cultura.\"},{\"index\":6688,\"text\":\"Il noce originale esiste ancora con certezza.\"},{\"index\":6689,\"text\":\"\"},{\"index\":6690,\"text\":\"📚 Ripassiamo la grammatica\"},{\"index\":6691,\"text\":\"Completa con il tempo corretto.\"},{\"index\":6692,\"text\":\"Molti contadini __________ di aver visto strane luci.\\n (dire)\"},{\"index\":6693,\"text\":\"Le cronache medievali __________ questa leggenda.\\n (raccontare)\"},{\"index\":6694,\"text\":\"Oggi molti turisti __________ Benevento.\\n (visitare)\"},{\"index\":6695,\"text\":\"Nel Medioevo alcune persone __________ alle streghe.\\n (credere)\"},{\"index\":6696,\"text\":\"Gli storici __________ ancora oggi l’origine della leggenda.\\n (studiare)\"},{\"index\":6697,\"text\":\"Tu __________ mai sentito parlare del Noce di Benevento?\\n (avere)\"},{\"index\":6698,\"text\":\"\"},{\"index\":6699,\"text\":\"✍️ Scrittura\"},{\"index\":6700,\"text\":\"Se fossi vissuta nel Medioevo…\"},{\"index\":6701,\"text\":\"Scrivi 12–15 frasi.\"},{\"index\":6702,\"text\":\"Immagina di vivere a Benevento nel XV secolo.\"},{\"index\":6703,\"text\":\"Una sera alcuni abitanti del villaggio raccontano di aver visto strane luci nel bosco.\"},{\"index\":6704,\"text\":\"Che cosa penseresti?\"},{\"index\":6705,\"text\":\"Andresti a vedere?\"},{\"index\":6706,\"text\":\"Avresti paura?\"},{\"index\":6707,\"text\":\"Oppure cercheresti una spiegazione razionale?\"},{\"index\":6708,\"text\":\"\"},{\"index\":6709,\"text\":\"📜 Documento storico\"},{\"index\":6710,\"text\":\"Lo storico longobardo Paolo Diacono, nella sua Historia Langobardorum (VIII secolo), racconta che i Longobardi praticavano antichi riti religiosi vicino ad alberi considerati sacri. Nei secoli successivi alcuni autori collegarono questi racconti alla nascita della leggenda del Noce di Benevento. Non sappiamo se questo collegamento sia corretto, ma mostra come storia e tradizione possano influenzarsi a vicenda.\"},{\"index\":6711,\"text\":\"\"},{\"index\":6712,\"text\":\"⭐ Curiosità finale\"},{\"index\":6713,\"text\":\"Ancora oggi Benevento è conosciuta in tutta Italia come “la città delle streghe”.\"},{\"index\":6714,\"text\":\"Nei negozi è possibile acquistare libri, souvenir e perfino il famoso liquore Strega, prodotto dal 1860. Il suo nome richiama la leggenda cittadina, anche se la ricetta non ha alcun legame con la magia.\"},{\"index\":6715,\"text\":\"➡️ Nella prossima lezione conosceremo una donna realmente esistita: Matteuccia di Todi, una delle prime persone processate per stregoneria in Italia. La sua storia è documentata dagli atti originali del tribunale e rappresenta uno dei casi più famosi del Quattrocento.\"}],\"questions\":[{\"prompt\":\"Dove si trovava il famoso noce?\",\"translation\":\"Where was the famous walnut tree?\",\"answer\":\"Near Benevento, in Campania; its original exact location is uncertain.\",\"type\":\"comprehension\",\"sourceParagraph\":6671},{\"prompt\":\"Che cosa raccontavano i contadini?\",\"translation\":\"What did the farmers report?\",\"answer\":\"Strange lights, music and women dressed in white dancing around the tree.\",\"type\":\"comprehension\",\"sourceParagraph\":6672},{\"prompt\":\"Che cosa facevano, secondo la leggenda, le streghe?\",\"translation\":\"What did the witches do, according to the legend?\",\"answer\":\"They gathered at full moon, lit bonfires, sang and danced, then disappeared before dawn.\",\"type\":\"comprehension\",\"sourceParagraph\":6673},{\"prompt\":\"Perché la storia cambiava nel corso dei secoli?\",\"translation\":\"Why did the story change over the centuries?\",\"answer\":\"Each generation added new details.\",\"type\":\"comprehension\",\"sourceParagraph\":6674},{\"prompt\":\"Quale popolo potrebbe aver dato origine alla leggenda?\",\"translation\":\"Which people might have given rise to the legend?\",\"answer\":\"The Lombards and their possible sacred-tree rituals; the reading explicitly calls this an unconfirmed theory.\",\"type\":\"comprehension\",\"sourceParagraph\":6675},{\"prompt\":\"Gli storici possono dimostrare che il sabba sia realmente esistito?\",\"translation\":\"Can historians prove that the witches’ gathering really existed?\",\"answer\":\"No. The existence of the legend is documented, not the alleged supernatural events.\",\"type\":\"comprehension\",\"sourceParagraph\":6676},{\"prompt\":\"Che cosa penseresti?\",\"translation\":\"What would you think?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6704},{\"prompt\":\"Andresti a vedere?\",\"translation\":\"Would you go and look?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6705},{\"prompt\":\"Avresti paura?\",\"translation\":\"Would you be afraid?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6706},{\"prompt\":\"Oppure cercheresti una spiegazione razionale?\",\"translation\":\"Or would you look for a rational explanation?\",\"answer\":null,\"type\":\"open\",\"sourceParagraph\":6707},{\"prompt\":\"Il Noce di Benevento si trovava in Toscana.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6683},{\"prompt\":\"Molte persone dicevano di aver visto luci misteriose.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6684},{\"prompt\":\"Le cronache raccontano di antichi riti longobardi.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6685},{\"prompt\":\"Gli storici sono certi che le streghe si riunissero davvero sotto il noce.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6686},{\"prompt\":\"Oggi Benevento valorizza questa leggenda come parte della sua cultura.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: True (vero).\",\"type\":\"truefalse\",\"sourceParagraph\":6687},{\"prompt\":\"Il noce originale esiste ancora con certezza.\",\"translation\":\"True or false? Justify your answer using the passage.\",\"answer\":\"According to the reading: False (falso).\",\"type\":\"truefalse\",\"sourceParagraph\":6688}]},{\"id\":\"lettura-08\",\"title\":\"Parte 2 – Matteuccia di Todi: il processo del 1428\",\"startParagraph\":6716,\"endParagraph\":6810,\"paragraphs\":[{\"index\":6716,\"text\":\"🧙 Le Grandi Leggende delle Streghe Italiane\"},{\"index\":6717,\"text\":\"Parte 2 – Matteuccia di Todi: il processo del 1428\"},{\"index\":6718,\"text\":\"Nota storica\"},{\"index\":6719,\"text\":\"\"},{\"index\":6720,\"text\":\"Matteuccia di Francesco, conosciuta come Matteuccia di Todi, fu una persona realmente esistita. Gran parte di ciò che sappiamo proviene dagli atti del suo processo del 1428. Le confessioni contenute nei documenti sono oggi considerate dagli storici poco affidabili, perché in quell’epoca gli interrogatori potevano essere accompagnati da forti pressioni o torture.\"},{\"index\":6721,\"text\":\"\"},{\"index\":6722,\"text\":\"🌞 Prima di leggere\"},{\"index\":6723,\"text\":\"Vocabolario\"},{\"index\":6724,\"text\":\"⚖️ il tribunale = court\"},{\"index\":6725,\"text\":\"📜 il processo = trial\"},{\"index\":6726,\"text\":\"🧴 l’unguento = ointment\"},{\"index\":6727,\"text\":\"🐐 il caprone = he-goat\"},{\"index\":6728,\"text\":\"🧹 la scopa = broom\"},{\"index\":6729,\"text\":\"🪄 la formula magica = magical formula\"},{\"index\":6730,\"text\":\"🗣️ la confessione = confession\"},{\"index\":6731,\"text\":\"😨 l’accusato = accused person\"},{\"index\":6732,\"text\":\"🔥 il rogo = stake\"},{\"index\":6733,\"text\":\"📖 il manoscritto = manuscript\"},{\"index\":6734,\"text\":\"\"},{\"index\":6735,\"text\":\"📖 Una donna chiamata Matteuccia\"},{\"index\":6736,\"text\":\"Nella primavera del 1428, la città umbra di Todi fu scossa da un processo destinato a diventare uno dei più famosi della storia italiana.\"},{\"index\":6737,\"text\":\"L’imputata si chiamava Matteuccia di Francesco.\"},{\"index\":6738,\"text\":\"Era una donna che conosceva le erbe medicinali e preparava rimedi per curare alcune malattie. Come accadeva spesso nel Medioevo, molte persone si rivolgevano a lei quando non esistevano medici nelle vicinanze.\"},{\"index\":6739,\"text\":\"Con il passare del tempo, però, iniziarono a circolare strane voci.\"},{\"index\":6740,\"text\":\"Alcuni abitanti sostenevano che le sue cure fossero troppo misteriose.\"},{\"index\":6741,\"text\":\"Altri dicevano che parlasse con forze oscure.\"},{\"index\":6742,\"text\":\"Ben presto queste dicerie arrivarono alle autorità.\"},{\"index\":6743,\"text\":\"Matteuccia fu arrestata e portata davanti al tribunale.\"},{\"index\":6744,\"text\":\"\"},{\"index\":6745,\"text\":\"🐐 Il racconto del volo\"},{\"index\":6746,\"text\":\"Durante il processo comparve una delle confessioni più sorprendenti della storia della stregoneria italiana.\"},{\"index\":6747,\"text\":\"Secondo gli atti processuali, Matteuccia avrebbe dichiarato di preparare un particolare unguento.\"},{\"index\":6748,\"text\":\"Dopo averlo spalmato sul corpo, avrebbe pronunciato una formula magica.\"},{\"index\":6749,\"text\":\"Successivamente sarebbe salita in groppa a un caprone e avrebbe volato nella notte per raggiungere altre streghe.\"},{\"index\":6750,\"text\":\"Negli atti del processo compare anche una formula che, secondo il documento, avrebbe recitato prima del volo.\"},{\"index\":6751,\"text\":\"Per secoli questo racconto fu considerato una prova dell’esistenza delle streghe.\"},{\"index\":6752,\"text\":\"Oggi, invece, gli storici invitano a leggerlo con molta prudenza.\"},{\"index\":6753,\"text\":\"\"},{\"index\":6754,\"text\":\"📜 Che cosa pensano gli storici?\"},{\"index\":6755,\"text\":\"Quasi tutti gli studiosi moderni ritengono che confessioni di questo tipo non possano essere considerate prove storiche.\"},{\"index\":6756,\"text\":\"Nel Quattrocento gli interrogatori erano molto diversi da quelli di oggi.\"},{\"index\":6757,\"text\":\"In molti tribunali europei gli accusati venivano minacciati o torturati.\"},{\"index\":6758,\"text\":\"Per questo motivo alcune persone confessavano qualunque cosa pur di far terminare il processo.\"},{\"index\":6759,\"text\":\"Gli storici ritengono inoltre che molte idee sul volo delle streghe fossero già diffuse nella cultura dell’epoca.\"},{\"index\":6760,\"text\":\"È possibile che gli inquisitori suggerissero inconsapevolmente alcune immagini durante gli interrogatori, oppure che gli accusati ripetessero racconti popolari già conosciuti.\"},{\"index\":6761,\"text\":\"Per questo motivo il caso di Matteuccia è importante non tanto perché dimostrerebbe l’esistenza della magia, ma perché ci mostra come funzionava la giustizia nel Quattrocento e quali paure fossero presenti nella società.\"},{\"index\":6762,\"text\":\"\"},{\"index\":6763,\"text\":\"🌍 Curiosità\"},{\"index\":6764,\"text\":\"📖 La formula magica\"},{\"index\":6765,\"text\":\"Negli atti del processo compare una breve formula che Matteuccia avrebbe pronunciato prima del volo.\"},{\"index\":6766,\"text\":\"È uno dei più antichi testi italiani collegati alla stregoneria arrivati fino a noi.\"},{\"index\":6767,\"text\":\"Gli studiosi lo analizzano oggi come documento linguistico e storico.\"},{\"index\":6768,\"text\":\"\"},{\"index\":6769,\"text\":\"🌿 Guaritrice o strega?\"},{\"index\":6770,\"text\":\"Nel Medioevo il confine tra medicina popolare, superstizione e magia era spesso poco chiaro.\"},{\"index\":6771,\"text\":\"Molte persone che preparavano rimedi naturali potevano essere rispettate da alcuni e temute da altri.\"},{\"index\":6772,\"text\":\"\"},{\"index\":6773,\"text\":\"⚖️ Un documento prezioso\"},{\"index\":6774,\"text\":\"Il processo di Matteuccia è uno dei documenti più importanti per comprendere la nascita dell’immagine della strega nell’Italia del Quattrocento.\"},{\"index\":6775,\"text\":\"\"},{\"index\":6776,\"text\":\"💬 Hai capito?\"},{\"index\":6777,\"text\":\"Chi era Matteuccia?\"},{\"index\":6778,\"text\":\"Perché molte persone si rivolgevano a lei?\"},{\"index\":6779,\"text\":\"Che cosa racconta la confessione?\"},{\"index\":6780,\"text\":\"Perché gli storici non la considerano una prova affidabile?\"},{\"index\":6781,\"text\":\"Che cosa ci insegna questo processo?\"},{\"index\":6782,\"text\":\"Perché il caso di Matteuccia è ancora studiato oggi?\"},{\"index\":6783,\"text\":\"\"},{\"index\":6784,\"text\":\"✅ Vero o falso?\"},{\"index\":6785,\"text\":\"Matteuccia visse nel Quindicesimo secolo.\"},{\"index\":6786,\"text\":\"Era conosciuta per l’uso delle erbe medicinali.\"},{\"index\":6787,\"text\":\"Gli storici credono che la confessione dimostri l’esistenza della magia.\"},{\"index\":6788,\"text\":\"Il processo è documentato da fonti storiche.\"},{\"index\":6789,\"text\":\"Nel Medioevo gli interrogatori erano identici a quelli moderni.\"},{\"index\":6790,\"text\":\"Il caso di Matteuccia è ancora studiato dagli storici.\"},{\"index\":6791,\"text\":\"\"},{\"index\":6792,\"text\":\"📚 Ripassiamo la grammatica\"},{\"index\":6793,\"text\":\"Completa con il tempo corretto.\"},{\"index\":6794,\"text\":\"Nel 1428 Matteuccia __________ davanti al tribunale.\\n (comparire)\"},{\"index\":6795,\"text\":\"Molte persone
