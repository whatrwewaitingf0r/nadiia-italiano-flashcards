6 · Viaggio con Liam · Unità 4 Liguria · Nord/Sud\"},{\"it\":\"extravergine\",\"other\":\"extra virgin (olive oil)\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Lezione 16 settembre 2026 · Viaggio con Liam · Unità 4 Liguria · Nord/Sud\"},{\"it\":\"mortaio\",\"other\":\"mortar\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Lezione 16 settembre 2026 · Viaggio con Liam · Unità 4 Liguria · Nord/Sud\"},{\"it\":\"Presente: come si formano i verbi regolari?\",\"other\":\"parlare: parlo, parli, parla, parliamo, parlate, parlano. prendere: prendo, prendi, prende, prendiamo, prendete, prendono. dormire: dormo, dormi, dorme, dormiamo, dormite, dormono. Match the subject.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Capire, finire, preferire, pulire: dove va -isc-?\",\"other\":\"capisco, capisci, capisce, capiamo, capite, capiscono. Also: finisco, preferisci, pulisce. No -isc- with noi or voi.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Essere e avere: il presente?\",\"other\":\"essere: sono, sei, è, siamo, siete, sono. avere: ho, hai, ha, abbiamo, avete, hanno. These are also the auxiliaries for passato prossimo.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Andare e venire: il presente?\",\"other\":\"andare: vado, vai, va, andiamo, andate, vanno. venire: vengo, vieni, viene, veniamo, venite, vengono.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Fare e stare: il presente?\",\"other\":\"fare: faccio, fai, fa, facciamo, fate, fanno. stare: sto, stai, sta, stiamo, state, stanno.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Dare e dire: il presente?\",\"other\":\"dare: do, dai, dà, diamo, date, danno. dire: dico, dici, dice, diciamo, dite, dicono. Dà needs an accent; do does not.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Potere, volere, dovere: il presente?\",\"other\":\"posso, puoi, può, possiamo, potete, possono. voglio, vuoi, vuole, vogliamo, volete, vogliono. devo, devi, deve, dobbiamo, dovete, devono (also debbo / debbono).\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Sapere, bere, uscire: il presente?\",\"other\":\"so, sai, sa, sappiamo, sapete, sanno. bevo, bevi, beve, beviamo, bevete, bevono. esco, esci, esce, usciamo, uscite, escono.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Passato prossimo: quali due pezzi servono?\",\"other\":\"Present auxiliary + past participle: io ho mangiato; lei è partita. Both words belong in the answer. A completed event in the past.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Con avere, il participio cambia in queste frasi?\",\"other\":\"No: io ho mangiato; lei ha mangiato; noi abbiamo mangiato. With a following direct object, keep the participle unchanged. Object-pronoun agreement is a separate rule.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Con essere, come concorda il participio?\",\"other\":\"lui è andato; lei è andata; loro sono andati (m. / mixed); loro sono andate (all f.). Match the subject in gender and number.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Andare, venire, uscire, arrivare, partire: l’ausiliare?\",\"other\":\"Use essere here: sono andata, è venuta, siamo usciti, siete arrivati, sono partite. Not every movement verb takes essere: ho camminato.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Essere e stare: il passato prossimo?\",\"other\":\"essere: sono stato / stata; siamo stati / state. stare: sono stato / stata; siamo stati / state. Both use essere + stato, with subject agreement.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Fare, dire, bere: il participio passato?\",\"other\":\"fare → fatto; dire → detto; bere → bevuto. Examples: ho fatto una passeggiata; hai detto la verità; ha bevuto acqua.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Prendere, mettere, vedere: il participio passato?\",\"other\":\"prendere → preso; mettere → messo; vedere → visto (also veduto). Examples: ho preso il treno; ho messo il libro sul tavolo; ho visto un film.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Scrivere, leggere, vivere: il participio passato?\",\"other\":\"scrivere → scritto; leggere → letto; vivere → vissuto. Ho scritto una lettera; ho letto un libro; ho vissuto una bella esperienza. Transitive vivere uses avere.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Potere, volere, dovere, sapere: il participio passato?\",\"other\":\"potuto, voluto, dovuto, saputo. Ho potuto fare una pausa; ho voluto un caffè; ho dovuto pagare il conto; ho saputo la notizia. Modal auxiliary choice can depend on the following infinitive.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Passato prossimo o imperfetto?\",\"other\":\"Ieri ho letto un libro: completed event. Prima leggevo ogni sera: past habit. Mentre leggevo, è arrivata Anna: background action + event.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Imperfetto: quali sono le desinenze?\",\"other\":\"-vo, -vi, -va, -vamo, -vate, -vano. parlavo, prendevi, dormiva; parlavamo, prendevate, dormivano. Keep the conjugation vowel: a / e / i.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Essere, fare, dire, bere: l’imperfetto?\",\"other\":\"ero, eri, era, eravamo, eravate, erano. fare → facevo; dire → dicevo; bere → bevevo. Continue with -vi, -va, -vamo, -vate, -vano.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Futuro semplice: quali sono le desinenze?\",\"other\":\"-ò, -ai, -à, -emo, -ete, -anno. parlerò, parlerai, parlerà, parleremo, parlerete, parleranno. Regular -are changes to -er-; -ere uses -er-; -ire uses -ir-.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Futuro: essere, avere, andare, venire?\",\"other\":\"sarò, avrò, andrò, verrò. Stems: sar-, avr-, andr-, verr-. Add -ò, -ai, -à, -emo, -ete, -anno: lei sarà; noi avremo; loro verranno.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Futuro: fare, dare, stare, bere, volere?\",\"other\":\"farò, darò, starò, berrò, vorrò. Also: potrò, dovrò, saprò, vedrò, vivrò. Mangiare → mangerò, not mangierò.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Condizionale presente: come si forma?\",\"other\":\"Use the future stem + -ei, -esti, -ebbe, -emmo, -este, -ebbero. parlerei, parleresti, parlerebbe, parleremmo, parlereste, parlerebbero.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Vorrei, potrei, dovrei: quando si usano?\",\"other\":\"Vorrei un caffè: polite wish. Potrei fare una pausa?: polite request / possibility. Dovrei studiare: advice or obligation softened. Se fosse possibile, andrei a Roma. Conditional: sarei, avrei, farei, verrei.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"ghiro\",\"other\":\"dormouse\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Animals and pronunciation · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"gnomo\",\"other\":\"gnome\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Animals and pronunciation · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"sciarpa\",\"other\":\"scarf\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Animals and pronunciation · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"scimmia\",\"other\":\"monkey\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Animals and pronunciation · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"scendere\",\"other\":\"to go down\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Animals and pronunciation · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"il forziere\",\"other\" b\",\"nord-sud\"]},{\"it\":\"la metropoli\",\"other\":\"metropolis\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Village life and culture · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"il terrazzamento\",\"other\":\"terrace built into a hillside\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Village life and culture · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"il muro a secco\",\"other\":\"dry-stone wall\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Village life and culture · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"l’abbazia\",\"other\":\"abbey\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Village life and culture · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"la baia\",\"other\":\"bay\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Village life and culture · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"il faro\",\"other\":\"lighthouse\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Village life and culture · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"il marinaio\",\"other\":\"sailor\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Village life and culture · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"il presepe\",\"other\":\"nativity scene\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Village life and culture · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"Matteuccia di Todi\",\"other\":\"a woman tried for witchcraft in Todi in 1428 (historical reading)\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Matteuccia reading · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"guaritrice\",\"other\":\"female healer\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Matteuccia reading · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"gli inquisitori\",\"other\":\"inquisitors\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Matteuccia reading · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"il Quattrocento\",\"other\":\"the fifteenth century; the 1400s\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Matteuccia reading · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"stregoneria\",\"other\":\"witchcraft\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Witch trials · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"strix\",\"other\":\"Latin name of a nocturnal bird in Roman tales; source of Italian strega\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Witches and word origins · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"la Befana\",\"other\":\"the Italian folklore figure who brings children sweets or coal in early January\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Italian folklore · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"Hexe / Hexen\",\"other\":\"witch / witches in German (terms in the Italian reading)\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Witches and word origins · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"wicce / wicca\",\"other\":\"Old English feminine / masculine words cited as the origin of witch\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Witches and word origins · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"Parte 1 – Chi erano davvero?\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-01\",\"sourceParagraph\":5912,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5913\",\"sourceText\":\"🧙 Folclore Italiano\\nUnità 1\\nLe Streghe d’Italia\\nParte 1 – Chi erano davvero?\\n\\n🌙 Prima di leggere\\nVocabolario\\n🧙 la strega = witch\\n🪄 la magia = magic\\n🌿 l’erba medicinale = medicinal herb\\n🍄 il fungo = mushroom\\n🌕 la luna piena = full moon\\n🔥 il rogo = stake, bonfire \\n⚖️ il processo = trial\\n🙏 la superstizione = superstition\\n📖 la leggenda = legend\\n🏔️ il villaggio = village\\n🌲 il bosco = forest\\n\\n📖 Lettura\\nQuando sentiamo la parola strega, molti pensano subito a una donna con il cappello a punta, una scopa volante (flying) e un gatto nero. 🐈‍⬛ Tuttavia, questa immagine è abbastanza (enough) moderna e deriva soprattutto dalle fiabe e dalla cultura popolare.\\nNel passato la parola strega aveva un significato molto diverso.\\nIn molte regioni d’Italia si credeva (it was believed) che alcune donne conoscessero le proprietà delle erbe medicinali, sapessero assistere le partorienti (le donne in cinta) oppure preparassero rimedi contro alcune malattie (diseases). 🌿 Alcune di loro erano guaritrici (healers), levatrici (midwives) o semplicemente donne molto esperte della natura.\\nCon il passare dei secoli, però, molte superstizioni si diffusero in Europa. Alcune persone iniziarono ad accusare queste donne di praticare la magia o di avere rapporti (relations) con il diavolo.\\nTra (between) il Quattrocento e il Seicento si svolsero (conduct) numerosi processi per stregoneria(witchcraft) anche in alcune zone dell’Italia. Molte persone furono interrogate, imprigionate e, in alcuni casi, condannate a morte.\\nOggi gli storici ritengono (believe) che una parte di queste accuse fosse basata sulla paura, sulle superstizioni o su conflitti tra vicini, piuttosto (instead) che su prove reali.\\nPer questo motivo, quando studiamo le streghe, non studiamo soltanto il folclore, ma anche il modo in cui le persone interpretavano il mondo molti secoli fa.\\n\\n🇮🇹 Curiosità\\n🧹 Da dove viene la scopa?\\nL’idea della strega che vola sulla scopa non nasce in Italia.\\nSi diffuse in Europa tra la fine del Medioevo e l’inizio dell’età moderna, entrando poi nelle fiabe e nell’arte.\\n\\n🐈‍⬛ Perché il gatto nero?\\nNel Medioevo molti credevano che i gatti neri portassero sfortuna o fossero legati (connected) alle streghe.\\nOggi, naturalmente, sappiamo che si tratta solo di una superstizione.\\n\\n🌿 Le erbe\\nMolte presunte “streghe” conoscevano davvero le piante medicinali.\\nIn un’epoca in cui la medicina era poco sviluppata (developed), questi saperi erano molto preziosi.\\n\\n💬 Hai capito?\\nDa dove deriva l’immagine moderna della strega?\\nChe cosa facevano molte donne considerate streghe?\\nPerché alcune persone le accusavano?\\nIn quale periodo si svolsero molti processi?\\nChe cosa pensano oggi gli storici?\\nChe cosa possiamo imparare studiando la stregoneria?\\n\\n📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel Medioevo molte persone ___credevano_______ alle streghe.\\n (credere)\\nAlcune donne __conoscevano________ le erbe medicinali.\\n (conoscere)\\nGli storici ____studiano______ questo fenomeno ancora oggi.\\n (studiare)\\nNel passato molti processi ____si svolgevano______ in Europa.\\n (svolgersi)\\nAlcune donne __lavoravano________ come levatrici.\\n (lavorare)\\nTu ___hai_______ mai letto un libro sulle streghe?\\n (avere)\\n\\n🔄 Ripasso dei tempi verbali\\nTrasforma la frase usando il tempo richiesto.\\nPresente\\nLe donne conoscono le erbe.\\nImperfetto\\n conoscevano\\nPassato prossimo\\nHanno conosciuto\\nPassato remoto\\nconobbero\\n🗣️ Parliamone\\nPensi che nel passato le persone fossero più superstiziose di oggi?\\nConosci qualche leggenda del tuo Paese?\\nPerché la gente aveva paura delle streghe?\\nOggi esistono ancora superstizioni?\\n\\n///////////////////////////////////////////////\\n///////////////////////\\n//////\\n\\n✍️ Scrittura\\nScrivi 12–15 frasi.\\nPerché nascono le leggende?\\nPuoi parlare di:\\n🌙 la paura\\n🌲 la natura\\n📖 la religione\\n👵 le tradizioni\\n🧙 le streghe\\n\\n⭐ Lo sapevi?\\nLa parola italiana strega deriva dal latino strix, il nome di un uccello notturno che, secondo gli antichi Romani, si nutriva del sangue dei bambini. Con il passare dei secoli, il significato della parola cambiò e finì per indicare una donna associata alla magia e al soprannaturale.\\n➡️ Nella prossima lezione esploreremo alcune delle streghe più famose del folclore italiano, come la Befana, le Janare di Benevento e le Masche del Piemonte, cercando di capire come nacquero queste leggende.\\n30-09-26 – Nadia\"},{\"it\":\"la strega\",\"other\":\"witch\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5919,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5920\"},{\"it\":\"la magia\",\"other\":\"magic\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5920,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5921\"},{\"it\":\"l’erba medicinale\",\"other\":\"medicinal herb\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5921,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5922\"},{\"it\":\"il fungo\",\"other\":\"mushroom\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5922,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5923\"},{\"it\":\"la luna piena\",\"other\":\"full moon\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5923,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5924\"},{\"it\":\"il rogo\",\"other\":\"stake, bonfire\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5924,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5925\"},{\"it\":\"il processo\",\"other\":\"trial\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5925,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5926\"},{\"it\":\"la superstizione\",\"other\":\"superstition\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5926,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5927\"},{\"it\":\"la leggenda\",\"other\":\"legend\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5927,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5928\"},{\"it\":\"il villaggio\",\"other\":\"village\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5928,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5929\"},{\"it\":\"il bosco\",\"other\":\"forest\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-01\",\"sourceParagraph\":5929,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5930\"},{\"it\":\"Da dove deriva l’immagine moderna della strega?\",\"other\":\"Where does the modern image of the witch come from?\\n\\nSuggested response based on the reading: Mainly from fairy tales and popular culture.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5954,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5955\"},{\"it\":\"Che cosa facevano molte donne considerate streghe?\",\"other\":\"What did many women considered witches do?\\n\\nSuggested response based on the reading: They knew medicinal herbs, helped women give birth and prepared remedies; some were healers or midwives.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5955,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5956\"},{\"it\":\"Perché alcune persone le accusavano?\",\"other\":\"Why did some people accuse them?\\n\\nSuggested response based on the reading: Fear and superstition led people to suspect magic or dealings with the devil.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5956,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5957\"},{\"it\":\"In quale periodo si svolsero molti processi?\",\"other\":\"During what period did many trials take place?\\n\\nSuggested response based on the reading: Between the fifteenth and seventeenth centuries.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5957,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5958\"},{\"it\":\"Che cosa pensano oggi gli storici?\",\"other\":\"What do historians think today?\\n\\nSuggested response based on the reading: Many accusations reflected fear, superstition and conflicts between neighbours rather than real evidence.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5958,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5959\"},{\"it\":\"Che cosa possiamo imparare studiando la stregoneria?\",\"other\":\"What can we learn by studying witchcraft?\\n\\nSuggested response based on the reading: How people interpreted the world, and how fears and beliefs shaped past societies.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-01\",\"sourceParagraph\":5959,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5960\"},{\"it\":\"Pensi che nel passato le persone fossero più superstiziose di oggi?\",\"other\":\"Do you think people in the past were more superstitious than people today?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-01\",\"sourceParagraph\":5981,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5982\"},{\"it\":\"Conosci qualche leggenda del tuo Paese?\",\"other\":\"Do you know any legends from your country?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-01\",\"sourceParagraph\":5982,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5983\"},{\"it\":\"Perché la gente aveva paura delle streghe?\",\"other\":\"Why were people afraid of witches?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-01\",\"sourceParagraph\":5983,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5984\"},{\"it\":\"Oggi esistono ancora superstizioni?\",\"other\":\"Do superstitions still exist today?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-01\",\"sourceParagraph\":5984,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5985\"},{\"it\":\"Perché nascono le leggende?\",\"other\":\"Why do legends arise?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-01\",\"sourceParagraph\":5992,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5993\"},{\"it\":\"📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel Medioevo molte persone ___credevano_______ alle streghe.\\n (credere)\\nAlcune donne __conoscevano________ le erbe medicinali.\\n (conoscere)\\nGli storici ____studiano______ questo fenomeno ancora oggi.\\n (studiare)\\nNel passato molti processi ____si svolgevano______ in Europa.\\n (svolgersi)\\nAlcune donne __lavoravano________ come levatrici.\\n (lavorare)\\nTu ___hai_______ mai letto un libro sulle streghe?\\n (avere)\\n\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-01\",\"sourceParagraph\":5961,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5962\"},{\"it\":\"🔄 Ripasso dei tempi verbali\\nTrasforma la frase usando il tempo richiesto.\\nPresente\\nLe donne conoscono le erbe.\\nImperfetto\\n conoscevano\\nPassato prossimo\\nHanno conosciuto\\nPassato remoto\\nconobbero\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-01\",\"sourceParagraph\":5970,\"note\":\"Liam · Lettura · Parte 1 – Chi erano davvero? · DOCX paragraph 5971\"},{\"it\":\"Parte 2 – Le streghe più famose del folclore italiano\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-02\",\"sourceParagraph\":6004,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6005\",\"sourceText\":\"🧙 Folclore Italiano\\nUnità 1\\nLe Streghe d’Italia\\nParte 2 – Le streghe più famose del folclore italiano\\n\\n🌞 Prima di leggere\\nVocabolario\\n🧹 la scopa = broom\\n🎁 il regalo = gift\\n👵 l’anziana = elderly woman\\n🌰 il noce = walnut tree\\n🌙 il sabba = witches’ gathering (secondo il folclore)\\n🧚 la fata = fairy\\n🪄 l’incantesimo = spell\\n🪶 la leggenda popolare = folk legend\\n🦉 il gufo = owl\\n🏞️ il folklore = folklore\\n\\n📖 Lettura\\nL’Italia non ha una sola leggenda sulle streghe. Ogni regione ha creato le proprie storie, spesso molto diverse tra loro.\\nUna delle figure più conosciute è la Befana. Oggi è una simpatica vecchietta che, nella notte tra il 5 e il 6 gennaio, porta dolci ai bambini buoni e carbone a quelli che si sono comportati male. 🎁\\nMolti studiosi pensano che la Befana abbia origini molto antiche, forse precedenti al Cristianesimo. Alcuni elementi ricordano antichi riti agricoli legati alla fine dell’inverno e all’inizio di un nuovo ciclo della natura.\\nMolto diversa è la leggenda delle Janare, diffuse soprattutto nella zona di Benevento, in Campania. Secondo il folclore, le Janare erano donne che uscivano di notte e si riunivano vicino a un grande albero di noce. Si diceva che conoscessero formule magiche e che potessero lanciare incantesimi.\\nGli storici, però, ritengono che queste storie siano il risultato di antiche credenze popolari, trasformate nel corso dei secoli dalla fantasia e dalla paura.\\nNel Piemonte, invece, si raccontavano le storie delle Masche. Le Masche non erano sempre malvagie: in alcune leggende aiutavano le persone, in altre provocavano scherzi o piccoli dispetti. Potevano trasformarsi in animali, scomparire all’improvviso(disappear suddenly) oppure(or) confondere(confuse) i viaggiatori durante la notte.\\nQueste leggende cambiavano da paese a paese. Non esisteva una sola storia “ufficiale”: ogni famiglia raccontava i propri episodi e aggiungeva nuovi particolari.\\nPer questo motivo il folclore italiano è così ricco e vario.\\n\\n🌍 Curiosità\\n🎁 La Befana è una strega?\\nMolti bambini la chiamano “strega”, ma in realtà la Befana è una figura del folclore italiano.\\nNon è considerata malvagia: porta regali, dolci e speranza per il nuovo anno.\\n\\n🌰 Il Noce di Benevento\\nPer secoli si raccontò che vicino a Benevento crescesse un enorme noce dove le Janare si riunivano durante la notte.\\nGli storici non hanno prove che questi incontri siano realmente avvenuti, ma la leggenda è diventata una delle più famose d’Italia.\\n\\n🦉 Animali misteriosi\\nNelle antiche leggende le streghe erano spesso accompagnate da:\\n🐈‍⬛ gatti neri\\n🦉 gufi\\n🐺 lupi\\nQuesti animali erano associati alla notte e al mistero.\\n\\n💬 Hai capito?\\nRispondi.\\nChi è la Befana?\\nQuali potrebbero essere le origini della Befana?\\nDove vivevano, secondo la leggenda, le Janare?\\nChi erano le Masche?\\nPerché esistono tante versioni delle stesse leggende?\\nQuali animali compaiono spesso nelle storie di streghe?\\n\\n✅ Vero o falso?\\nLa Befana porta i regali il giorno di Natale.\\nLe Janare appartengono al folclore della Campania.\\nLe Masche sono legate al Piemonte.\\nTutte le leggende raccontano la stessa storia.\\nIl noce di Benevento è famoso nella tradizione popolare.\\nIl folclore cambia da una regione all’altra.\\n\\n📚 Ripassiamo la grammatica\\nScegli il tempo corretto.\\nQuando Nadia era bambina, __________ molte fiabe.\\na) leggeva\\nb) ha letto\\nc) lesse\\n\\nNel Medioevo molte persone __________ nelle streghe.\\na) credono\\nb) credevano\\nc) hanno creduto\\n\\nLa Befana __________ uno dei simboli del folclore italiano.\\na) è\\nb) era\\nc) fu\\n\\nI nonni mi __________ questa leggenda quando ero piccolo.\\na) raccontavano\\nb) hanno raccontato\\nc) racconteranno\\n\\nNel Cinquecento molte persone __________ accuse di stregoneria.\\na) subirono\\nb) hanno subito\\nc) subiscono\\n\\n🔄 Trasforma la frase\\nFrase:\\nLe Janare si riunivano sotto il noce.\\n➡️ Presente:\\n\\n➡️ Passato prossimo:\\n\\n➡️ Passato remoto:\\n\\n🗣️ Parliamone\\nQuale leggenda ti sembra più interessante?\\nNel tuo Paese esiste una figura simile alla Befana?\\nPerché le persone inventano storie sul soprannaturale?\\nTi piace il folclore oppure preferisci la storia documentata?\\n\\n✍️ Scrittura\\nUna leggenda della mia città\\nScrivi 12–15 frasi.\\nParla di:\\n📍 dove nasce la leggenda\\n👥 i personaggi\\n🌙 che cosa succede\\n🤔 perché pensi che questa storia sia nata\\n\\n⭐ Lo sapevi?\\nLa parola folclore deriva dall’inglese folklore, formato da folk (“popolo”) e lore (“sapere”, “tradizione”). Indica l’insieme delle leggende, dei racconti, delle feste, delle credenze e delle tradizioni tramandate oralmente da una generazione all’altra.\\n➡️ Nella prossima lezione scopriremo i veri processi alle streghe in Italia: chi veniva accusato, perché accadeva e che cosa ci raccontano oggi gli storici su quel periodo.\\n30-09-26 – Nadia\"},{\"it\":\"la scopa\",\"other\":\"broom\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6011,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6012\"},{\"it\":\"il regalo\",\"other\":\"gift\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6012,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6013\"},{\"it\":\"l’anziana\",\"other\":\"elderly woman\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6013,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6014\"},{\"it\":\"il noce\",\"other\":\"walnut tree\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6014,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6015\"},{\"it\":\"il sabba\",\"other\":\"witches’ gathering (secondo il folclore)\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6015,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6016\"},{\"it\":\"la fata\",\"other\":\"fairy\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6016,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6017\"},{\"it\":\"l’incantesimo\",\"other\":\"spell\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6017,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6018\"},{\"it\":\"la leggenda popolare\",\"other\":\"folk legend\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6018,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6019\"},{\"it\":\"il gufo\",\"other\":\"owl\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6019,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6020\"},{\"it\":\"il folklore\",\"other\":\"folklore\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-02\",\"sourceParagraph\":6020,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6021\"},{\"it\":\"Chi è la Befana?\",\"other\":\"Who is the Befana?\\n\\nSuggested response based on the reading: An Italian folklore figure who brings sweets to well-behaved children and coal to those who misbehave, on the night of 5–6 January.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6050,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6051\"},{\"it\":\"Quali potrebbero essere le origini della Befana?\",\"other\":\"What might the origins of the Befana be?\\n\\nSuggested response based on the reading: Possibly ancient, pre-Christian agricultural rituals connected with the end of winter and a new natural cycle.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6051,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6052\"},{\"it\":\"Dove vivevano, secondo la leggenda, le Janare?\",\"other\":\"Where did the Janare live, according to the legend?\\n\\nSuggested response based on the reading: Around Benevento in Campania; they supposedly gathered near a large walnut tree.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6052,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6053\"},{\"it\":\"Chi erano le Masche?\",\"other\":\"Who were the Masche?\\n\\nSuggested response based on the reading: Figures of Piedmontese folklore who could supposedly transform into animals; some helped people, others played tricks.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6053,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6054\"},{\"it\":\"Perché esistono tante versioni delle stesse leggende?\",\"other\":\"Why are there so many versions of the same legends?\\n\\nSuggested response based on the reading: Stories were passed down orally; each village and family added new details.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6054,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6055\"},{\"it\":\"Quali animali compaiono spesso nelle storie di streghe?\",\"other\":\"Which animals often appear in stories about witches?\\n\\nSuggested response based on the reading: Black cats, owls and wolves.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-02\",\"sourceParagraph\":6055,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6056\"},{\"it\":\"Quale leggenda ti sembra più interessante?\",\"other\":\"Which legend seems most interesting to you?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-02\",\"sourceParagraph\":6102,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6103\"},{\"it\":\"Nel tuo Paese esiste una figura simile alla Befana?\",\"other\":\"Is there a figure similar to the Befana in your country?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-02\",\"sourceParagraph\":6103,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6104\"},{\"it\":\"Perché le persone inventano storie sul soprannaturale?\",\"other\":\"Why do people invent stories about the supernatural?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-02\",\"sourceParagraph\":6104,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6105\"},{\"it\":\"Ti piace il folclore oppure preferisci la storia documentata?\",\"other\":\"Do you enjoy folklore, or do you prefer documented history?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-02\",\"sourceParagraph\":6105,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6106\"},{\"it\":\"La Befana porta i regali il giorno di Natale.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-02\",\"sourceParagraph\":6058,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6059\"},{\"it\":\"Le Janare appartengono al folclore della Campania.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-02\",\"sourceParagraph\":6059,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6060\"},{\"it\":\"Le Masche sono legate al Piemonte.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-02\",\"sourceParagraph\":6060,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6061\"},{\"it\":\"Tutte le leggende raccontano la stessa storia.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-02\",\"sourceParagraph\":6061,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6062\"},{\"it\":\"Il noce di Benevento è famoso nella tradizione popolare.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-02\",\"sourceParagraph\":6062,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6063\"},{\"it\":\"Il folclore cambia da una regione all’altra.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-02\",\"sourceParagraph\":6063,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6064\"},{\"it\":\"📚 Ripassiamo la grammatica\\nScegli il tempo corretto.\\nQuando Nadia era bambina, __________ molte fiabe.\\na) leggeva\\nb) ha letto\\nc) lesse\\n\\nNel Medioevo molte persone __________ nelle streghe.\\na) credono\\nb) credevano\\nc) hanno creduto\\n\\nLa Befana __________ uno dei simboli del folclore italiano.\\na) è\\nb) era\\nc) fu\\n\\nI nonni mi __________ questa leggenda quando ero piccolo.\\na) raccontavano\\nb) hanno raccontato\\nc) racconteranno\\n\\nNel Cinquecento molte persone __________ accuse di stregoneria.\\na) subirono\\nb) hanno subito\\nc) subiscono\\n\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-02\",\"sourceParagraph\":6065,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6066\"},{\"it\":\"🔄 Trasforma la frase\\nFrase:\\nLe Janare si riunivano sotto il noce.\\n➡️ Presente:\\n\\n➡️ Passato prossimo:\\n\\n➡️ Passato remoto:\\n\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-02\",\"sourceParagraph\":6092,\"note\":\"Liam · Lettura · Parte 2 – Le streghe più famose del folclore italiano · DOCX paragraph 6093\"},{\"it\":\"Parte 3 – I processi alle streghe: storia o paura?\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-03\",\"sourceParagraph\":6120,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6121\",\"sourceText\":\"🧙 Folclore Italiano\\nUnità 1\\n//////////////////////////////////////\\n\\n///////\\nLe Streghe d’Italia\\nParte 3 – I processi alle streghe: storia o paura?\\n\\n🌞 Prima di leggere\\nVocabolario\\n⚖️ il tribunale = court\\n👨‍⚖️ il giudice = judge\\n📜 l’accusa = accusation\\n🛡️ la difesa = defense\\n😨 la paura = fear\\n🙏 l’eresia = heresy\\n🔥 il rogo = stake\\n⛓️ il carcere = prison\\n🗣️ la confessione = confession\\n📚 la testimonianza = testimony\\n\\n📖 Lettura\\nQuando pensiamo ai processi alle streghe, immaginiamo spesso migliaia di donne condannate ovunque in Europa. La realtà storica, però, è più complessa.\\nTra il XV e il XVII secolo si svolsero numerosi processi per stregoneria in varie parti dell’Europa. Anche alcuni territori italiani conobbero questi processi, ma furono generalmente meno numerosi rispetto ad alcune regioni dell’Europa centrale e settentrionale.\\nLe persone accusate erano soprattutto donne, anche se in alcuni casi furono processati anche uomini. Bastavano talvolta un litigio tra vicini, una malattia improvvisa del bestiame, un raccolto andato male o la reputazione di conoscere erbe medicinali perché qualcuno iniziasse a sospettare.\\nDurante gli interrogatori gli accusati dovevano difendersi da accuse molto gravi. In alcuni tribunali europei veniva usata anche la tortura per ottenere confessioni. Oggi gli storici sottolineano che confessioni ottenute in questo modo non possono essere considerate affidabili.\\nIn Italia la situazione variava molto da uno Stato all’altro. Alcuni tribunali erano più severi, altri chiedevano prove più solide prima di emettere una condanna. Per questo motivo il numero delle esecuzioni fu generalmente inferiore rispetto ad altre zone d’Europa.\\nCon il passare del tempo, lo sviluppo della scienza, della medicina e di un approccio più razionale contribuì a ridurre la credenza nella stregoneria. Nel XVIII secolo questi processi divennero sempre più rari e infine scomparvero.\\nOggi gli storici studiano questo periodo per capire come la paura, la superstizione e le tensioni sociali possano influenzare il comportamento di un’intera comunità.\\n\\n🌍 Curiosità\\n📖 Il\\nMalleus Maleficarum\\nNel 1487 fu pubblicato il Malleus Maleficarum (“Il martello delle streghe”), un trattato scritto dai religiosi Heinrich Kramer e Jacob Sprenger. Il libro descriveva come individuare e processare le presunte streghe.\\nMolti storici lo considerano uno dei testi che contribuirono a diffondere la paura della stregoneria in alcune parti d’Europa, anche se la sua influenza variò da regione a regione.\\n\\n🇮🇹 Italia ed Europa\\nLe grandi persecuzioni furono particolarmente intense in alcune aree dell’attuale Germania, Svizzera, Francia orientale e Scozia.\\nAnche in Italia si svolsero processi, ma nella maggior parte delle regioni il numero delle condanne fu inferiore rispetto a quello registrato in alcune zone dell’Europa centrale.\\n\\n🌿 Guaritrici o streghe?\\nMolte donne conoscevano davvero le proprietà delle piante medicinali.\\nOggi gli studiosi ritengono che alcune di loro fossero semplicemente guaritrici, levatrici o persone esperte di rimedi tradizionali.\\n\\n💬 Hai capito?\\nRispondi.\\nIn quali secoli si svolsero i processi alle streghe?\\nChi veniva accusato più spesso?\\nQuali situazioni potevano far nascere un’accusa?\\nPerché gli storici non considerano affidabili molte confessioni?\\nPerché i processi diminuirono nel XVIII secolo?\\nPerché oggi si studia ancora questo periodo?\\n\\n✅ Vero o falso?\\nI processi alle streghe avvennero solo in Italia.\\nAnche alcuni uomini furono accusati di stregoneria.\\nLa tortura era usata in tutti i tribunali italiani.\\nLo sviluppo della scienza contribuì a ridurre la credenza nella stregoneria.\\nIl Malleus Maleficarum fu pubblicato nel Quindicesimo secolo.\\nGli storici continuano a studiare questo fenomeno.\\n\\n📚 Ripassiamo la grammatica\\nScegli il tempo corretto.\\nNel XVI secolo molte persone __________ alle streghe.\\na) credono\\nb) credevano\\nc) hanno creduto\\n\\nGli storici oggi __________ questo periodo.\\na) studiano\\nb) studiavano\\nc) studiarono\\n\\nNel 1487 Kramer __________ il Malleus Maleficarum insieme a Jacob Sprenger.\\na) pubblicò\\nb) ha pubblicato\\nc) pubblicava\\n\\nQuando vivevano nei villaggi, alcune donne __________ le erbe medicinali.\\na) conoscevano\\nb) hanno conosciuto\\nc) conosceranno\\n\\nLa scienza __________ molte spiegazioni più razionali.\\na) offrì\\nb) offre\\nc) offriva\\n\\n🔄 Trasforma la frase\\nFrase:\\nMolte persone accusavano le guaritrici di stregoneria.\\n➡️ Presente\\n\\n➡️ Passato prossimo\\n\\n➡️ Passato remoto\\n\\n📖 Leggiamo insieme\\nLeggi ad alta voce.\\n«Nel passato molte persone avevano paura di ciò che non riuscivano a spiegare. Una malattia improvvisa, una tempesta o un cattivo raccolto potevano sembrare eventi misteriosi. Oggi sappiamo che esistono spiegazioni scientifiche per molti fenomeni che un tempo venivano attribuiti alla magia.»\\n\\n🗣️ Parliamone\\nPerché pensi che la paura possa influenzare il giudizio delle persone?\\nConosci altri esempi storici in cui la paura ha portato ad accusare persone innocenti?\\nPerché è importante studiare la storia anche quando è difficile o ingiusta?\\nPensi che oggi esistano ancora superstizioni diffuse?\\n\\n✍️ Scrittura\\nLa paura e la conoscenza\\nScrivi 12–15 frasi.\\nPuoi parlare di:\\n😨 la paura dell’ignoto\\n📚 l’importanza della scienza\\n🌿 le guaritrici\\n⚖️ la giustizia\\n🧠 ciò che hai imparato da questa lezione\\n\\n⭐ Curiosità finale\\nLa parola strega deriva dal latino strix, un uccello notturno che, secondo gli antichi Romani, era associato a racconti inquietanti. Con il passare dei secoli il significato cambiò, fino a indicare una persona ritenuta capace di praticare la magia.\\nMolte storie sulle streghe ci parlano meno della magia e molto di più delle paure, delle credenze e della mentalità delle società del passato. Studiare queste vicende significa comprendere meglio la storia dell’Europa e il modo in cui le idee possono cambiare nel tempo.\\n➡️ Nell’ultima lezione esploreremo le superstizioni italiane più curiose: il malocchio, il corno rosso, il numero 17, il sale, gli specchi, i gatti neri e molte altre credenze popolari che, in alcuni casi, sopravvivono ancora oggi.\\n\\n\\n30-09-26 – Nadia\"},{\"it\":\"il tribunale\",\"other\":\"court\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-03\",\"sourceParagraph\":6130,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6131\"},{\"it\":\"il giudice\",\"other\":\"judge\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-03\",\"sourceParagraph\":6131,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6132\"},{\"it\":\"l’accusa\",\"other\":\"accusation\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-03\",\"sourceParagraph\":6132,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6133\"},{\"it\":\"la difesa\",\"other\":\"defense\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-03\",\"sourceParagraph\":6133,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6134\"},{\"it\":\"la paura\",\"other\":\"fear\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-03\",\"sourceParagraph\":6134,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6135\"},{\"it\":\"l’eresia\",\"other\":\"heresy\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-03\",\"sourceParagraph\":6135,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6136\"},{\"it\":\"il rogo\",\"other\":\"stake\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-03\",\"sourceParagraph\":6136,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6137\"},{\"it\":\"il carcere\",\"other\":\"prison\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-03\",\"sourceParagraph\":6137,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6138\"},{\"it\":\"la confessione\",\"other\":\"confession\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-03\",\"sourceParagraph\":6138,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6139\"},{\"it\":\"la testimonianza\",\"other\":\"testimony\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-03\",\"sourceParagraph\":6139,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6140\"},{\"it\":\"In quali secoli si svolsero i processi alle streghe?\",\"other\":\"In which centuries did witch trials take place?\\n\\nSuggested response based on the reading: Mainly between the fifteenth and seventeenth centuries.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-03\",\"sourceParagraph\":6166,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6167\"},{\"it\":\"Chi veniva accusato più spesso?\",\"other\":\"Who was accused most often?\\n\\nSuggested response based on the reading: Women, although some men were also tried.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-03\",\"sourceParagraph\":6167,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6168\"},{\"it\":\"Quali situazioni potevano far nascere un’accusa?\",\"other\":\"What situations could give rise to an accusation?\\n\\nSuggested response based on the reading: A quarrel between neighbours, sick livestock, a failed harvest or a reputation for knowing medicinal herbs.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-03\",\"sourceParagraph\":6168,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6169\"},{\"it\":\"Perché gli storici non considerano affidabili molte confessioni?\",\"other\":\"Why do historians consider many confessions unreliable?\\n\\nSuggested response based on the reading: Some were obtained under threats or torture, rather than freely given.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-03\",\"sourceParagraph\":6169,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6170\"},{\"it\":\"Perché i processi diminuirono nel XVIII secolo?\",\"other\":\"Why did trials decline in the eighteenth century?\\n\\nSuggested response based on the reading: Developments in science, medicine and more rational approaches weakened belief in witchcraft.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-03\",\"sourceParagraph\":6170,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6171\"},{\"it\":\"Perché oggi si studia ancora questo periodo?\",\"other\":\"Why is this period still studied today?\\n\\nSuggested response based on the reading: To understand how fear, superstition and social tensions influence communities.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-03\",\"sourceParagraph\":6171,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6172\"},{\"it\":\"Perché pensi che la paura possa influenzare il giudizio delle persone?\",\"other\":\"Why do you think fear can influence people’s judgment?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-03\",\"sourceParagraph\":6222,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6223\"},{\"it\":\"Conosci altri esempi storici in cui la paura ha portato ad accusare persone innocenti?\",\"other\":\"Do you know other historical examples in which fear led to accusations against innocent people?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-03\",\"sourceParagraph\":6223,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6224\"},{\"it\":\"Perché è importante studiare la storia anche quando è difficile o ingiusta?\",\"other\":\"Why is it important to study history even when it is difficult or unjust?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-03\",\"sourceParagraph\":6224,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6225\"},{\"it\":\"Pensi che oggi esistano ancora superstizioni diffuse?\",\"other\":\"Do you think widespread superstitions still exist today?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-03\",\"sourceParagraph\":6225,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6226\"},{\"it\":\"I processi alle streghe avvennero solo in Italia.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-03\",\"sourceParagraph\":6174,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6175\"},{\"it\":\"Anche alcuni uomini furono accusati di stregoneria.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-03\",\"sourceParagraph\":6175,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6176\"},{\"it\":\"La tortura era usata in tutti i tribunali italiani.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-03\",\"sourceParagraph\":6176,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6177\"},{\"it\":\"Lo sviluppo della scienza contribuì a ridurre la credenza nella stregoneria.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-03\",\"sourceParagraph\":6177,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6178\"},{\"it\":\"Il Malleus Maleficarum fu pubblicato nel Quindicesimo secolo.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-03\",\"sourceParagraph\":6178,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6179\"},{\"it\":\"Gli storici continuano a studiare questo fenomeno.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-03\",\"sourceParagraph\":6179,\"note\":\"Liam · Lettura · Parte 3 – I processi alle streghe: storia o paura? · DOCX paragraph 6180\"},{\"it\":\"📚 Ripassiamo la grammatica\\nScegli il tempo corretto.\\nNel XVI secolo molte persone __________ alle streghe.\\na) credono\\nb) crede
