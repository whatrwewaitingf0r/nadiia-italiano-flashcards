Altri dicevano che parlasse con forze oscure.\\nBen presto queste dicerie arrivarono alle autorità.\\nMatteuccia fu arrestata e portata davanti al tribunale.\\n\\n🐐 Il racconto del volo\\nDurante il processo comparve una delle confessioni più sorprendenti della storia della stregoneria italiana.\\nSecondo gli atti processuali, Matteuccia avrebbe dichiarato di preparare un particolare unguento.\\nDopo averlo spalmato sul corpo, avrebbe pronunciato una formula magica.\\nSuccessivamente sarebbe salita in groppa a un caprone e avrebbe volato nella notte per raggiungere altre streghe.\\nNegli atti del processo compare anche una formula che, secondo il documento, avrebbe recitato prima del volo.\\nPer secoli questo racconto fu considerato una prova dell’esistenza delle streghe.\\nOggi, invece, gli storici invitano a leggerlo con molta prudenza.\\n\\n📜 Che cosa pensano gli storici?\\nQuasi tutti gli studiosi moderni ritengono che confessioni di questo tipo non possano essere considerate prove storiche.\\nNel Quattrocento gli interrogatori erano molto diversi da quelli di oggi.\\nIn molti tribunali europei gli accusati venivano minacciati o torturati.\\nPer questo motivo alcune persone confessavano qualunque cosa pur di far terminare il processo.\\nGli storici ritengono inoltre che molte idee sul volo delle streghe fossero già diffuse nella cultura dell’epoca.\\nÈ possibile che gli inquisitori suggerissero inconsapevolmente alcune immagini durante gli interrogatori, oppure che gli accusati ripetessero racconti popolari già conosciuti.\\nPer questo motivo il caso di Matteuccia è importante non tanto perché dimostrerebbe l’esistenza della magia, ma perché ci mostra come funzionava la giustizia nel Quattrocento e quali paure fossero presenti nella società.\\n\\n🌍 Curiosità\\n📖 La formula magica\\nNegli atti del processo compare una breve formula che Matteuccia avrebbe pronunciato prima del volo.\\nÈ uno dei più antichi testi italiani collegati alla stregoneria arrivati fino a noi.\\nGli studiosi lo analizzano oggi come documento linguistico e storico.\\n\\n🌿 Guaritrice o strega?\\nNel Medioevo il confine tra medicina popolare, superstizione e magia era spesso poco chiaro.\\nMolte persone che preparavano rimedi naturali potevano essere rispettate da alcuni e temute da altri.\\n\\n⚖️ Un documento prezioso\\nIl processo di Matteuccia è uno dei documenti più importanti per comprendere la nascita dell’immagine della strega nell’Italia del Quattrocento.\\n\\n💬 Hai capito?\\nChi era Matteuccia?\\nPerché molte persone si rivolgevano a lei?\\nChe cosa racconta la confessione?\\nPerché gli storici non la considerano una prova affidabile?\\nChe cosa ci insegna questo processo?\\nPerché il caso di Matteuccia è ancora studiato oggi?\\n\\n✅ Vero o falso?\\nMatteuccia visse nel Quindicesimo secolo.\\nEra conosciuta per l’uso delle erbe medicinali.\\nGli storici credono che la confessione dimostri l’esistenza della magia.\\nIl processo è documentato da fonti storiche.\\nNel Medioevo gli interrogatori erano identici a quelli moderni.\\nIl caso di Matteuccia è ancora studiato dagli storici.\\n\\n📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel 1428 Matteuccia __________ davanti al tribunale.\\n (comparire)\\nMolte persone __________ da lei per chiedere aiuto.\\n (andare)\\nGli storici __________ ancora oggi questo processo.\\n (studiare)\\nDurante il Medioevo molti abitanti __________ alle streghe.\\n (credere)\\nMatteuccia __________ rimedi con le erbe.\\n (preparare)\\nTu __________ mai sentito parlare di questo processo?\\n (avere)\\n\\n📜 Documento storico\\nNegli atti del processo compare questa frase, attribuita a Matteuccia:\\n«Unguento, unguento, mandami al noce di Benevento, sopra l’acqua e sopra il vento, e sopra ogni altro maltempo.»\\nQuesta è una delle testimonianze più celebri della stregoneria italiana.\\nGli storici ricordano però che non sappiamo se queste parole siano state davvero pronunciate da Matteuccia o se siano state registrate sotto pressione durante gli interrogatori.\\n\\n⭐ Curiosità finale\\nIl processo di Matteuccia avvenne quasi settant’anni prima che il fenomeno delle grandi cacce alle streghe raggiungesse il suo apice in molte regioni d’Europa.\\nPer questo motivo è considerato uno dei casi più antichi e importanti della storia della stregoneria italiana.\\n➡️ Nella prossima lezione entreremo nelle case delle Janare di Benevento e leggeremo alcune testimonianze raccolte tra il Seicento e l’Ottocento da persone convinte di averle incontrate durante la notte.\"},{\"it\":\"il tribunale\",\"other\":\"court\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6724,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6725\"},{\"it\":\"il processo\",\"other\":\"trial\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6725,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6726\"},{\"it\":\"l’unguento\",\"other\":\"ointment\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6726,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6727\"},{\"it\":\"il caprone\",\"other\":\"he-goat\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6727,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6728\"},{\"it\":\"la scopa\",\"other\":\"broom\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6728,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6729\"},{\"it\":\"la formula magica\",\"other\":\"magical formula\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6729,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6730\"},{\"it\":\"la confessione\",\"other\":\"confession\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6730,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6731\"},{\"it\":\"l’accusato\",\"other\":\"accused person\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6731,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6732\"},{\"it\":\"il rogo\",\"other\":\"stake\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6732,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6733\"},{\"it\":\"il manoscritto\",\"other\":\"manuscript\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6733,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6734\"},{\"it\":\"Chi era Matteuccia?\",\"other\":\"Who was Matteuccia?\\n\\nSuggested response based on the reading: Matteuccia di Francesco, a woman from Todi who knew medicinal herbs and prepared remedies; she was tried in 1428.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6777,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6778\"},{\"it\":\"Perché molte persone si rivolgevano a lei?\",\"other\":\"Why did many people turn to her?\\n\\nSuggested response based on the reading: For remedies and help with illnesses, particularly when no doctor was nearby.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6778,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6779\"},{\"it\":\"Che cosa racconta la confessione?\",\"other\":\"What does the confession describe?\\n\\nSuggested response based on the reading: An ointment, a magical formula and a supposed night flight on a he-goat to meet other witches; these are recorded allegations, not proven events.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6779,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6780\"},{\"it\":\"Perché gli storici non la considerano una prova affidabile?\",\"other\":\"Why do historians not consider it reliable evidence?\\n\\nSuggested response based on the reading: Interrogations could involve pressure or torture, and confessions could repeat existing stories or suggestions.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6780,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6781\"},{\"it\":\"Che cosa ci insegna questo processo?\",\"other\":\"What does this trial teach us?\\n\\nSuggested response based on the reading: How justice worked in the fifteenth century and what fears existed in society, not that magic existed.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6781,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6782\"},{\"it\":\"Perché il caso di Matteuccia è ancora studiato oggi?\",\"other\":\"Why is Matteuccia’s case still studied today?\\n\\nSuggested response based on the reading: It is an early documented case, important for the history of trials, beliefs and the developing image of the witch.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6782,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6783\"},{\"it\":\"Matteuccia visse nel Quindicesimo secolo.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6785,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6786\"},{\"it\":\"Era conosciuta per l’uso delle erbe medicinali.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6786,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6787\"},{\"it\":\"Gli storici credono che la confessione dimostri l’esistenza della magia.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6787,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6788\"},{\"it\":\"Il processo è documentato da fonti storiche.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6788,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6789\"},{\"it\":\"Nel Medioevo gli interrogatori erano identici a quelli moderni.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6789,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6790\"},{\"it\":\"Il caso di Matteuccia è ancora studiato dagli storici.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6790,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6791\"},{\"it\":\"📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel 1428 Matteuccia __________ davanti al tribunale.\\n (comparire)\\nMolte persone __________ da lei per chiedere aiuto.\\n (andare)\\nGli storici __________ ancora oggi questo processo.\\n (studiare)\\nDurante il Medioevo molti abitanti __________ alle streghe.\\n (credere)\\nMatteuccia __________ rimedi con le erbe.\\n (preparare)\\nTu __________ mai sentito parlare di questo processo?\\n (avere)\\n\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-08\",\"sourceParagraph\":6792,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6793\"},{\"it\":\"Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-09\",\"sourceParagraph\":6811,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6812\",\"sourceText\":\"🧙 Le Grandi Leggende delle Streghe Italiane\\nParte 3 – Le Janare di Benevento: le streghe che entravano nelle case\\nNota storica\\n\\nLe Janare appartengono al folclore della Campania, soprattutto della zona di Benevento. Le storie che seguono provengono da racconti popolari tramandati per secoli e da testimonianze raccolte tra il Seicento e l’Ottocento. Non esistono prove storiche che gli eventi soprannaturali descritti siano realmente accaduti.\\n\\n🌞 Prima di leggere\\nVocabolario\\n🏠 la soglia = doorstep\\n🧹 la scopa = broom\\n🧂 il sale = salt\\n🛏️ il letto = bed\\n😱 la paralisi = paralysis\\n🌙 l’incubo = nightmare\\n🔑 la serratura = lock\\n🚪 la porta = door\\n👣 l’impronta = footprint\\n🌑 il buio = darkness\\n\\n📖 «La Janara è entrata in casa»\\nNel Settecento un contadino della provincia di Benevento raccontò una storia che sarebbe stata ripetuta per generazioni.\\nUna sera chiuse bene porte e finestre.\\nPrima di andare a dormire, sua moglie lasciò una scopa davanti all’ingresso della casa.\\nEra un gesto che molte famiglie facevano quasi automaticamente.\\nSecondo la tradizione, se durante la notte fosse arrivata una Janara, sarebbe stata costretta a fermarsi per contare tutti i fili della scopa.\\nIl contadino rise.\\nDisse che erano soltanto superstizioni.\\nQuella notte, però, accadde qualcosa che lo spaventò.\\nSi svegliò all’improvviso.\\nLa stanza era silenziosa.\\nSentiva chiaramente qualcuno camminare vicino al letto.\\nProvò ad alzarsi.\\nNon ci riuscì.\\nTentò di gridare.\\nNessun suono uscì dalla sua bocca.\\nRaccontò di aver visto una figura femminile vicino alla finestra.\\nPochi istanti dopo tutto scomparve.\\nLa mattina seguente disse ai vicini:\\n«La Janara è entrata in casa.»\\nDa quel giorno nessuno della famiglia dimenticò più di lasciare la scopa davanti alla porta.\\n\\n📖 Il sale sul pavimento\\nIn un altro paese della Campania circolava una storia simile.\\nUna donna anziana sosteneva che una Janara cercasse spesso di entrare nella sua casa.\\nUn vicino le consigliò un rimedio molto semplice.\\n«Lascia cadere un pugno di sale davanti alla porta.»\\nSecondo la credenza popolare, la Janara avrebbe dovuto raccogliere o contare tutti i granelli di sale uno per uno.\\nLa donna raccontò che, il mattino seguente, il sale era ancora sul pavimento ma nessuno aveva aperto la porta durante la notte.\\nPer lei quella era la prova che il rimedio aveva funzionato.\\nOggi gli storici interpretano racconti come questo come esempi di tradizioni popolari tramandate oralmente per secoli.\\n\\n📖 Una spiegazione moderna\\nMolte testimonianze sulle Janare hanno un elemento in comune.\\nLe persone raccontavano di:\\nsvegliarsi improvvisamente;\\nnon riuscire a muoversi;\\nsentire una presenza nella stanza;\\navere paura;\\nvedere figure oscure.\\nOggi la medicina conosce un fenomeno chiamato paralisi del sonno.\\nDurante questo episodio una persona può essere cosciente ma incapace di muoversi per alcuni secondi o minuti.\\nAlcune persone riferiscono anche allucinazioni molto realistiche.\\nMolti studiosi ritengono che almeno una parte delle antiche storie sulle Janare possa essere spiegata in questo modo.\\nNaturalmente non possiamo sapere che cosa abbiano realmente vissuto le persone che raccontarono queste esperienze secoli fa.\\n\\n🌍 Curiosità\\n🧹 Perché proprio una scopa?\\nIn molte tradizioni europee si pensava che alcuni spiriti o esseri soprannaturali fossero ossessionati dal contare.\\nLasciare una scopa davanti alla porta significava costringerli a contare tutti i fili di saggina prima di entrare.\\nCon l’arrivo dell’alba sarebbero stati costretti ad andarsene.\\nQuesta credenza esiste, con alcune varianti, anche in altri Paesi europei.\\n\\n🧂 Il sale\\nIl sale era considerato un simbolo di protezione molto prima del Cristianesimo.\\nPer questo motivo compare in moltissime superstizioni italiane.\\n\\n👵 Le Janare oggi\\nAncora oggi, soprattutto nella zona di Benevento, la figura della Janara è presente nella cultura locale.\\nEsistono:\\n🧙 statue\\n🎭 festival\\n📚 libri\\n🍷 prodotti tipici che richiamano questa antica leggenda.\\n\\n💬 Hai capito?\\nPerché alcune famiglie lasciavano una scopa davanti alla porta?\\nChe cosa raccontò il contadino dopo quella notte?\\nQuale rimedio consigliò il vicino alla donna anziana?\\nChe cos’è la paralisi del sonno?\\nPerché gli studiosi collegano questo fenomeno alle Janare?\\nLe Janare fanno ancora parte della cultura campana?\\n\\n✅ Vero o falso?\\nIl contadino era convinto dell’esistenza delle Janare fin dall’inizio.\\nSecondo la leggenda, la Janara doveva contare i fili della scopa.\\nAlcune persone usavano il sale come protezione.\\nLa medicina moderna conosce la paralisi del sonno.\\nTutte le testimonianze dimostrano che le Janare esistevano davvero.\\nLa leggenda è ancora conosciuta oggi.\\n\\n📜 Testimonianza popolare\\nLo scrittore e folklorista Giuseppe Pitrè (1841–1916), che raccolse numerose tradizioni popolari italiane, riportò vari racconti in cui le persone descrivevano esseri notturni capaci di entrare nelle case e immobilizzare chi dormiva. Racconti simili erano diffusi anche in Campania e contribuirono alla fama delle Janare.\\nGli studiosi considerano queste testimonianze preziose per capire le credenze popolari dell’epoca, non come prove dell’esistenza di fenomeni soprannaturali.\\n\\n⭐ Curiosità finale\\nLa leggenda delle Janare è sorprendentemente simile a racconti presenti in molte altre culture.\\nIn Scandinavia si parlava della Mara, uno spirito che si sedeva sul petto delle persone addormentate.\\nIn Terranova (Canada) si raccontava della Old Hag.\\nIn Giappone esistono racconti di spiriti notturni che immobilizzano chi dorme.\\nOggi molti ricercatori ritengono che tutte queste storie possano essere collegate allo stesso fenomeno: la paralisi del sonno, interpretata in modi diversi dalle varie culture.\\n➡️ Nella prossima lezione saliremo tra le montagne del Piemonte per conoscere le misteriose Masche, donne che, secondo le leggende, potevano trasformarsi in animali e lanciare maledizioni.\"},{\"it\":\"la soglia\",\"other\":\"doorstep\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-09\",\"sourceParagraph\":6819,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6820\"},{\"it\":\"la scopa\",\"other\":\"broom\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-09\",\"sourceParagraph\":6820,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6821\"},{\"it\":\"il sale\",\"other\":\"salt\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-09\",\"sourceParagraph\":6821,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6822\"},{\"it\":\"il letto\",\"other\":\"bed\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-09\",\"sourceParagraph\":6822,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6823\"},{\"it\":\"la paralisi\",\"other\":\"paralysis\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-09\",\"sourceParagraph\":6823,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6824\"},{\"it\":\"l’incubo\",\"other\":\"nightmare\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-09\",\"sourceParagraph\":6824,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6825\"},{\"it\":\"la serratura\",\"other\":\"lock\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-09\",\"sourceParagraph\":6825,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6826\"},{\"it\":\"la porta\",\"other\":\"door\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-09\",\"sourceParagraph\":6826,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6827\"},{\"it\":\"l’impronta\",\"other\":\"footprint\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-09\",\"sourceParagraph\":6827,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6828\"},{\"it\":\"il buio\",\"other\":\"darkness\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-09\",\"sourceParagraph\":6828,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6829\"},{\"it\":\"Perché alcune famiglie lasciavano una scopa davanti alla porta?\",\"other\":\"Why did some families leave a broom at the door?\\n\\nSuggested response based on the reading: According to the legend, a Janara would have to count every broom bristle, delaying her until dawn.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-09\",\"sourceParagraph\":6896,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6897\"},{\"it\":\"Che cosa raccontò il contadino dopo quella notte?\",\"other\":\"What did the farmer say after that night?\\n\\nSuggested response based on the reading: That a Janara had entered his house: he reported a presence, inability to move or speak and a female figure.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-09\",\"sourceParagraph\":6897,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6898\"},{\"it\":\"Quale rimedio consigliò il vicino alla donna anziana?\",\"other\":\"What remedy did the neighbour suggest to the elderly woman?\\n\\nSuggested response based on the reading: To scatter a handful of salt in front of the door, supposedly forcing the Janara to count the grains.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-09\",\"sourceParagraph\":6898,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6899\"},{\"it\":\"Che cos’è la paralisi del sonno?\",\"other\":\"What is sleep paralysis?\\n\\nSuggested response based on the reading: In the reading, a state in which someone is conscious but briefly unable to move, sometimes with vivid hallucinations.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-09\",\"sourceParagraph\":6899,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6900\"},{\"it\":\"Perché gli studiosi collegano questo fenomeno alle Janare?\",\"other\":\"Why do researchers connect this phenomenon with the Janare?\\n\\nSuggested response based on the reading: The reported immobility, fear, sensed presence and dark figures resemble some sleep-paralysis experiences; this is an interpretation, not proof about each old account.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-09\",\"sourceParagraph\":6900,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6901\"},{\"it\":\"Le Janare fanno ancora parte della cultura campana?\",\"other\":\"Are the Janare still part of Campanian culture?\\n\\nSuggested response based on the reading: Yes: the reading mentions statues, festivals, books and local products, especially around Benevento.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-09\",\"sourceParagraph\":6901,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6902\"},{\"it\":\"Il contadino era convinto dell’esistenza delle Janare fin dall’inizio.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-09\",\"sourceParagraph\":6904,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6905\"},{\"it\":\"Secondo la leggenda, la Janara doveva contare i fili della scopa.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-09\",\"sourceParagraph\":6905,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6906\"},{\"it\":\"Alcune persone usavano il sale come protezione.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-09\",\"sourceParagraph\":6906,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6907\"},{\"it\":\"La medicina moderna conosce la paralisi del sonno.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-09\",\"sourceParagraph\":6907,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6908\"},{\"it\":\"Tutte le testimonianze dimostrano che le Janare esistevano davvero.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-09\",\"sourceParagraph\":6908,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6909\"},{\"it\":\"La leggenda è ancora conosciuta oggi.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-09\",\"sourceParagraph\":6909,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6910\"},{\"it\":\"Parte 4 – Le Masche del Piemonte: donne, animali e misteri\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-10\",\"sourceParagraph\":6922,\"note\":\"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6923\",\"sourceText\":\"🧙 Le Grandi Leggende delle Streghe Italiane\\nParte 4 – Le Masche del Piemonte: donne, animali e misteri\\nNota storica\\n\\nLe Masche appartengono al folclore del Piemonte, soprattutto delle province di Cuneo, Asti e Torino. I racconti che seguono furono tramandati oralmente per secoli e vennero raccolti da studiosi del folclore tra il XIX e il XX secolo. Non esistono prove storiche che i fenomeni soprannaturali descritti siano realmente avvenuti.\\n\\n🌞 Prima di leggere\\nVocabolario\\n🐈 il gatto = cat\\n🐺 il lupo = wolf\\n🌫️ la nebbia = fog\\n🌾 il raccolto = harvest\\n🥛 il latte = milk\\n🐄 il bestiame = livestock\\n🪄 la maledizione = curse\\n🌲 il bosco = forest\\n👵 l’anziana = elderly woman\\n🔥 il camino = fireplace\\n\\n📖 Il gatto della signora Caterina\\nPer molti anni, in un piccolo villaggio delle Langhe, si raccontò una storia che quasi tutti conoscevano.\\nAi margini del paese viveva una donna anziana chiamata Caterina.\\nEra vedova.\\nViveva da sola.\\nConosceva molte erbe medicinali e trascorreva gran parte del tempo nel suo orto.\\nAlcuni abitanti la rispettavano.\\nAltri, invece, la evitavano.\\nDicevano che fosse una Masca.\\nOgni sera, raccontavano i bambini del paese, un grosso gatto nero usciva dalla sua casa e spariva nel bosco.\\nUna notte tre giovani decisero di seguirlo.\\nCamminarono per quasi un’ora.\\nIl gatto sembrava aspettarli.\\nPoi sparì dietro alcuni alberi.\\nUno dei ragazzi raccontò di avergli lanciato un sasso.\\nSentì un miagolio.\\nPoi più nulla.\\nLa mattina seguente Caterina uscì di casa zoppicando.\\nAveva una fasciatura sulla gamba.\\nPer molti abitanti quella era la prova.\\nDicevano:\\n«Il gatto e Caterina sono la stessa persona.»\\nLa storia si diffuse rapidamente.\\nAnche chi non aveva visto nulla iniziò a raccontarla.\\nCon il passare degli anni nacquero decine di versioni diverse.\\n\\n📖 Il latte scomparso\\nUn’altra storia veniva raccontata nelle campagne piemontesi.\\nOgni mattina un allevatore trovava le sue mucche strane.\\nErano nervose.\\nProducevano molto meno latte del solito.\\nL’uomo non riusciva a capirne il motivo.\\nUna sera decise di nascondersi nella stalla.\\nAspettò tutta la notte.\\nIl giorno dopo raccontò di aver visto una donna entrare nel cortile.\\nDisse che la donna parlò sottovoce agli animali.\\nPoi scomparve nel buio.\\nDa quel momento molti abitanti del villaggio credettero che una Masca stesse lanciando una maledizione sul bestiame.\\nOggi gli storici ritengono che racconti come questo riflettano le difficoltà della vita contadina.\\nQuando una malattia colpiva gli animali e nessuno ne conosceva la causa, era naturale cercare una spiegazione.\\n\\n📖 La nebbia delle Langhe\\nLe colline piemontesi sono spesso avvolte dalla nebbia.\\nPer secoli i viandanti raccontarono di essersi persi durante il cammino.\\nAlcuni dicevano di aver visto una donna camminare davanti a loro.\\nLa seguivano.\\nMa dopo pochi minuti la figura spariva.\\nMolti erano convinti che fosse una Masca.\\nSecondo gli studiosi, la nebbia, l’oscurità e la fatica potevano facilmente creare illusioni o errori di orientamento.\\nMa, per chi viveva trecento anni fa, il mistero sembrava molto più convincente di una spiegazione naturale.\\n\\n🌍 Curiosità\\n🐈 Le Masche si trasformavano davvero?\\nSecondo il folclore piemontese, le Masche potevano assumere l’aspetto di:\\n🐈 gatti\\n🐺 lupi\\n🐇 lepri\\n🦉 gufi\\nGli storici considerano queste trasformazioni elementi tipici delle leggende europee.\\nRacconti simili esistono anche in Francia, Germania e Svizzera.\\n\\n🌫️ La nebbia\\nLa Pianura Padana e le colline piemontesi sono famose per la nebbia autunnale.\\nIn passato era facile perdere l’orientamento.\\nQuesto contribuì probabilmente alla nascita di molte storie misteriose.\\n\\n🌿 Le guaritrici\\nCome in molte altre regioni italiane, alcune donne conoscevano le proprietà delle erbe medicinali.\\nLa popolazione poteva considerarle persone molto sagge oppure temerle.\\nSpesso bastava una cattiva reputazione perché nascessero nuove leggende.\\n\\n📜 Una testimonianza raccolta dagli studiosi\\nTra la fine dell’Ottocento e l’inizio del Novecento diversi studiosi di tradizioni popolari piemontesi raccolsero racconti secondo cui alcune Masche erano capaci di trasformarsi in animali durante la notte.\\nQueste testimonianze venivano tramandate oralmente e cambiavano da paese a paese.\\nGli antropologi le studiano oggi come esempi della cultura contadina e dell’immaginazione popolare.\\n\\n⭐ Curiosità finale\\nNelle Langhe esiste ancora un proverbio:\\n“Di notte non tutto è come sembra.”\\nNon sappiamo quando sia nato.\\nForse non parlava davvero delle Masche.\\nMa descrive perfettamente l’atmosfera delle campagne piemontesi nelle fredde notti di nebbia.\\nMolte persone, tornando a casa dopo il tramonto, vedevano forme indistinte tra gli alberi.\\nAlcuni pensavano fossero animali.\\nAltri erano convinti di aver incontrato una Masca.\\nOggi sappiamo che la nebbia può ingannare facilmente i nostri occhi.\\nMa proprio questi racconti rendono il folclore piemontese uno dei più ricchi e affascinanti d’Italia.\\n➡️ Nell’ultima lezione visiteremo Triora, il “paese delle streghe”, dove un vero processo del XVI secolo trasformò un piccolo borgo ligure in uno dei luoghi più misteriosi d’Europa.\"},{\"it\":\"il gatto\",\"other\":\"cat\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-10\",\"sourceParagraph\":6930,\"note\":\"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6931\"},{\"it\":\"il lupo\",\"other\":\"wolf\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-10\",\"sourceParagraph\":6931,\"note\":\"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6932\"},{\"it\":\"la nebbia\",\"other\":\"fog\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-10\",\"sourceParagraph\":6932,\"note\":\"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6933\"},{\"it\":\"il raccolto\",\"other\":\"harvest\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-10\",\"sourceParagraph\":6933,\"note\":\"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6934\"},{\"it\":\"il latte\",\"other\":\"milk\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-10\",\"sourceParagraph\":6934,\"note\":\"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6935\"},{\"it\":\"il bestiame\",\"other\":\"livestock\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-10\",\"sourceParagraph\":6935,\"note\":\"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6936\"},{\"it\":\"la maledizione\",\"other\":\"curse\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-10\",\"sourceParagraph\":6936,\"note\":\"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6937\"},{\"it\":\"il bosco\",\"other\":\"forest\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-10\",\"sourceParagraph\":6937,\"note\":\"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6938\"},{\"it\":\"l’anziana\",\"other\":\"elderly woman\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-10\",\"sourceParagraph\":6938,\"note\":\"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6939\"},{\"it\":\"il camino\",\"other\":\"fireplace\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-10\",\"sourceParagraph\":6939,\"note\":\"Liam · Lettura · Parte 4 – Le Masche del Piemonte: donne, animali e misteri · DOCX paragraph 6940\"},{\"it\":\"Parte 5 – Triora: il paese delle streghe\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-11\",\"sourceParagraph\":7029,\"note\":\"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7030\",\"sourceText\":\"🧙 Le Grandi Leggende delle Streghe Italiane\\nParte 5 – Triora: il paese delle streghe\\nNota storica\\n\\nTra il 1587 e il 1589 il piccolo borgo ligure di Triora fu teatro di uno dei più celebri processi per stregoneria della storia italiana. I fatti principali – la carestia, le indagini e i processi – sono documentati da fonti storiche. Le presunte attività delle streghe, invece, appartengono alle accuse dell’epoca e alle leggende nate successivamente.\\n\\n🌞 Prima di leggere\\nVocabolario\\n🏰 il borgo = village\\n🌾 la carestia = famine\\n🍞 il raccolto = harvest\\n⚖️ il processo = trial\\n👩‍⚖️ il magistrato = magistrate\\n⛓️ la prigione = prison\\n🗣️ la diceria = rumor\\n😨 il sospetto = suspicion\\n📜 il verbale = official record\\n👥 la folla = crowd\\n\\n📖 L’inizio della paura\\nTra le montagne della Liguria occidentale si trova Triora, un piccolo borgo medievale costruito su uno sperone di roccia.\\nOggi è un luogo tranquillo, visitato da turisti provenienti da tutto il mondo.\\nPiù di quattrocento anni fa, però, la situazione era molto diversa.\\nNegli anni 1587–1588 la popolazione attraversò un periodo molto difficile.\\nIl raccolto fu scarso.\\nIl prezzo del grano aumentò.\\nMolte famiglie facevano fatica a procurarsi il pane.\\nQuando una comunità vive una crisi così grave, spesso cerca qualcuno da incolpare.\\nA Triora iniziarono a circolare strane voci.\\nAlcuni abitanti dicevano che certe donne si riunissero di notte.\\nAltri sostenevano che praticassero la magia e fossero responsabili della carestia.\\nLe dicerie si diffusero rapidamente.\\nBen presto le autorità decisero di aprire un’inchiesta.\\n\\n📖 Il processo\\nDiversi abitanti del paese furono interrogati.\\nAlcune donne vennero arrestate.\\nI verbali raccontano accuse molto diverse tra loro.\\nC’era chi affermava di aver visto riunioni notturne.\\nChi sosteneva che alcune persone avessero lanciato maledizioni.\\nChi raccontava di animali misteriosi e di strani rumori nei boschi.\\nCome accadeva spesso nei processi dell’epoca, molte testimonianze si basavano su racconti sentiti da altri e non su fatti osservati direttamente.\\nIn alcuni casi gli interrogatori furono accompagnati dalla tortura.\\nPer questo motivo gli storici ritengono che molte confessioni non possano essere considerate attendibili.\\nNonostante ciò, il processo continuò per mesi.\\nAlcuni imputati morirono durante la prigionia.\\nAltri vennero trasferiti a Genova per ulteriori interrogatori.\\n\\n📖 La nascita della leggenda\\nCon il passare del tempo il processo terminò.\\nMa la storia non fu dimenticata.\\nAnzi.\\nOgni generazione aggiunse nuovi particolari.\\nSi iniziò a raccontare che le streghe si incontrassero nei boschi.\\nChe preparassero pozioni misteriose.\\nChe evocassero spiriti durante la notte.\\nMolte di queste storie non compaiono nei documenti del processo.\\nNacquero molto tempo dopo.\\nCosì la storia reale e il folclore finirono per mescolarsi.\\nÈ proprio questo che rende Triora così affascinante.\\n\\n🌍 Triora oggi\\nPasseggiando per il paese si incontrano ancora:\\n🧙 statue dedicate alle streghe.\\n🏛️ il Museo Regionale Etnografico e della Stregoneria, che racconta la storia dei processi e delle tradizioni popolari.\\n🪨 antichi vicoli medievali.\\n🏰 case in pietra quasi immutate da secoli.\\nOgni anno molti visitatori arrivano per conoscere la vera storia di Triora e distinguere i fatti documentati dalle leggende.\\n\\n🌍 Curiosità\\n🏰 La Salem italiana?\\nTriora viene spesso chiamata “la Salem d’Italia”.\\nIl paragone nasce perché entrambe le località sono famose per i processi alle streghe.\\nTuttavia i fatti avvennero in epoche diverse: quelli di Triora si svolsero alla fine del Cinquecento, mentre i celebri processi di Salem, nel Massachusetts, risalgono al 1692.\\n\\n📚 Un museo dedicato alla storia\\nIl museo di Triora non cerca di dimostrare l’esistenza delle streghe.\\nEspone invece documenti, oggetti e ricostruzioni che aiutano a comprendere la mentalità dell’epoca e le cause storiche dei processi.\\n\\n🌫️ Un paese perfetto per una leggenda\\nTriora è circondata da boschi e montagne.\\nQuando arriva la nebbia, il borgo assume un’atmosfera molto suggestiva.\\nMolti scrittori e registi hanno scelto questo luogo come ambientazione per racconti misteriosi.\\n\\n📜 Documento storico\\nNegli archivi sono conservati i verbali originali dei processi di Triora.\\nEssi mostrano che molte accuse nacquero durante un periodo di grave crisi economica e alimentare.\\nPer gli storici questi documenti rappresentano una testimonianza preziosa del modo in cui paura, fame e tensioni sociali possano influenzare il comportamento di una comunità.\\n\\n⭐ Conclusione dell’Unità\\nAbbiamo viaggiato attraverso cinque delle storie più famose della stregoneria italiana.\\nAbbiamo conosciuto il misterioso Noce di Benevento, il processo di Matteuccia di Todi, le inquietanti Janare, le enigmatiche Masche del Piemonte e, infine, il borgo di Triora.\\nIn ogni lezione abbiamo scoperto che dietro le leggende si nascondono persone reali, documenti storici, paure collettive e tradizioni tramandate per secoli.\\nForse il vero mistero non è capire se le streghe siano mai esistite.\\nIl vero mistero è comprendere perché, in epoche e luoghi diversi, così tante persone abbiano creduto alle stesse storie.\\nEd è proprio questo che rende il folclore una finestra straordinaria sulla storia, sull’antropologia e sulla natura umana.\"},{\"it\":\"il borgo\",\"other\":\"village\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-11\",\"sourceParagraph\":7037,\"note\":\"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7038\"},{\"it\":\"la carestia\",\"other\":\"famine\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-11\",\"sourceParagraph\":7038,\"note\":\"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7039\"},{\"it\":\"il raccolto\",\"other\":\"harvest\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-11\",\"sourceParagraph\":7039,\"note\":\"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7040\"},{\"it\":\"il processo\",\"other\":\"trial\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-11\",\"sourceParagraph\":7040,\"note\":\"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7041\"},{\"it\":\"il magistrato\",\"other\":\"magistrate\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-11\",\"sourceParagraph\":7041,\"note\":\"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7042\"},{\"it\":\"la prigione\",\"other\":\"prison\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-11\",\"sourceParagraph\":7042,\"note\":\"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7043\"},{\"it\":\"la diceria\",\"other\":\"rumor\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-11\",\"sourceParagraph\":7043,\"note\":\"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7044\"},{\"it\":\"il sospetto\",\"other\":\"suspicion\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-11\",\"sourceParagraph\":7044,\"note\":\"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7045\"},{\"it\":\"il verbale\",\"other\":\"official record\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-11\",\"sourceParagraph\":7045,\"note\":\"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7046\"},{\"it\":\"la folla\",\"other\":\"crowd\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-11\",\"sourceParagraph\":7046,\"note\":\"Liam · Lettura · Parte 5 – Triora: il paese delle streghe · DOCX paragraph 7047\"},{\"it\":\"Parte 6 – I luoghi più misteriosi d’Italia\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-12\",\"sourceParagraph\":7125,\"note\":\"Liam · Lettura · Parte 6 – I luoghi più misteriosi d’Italia · DOCX paragraph 7126\",\"sourceText\":\"🧙 Le Grandi Leggende delle Streghe Italiane\\nParte 6 – I luoghi più misteriosi d’Italia\\nNota storica\\n\\nI luoghi descritti in questa lezione esistono realmente. Le leggende che li riguardano fanno parte del patrimonio culturale italiano. Alcune si basano su eventi storici, altre su racconti popolari tramandati per secoli. Gli elementi soprannaturali non sono confermati da prove storiche.\\n\\n🌊 1. Il Lago di Pilato (Marche)\\nTra le montagne dei Monti Sibillini, a oltre 1.900 metri di altitudine, si trova uno dei laghi più misteriosi d’Italia.\\nSecondo una leggenda medievale, dopo la morte di Ponzio Pilato, il governatore romano che autorizzò la crocifissione di Gesù, il suo corpo fu caricato su un carro trainato da buoi.\\nGli animali, impazziti, avrebbero percorso montagne e vallate fino a precipitare nel lago.\\nDa quel momento il luogo sarebbe stato maledetto.\\nNel Medioevo molti credevano che maghi e negromanti raggiungessero il lago durante la notte per evocare demoni e imparare formule magiche.\\nLe autorità dell’epoca presero queste storie molto sul serio.\\nIn alcuni periodi fu addirittura vietato avvicinarsi al lago.\\nOggi gli storici ritengono che queste leggende siano nate dall’isolamento del luogo e dal fascino che il lago esercitava sui viaggiatori medievali.\\n\\n⛰️ 2. La Grotta della Sibilla\\nSempre nei Monti Sibillini si trova un’altra delle grandi leggende italiane.\\nPer oltre settecento anni i viaggiatori raccontarono dell’esistenza di una grotta nascosta nella montagna.\\nLì avrebbe vissuto la Sibilla Appenninica, una donna dotata di poteri straordinari.\\nSecondo alcuni racconti era una profetessa.\\nSecondo altri era una fata.\\nAltri ancora la descrivevano come una potente maga.\\nNel XV secolo il cavaliere francese Antoine de La Sale scrisse un celebre racconto di viaggio nel quale descrisse la montagna e riportò le storie ascoltate dagli abitanti.\\nAncora oggi migliaia di escursionisti percorrono i sentieri del Monte Sibilla per raggiungere l’ingresso della grotta.\\n\\n🌲 3. Il Bosco del Cansiglio\\nTra Veneto e Friuli-Venezia Giulia si estende il grande Bosco del Cansiglio.\\nPer secoli i boscaioli raccontarono di udire voci tra gli alberi durante la notte.\\nAlcuni sostenevano di vedere piccole luci muoversi nel bosco.\\nAltri parlavano di donne misteriose vestite di bianco.\\nOggi sappiamo che fenomeni naturali, come il vento, gli animali notturni o i giochi di luce, possono creare impressioni molto suggestive.\\nTuttavia il Cansiglio continua ancora oggi a essere uno dei boschi più misteriosi d’Italia.\\n\\n🪨 4. Le incisioni della Val Camonica\\nIn Lombardia, nella Val Camonica, si trovano oltre 140.000 incisioni rupestri, realizzate nell’arco di migliaia di anni.\\nMolte raffigurano uomini armati, animali, scene di caccia e simboli misteriosi.\\nPer secoli gli abitanti pensarono che quei segni fossero stati lasciati da streghe, giganti o creature soprannaturali.\\nSolo nell’Ottocento gli archeologi iniziarono a comprenderne la vera origine.\\nOggi sappiamo che furono incisi da popolazioni preistoriche.\\nLa Val Camonica è stata il primo sito italiano inserito nella lista del Patrimonio Mondiale dell’UNESCO.\\n\\n🌋 5. L’Etna e le streghe\\nAnche il vulcano Etna, in Sicilia, è protagonista di numerose leggende.\\nAlcuni racconti popolari narrano che, durante le notti di tempesta, le streghe si riunissero sulle sue pendici.\\nAltri sostenevano di vedere strane luci tra la lava.\\nOggi sappiamo che molte di queste luci possono essere spiegate dai fenomeni vulcanici.\\nMa il vulcano continua ad alimentare l’immaginazione di chi lo osserva.\\n\\n🌍 Perché questi luoghi sono diventati leggendari?\\nQuasi tutti hanno qualcosa in comune.\\nSono:\\n🌲 isolati.\\n🌫️ avvolti dalla nebbia.\\n🏔️ difficili da raggiungere.\\n🌋 caratterizzati da fenomeni naturali insoliti.\\nNel passato questi ambienti apparivano misteriosi.\\nQuando non esistevano spiegazioni scientifiche, era naturale creare racconti per spiegare ciò che sembrava inspiegabile.\\nPer questo motivo montagne, boschi e laghi sono presenti nelle leggende di quasi tutte le culture del mondo.\\n\\n📜 Un viaggiatore del Quattrocento\\nNel XV secolo molti pellegrini raccontavano di aver sentito dire che il Lago di Pilato fosse un luogo proibito.\\nAlcuni scrivevano di aver visto persone evitare quelle acque anche durante il giorno.\\nNon sappiamo quanto vi fosse di vero.\\nMa sappiamo che la fama del lago era già diffusa in tutta Europa.\\n\\n⭐ Curiosità finali\\n🏔️ Il Monte Sibilla ha dato il nome all’intera catena dei Monti Sibillini.\\n🌊 Il Lago di Pilato è l’unico lago naturale delle Marche.\\n🪨 Le incisioni della Val Camonica raccontano la vita di popolazioni vissute migliaia di anni prima dei Romani.\\n🌲 Il Bosco del Cansiglio è uno dei boschi meglio conservati d’Italia.\\n🧙 Quasi tutte le regioni italiane possiedono almeno una leggenda legata a streghe, fate, spiriti o creature misteriose.\\n\\n🎓 Fine del viaggio\\nAbbiamo visitato processi realmente documentati, antiche leggende, villaggi medievali, montagne, laghi e boschi che hanno alimentato l’immaginazione degli italiani per secoli.\\nLa cosa più interessante è che queste storie ci parlano molto meno della magia e molto di più delle persone.\\nCi raccontano come gli esseri umani affrontavano la paura, cercavano spiegazioni per ciò che non comprendevano e trasformavano gli eventi più misteriosi in racconti destinati a sopravvivere per generazioni.\\nForse è proprio questo il vero incantesimo delle leggende: non quello di cambiare il mondo, ma quello di continuare a farci immaginare.\"},{\"it\":\"Parte 7 – Le streghe nel mondo\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-13\",\"sourceParagraph\":7203,\"note\":\"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7204\",\"sourceText\":\"🧙 Le Grandi Leggende delle Streghe\\nParte 7 – Le streghe nel mondo\\nNota\\n\\nQuasi ogni civiltà della storia ha creato racconti su streghe, maghe, spiriti femminili o esseri soprannaturali. Alcune figure derivano dalla religione, altre dal folclore popolare. In questa lezione scopriremo come culture molto lontane abbiano inventato personaggi sorprendentemente simili.\\n\\n🌍 Perché esistono le streghe in quasi tutte le culture?\\nGli antropologi si sono posti questa domanda per molti anni.\\nCom’è possibile che popoli separati da migliaia di chilometri abbiano inventato storie così simili?\\nSecondo molti studiosi esistono diverse spiegazioni.\\nLe persone avevano paura delle malattie, delle tempeste, della morte e dell’ignoto.\\nQuando non esistevano spiegazioni scientifiche, era naturale attribuire questi eventi a esseri soprannaturali.\\nLe leggende servivano anche a trasmettere insegnamenti.\\nMolte storie mettevano in guardia i bambini dal pericolo di allontanarsi da casa o di entrare nei boschi da soli.\\nAltre spiegavano perché fosse importante rispettare certe regole della comunità.\\nCosì nacquero figure diverse, ma con caratteristiche spesso molto simili.\\n\\n🇷🇺 Baba Jaga\\nUna delle figure più famose del folclore slavo è Baba Jaga.\\nVive in una capanna costruita su enormi zampe di gallina.\\nSecondo le leggende vola dentro un mortaio gigante e usa un pestello per dirigere il volo.\\nA volte aiuta gli eroi.\\nAltre volte li mette alla prova.\\nPuò essere crudele oppure sorprendentemente saggia.\\nPer questo motivo Baba Jaga è molto diversa dall’immagine moderna della strega cattiva.\\n\\n🇷🇴 Gli Strigoi\\nIn Romania esistono gli Strigoi.\\nSecondo il folclore sono spiriti o persone che ritornano dopo la morte.\\nSi diceva che potessero tormentare le famiglie, provocare malattie o portare sfortuna.\\nMolte tradizioni rumene nacquero per proteggere i villaggi da questi esseri.\\nGli studiosi ritengono che queste leggende abbiano influenzato anche il mito moderno dei vampiri.\\n\\n🇬🇷 Lamia\\nNell’antica Grecia si raccontava la storia di Lamia.\\nSecondo il mito era una regina trasformata in mostro.\\nCon il passare dei secoli divenne una creatura che spaventava i bambini e viveva lontano dalle città.\\nIn alcune versioni era un mostro.\\nIn altre una maga.\\nIl suo racconto cambiò molte volte nel corso della storia.\\n\\n🇯🇵 Yamauba\\nTra le montagne del Giappone vive, secondo il folclore, la Yamauba.\\nÈ descritta come una vecchia donna che abita nei boschi.\\nAlcune storie la presentano come un mostro pericoloso.\\nAltre raccontano che aiuti i viaggiatori smarriti.\\nAnche questa figura, come Baba Jaga, non è completamente buona né completamente cattiva.\\n\\n🇫🇷 Le sorcières\\nIn Francia le streghe vengono chiamate sorcières.\\nDurante il Medioevo e l’età moderna molte donne furono accusate di praticare la magia.\\nLe loro storie sono molto simili a quelle italiane.\\nAnche qui gli storici ritengono che paura, superstizione e tensioni sociali abbiano avuto un ruolo importante nelle accuse.\\n\\n🇩🇪 Le Hexen\\nIn Germania le streghe sono chiamate Hexen.\\nLa tradizione tedesca racconta che nella notte del 30 aprile, chiamata Notte di Valpurga (Walpurgisnacht), le streghe si riunissero sul monte Brocken, la cima più alta dei monti Harz.\\nQuesta leggenda è diventata così famosa da ispirare libri, opere teatrali e persino il Faust di Johann Wolfgang von Goethe.\\nAncora oggi in alcune città tedesche si organizzano feste popolari dedicate a questa antica tradizione.\\n\\n🌎 Che cosa hanno in comune?\\nQuasi tutte queste figure:\\n🌙 vivono vicino alla natura.\\n🌲 frequentano boschi o montagne.\\n🌿 conoscono le erbe.\\n🦉 sono attive soprattutto di notte.\\n😨 fanno paura, ma non sempre sono malvagie.\\n📚 raccontano qualcosa delle paure e delle speranze delle persone che le hanno immaginate.\\n\\n🤔 Una domanda per gli antropologi\\nGli studiosi non cercano di capire se queste creature siano realmente esistite.\\nSi chiedono invece:\\nPerché popoli che non si conoscevano hanno inventato storie così simili?\\nForse gli esseri umani, ovunque vivano, condividono le stesse paure.\\nLa notte.\\nI boschi.\\nLe malattie.\\nL’ignoto.\\nPer questo motivo le leggende cambiano nome e lingua, ma spesso raccontano la stessa storia.\\n\\n⭐ Curiosità finali\\n📚 La parola italiana strega deriva dal latino strix.\\n🧙 L’inglese witch deriva dall’antico inglese wicce (forma femminile) e wicca (forma maschile).\\n🇫🇷 In francese sorcière deriva dal latino sortiarius, legato al destino e agli incantesimi.\\n🇩🇪 Il tedesco Hexe deriva da un’antica parola germanica che indicava una figura associata alla magia.\\n🌍 Nonostante le differenze culturali, quasi ogni civiltà ha creato racconti su donne misteriose, maghe o esseri soprannaturali.\\n\\n🎓 Conclusione finale\\nDopo questo viaggio possiamo capire che la figura della strega è molto più complessa di quella che vediamo nelle fiabe.\\nPer alcuni era una guaritrice.\\nPer altri una saggia.\\nPer altri ancora una persona da temere.\\nLe storie cambiano da un Paese all’altro, ma ci insegnano tutte la stessa cosa: ogni società usa le leggende per spiegare ciò che ancora non comprende.\\nEd è proprio per questo che, dopo migliaia di anni, continuiamo ancora a raccontarle.\\n\"},{\"it\":\"La formula attribuita a Matteuccia\",\"other\":\"Ointment, ointment, send me to the walnut tree of Benevento, above the water and above the wind, and above every other bad weather. The reading warns that the words may have been recorded under interrogation pressure.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-08\",\"sourceParagraph\":6803,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6804\",\"sourceExcerpt\":\"«Unguento, unguento, mandami al noce di Benevento, sopra l’acqua e sopra il vento, e sopra ogni altro maltempo.»\"},{\"it\":\"Guaritrice o strega?\",\"other\":\"In the Middle Ages, the boundary between folk medicine, superstition and magic was often unclear. Some respected the women who made natural remedies; others feared them.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-08\",\"sourceParagraph\":6770,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6771\",\"sourceExcerpt\":\"Nel Medioevo il confine tra medicina popolare, superstizione e magia era spesso poco chiaro.\"},{\"it\":\"Gli Strigoi\",\"other\":\"In Romanian folklore, spirits or people said to return after death, trouble families and bring disease or bad luck. The reading links these legends to the modern vampire myth.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-13\",\"sourceParagraph\":7230,\"note\":\"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7231\",\"sourceExcerpt\":\"In Romania esistono gli Strigoi.\"},{\"it\":\"Lamia\",\"other\":\"In the Greek myth presented here, a queen transformed into a monster; later versions describe her as a monster or sorceress who frightened children.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-13\",\"sourceParagraph\":7237,\"note\":\"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7238\",\"sourceExcerpt\":\"Nell’antica Grecia si raccontava la storia di Lamia.\"},{\"it\":\"Yamauba\",\"other\":\"A woman of Japanese mountain folklore, portrayed as a dangerous monster in some stories and a helper of lost travellers in others.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-13\",\"sourceParagraph\":7245,\"note\":\"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7246\",\"sourceExcerpt\":\"Tra le montagne del Giappone vive, secondo il folclore, la Yamauba.\"},{\"it\":\"Le sorcières\",\"other\":\"The French word for witches. The reading associates accusations in France with fear, superstition and social tensions.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-13\",\"sourceParagraph\":7252,\"note\":\"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7253\",\"sourceExcerpt\":\"In Francia le streghe vengono chiamate sorcières.\"},{\"it\":\"Baba Jaga\",\"other\":\"A Slavic folklore figure living in a hut on chicken legs and flying in a mortar with a pestle; she may help or test heroes, and may be cruel or wise.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-13\",\"sourceParagraph\":7221,\"note\":\"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7222\",\"sourceExcerpt\":\"Una delle figure più famose del folclore slavo è Baba Jaga.\"},{\"it\":\"Le Hexen e la Notte di Valpurga\",\"other\":\"Hexen means witches in German. According to the tradition in the reading, they gather on the Brocken on 30 April, Walpurgis Night.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-13\",\"sourceParagraph\":7258,\"note\":\"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7259\",\"sourceExcerpt\":\"In Germania le streghe sono chiamate Hexen.\"},{\"it\":\"Etimologia: strega\",\"other\":\"The reading traces Italian strega to Latin strix, a nocturnal bird associated with unsettling ancient stories.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-13\",\"sourceParagraph\":7284,\"note\":\"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7285\",\"sourceExcerpt\":\"📚 La parola italiana strega deriva dal latino strix.\"},{\"it\":\"Etimologia: witch\",\"other\":\"The reading traces English witch to Old English wicce (feminine) and wicca (masculine).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-13\",\"sourceParagraph\":7285,\"note\":\"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7286\",\"sourceExcerpt\":\"🧙 L’inglese witch deriva dall’antico inglese wicce (forma femminile) e wicca (forma maschile).\"},{\"it\":\"Etimologia: sorcière\",\"other\":\"The reading traces French sorcière to Latin sortiarius, connected with fate and spells.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-13\",\"sourceParagraph\":7286,\"note\":\"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7287\",\"sourceExcerpt\":\"🇫🇷 In francese sorcière deriva dal latino sortiarius, legato al destino e agli incantesimi.\"},{\"it\":\"Etimologia: Hexe\",\"other\":\"The reading traces German Hexe to an old Germanic word denoting a figure associated with magic; it does not supply that older word.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"source-fact\",\"reading\":\"lettura-13\",\"sourceParagraph\":7287,\"note\":\"Liam · Lettura · Parte 7 – Le streghe nel mondo · DOCX paragraph 7288\",\"sourceExcerpt\":\"🇩🇪 Il tedesco Hexe deriva da un’antica parola germanica che indicava una figura associata alla magia.\"}]}\u003c/script>\n\u003cscript>\n'use strict';\nconst READING=JSON.parse(document.getElementById('reading-data').textContent);\nconst $=id=>document.getElementById(id);\nlet selected=0,searchPosition=-1,lastSearch='';\nconst storagePrefix='liam-reading-'+READING.source.sha256+'-';\nfunction element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}\nREADING.sections.forEach((s,i)=>{const o=element('option','',s.title);o.value=i;$('section').appendChild(o)});\nconst questionCount=READING.sections.reduce((n,s)=>n+s.questions.length,0);\n$('counts').textContent=READING.sections.length+' sezioni · '+READING.source.paragraphCount+' paragrafi originali · '+questionCount+' domande · '+READING.cards.length+' carte Liam';\nfunction render(){\n const s=READING.sections[selected];$('section').value=selected;$('title').textContent=s.title;\n $('paragraphs').replaceChildren();s.paragraphs.forEach(p=>{\n  const text=p.text;const cls='paragraph'+(!text.trim()?' empty':'')+(/^[\\p{Extended_Pictographic}\\p{Regional_Indicator}]/u.test(text)||text.startsWith('Parte ')?' heading':'')+(/^\\s*\\/+\\s*$/.test(text)?' separator':'');\n  const e=element('p',cls,text);e.id='source-'+p.index;$('paragraphs').appendChild(e);\n });\n $('questions').replaceChildren();\n if(!s.questions.length)$('questions').appendChild(element('p','','Questa sezione non contiene un blocco “Hai capito?”. Il testo, i documenti e tutti gli altri esercizi restano riportati integralmente a fianco.'));\n s.questions.forEach(q=>{\n  const box=element('section','question');box.appendChild(element('p','',q.prompt));\n  const label=element('label','','La tua risposta in italiano');label.htmlFor='response-'+q.sourceParagraph;box.appendChild(label);\n  const field=element('textarea');field.id=label.htmlFor;field.placeholder='Scrivi qui…';\n  try{field.value=localStorage.getItem(storagePrefix+q.sourceParagraph)||''}catch(e){}\n  field.addEventListener('input',()=>{try{localStorage.setItem(storagePrefix+q.sourceParagraph,field.value);$('save-status').textContent='Risposta salvata solo su questo dispositivo.'}catch(e){$('save-status').textContent='Spazio locale non disponibile: la risposta resta visibile solo in questa sessione.'}});box.appendChild(field);\n  const details=element('details');details.appendChild(element('summary','',q.answer?'English · suggested response':'English · open question'));\n  details.appendChild(element('p','answer',q.translation+'\\n\\n'+(q.answer?'Suggested response based on the reading: '+q.answer:'Open response: there is no single correct answer.')));box.appendChild(details);\n  const link=element('button','source-link','Vedi la domanda nel testo originale');link.type='button';link.addEventListener('click',()=>highlight(q.sourceParagraph));box.appendChild(link);\n  $('questions').appendChild(box);\n });\n $('previous').disabled=selected===0;$('next').disabled=selected===READING.sections.length-1;\n $('status').textContent=(selected+1)+' / '+READING.sections.length+' · DOCX paragrafi '+(s.startParagraph+1)+'–'+(s.endParagraph+1);\n window.scrollTo(0,0);\n}\nfunction highlight(index){document.querySelectorAll('.match').forEach(p=>p.classList.remove('match'));const e=$('source-'+index);if(e){e.classList.add('match');e.scrollIntoView({block:'center'})}}\nfunction find(){const query=$('search').value.trim().toLocaleLowerCase();if(!query)return;\n if(query!==lastSearch){searchPosition=-1;lastSearch=query}\n const matches=[];READING.sections.forEach((s,i)=>s.paragraphs.forEach(p=>{if(p.text.toLocaleLowerCase().includes(query))matches.push({section:i,index:p.index})}));\n if(!matches.length){$('status').textContent='Nessun risultato in tutte le '+READING.sections.length+' sezioni.';return}\n searchPosition=(searchPosition+1)%matches.length;selected=matches[searchPosition].section;render();highlight(matches[searchPosition].index);$('status').textContent='Risultato '+(searchPosition+1)+' / '+matches.length+' · sezione '+(selected+1);\n}\n$('section').addEventListener('change',()=>{selected=Number($('section').value);render()});\n$('previous').addEventListener('click',()=>{if(selected>0){selected--;render();window.scrollTo(0,0)}});\n$('next').addEventListener('click',()=>{if(selected\u003cREADING.sections.length-1){selected++;render();window.scrollTo(0,0)}});\n$('find').addEventListener('click',find);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();find()}});\nrender();\n\u003c/script>\u003c/main>\u003c/body>\u003c/html>\n"</script>
<script>
'use strict';
const keys=["carte","articoli","aggettivi","verbi","lettura"];
const routes={'liam-lettura.html':'lettura','italiano-flashcards.html':'carte','articoli-esercizi.html':'articoli','articoli-aggettivi.html':'aggettivi','verbi-tempi.html':'verbi'};
const ready=new Set();
function activate(key,focus=false){
 if(!keys.includes(key))key='carte';
 keys.forEach(k=>{
  const tab=document.getElementById('tab-'+k),selected=k===key;
  tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;
  document.getElementById('panel-'+k).hidden=!selected;
 });
 const frame=document.getElementById('frame-'+key);
 if(!ready.has(key)){
  ready.add(key);
  frame.addEventListener('load',()=>{
   const doc=frame.contentDocument;
   if(!doc||!doc.querySelector('main'))return;
   if(key==='carte'){
    // Explicit face visibility avoids mirrored backfaces in iOS/WebKit iframe compositing.
    const style=doc.createElement('style');
    style.textContent='.scene .card{transform:none!important;transition:none!important}.scene .face{transform:none!important;backface-visibility:visible!important;-webkit-backface-visibility:visible!important}.scene .back{visibility:hidden}.scene.flipped .front{visibility:hidden}.scene.flipped .back{visibility:visible}';
    doc.head.appendChild(style);
    const select=doc.getElementById('filter');
    const options=Array.from(select.options);
    options.filter(o=>o.value.startsWith('chiara-')).forEach(o=>select.appendChild(o));
    options.filter(o=>!o.value.startsWith('chiara-')).forEach(o=>select.appendChild(o));
    select.value='chiara-23-sett';select.dispatchEvent(new Event('change'));
   }
   doc.addEventListener('click',event=>{
    const link=event.target.closest('a[href]');
    if(!link)return;
    const file=link.getAttribute('href').split('?')[0].split('/').pop();
    if(routes[file]){event.preventDefault();activate(routes[file],true);}
   });
   document.getElementById('loading-'+key).hidden=true;
  });
  frame.srcdoc=JSON.parse(document.getElementById('app-'+key).textContent);
 }
 if(location.hash!=='#'+key)history.replaceState(null,'','#'+key);
 if(focus)document.getElementById('tab-'+key).focus();
}
keys.forEach((key,index)=>{
 const tab=document.getElementById('tab-'+key);
 tab.addEventListener('click',()=>activate(key));
 tab.addEventListener('keydown',event=>{
  let next=index;
  if(event.key==='ArrowRight')next=(index+1)%keys.length;
  else if(event.key==='ArrowLeft')next=(index+keys.length-1)%keys.length;
  else if(event.key==='Home')next=0;
  else if(event.key==='End')next=keys.length-1;
  else return;
  event.preventDefault();activate(keys[next],true);
 });
});
window.addEventListener('hashchange',()=>activate(location.hash.slice(1)));
activate(location.hash.slice(1));
</script>
