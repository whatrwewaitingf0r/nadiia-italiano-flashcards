p\":\"Liam \u00b7 Nord/Sud \u00b7 Liguria\",\"note\":\"Lezione 16 settembre 2026 \u00b7 Viaggio con Liam \u00b7 Unit\u00e0 4 Liguria \u00b7 Nord/Sud\"},{\"it\":\"Presente: come si formano i verbi regolari?\",\"other\":\"parlare: parlo, parli, parla, parliamo, parlate, parlano. prendere: prendo, prendi, prende, prendiamo, prendete, prendono. dormire: dormo, dormi, dorme, dormiamo, dormite, dormono. Match the subject.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Capire, finire, preferire, pulire: dove va -isc-?\",\"other\":\"capisco, capisci, capisce, capiamo, capite, capiscono. Also: finisco, preferisci, pulisce. No -isc- with noi or voi.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Essere e avere: il presente?\",\"other\":\"essere: sono, sei, \u00e8, siamo, siete, sono. avere: ho, hai, ha, abbiamo, avete, hanno. These are also the auxiliaries for passato prossimo.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Andare e venire: il presente?\",\"other\":\"andare: vado, vai, va, andiamo, andate, vanno. venire: vengo, vieni, viene, veniamo, venite, vengono.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Fare e stare: il presente?\",\"other\":\"fare: faccio, fai, fa, facciamo, fate, fanno. stare: sto, stai, sta, stiamo, state, stanno.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Dare e dire: il presente?\",\"other\":\"dare: do, dai, d\u00e0, diamo, date, danno. dire: dico, dici, dice, diciamo, dite, dicono. D\u00e0 needs an accent; do does not.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Potere, volere, dovere: il presente?\",\"other\":\"posso, puoi, pu\u00f2, possiamo, potete, possono. voglio, vuoi, vuole, vogliamo, volete, vogliono. devo, devi, deve, dobbiamo, dovete, devono (also debbo / debbono).\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Sapere, bere, uscire: il presente?\",\"other\":\"so, sai, sa, sappiamo, sapete, sanno. bevo, bevi, beve, beviamo, bevete, bevono. esco, esci, esce, usciamo, uscite, escono.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Passato prossimo: quali due pezzi servono?\",\"other\":\"Present auxiliary + past participle: io ho mangiato; lei \u00e8 partita. Both words belong in the answer. A completed event in the past.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Con avere, il participio cambia in queste frasi?\",\"other\":\"No: io ho mangiato; lei ha mangiato; noi abbiamo mangiato. With a following direct object, keep the participle unchanged. Object-pronoun agreement is a separate rule.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Con essere, come concorda il participio?\",\"other\":\"lui \u00e8 andato; lei \u00e8 andata; loro sono andati (m. / mixed); loro sono andate (all f.). Match the subject in gender and number.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Andare, venire, uscire, arrivare, partire: l\u2019ausiliare?\",\"other\":\"Use essere here: sono andata, \u00e8 venuta, siamo usciti, siete arrivati, sono partite. Not every movement verb takes essere: ho camminato.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Essere e stare: il passato prossimo?\",\"other\":\"essere: sono stato / stata; siamo stati / state. stare: sono stato / stata; siamo stati / state. Both use essere + stato, with subject agreement.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Fare, dire, bere: il participio passato?\",\"other\":\"fare \u2192 fatto; dire \u2192 detto; bere \u2192 bevuto. Examples: ho fatto una passeggiata; hai detto la verit\u00e0; ha bevuto acqua.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Prendere, mettere, vedere: il participio passato?\",\"other\":\"prendere \u2192 preso; mettere \u2192 messo; vedere \u2192 visto (also veduto). Examples: ho preso il treno; ho messo il libro sul tavolo; ho visto un film.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Scrivere, leggere, vivere: il participio passato?\",\"other\":\"scrivere \u2192 scritto; leggere \u2192 letto; vivere \u2192 vissuto. Ho scritto una lettera; ho letto un libro; ho vissuto una bella esperienza. Transitive vivere uses avere.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Potere, volere, dovere, sapere: il participio passato?\",\"other\":\"potuto, voluto, dovuto, saputo. Ho potuto fare una pausa; ho voluto un caff\u00e8; ho dovuto pagare il conto; ho saputo la notizia. Modal auxiliary choice can depend on the following infinitive.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Passato prossimo o imperfetto?\",\"other\":\"Ieri ho letto un libro: completed event. Prima leggevo ogni sera: past habit. Mentre leggevo, \u00e8 arrivata Anna: background action + event.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Imperfetto: quali sono le desinenze?\",\"other\":\"-vo, -vi, -va, -vamo, -vate, -vano. parlavo, prendevi, dormiva; parlavamo, prendevate, dormivano. Keep the conjugation vowel: a / e / i.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Essere, fare, dire, bere: l\u2019imperfetto?\",\"other\":\"ero, eri, era, eravamo, eravate, erano. fare \u2192 facevo; dire \u2192 dicevo; bere \u2192 bevevo. Continue with -vi, -va, -vamo, -vate, -vano.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Futuro semplice: quali sono le desinenze?\",\"other\":\"-\u00f2, -ai, -\u00e0, -emo, -ete, -anno. parler\u00f2, parlerai, parler\u00e0, parleremo, parlerete, parleranno. Regular -are changes to -er-; -ere uses -er-; -ire uses -ir-.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Futuro: essere, avere, andare, venire?\",\"other\":\"sar\u00f2, avr\u00f2, andr\u00f2, verr\u00f2. Stems: sar-, avr-, andr-, verr-. Add -\u00f2, -ai, -\u00e0, -emo, -ete, -anno: lei sar\u00e0; noi avremo; loro verranno.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Futuro: fare, dare, stare, bere, volere?\",\"other\":\"far\u00f2, dar\u00f2, star\u00f2, berr\u00f2, vorr\u00f2. Also: potr\u00f2, dovr\u00f2, sapr\u00f2, vedr\u00f2, vivr\u00f2. Mangiare \u2192 manger\u00f2, not mangier\u00f2.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Condizionale presente: come si forma?\",\"other\":\"Use the future stem + -ei, -esti, -ebbe, -emmo, -este, -ebbero. parlerei, parleresti, parlerebbe, parleremmo, parlereste, parlerebbero.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Vorrei, potrei, dovrei: quando si usano?\",\"other\":\"Vorrei un caff\u00e8: polite wish. Potrei fare una pausa?: polite request / possibility. Dovrei studiare: advice or obligation softened. Se fosse possibile, andrei a Roma. Conditional: sarei, avrei, farei, verrei.\",\"lang\":\"EN\",\"group\":\"Grammatica \u00b7 verbi\",\"note\":\"Regola \u00b7 grammar/verbi \u00b7 IT \u2192 EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"ghiro\",\"other\":\"dormouse\",\"lang\":\"EN\",\"group\":\"Liam \u00b7 Nord/Sud \u00b7 Liguria\",\"note\":\"Liam \u00b7 Full document vocabulary \u00b7 Animals and pronunciation \u00b7 IT \u2192 EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"gnomo\",\"other\":\"gnome\",\"lang\":\"EN\",\"group\":\"Liam \u00b7 Nord/Sud \u00b7 Liguria\",\"note\":\"Liam \u00b7 Full document vocabulary \u00b7 Animals and pronunciation \u00b7 IT \u2192 EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"sciarpa\",\"other\":\"scarf\",\"lang\":\"EN\",\"group\":\"Liam \u00b7 Nord/Sud \u00b7 Liguria\",\"note\":\"Liam \u00b7 Full document vocabulary \u00b7 Animals and pronunciation \u00b7 ','14 ott','7 ott','24 ott \u00b7 corpo','24 ott \u00b7 terra','24 ott \u00b7 casa','25 ott \u00b7 foto','25 ott \u00b7 Dante','21 ott \u00b7 mangiare','27 ott \u00b7 frasi'];\n const ordered=lessons.flatMap(group=>pool.filter(c=>c.group===group));\n const older=pool.filter(c=>!lessons.includes(c.group));\n for(let i=older.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[older[i],older[j]]=[older[j],older[i]]}\n pool=ordered.concat(older);\n}\n$('scene').onclick=()=>setFlip(!flipped);$('flip').onclick=()=>setFlip(!flipped);$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);\nlet lastDirectionTouch=0;\nfunction toggleDirection(event){\n event.preventDefault();event.stopPropagation();\n if($('direction').disabled)return;\n if(event.type==='touchend')lastDirectionTouch=Date.now();\n else if(event.detail>0&&Date.now()-lastDirectionTouch\u003c700)return;\n reverse=!reverse;render();\n}\n$('direction').addEventListener('touchstart',event=>event.stopPropagation(),{passive:true});\n$('direction').addEventListener('touchend',toggleDirection,{passive:false});\n$('direction').addEventListener('click',toggleDirection);\nfilter.onchange=()=>{pool=ALL.filter(c=>matches(c,filter.value));shufflePool();index=0;reverse=false;$('status').textContent=pool.length+(['18-ott','14-ott','7-ott','24-ott-corpo','24-ott-terra','24-ott-casa','25-ott-foto','25-ott-dante','21-ott-mangiare','27-ott-frasi'].includes(filter.value)?' carte \u00b7 ordine della lezione':' carte \u00b7 mescolate')+' \u00b7 offline \u00b7 v59';render()};\n$('shuffle').onclick=()=>{shufflePool();index=0;$('status').textContent='Mazzo mescolato \u00b7 v59';render()};\ndocument.addEventListener('keydown',e=>{if(e.target.closest('button, select, a, input, textarea'))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' '||e.key==='Enter'){e.preventDefault();setFlip(!flipped)}});\npool=ALL.filter(c=>matches(c,filter.value));shufflePool();$('status').textContent=pool.length+(['18-ott','14-ott','7-ott','24-ott-corpo','24-ott-terra','24-ott-casa','25-ott-foto','25-ott-dante','21-ott-mangiare','27-ott-frasi'].includes(filter.value)?' carte \u00b7 ordine della lezione':' carte \u00b7 mescolate')+' \u00b7 offline \u00b7 v59';render();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script type="application/json" id="app-articoli">"\u003c!DOCTYPE html>\n\u003chtml lang=\"it\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#345b55\">\n\u003cmeta name=\"build-version\" content=\"v48\">\n\u003ctitle>Articoli \u00b7 Il laboratorio di Nadiia\u003c/title>\n\u003cstyle>\n:root{--laguna:#345b55;--cielo:#dceff1;--limone:#f3d45b;--carta:#fffdf8;--inchiostro:#17302d;--corallo:#e87962;--muted:#536c67;--line:#b6ccc7}\n*{box-sizing:border-box}body{margin:0;background:var(--cielo);color:var(--inchiostro);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}\nmain{max-width:1040px;margin:auto;padding:28px clamp(16px,4vw,42px) 40px}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--carta);color:var(--inchiostro);padding:10px 15px;font-weight:750}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--laguna);outline-offset:3px}\nheader{display:grid;grid-template-columns:1fr auto;align-items:end;gap:15px;margin-bottom:26px}.eyebrow{font-size:.7rem;letter-spacing:.17em;text-transform:uppercase;font-weight:800;color:var(--laguna)}h1{font-size:clamp(2.3rem,7.5vw,4rem);line-height:1;letter-spacing:-.06em;margin:10px 0}header p{margin:0;max-width:49ch;line-height:1.45}.stamp{border:2px solid var(--laguna);padding:12px;border-radius:50%;width:90px;height:90px;display:grid;place-content:center;text-align:center;transform:rotate(-9deg);font-size:.7rem;line-height:1.4;font-weight:800;color:var(--laguna)}\n.legend{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.article{background:var(--laguna);color:var(--carta);padding:8px 12px;border-radius:7px;font-size:1.05rem;font-weight:800}.article:nth-child(2){background:var(--limone);color:var(--inchiostro)}.article:nth-child(3){background:var(--corallo);color:var(--inchiostro)}\n.layout{display:grid;grid-template-columns:minmax(240px,.85fr) minmax(0,1.3fr);gap:20px;align-items:start}.lesson{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:16px;padding:22px}.step{display:flex;align-items:center;gap:10px;font-size:.75rem;text-transform:uppercase;font-weight:850;letter-spacing:.08em;margin:0 0 14px}.step span{width:26px;height:26px;border-radius:50%;background:var(--laguna);color:var(--carta);display:grid;place-content:center;font-size:.8rem}.lesson h2{font-size:1.25rem;line-height:1.15;letter-spacing:-.025em;margin:0 0 14px}.rules{margin:0;padding-left:19px;line-height:1.5;font-size:.91rem}.rules li{margin:0 0 13px}.en{display:block;font-size:.75rem;color:var(--muted);margin-top:4px;line-height:1.5}.special{border-left:4px solid var(--corallo);padding:10px 12px;background:var(--carta);margin:17px 0 0;font-size:.84rem;line-height:1.5}details{margin-top:18px}summary{cursor:pointer;font-weight:750;font-size:.82rem;padding:5px 0}.table-wrap{overflow-x:auto;margin-top:8px}table{border-collapse:collapse;width:100%;font-size:.76rem}th,td{padding:7px 5px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}caption{text-align:left;font-size:.7rem;color:var(--muted);margin-bottom:8px}\n.practice{min-width:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button[aria-pressed=true]{background:var(--laguna);color:var(--carta);border-color:var(--laguna)}.toolbar #shuffle{margin-left:auto;background:transparent}.ticket{background:var(--carta);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 30px #17302d12}.ticket-top{padding:20px 23px;background:var(--laguna);color:var(--carta)}.ticket-top .step{margin-bottom:12px}.ticket-top .step span{background:var(--limone);color:var(--inchiostro)}#rule{font-weight:750;line-height:1.45;font-size:.95rem}#rule-en{color:#dceff1;margin-top:6px}.exercise{padding:22px 23px 24px;border-top:2px dashed var(--line)}.meta{display:flex;justify-content:space-between;gap:10px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--laguna)}#phrase{font-size:clamp(2.05rem,7vw,3.35rem);line-height:1.1;font-weight:850;letter-spacing:-.05em;margin:24px 0 8px;overflow-wrap:anywhere}#phrase .blank,#phrase .given{color:var(--laguna)}#gloss{font-size:.8rem;color:var(--muted);margin:0 0 21px}.answer-label{font-size:.8rem;font-weight:750;display:block;margin-bottom:8px}.input-row{display:flex;gap:8px;min-width:0}input{min-width:0;width:100%;border:1px solid var(--line);border-radius:10px;min-height:48px;padding:11px;background:white;color:var(--inchiostro);font-size:16px}.primary{background:var(--limone);border-color:var(--limone)}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.choices button{font-size:1.15rem;padding:10px 5px}select{padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--carta);color:var(--inchiostro);font-size:16px}#input-method{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;font-size:.78rem;color:var(--muted)}.feedback{margin-top:18px;padding:14px;border-radius:10px;line-height:1.5;background:var(--cielo);min-height:58px;font-size:.86rem}.feedback.good{background:#d6eadf}.feedback.bad{background:#f9e0d7}.feedback strong{display:block}#next{width:100%;margin-top:13px;background:var(--laguna);color:var(--carta);border-color:var(--laguna)}.score{display:flex;justify-content:space-between;gap:12px;font-size:.77rem;margin:14px 3px;color:var(--laguna);font-variant-numeric:tabular-nums}.track{height:6px;border-radius:8px;background:#b6ccc7;overflow:hidden}.track i{display:block;height:100%;background:var(--corallo);width:0}footer{font-size:.73rem;color:var(--muted);line-height:1.5;margin-top:25px}.hidden,[hidden]{display:none!important}@media(max-width:720px){.layout{grid-template-columns:1fr}.lesson{padding:18px}.rules{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}header{align-items:center}.stamp{width:70px;height:70px;font-size:.6rem}main{padding-top:20px}.toolbar #shuffle{margin-left:0;flex-grow:1}.ticket-top,.exercise{padding:18px}}@media(max-width:420px){.rules{display:block}.stamp{display:none}.choices{grid-template-columns:repeat(4,minmax(0,1fr))}.toolbar button{padding:9px 10px;font-size:.85rem}.input-row{flex-wrap:wrap}.input-row .primary{width:100%}}\n\n/* Answer frames stay green until a nonempty answer is checked and rejected. */\n#answer{border:2px solid var(--laguna);background:#f3faf5;opacity:1;-webkit-text-fill-color:var(--inchiostro);}\n#answer:focus{outline:3px solid var(--laguna);outline-offset:3px}\n#answer[data-state=\"bad\"]{border-color:var(--corallo);background:#f9e0d7}\n#answer[data-state=\"bad\"]:focus{outline-color:var(--corallo)}\n#phrase[data-state=\"bad\"] .blank,#phrase[data-state=\"bad\"] .wrong,#phrase[data-state=\"bad\"] .given{color:var(--corallo);border-color:var(--corallo);background:#f9e0d7}\n\n/* Keep the answer usable beside two 44px phone controls. */\n.input-row{flex-wrap:wrap;align-items:center}.input-row input{flex:1 1 140px;width:0}\n#speak{min-width:44px;min-height:44px;flex:none;white-space:nowrap}\n#speak[aria-pressed=\"true\"]{background:#345b55;color:#fffdf8}\n#speech-status{font-size:.78rem;line-height:1.4;margin:8px 0 0;min-height:1.4em}\n.back-link{display:inline-block;margin:0 0 12px;padding:10px 0;color:inherit;font-weight:700;min-height:44px;box-sizing:border-box}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003ca class=\"back-link\" href=\"index.html?v=48\" target=\"_top\">\u00ab Tutte le schede\u003c/a>\n\u003cheader>\u003cdiv>\u003cdiv class=\"eyebrow\">Italiano in tasca \u00b7 Nadiia \u00b7 v48\u003c/div>\u003ch1>Piccole parole.\u003cbr>Regole precise.\u003c/h1>\u003cp>Prima la regola, poi la prova: scegli l\u2019articolo o correggi l\u2019errore.\u003c/p>\u003cdiv class=\"legend\" aria-label=\"Tre famiglie di articoli\">\u003cspan class=\"article\">il / lo / l\u2019\u003c/span>\u003cspan class=\"article\">un / uno / un\u2019\u003c/span>\u003cspan class=\"article\">dei / degli / delle\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"stamp\">ARTICOLI\u003cbr>80 PROVE\u003cbr>OFFLINE\u003c/div>\u003c/header>\n\u003cdiv class=\"layout\">\n\u003caside class=\"lesson\" aria-label=\"Regole degli articoli\">\n\u003cp class=\"step\">\u003cspan>1\u003c/span> Leggi la regola\u003c/p>\u003ch2>Genere + numero\u003cbr>+ inizio della parola.\u003c/h2>\n\u003cul class=\"rules\">\n\u003cli>\u003cb>Determinativi = \u201cthe\u201d.\u003c/b>\u003cbr>Maschile: \u003cb>il \u2192 i\u003c/b>, \u003cb>lo / l\u2019 \u2192 gli\u003c/b>.\u003cbr>Femminile: \u003cb>la / l\u2019 \u2192 le\u003c/b>.\u003c/li>\n\u003cli>\u003cb>Lo / uno\u003c/b> davanti a \u003cb>s + consonante, z, gn, pn, ps, x, y\u003c/b> consonantica.\u003cbr>\u003cspan class=\"en\">lo studente, uno yogurt; but il signore.\u003c/span>\u003c/li>\n\u003cli>\u003cb>Una\u003c/b> + consonante; \u003cb>un\u2019\u003c/b> + vocale (femminile).\u003cbr>\u003cb>Un\u003c/b> + consonante normale o vocale (maschile).\u003cspan class=\"en\">un\u2019amica, but un amico: no apostrophe for masculine un.\u003c/span>\u003c/li>\n\u003cli>\u003cb>Some\u003c/b>, al plurale: \u003cb>dei\u003c/b> dove usi i; \u003cb>degli\u003c/b> dove usi gli; \u003cb>delle\u003c/b> dove usi le.\u003cspan class=\"en\">Here these are partitive articles = some, not \u201cof the\u201d.\u003c/span>\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"special\">\u003cb>Tre trappole.\u003c/b>\u003cbr>lo yogurt \u2192 gli yogurt (invariabile)\u003cbr>la paga \u2192 le paghe\u003cbr>il chirurgo \u2192 i chirurghi\u003cspan class=\"en\">Use the standard lo / uno forms for pneumatico.\u003c/span>\u003c/div>\n\u003cdetails>\u003csummary>Apri la tabella \u00b7 20 parole\u003c/summary>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ccaption>Nomi delle tabelle PDF \u00b7 forme standard\u003c/caption>\u003cthead>\u003ctr>\u003cth>Singolare\u003c/th>\u003cth>Plurale\u003c/th>\u003cth>Some\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"noun-table\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>\n\u003c/aside>\n\u003csection class=\"practice\" aria-label=\"Esercizi\">\n\u003cdiv class=\"toolbar\" role=\"group\" aria-label=\"Modalit\u00e0\">\u003cbutton id=\"mode-a\" aria-pressed=\"true\">A \u00b7 Completa\u003c/button>\u003cbutton id=\"mode-b\" aria-pressed=\"false\">B \u00b7 Correggi\u003c/button>\u003cbutton id=\"shuffle\">Mescola \u21ba\u003c/button>\u003c/div>\n\u003cdiv class=\"ticket\">\n\u003cdiv class=\"ticket-top\">\u003cp class=\"step\">\u003cspan>2\u003c/span> Regola di questa prova\u003c/p>\u003cdiv id=\"rule\">\u003c/div>\u003csmall class=\"en\" id=\"rule-en\">\u003c/small>\u003c/div>\n\u003cdiv class=\"exercise\">\n\u003cdiv class=\"meta\">\u003cspan id=\"category\">\u003c/span>\u003cspan id=\"position\">\u003c/span>\u003c/div>\n\u003cdiv id=\"phrase\">\u003cspan class=\"blank\">___ \u003c/span>\u003cspan class=\"noun\">studente\u003c/span>\u003c/div>\u003cp id=\"gloss\">\u003c/p>\n\u003cdiv id=\"input-method\">\u003clabel for=\"method\">Come rispondi?\u003c/label>\u003cselect id=\"method\">\u003coption value=\"choose\">Scegli\u003c/option>\u003coption value=\"type\">Scrivi\u003c/option>\u003c/select>\u003c/div>\n\u003cform id=\"answer-form\">\u003clabel class=\"answer-label\" id=\"answer-label\" for=\"answer\">Scrivi solo l\u2019articolo.\u003c/label>\u003cdiv class=\"input-row\">\u003cinput id=\"answer\" autocomplete=\"off\" autocapitalize=\"none\" spellcheck=\"false\" placeholder=\"Articolo\">\u003cbutton id=\"speak\" type=\"button\" aria-pressed=\"false\" aria-describedby=\"speech-status\">Parla\u003c/button>\u003cbutton class=\"primary\" type=\"submit\" id=\"check\">Verifica\u003c/button>\u003c/div>\u003cp id=\"speech-status\" role=\"status\" aria-live=\"polite\">\u003c/p>\u003c/form>\n\u003cdiv class=\"choices\" id=\"choices\" role=\"group\" aria-label=\"Scegli l\u2019articolo\">\u003c/div>\n\u003cdiv class=\"feedback\" id=\"feedback\" aria-live=\"polite\" aria-atomic=\"true\">Una risposta per prova. La soluzione arriva subito.\u003c/div>\n\u003cbutton id=\"next\" disabled>Prossima \u2192\u003c/button>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"score\">\u003cspan id=\"score\">0 corrette / 0 risposte\u003c/span>\u003cspan id=\"accuracy\">\u2014\u003c/span>\u003c/div>\u003cdiv class=\"track\" aria-label=\"Avanzamento\">\u003ci id=\"progress\">\u003c/i>\u003c/div>\n\u003c/section>\n\u003c/div>\n\u003cfooter>80 prove in ogni modalit\u00e0 \u00b7 20 nomi \u00d7 4 forme. \u201cMescola\u201d e il cambio modalit\u00e0 iniziano una nuova sessione. La dettatura usa il servizio vocale del browser. Puoi sempre scrivere.\u003c/footer>\n\u003c/main>\n\u003cscript>\n'use strict';\nconst NOUNS=[{\"sg\":\"bambino\",\"pl\":\"bambini\",\"gender\":\"m\",\"kind\":\"normal\",\"en\":\"child\"},{\"sg\":\"signore\",\"pl\":\"signori\",\"gender\":\"m\",\"kind\":\"normal\",\"en\":\"gentleman\"},{\"sg\":\"amico\",\"pl\":\"amici\",\"gender\":\"m\",\"kind\":\"vowel\",\"en\":\"friend (male)\"},{\"sg\":\"studente\",\"pl\":\"studenti\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"student\"},{\"sg\":\"gnocco\",\"pl\":\"gnocchi\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"gnocchi dumpling\"},{\"sg\":\"pneumatico\",\"pl\":\"pneumatici\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"tyre\"},{\"sg\":\"psicologo\",\"pl\":\"psicologi\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"psychologist\"},{\"sg\":\"xilofono\",\"pl\":\"xilofoni\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"xylophone\"},{\"sg\":\"yogurt\",\"pl\":\"yogurt\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"yogurt\"},{\"sg\":\"zaino\",\"pl\":\"zaini\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"backpack\"},{\"sg\":\"bambina\",\"pl\":\"bambine\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"girl\"},{\"sg\":\"moglie\",\"pl\":\"mogli\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"wife\"},{\"sg\":\"amica\",\"pl\":\"amiche\",\"gender\":\"f\",\"kind\":\"vowel\",\"en\":\"friend (female)\"},{\"sg\":\"paga\",\"pl\":\"paghe\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"wage\"},{\"sg\":\"chirurgo\",\"pl\":\"chirurghi\",\"gender\":\"m\",\"kind\":\"normal\",\"en\":\"surgeon\"},{\"sg\":\"bottiglia\",\"pl\":\"bottiglie\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"bottle\"},{\"sg\":\"portafoglio\",\"pl\":\"portafogli\",\"gender\":\"m\",\"kind\":\"normal\",\"en\":\"wallet\"},{\"sg\":\"borsa\",\"pl\":\"borse\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"bag\"},{\"sg\":\"chiave\",\"pl\":\"chiavi\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"key\"},{\"sg\":\"bicchiere\",\"pl\":\"bicchieri\",\"gender\":\"m\",\"kind\":\"normal\",\"en\":\"drinking glass\"}];\nconst FORMS=['def-sg','def-pl','ind-sg','some-pl'];\nconst OPTIONS={'def-sg':['il','lo','la','l\u2019'],'def-pl':['i','gli','le'],'ind-sg':['un','uno','una','un\u2019'],'some-pl':['dei','degli','delle']};\nconst LABELS={'def-sg':'Determinativo \u00b7 singolare','def-pl':'Determinativo \u00b7 plurale','ind-sg':'Indeterminativo \u00b7 singolare','some-pl':'Partitivo \u00b7 plurale (some)'};\nfunction article(n,f){if(f==='def-sg')return n.kind==='vowel'?'l\u2019':n.gender==='f'?'la':n.kind==='special'?'lo':'il';if(f==='def-pl')return n.gender==='f'?'le':n.kind==='normal'?'i':'gli';if(f==='ind-sg')return n.gender==='f'?(n.kind==='vowel'?'un\u2019':'una'):(n.kind==='special'?'uno':'un');return n.gender==='f'?'delle':n.kind==='normal'?'dei':'degli';}\nfunction join(a,w){return a.endsWith('\u2019')?a+w:a+' '+w;}\nconst ITEMS=NOUNS.flatMap(n=>FORMS.map(form=>({noun:n,form,word:form.endsWith('pl')?n.pl:n.sg,answer:article(n,form)})));\nconst $=id=>document.getElementById(id);\nlet mode='a',order=[],pos=0,answered=false,correct=0,total=0;\nfunction norm(s){return s.trim().toLowerCase().replace(/[\u2019\u2018`\u00b4]/g,\"'\").replace(/\\s*'\\s*/g,\"'\").replace(/\\s+/g,' ').replace(/[.!?]+$/,'');}\nfunction ruleFor(item){const n=item.noun,f=item.form;let it,en;\nif(f==='some-pl'){it=n.gender==='f'?'Tutti i plurali femminili: delle, anche davanti a vocale.':n.kind==='normal'?'Maschile plurale con i \u2192 dei.':'Maschile plurale con gli \u2192 degli.';en='Plural partitive = some, not \u201cof the\u201d.';}\nelse if(f==='def-pl'){it=n.gender==='f'?'Femminile plurale: le, anche davanti a vocale.':n.kind==='normal'?'Maschile plurale: il diventa i.':'Maschile plurale: lo e l\u2019 diventano gli.';en='Definite plural = the. No apostrophe in le or gli.';}\nelse if(f==='ind-sg'){it=n.gender==='f'?(n.kind==='vowel'?'Femminile + vocale: una diventa un\u2019, con apostrofo.':'Femminile + consonante: una.'):(n.kind==='special'?'Maschile con inizio speciale: uno.':'Maschile: un, anche davanti a vocale; mai l\u2019apostrofo.');en='Indefinite singular = a / an.';}\nelse{it=n.kind==='vowel'?'Davanti a vocale, al singolare: l\u2019 (maschile o femminile).':n.gender==='f'?'Femminile singolare + consonante: la.':n.kind==='special'?'Maschile + s/consonante, z, gn, pn, ps, x, y consonantica: lo.':'Maschile singolare + consonante normale: il.';en='Definite singular = the.';}\nif(n.sg==='signore')it+=' Signore: s + vocale, non s + consonante.';\nif(n.sg==='yogurt')it+=' Yogurt: y consonantica; il plurale non cambia.';\nif(n.sg==='paga'&&f.endsWith('pl'))it+=' Paga \u2192 paghe.';\nif(n.sg==='chirurgo'&&f.endsWith('pl'))it+=' Chirurgo \u2192 chirurghi.';\nreturn {it,en};}\nfunction wrongFor(item){if(item.form==='ind-sg'&&item.noun.sg==='amico')return 'un\u2019';if(item.form==='ind-sg'&&item.noun.sg==='amica')return 'un';return OPTIONS[item.form].find(a=>a!==item.answer);}\nfunction start(){order=ITEMS.slice();for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;correct=0;total=0;render();}\nfunction updateScore(){$('score').textContent=correct+' corrette / '+total+' risposte';$('accuracy').textContent=total?Math.round(correct/total*100)+'%':'\u2014';$('progress').style.width=total/order.length*100+'%';}\nfunction setAnswerState(state){$('answer').setAttribute('data-state',state);$('phrase').setAttribute('data-state',state);}\nfunction render(){cancelDictation();setAnswerState('idle');const item=order[pos];answered=false;const rule=ruleFor(item);$('rule').textContent=rule.it;$('rule-en').textContent=rule.en;$('category').textContent=LABELS[item.form];$('position').textContent=(pos+1)+' / '+order.length;\n$('phrase').textContent='';const lead=document.createElement('span');lead.className=mode==='a'?'blank':'given';const wrong=mode==='b'?wrongFor(item):'';lead.textContent=mode==='a'?'___ ':wrong+(wrong.endsWith('\u2019')?'':' ');const noun=document.createElement('span');noun.className='noun';noun.textContent=item.word;$('phrase').appendChild(lead);$('phrase').appendChild(noun);\n$('gloss').textContent=item.noun.en+' \u00b7 '+(item.noun.gender==='m'?'maschile':'femminile')+' \u00b7 '+(item.form.endsWith('pl')?'plurale':'singolare');\nconst choosing=mode==='a'&&$('method').value==='choose';$('input-method').hidden=mode==='b';$('answer-form').hidden=choosing;$('choices').hidden=!choosing;$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('answer-label').textContent=mode==='b'?'Riscrivi tutta la frase con l\u2019articolo corretto.':'Scrivi solo l\u2019articolo.';$('answer').placeholder=mode==='b'?'Articolo + nome':'Articolo';\n$('choices').textContent='';OPTIONS[item.form].forEach(a=>{const b=document.createElement('button');b.type='button';b.textContent=a;b.onclick=()=>submit(a);$('choices').appendChild(b);});\n$('feedback').className='feedback';$('feedback').textContent=mode==='b'?'Correggi l\u2019articolo: il nome \u00e8 gi\u00e0 giusto.':'Scegli o scrivi l\u2019articolo richiesto.';$('next').disabled=true;$('next').textContent=pos===order.length-1?'Vedi il risultato \u2192':'Prossima \u2192';updateScore();}\nfunction submit(value){cancelDictation();if(answered)return;if(!norm(value)){setAnswerState('idle');$('feedback').textContent='Scrivi una risposta prima di verificare.';return;}const item=order[pos],expected=mode==='b'?join(item.answer,item.word):item.answer;const good=norm(value)===norm(expected);setAnswerState(good?'good':'bad');answered=true;total++;if(good)correct++;\n$('feedback').textContent='';const strong=document.createElement('strong');strong.textContent=good?'Esatto! '+join(item.answer,item.word):'Non ancora. La forma corretta \u00e8 '+join(item.answer,item.word)+'.';$('feedback').appendChild(strong);const explain=document.createElement('span');explain.textContent=ruleFor(item).it;$('feedback').appendChild(explain);$('feedback').className='feedback '+(good?'good':'bad');$('answer').disabled=true;$('check').disabled=true;Array.from($('choices').children).forEach(b=>b.disabled=true);$('next').disabled=false;updateScore();}\nfunction finish(){$('phrase').textContent='Sessione finita.';$('gloss').textContent=correct+' / '+order.length+' corrette \u00b7 '+Math.round(correct/order.length*100)+'%';$('answer-form').hidden=true;$('choices').hidden=true;$('input-method').hidden=true;$('feedback').className='feedback';$('feedback').textContent='Rileggi le regole e premi \u201cMescola\u201d per ricominciare. Puoi anche cambiare modalit\u00e0.';$('next').disabled=true;$('next').textContent='Completato';}\nfunction setMode(m){mode=m;$('mode-a').setAttribute('aria-pressed',String(m==='a'));$('mode-b').setAttribute('aria-pressed',String(m==='b'));start();}\n$('mode-a').onclick=()=>setMode('a');$('mode-b').onclick=()=>setMode('b');$('shuffle').onclick=start;\n$('method').onchange=()=>{if(!answered)render();};\n$('answer-form').onsubmit=e=>{e.preventDefault();submit($('answer').value);};\n$('next').onclick=()=>{if(!answered)return;if(pos===order.length-1)finish();else{pos++;render();}};\nNOUNS.forEach(n=>{const tr=document.createElement('tr');[join(article(n,'def-sg'),n.sg),join(article(n,'def-pl'),n.pl),join(article(n,'some-pl'),n.pl)].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.appendChild(td);});$('noun-table').appendChild(tr);});\n$('answer').oninput=()=>{cancelDictation();setAnswerState('idle');};\n// Browser-managed dictation: no recording, upload endpoint or API key in this app.\nconst cancelDictation=(()=>{\n const input=$('answer'),button=$('speak'),status=$('speech-status');\n const Recognition=globalThis.webkitSpeechRecognition||globalThis.SpeechRecognition;\n let current=null,stopping=false;\n function idle(){button.textContent='Parla';button.setAttribute('aria-pressed','false');if(status.textContent==='In ascolto\u2026')status.textContent='';}\n function errorText(error){return error==='not-allowed'||error==='service-not-allowed'?'Consenti il microfono per dettare, oppure scrivi.':error==='no-speech'?'Non ho sentito. Riprova o scrivi.':'Dettatura non disponibile. Riprova o scrivi.';}\n function write(text){if(input.disabled||$('answer-form').hidden)return;const transcript=text.trim().replace(/[.!?]+$/,'');if(!transcript)return;input.value=transcript;setAnswerState('idle');status.textContent='Testo inserito. Controlla la risposta.';}\n function cancel(){const old=current;current=null;stopping=false;idle();if(old!==null){status.textContent='';old.abort();}}\n if(!Recognition){button.disabled=true;status.textContent='Detta solo in Safari.';return cancel;}\n button.onclick=()=>{\n  if(button.disabled||input.disabled||$('answer-form').hidden)return;\n  if(current!==null){if(!stopping){stopping=true;idle();current.stop();}return;}\n  status.textContent='';\n  try{\n   // Construct and start here, in this document's tap: no message or async hop.\n   const session=new Recognition();current=session;stopping=false;\n   session.lang='it-IT';session.continuous=false;session.interimResults=true;\n   session.onresult=event=>{if(current===session)write(Array.from(event.results).map(result=>result[0].transcript).join(' '));};\n   session.onend=()=>{if(current===session){current=null;stopping=false;idle();}};\n   session.onerror=event=>{if(current!==session)return;current=null;stopping=false;idle();status.textContent=errorText(event.error);};\n   button.textContent='Ferma';button.setAttribute('aria-pressed','true');status.textContent='In ascolto\u2026';\n   session.start();\n  }catch(error){current=null;stopping=false;idle();status.textContent=errorText('failed');}\n };\n globalThis.addEventListener?.('pagehide',cancel);\n document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel();});\n return cancel;\n})();\nstart();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script type="application/json" id="app-aggettivi">"\u003c!DOCTYPE html>\n\u003chtml lang=\"it\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cmeta name=\"theme-color\" content=\"#345b55\">\u003cmeta name=\"build-version\" content=\"v48\">\u003ctitle>Articoli + aggettivi \u00b7 Nadiia\u003c/title>\n\u003cstyle>\n:root{--ink:#17302d;--green:#345b55;--paper:#fffdf8;--sky:#dceff1;--yellow:#f3d45b;--coral:#e87962;--line:#b6ccc7}*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:1100px;margin:auto;padding:28px clamp(16px,4vw,40px) 45px}.eyebrow,.meta,#category{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--green)}h1{font-size:clamp(2.25rem,7vw,4rem);letter-spacing:-.055em;line-height:1;margin:12px 0}header p{line-height:1.5;max-width:58ch}header{margin-bottom:26px}.layout{display:grid;grid-template-columns:minmax(245px,.8fr) minmax(0,1.4fr);gap:22px;align-items:start}.rules{padding:23px;border:1px solid var(--line);border-radius:16px;background:#ffffff70;font-size:.92rem;line-height:1.55}.rules h2{font-size:1.4rem;line-height:1.15;margin-top:0;letter-spacing:-.03em}.switch{display:grid;grid-template-columns:30px 1fr;gap:10px;margin:18px 0}.switch b:first-child{width:28px;height:28px;display:grid;place-content:center;background:var(--green);color:white;border-radius:50%}.rules table{width:100%;border-collapse:collapse;font-size:.84rem}.rules th,.rules td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}details{margin-top:18px}summary{cursor:pointer;font-weight:750}.example{border-left:4px solid var(--coral);padding:10px 12px;background:var(--paper);margin:16px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button,input{font:inherit}button{min-height:46px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--paper);color:var(--ink);font-weight:750;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55;cursor:default}.toolbar button[aria-pressed=true],#next{background:var(--green);color:white}#shuffle{margin-left:auto;background:transparent}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:3px}.ticket{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 15px 35px #17302d12}.meta{display:flex;justify-content:flex-end;gap:10px;padding:18px 22px;border-bottom:1px dashed var(--line);letter-spacing:.04em}#category{margin-bottom:8px;letter-spacing:.04em}.exercise{padding:22px}#lemma{font-size:clamp(3.2rem,10vw,5.2rem);font-weight:850;line-height:1.05;letter-spacing:-.055em;overflow-wrap:anywhere;margin:8px 0 22px}#phrase{font-size:clamp(1.5rem,5vw,2.25rem);font-weight:800;line-height:1.2;letter-spacing:-.03em;overflow-wrap:anywhere}#cue{font-size:1rem;color:var(--green);margin:8px 0 20px}#hint{background:#fff0ca;border-left:4px solid var(--yellow);padding:12px;font-size:.88rem;line-height:1.5;margin-bottom:18px}label{display:block;font-size:.82rem;font-weight:750;margin-bottom:8px}.input-row{display:flex;gap:8px}input{width:100%;min-width:0;min-height:50px;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-size:16px}.primary{background:var(--yellow);border-color:var(--yellow)}.feedback{background:var(--sky);min-height:62px;margin-top:18px;padding:14px;border-radius:10px;line-height:1.5;font-size:.92rem}.feedback.good{background:#d6eadf}.feedback.bad{background:#f9e0d7}#reveal{margin-top:12px;font-size:.85rem}#next{width:100%;margin-top:12px}.score{display:flex;justify-content:space-between;gap:10px;margin:14px 3px;font-size:.8rem;font-variant-numeric:tabular-nums}.track{height:6px;background:var(--line);border-radius:8px;overflow:hidden}.track i{height:100%;display:block;background:var(--coral);width:0}footer{font-size:.76rem;line-height:1.6;margin-top:24px;color:var(--green)}a{color:var(--green)}[hidden]{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.rules{padding:18px}.rules .switch{margin:10px 0}main{padding-top:20px}#shuffle{margin-left:0}.meta,.exercise{padding:18px}}@media(max-width:420px){.input-row{flex-wrap:wrap}.primary{width:100%}.toolbar button{font-size:.86rem;padding:9px 10px}.score{font-size:.73rem}}\n\n/* Answer frames stay green until a nonempty answer is checked and rejected. */\n#answer{border:2px solid var(--green);background:#f3faf5;opacity:1;-webkit-text-fill-color:var(--ink);}\n#answer:focus{outline:3px solid var(--green);outline-offset:3px}\n#answer[data-state=\"bad\"]{border-color:var(--coral);background:#f9e0d7}\n#answer[data-state=\"bad\"]:focus{outline-color:var(--coral)}\n#phrase[data-state=\"bad\"] .blank,#phrase[data-state=\"bad\"] .wrong,#phrase[data-state=\"bad\"] .given{color:var(--coral);border-color:var(--coral);background:#f9e0d7}\n\n/* Keep the answer usable beside two 44px phone controls. */\n.input-row{flex-wrap:wrap;align-items:center}.input-row input{flex:1 1 140px;width:0}\n#speak{min-width:44px;min-height:44px;flex:none;white-space:nowrap}\n#speak[aria-pressed=\"true\"]{background:#345b55;color:#fffdf8}\n#speech-status{font-size:.78rem;line-height:1.4;margin:8px 0 0;min-height:1.4em}\n.back-link{display:inline-block;margin:0 0 12px;padding:10px 0;color:inherit;font-weight:700;min-height:44px;box-sizing:border-box}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003ca class=\"back-link\" href=\"index.html?v=48\" target=\"_top\">\u00ab Tutte le schede\u003c/a>\n\u003cheader>\u003cdiv class=\"eyebrow\">Italiano in tasca \u00b7 Nadiia \u00b7 v48\u003c/div>\u003ch1>Tre interruttori.\u003cbr>Una frase intera.\u003c/h1>\u003cp>Articolo + nome + aggettivo. Completa le forme o correggi l\u2019accordo: piccoli passi, frasi vere.\u003c/p>\u003c/header>\n\u003cdiv class=\"layout\">\u003caside class=\"rules\">\u003ch2>La concordanza \u00e8 una tabella.\u003cbr>Non \u00e8 un calcolo.\u003c/h2>\u003cdiv class=\"switch\">\u003cb>1\u003c/b>\u003cdiv>\u003cb>Genere\u003c/b>\u003cbr>Maschile o femminile: il problema, la mano, la foto.\u003c/div>\u003c/div>\u003cdiv class=\"switch\">\u003cb>2\u003c/b>\u003cdiv>\u003cb>Numero\u003c/b>\u003cbr>Singolare o plurale: l\u2019amico alto \u2192 gli amici alti.\u003c/div>\u003c/div>\u003cdiv class=\"switch\">\u003cb>3\u003c/b>\u003cdiv>\u003cb>Classe dell\u2019articolo\u003c/b>\u003cbr>il / lo / l\u2019 \u00b7 i / gli\u003cbr>la / l\u2019 \u00b7 le\u003cbr>Guarda il suono subito dopo l\u2019articolo.\u003c/div>\u003c/div>\n\u003cdetails>\u003csummary>La tabella degli aggettivi\u003c/summary>\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>m.\u003c/th>\u003cth>f.\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Singolare\u003c/td>\u003ctd>alto\u003c/td>\u003ctd>alta\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Plurale\u003c/td>\u003ctd>alti\u003c/td>\u003ctd>alte\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Singolare in -e\u003c/td>\u003ctd>felice\u003c/td>\u003ctd>felice\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Plurale in -i\u003c/td>\u003ctd>felici\u003c/td>\u003ctd>felici\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>bianco \u2192 bianchi / bianche\u003cbr>lungo \u2192 lunghi / lunghe\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Prima del nome: bello e buono\u003c/summary>\u003cp>il bel libro \u00b7 i bei libri\u003cbr>il bell\u2019amico \u00b7 i begli amici\u003cbr>il bello studente \u00b7 i begli studenti\u003cbr>la bella casa \u00b7 le belle case\u003cbr>un buon amico \u00b7 un buono studente\u003cbr>una buona amica (anche: una buon\u2019amica)\u003c/p>\u003cp>Dopo il nome: il libro bello, i libri belli. L\u2019articolo cambia se l\u2019aggettivo viene prima: \u003cb>lo studente \u2192 il bravo studente\u003c/b>.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Questo e quello\u003c/summary>\u003cp>questo libro \u00b7 quest\u2019amico\u003cbr>questa casa \u00b7 quest\u2019amica\u003cbr>questi libri \u00b7 queste amiche\u003cbr>quel libro \u00b7 quello studente \u00b7 quell\u2019amico\u003cbr>quei libri \u00b7 quegli studenti \u00b7 quegli amici\u003cbr>quella casa \u00b7 quelle case\u003c/p>\u003cp>Sostituiscono l\u2019articolo: non si dice \u00abil questo libro\u00bb. Davanti a vocale accettiamo anche questo amico / questa amica.\u003c/p>\u003c/details>\n\u003cdiv class=\"example\">\u00ab___ amico ___ (alto)\u00bb\u003cbr>\u2192 un amico alto\u003cbr>\u003csmall>Il tipo di articolo \u00e8 indicato sopra la prova. L\u2019aiuto sul genere arriva solo dopo un errore.\u003c/small>\u003c/div>\u003c/aside>\n\u003csection aria-label=\"Esercizi di concordanza\">\u003cdiv class=\"toolbar\" role=\"group\" aria-label=\"Modalit\u00e0\">\u003cbutton id=\"mode-a\" aria-pressed=\"true\">A \u00b7 Completa\u003c/button>\u003cbutton id=\"mode-b\" aria-pressed=\"false\">B \u00b7 Correggi\u003c/button>\u003cbutton id=\"shuffle\">Mescola \u21ba\u003c/button>\u003c/div>\u003cdiv class=\"ticket\">\u003cdiv class=\"meta\">\u003cspan id=\"position\">\u003c/span>\u003c/div>\u003cdiv class=\"exercise\">\u003cdiv id=\"lemma\">\u003c/div>\u003cdiv id=\"phrase\">\u003c/div>\u003cp id=\"cue\">\u003c/p>\u003cdiv id=\"hint\" hidden>\u003c/div>\u003cform id=\"answer-form\">\u003cdiv id=\"category\">\u003c/div>\u003clabel for=\"answer\">Scrivi la frase completa\u003c/label>\u003cdiv class=\"input-row\">\u003cinput id=\"answer\" autocomplete=\"off\" autocapitalize=\"none\" spellcheck=\"false\" placeholder=\"Articolo + nome + aggettivo\">\u003cbutton id=\"speak\" type=\"button\" aria-pressed=\"false\" aria-describedby=\"speech-status\">Parla\u003c/button>\u003cbutton id=\"check\" class=\"primary\" type=\"submit\">Verifica\u003c/button>\u003c/div>\u003cp id=\"speech-status\" role=\"status\" aria-live=\"polite\">\u003c/p>\u003c/form>\u003cdiv id=\"feedback\" class=\"feedback\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/div>\u003cbutton id=\"reveal\" hidden>Mostra la soluzione\u003c/button>\u003cbutton id=\"next\" disabled>Prossima \u2192\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"score\">\u003cspan id=\"score\">\u003c/span>\u003cspan id=\"accuracy\">\u003c/span>\u003c/div>\u003cdiv class=\"track\" aria-label=\"Avanzamento\">\u003ci id=\"progress\">\u003c/i>\u003c/div>\u003c/section>\u003c/div>\n\u003cfooter>\u003cdiv id=\"inventory\">\u003c/div>Il punteggio conta il primo tentativo. Puoi riprovare senza penalit\u00e0 aggiuntive. \u00abMescola\u00bb e il cambio modalit\u00e0 iniziano una nuova sessione.\u003cbr>\u003ca id=\"flashcards-link\" href=\"italiano-flashcards.html?v=48\">Flashcard: regole di concordanza \u2192\u003c/a> \u00b7 \u003ca href=\"articoli-esercizi.html?v=48\">Solo articoli \u00b7 v48 \u2192\u003c/a>\u003cbr>La dettatura usa il servizio vocale del browser. Puoi sempre scrivere.\u003c/footer>\n\u003c/main>\u003cscript>'use strict';\nconst NOUNS=[{\"sg\":\"casa\",\"pl\":\"case\",\"gender\":\"f\",\"adjs\":[\"grande\",\"nuovo\"]},{\"sg\":\"amico\",\"pl\":\"amici\",\"gender\":\"m\",\"adjs\":[\"alto\",\"italiano\"]},{\"sg\":\"amica\",\"pl\":\"amiche\",\"gender\":\"f\",\"adjs\":[\"alto\",\"italiano\"]},{\"sg\":\"studente\",\"pl\":\"studenti\",\"gender\":\"m\",\"adjs\":[\"giovane\",\"bravo\"]},{\"sg\":\"studentessa\",\"pl\":\"studentesse\",\"gender\":\"f\",\"adjs\":[\"bravo\",\"giovane\"]},{\"sg\":\"donna\",\"pl\":\"donne\",\"gender\":\"f\",\"adjs\":[\"alto\",\"giovane\"]},{\"sg\":\"uomo\",\"pl\":\"uomini\",\"gender\":\"m\",\"adjs\":[\"alto\",\"giovane\"]},{\"sg\":\"citt\u00e0\",\"pl\":\"citt\u00e0\",\"gender\":\"f\",\"adjs\":[\"grande\",\"bello\"]},{\"sg\":\"problema\",\"pl\":\"problemi\",\"gender\":\"m\",\"adjs\":[\"difficile\",\"piccolo\"]},{\"sg\":\"foto\",\"pl\":\"foto\",\"gender\":\"f\",\"adjs\":[\"bello\",\"vecchio\"]} tion();if(done||pos===order.length)return;if(!norm(value)){setAnswerState('idle');$('feedback').textContent='Scrivi la frase prima di verificare.';return;}const x=order[pos];const good=accepted(x).includes(norm(value));setAnswerState(good?'good':'bad');if(attempts===0){total++;if(good)correct++;}attempts++;score();if(good){done=true;$('feedback').className='feedback good';$('feedback').textContent='Esatto: '+phrase(x);$('next').disabled=false;$('check').disabled=true;$('answer').disabled=true;$('reveal').hidden=true;}else{$('feedback').className='feedback bad';$('feedback').textContent='Non ancora. Controlla i tre interruttori e riprova.';$('hint').hidden=false;$('hint').textContent=(x.g==='f'?'Femminile':'Maschile')+' \u00b7 '+(x.plural?'plurale':'singolare')+' \u00b7 classe del nome: '+(x.g==='f'?'la / l\u2019 \u2192 le':onset(x.word)==='normal'?'il \u2192 i':onset(x.word)==='special'?'lo \u2192 gli':'l\u2019 \u2192 gli')+(x.pre?' \u00b7 L\u2019articolo guarda l\u2019aggettivo che viene subito dopo.':'');$('reveal').hidden=false;}}\nfunction start(m=mode){mode=m;order=ITEMS.slice();for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;total=0;correct=0;$('mode-a').setAttribute('aria-pressed',mode==='a');$('mode-b').setAttribute('aria-pressed',mode==='b');render();}\n$('answer-form').onsubmit=e=>{e.preventDefault();submit($('answer').value);};$('mode-a').onclick=()=>start('a');$('mode-b').onclick=()=>start('b');$('shuffle').onclick=()=>start();$('next').onclick=()=>{if(!done)return;pos++;render();};$('reveal').onclick=()=>{cancelDictation();if(done||!attempts)return;done=true;$('feedback').textContent='Soluzione: '+phrase(order[pos]);$('feedback').className='feedback';$('check').disabled=true;$('answer').disabled=true;$('next').disabled=false;$('reveal').hidden=true;};\nif(typeof location!=='undefined'&&!/\\/anki-html\\/[^/]+$/.test(location.pathname))$('flashcards-link').href='index.html?v=48';\n$('inventory').textContent=NOUNS.length+' nomi \u00b7 '+ITEMS.length+' prove per modalit\u00e0 \u00b7 tutto offline';$('answer').oninput=()=>{cancelDictation();setAnswerState('idle');};\n// Browser-managed dictation: no recording, upload endpoint or API key in this app.\nconst cancelDictation=(()=>{\n const input=$('answer'),button=$('speak'),status=$('speech-status');\n const Recognition=globalThis.webkitSpeechRecognition||globalThis.SpeechRecognition;\n let current=null,stopping=false;\n function idle(){button.textContent='Parla';button.setAttribute('aria-pressed','false');if(status.textContent==='In ascolto\u2026')status.textContent='';}\n function errorText(error){return error==='not-allowed'||error==='service-not-allowed'?'Consenti il microfono per dettare, oppure scrivi.':error==='no-speech'?'Non ho sentito. Riprova o scrivi.':'Dettatura non disponibile. Riprova o scrivi.';}\n function write(text){if(input.disabled||$('answer-form').hidden)return;const transcript=text.trim().replace(/[.!?]+$/,'');if(!transcript)return;input.value=transcript;setAnswerState('idle');status.textContent='Testo inserito. Controlla la risposta.';}\n function cancel(){const old=current;current=null;stopping=false;idle();if(old!==null){status.textContent='';old.abort();}}\n if(!Recognition){button.disabled=true;status.textContent='Detta solo in Safari.';return cancel;}\n button.onclick=()=>{\n  if(button.disabled||input.disabled||$('answer-form').hidden)return;\n  if(current!==null){if(!stopping){stopping=true;idle();current.stop();}return;}\n  status.textContent='';\n  try{\n   // Construct and start here, in this document's tap: no message or async hop.\n   const session=new Recognition();current=session;stopping=false;\n   session.lang='it-IT';session.continuous=false;session.interimResults=true;\n   session.onresult=event=>{if(current===session)write(Array.from(event.results).map(result=>result[0].transcript).join(' '));};\n   session.onend=()=>{if(current===session){current=null;stopping=false;idle();}};\n   session.onerror=event=>{if(current!==session)return;current=null;stopping=false;idle();status.textContent=errorText(event.error);};\n   button.textContent='Ferma';button.setAttribute('aria-pressed','true');status.textContent='In ascolto\u2026';\n   session.start();\n  }catch(error){current=null;stopping=false;idle();status.textContent=errorText('failed');}\n };\n globalThis.addEventListener?.('pagehide',cancel);\n document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel();});\n return cancel;\n})();\nstart();\n\u003c/script>\u003c/body>\u003c/html>\n"</script>
<script type="application/json" id="app-verbi">"\u003c!DOCTYPE html>\n\u003chtml lang=\"it\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#345b55\">\n\u003cmeta name=\"build-version\" content=\"v48\">\n\u003ctitle>Verbi e tempi \u00b7 Il laboratorio di Nadiia\u003c/title>\n\u003cstyle>\n:root{--laguna:#345b55;--cielo:#dceff1;--limone:#f3d45b;--carta:#fffdf8;--inchiostro:#17302d;--corallo:#e87962;--muted:#536c67;--line:#b6ccc7}\n*{box-sizing:border-box}body{margin:0;background:var(--cielo);color:var(--inchiostro);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:1040px;margin:auto;padding:28px clamp(16px,4vw,42px) 40px}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--carta);color:var(--inchiostro);padding:10px 15px;font-weight:750}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--laguna);outline-offset:3px}.eyebrow{font-size:.7rem;letter-spacing:.17em;text-transform:uppercase;font-weight:800;color:var(--laguna)}h1{font-size:clamp(2.3rem,7.5vw,4rem);line-height:1;letter-spacing:-.06em;margin:10px 0}header p{line-height:1.5;max-width:55ch;margin:0 0 24px}.layout{display:grid;grid-template-columns:minmax(230px,.8fr) minmax(0,1.5fr);gap:20px;align-items:start}.lesson{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:16px;padding:22px}.lesson h2{font-size:1.2rem;margin:0 0 15px}.rules{padding-left:19px;line-height:1.5;font-size:.9rem}.rules li{margin-bottom:14px}.note{border-left:4px solid var(--corallo);padding:10px 12px;background:var(--carta);font-size:.85rem;line-height:1.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button[aria-pressed=true]{background:var(--laguna);color:var(--carta)}.toolbar #shuffle{margin-left:auto;background:transparent}.filter{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.85rem}select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--carta);color:var(--inchiostro);min-width:0;max-width:100%;font-size:16px}.practice{min-width:0}.ticket{background:var(--carta);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 30px #17302d12}.ticket-top{padding:18px 22px;background:var(--laguna);color:var(--carta);line-height:1.5}.ticket-top strong{display:block;font-size:1.05rem}#instruction{font-size:.82rem}.exercise{padding:22px;border-top:2px dashed var(--line)}.meta{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--laguna)}#phrase{font-size:clamp(2rem,6.4vw,3.1rem);line-height:1.4;font-weight:850;letter-spacing:-.04em;margin:22px 0 14px;overflow-wrap:anywhere}#phrase .blank{display:inline-block;min-width:min(220px,100%);text-align:center;border-bottom:5px solid var(--laguna);background:#d6eadf;color:var(--laguna);letter-spacing:.08em;border-radius:7px;line-height:1.15;padding:10px 6px}#phrase .wrong{color:var(--laguna);background:#d6eadf;border-bottom:5px solid var(--laguna);text-decoration:underline wavy;text-underline-offset:8px}#phrase .solved{color:var(--laguna);background:#d6eadf;border-bottom:5px solid var(--laguna)}#lemma{font-size:1rem;font-weight:800;line-height:1.5;background:var(--cielo);padding:12px;border-radius:10px;margin-bottom:22px}.answer-label{font-size:.85rem;display:block;font-weight:750;margin-bottom:8px}.input-row{display:flex;gap:8px;min-width:0}input{min-width:0;width:100%;border:1px solid var(--line);border-radius:10px;min-height:52px;padding:12px;background:white;color:var(--inchiostro);font-size:18px}.primary{background:var(--limone);border-color:var(--limone)}.accents{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.accents button{min-height:38px;padding:4px 12px}.feedback{margin-top:18px;padding:14px;border-radius:10px;line-height:1.5;background:var(--cielo);min-height:58px;font-size:.9rem}.feedback.good{background:#d6eadf}.feedback.bad{background:#f9e0d7}.feedback strong{display:block}.en{font-size:.72rem;color:var(--muted);margin:8px 0 0}#next{width:100%;margin-top:13px;background:var(--laguna);color:var(--carta)}.score{display:flex;justify-content:space-between;gap:12px;font-size:.77rem;margin:14px 3px;color:var(--laguna);font-variant-numeric:tabular-nums}.track{height:6px;border-radius:8px;background:var(--line);overflow:hidden}.track i{display:block;height:100%;background:var(--corallo);width:0}footer{font-size:.73rem;color:var(--muted);line-height:1.5;margin-top:25px}[hidden]{display:none!important}@media(max-width:720px){.layout{grid-template-columns:1fr}.lesson{padding:18px}.rules{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.toolbar #shuffle{margin-left:0;flex-grow:1}.ticket-top,.exercise{padding:18px}main{padding-top:20px}}@media(max-width:420px){.rules{display:block}.input-row{flex-wrap:wrap}.input-row .primary{width:100%}.toolbar button{padding:9px 10px;font-size:.85rem}}\n\n/* Answer frames stay green until a nonempty answer is checked and rejected. */\n#answer{border:2px solid var(--laguna);background:#f3faf5;opacity:1;-webkit-text-fill-color:var(--inchiostro);}\n#answer:focus{outline:3px solid var(--laguna);outline-offset:3px}\n#answer[data-state=\"bad\"]{border-color:var(--corallo);background:#f9e0d7}\n#answer[data-state=\"bad\"]:focus{outline-color:var(--corallo)}\n#phrase[data-state=\"bad\"] .blank,#phrase[data-state=\"bad\"] .wrong,#phrase[data-state=\"bad\"] .given{color:var(--corallo);border-color:var(--corallo);background:#f9e0d7}\n\n/* Keep the answer usable beside two 44px phone controls. */\n.input-row{flex-wrap:wrap;align-items:center}.input-row input{flex:1 1 140px;width:0}\n#speak{min-width:44px;min-height:44px;flex:none;white-space:nowrap}\n#speak[aria-pressed=\"true\"]{background:#345b55;color:#fffdf8}\n#speech-status{font-size:.78rem;line-height:1.4;margin:8px 0 0;min-height:1.4em}\n.back-link{display:inline-block;margin:0 0 12px;padding:10px 0;color:inherit;font-weight:700;min-height:44px;box-sizing:border-box}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003ca class=\"back-link\" href=\"index.html?v=48\" target=\"_top\">\u00ab Tutte le schede\u003c/a>\n\u003cheader>\u003cdiv class=\"eyebrow\">Italiano in tasca \u00b7 Nadiia \u00b7 v48\u003c/div>\u003ch1>Una frase.\u003cbr>Il verbo giusto.\u003c/h1>\u003cp>Leggi tutta la frase. Guarda infinito, tempo e persona, poi scrivi soltanto la forma del verbo.\u003c/p>\u003c/header>\n\u003cdiv class=\"layout\">\n\u003caside class=\"lesson\" aria-label=\"Regole dei tempi\">\u003ch2>Cinque tempi, una scelta.\u003c/h2>\u003col class=\"rules\">\n\u003cli>\u003cb>Presente\u003c/b>: adesso o un\u2019abitudine.\u003cbr>Io vado, tu fai, lei capisce.\u003c/li>\n\u003cli>\u003cb>Passato prossimo\u003c/b>: un fatto concluso.\u003cbr>Ho mangiato; sono partita.\u003cbr>\u003cb>Avere / essere al presente + participio passato.\u003c/b>\u003c/li>\n\u003cli>\u003cb>Imperfetto\u003c/b>: abitudini, descrizioni, azioni in corso nel passato.\u003cbr>Leggevo, bevevi, eravamo.\u003c/li>\n\u003cli>\u003cb>Futuro semplice\u003c/b>: un fatto futuro.\u003cbr>Andr\u00f2, avrai, partir\u00e0.\u003c/li>\n\u003cli>\u003cb>Condizionale presente\u003c/b>: desideri, richieste, possibilit\u00e0.\u003cbr>Vorrei; se fosse possibile, andrei.\u003c/li>\n\u003c/ol>\u003cdiv class=\"note\">\u003cb>Con essere, accorda il participio:\u003c/b>\u003cbr>lui \u00e8 andato \u00b7 lei \u00e8 andata\u003cbr>noi siamo andate (f.)\u003cbr>loro sono andati (m.)\u003cbr>\u003cbr>Con \u003cb>avere\u003c/b>, qui il participio resta in \u003cb>-o\u003c/b>. Leggi il genere indicato per ogni persona.\u003c/div>\u003c/aside>\n\u003csection class=\"practice\" aria-l sta();\n const festa=$('festa'),long=streak>=20,label=document.createElement('span');\n label.className='festa-label';\n label.textContent=streak===5?'Cinque di fila.':streak===10?'Dieci di fila.':streak===20?'Venti di fila.':streak+' di fila.';\n festa.appendChild(label);\n const dots=long?18:streak===10?10:6;\n for(let i=0;i\u003cdots;i++){\n  const dot=document.createElement('span'),angle=2*Math.PI*i/dots,distance=long?100+i%3*14:75+i%3*10;\n  dot.className='festa-dot';dot.setAttribute('aria-hidden','true');\n  dot.style.setProperty('--x',Math.cos(angle)*distance+'px');\n  dot.style.setProperty('--y',Math.sin(angle)*distance+'px');festa.appendChild(dot);\n }\n if(streak>=10)festa.classList.add('grande');\n if(long)festa.classList.add('lunga');\n $('pair-board').style.setProperty('--festa-duration',long?'3s':'2.2s');\n festa.classList.add('show');$('pair-board').classList.add('festive');\n festaTimer=setTimeout(hideFesta,long?3000:2200);\n}\nfunction updateStreak(celebrate=false){\n try{sessionStorage.setItem('coppie-streak',String(streak));}catch{}\n $('streak-line').textContent=streak?streak+' di fila.':'';\n if(!streak)hideFesta();\n else if(celebrate&&(streak===5||streak%10===0))showFesta();\n}\nfunction shuffle(items){\n const result=items.slice();\n for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}\n return result;\n}\nfunction drawRound(){\n const drawn=[];\n const eligible=id=>!drawn.some(other=>other===id||PAIRS[other][0].toLowerCase()===PAIRS[id][0].toLowerCase()||PAIRS[other][1].toLowerCase()===PAIRS[id][1].toLowerCase());\n while(drawn.length\u003cMath.min(5,PAIRS.length)){\n  if(!queue.length)queue=shuffle(PAIRS.map((_,id)=>id));\n  let index=queue.findIndex(eligible);\n  // A mixed-deck boundary can contain synonyms: never show ambiguous matches.\n  if(index\u003c0){queue=shuffle(PAIRS.map((_,id)=>id));index=queue.findIndex(eligible);}\n  if(index\u003c0)break;\n  drawn.push(queue.splice(index,1)[0]);\n }\n return drawn;\n}\nfunction uniquePairs(decks){\n const pairs=[],seen=new Set();\n for(const deck of decks)for(const pair of deck.pairs){\n  const key=JSON.stringify(pair.map(word=>word.toLowerCase()));\n  if(!seen.has(key)){seen.add(key);pairs.push(pair);}\n }\n return pairs;\n}\nfunction updateDecks(changedInput){\n if(changedInput){streak=0;updateStreak();}\n if(changedInput&&changedInput.checked){\n  for(const input of deckInputs)if(input!==changedInput&&(changedInput.value==='tutto'||input.value==='tutto'))input.checked=false;\n }\n const selectedIds=new Set(deckInputs.filter(input=>input.checked).map(input=>input.value));\n const tutto=selectedIds.has('tutto');\n const chosen=tutto?DECKS:DECKS.filter(deck=>selectedIds.has(deck.id));\n PAIRS=uniquePairs(chosen);\n $('selection-count').textContent=tutto?'Tutto \u00b7 '+PAIRS.length+' carte':chosen.length+' selezionat'+(chosen.length===1?'o':'i');\n $('deck-count').textContent=tutto?'Tutto \u00b7 '+PAIRS.length+' carte':chosen.length===1?chosen[0].label+' \u00b7 '+PAIRS.length+' carte':chosen.length+' mazzi \u00b7 '+PAIRS.length+' carte';\n queue=[];newRound();\n}\nfunction renderDeckPicker(){\n const label=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span');\n input.type='checkbox';input.id='tutto';input.value='tutto';input.checked=false;input.onchange=()=>updateDecks(input);\n text.textContent='Tutto \u00b7 '+uniquePairs(DECKS).length;\n label.appendChild(input);label.appendChild(text);$('deck-picker').appendChild(label);deckInputs.push(input);\n for(const deck of DECKS){\n  const label=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span');\n  input.type='checkbox';input.value=deck.id;input.checked=deck.id==='18-ott';input.onchange=()=>updateDecks(input);\n  text.textContent=deck.label+' \u00b7 '+deck.pairs.length;\n  label.appendChild(input);label.appendChild(text);$('deck-picker').appendChild(label);deckInputs.push(input);\n }\n}\nfunction stopTimer(){if(timer!==null)clearInterval(timer);timer=null;}\nfunction tick(){\n const remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));\n $('clock').textContent=remaining+' s';\n if(!remaining){\n  stopTimer();expired=true;$('next').disabled=false;\n  $('feedback').textContent='Tempo finito. Continua con calma, oppure passa alle prossime coppie.';\n }\n}\nfunction startTimer(){\n stopTimer();expired=false;\n $('next').disabled=matched.size!==round.length;\n if(!timerChoice||!round.length){$('clock').textContent='Nessuna fretta';if(!round.length)$('next').disabled=true;return;}\n if(matched.size===round.length)return;\n deadline=Date.now()+timerChoice*1000;tick();timer=setInterval(tick,200);\n}\nfunction clearSelection(){\n for(const side of ['en','it']){\n  const tile=selected[side];\n  if(tile){tile.classList.remove('selected','wrong');tile.setAttribute('aria-pressed','false');}\n  selected[side]=null;\n }\n}\nfunction choose(tile,side,id){\n if(busy||matched.has(id))return;\n if(selected[side]===tile){tile.classList.remove('selected');tile.setAttribute('aria-pressed','false');selected[side]=null;return;}\n if(selected[side]){selected[side].classList.remove('selected');selected[side].setAttribute('aria-pressed','false');}\n selected[side]=tile;tile.classList.add('selected');tile.setAttribute('aria-pressed','true');\n if(!selected.en||!selected.it)return;\n if(selected.en.dataset.pair===selected.it.dataset.pair){\n  matched.add(id);streak++;updateStreak(true);\n  for(const tile of [selected.en,selected.it]){\n   tile.classList.add('matched');tile.disabled=true;\n   tile.setAttribute('aria-label','Coppia trovata: '+tile.textContent);\n  }\n  clearSelection();$('count').textContent=matched.size+' / '+round.length;\n  $('feedback').textContent='Coppia trovata. Avanti cos\u00ec.';\n  if(matched.size===round.length){stopTimer();$('next').disabled=false;$('feedback').textContent='Tutte e cinque! Pronta per altre coppie?';}\n }else{\n  streak=0;updateStreak();\n  busy=true;selected.en.classList.add('wrong');selected.it.classList.add('wrong');\n  $('feedback').textContent='Non \u00e8 questa coppia. Riprova, senza fretta.';\n  mismatch=setTimeout(()=>{clearSelection();busy=false;mismatch=null;},420);\n }\n}\nfunction makeTile(id,side){\n const tile=document.createElement('button');\n tile.type='button';tile.className='tile';tile.dataset.pair=String(id);\n tile.textContent=PAIRS[id][side==='en'?1:0];tile.setAttribute('lang',side==='en'?'en':'it');\n tile.setAttribute('aria-pressed','false');tile.onclick=()=>choose(tile,side,id);\n return tile;\n}\nfunction newRound(){\n if(mismatch!==null)clearTimeout(mismatch);mismatch=null;\n stopTimer();clearSelection();matched=new Set();busy=false;round=drawRound();\n const left=shuffle(round);let right=shuffle(round);\n // Shuffle both columns separately, rejecting accidental matching rows.\n for(let tries=0;tries\u003c20&&left.some((id,i)=>id===right[i]);tries++)right=shuffle(round);\n if(left.some((id,i)=>id===right[i]))right=left.slice(1).concat(left[0]);\n $('english').replaceChildren(...left.map(id=>makeTile(id,'en')));\n $('italian').replaceChildren(...right.map(id=>makeTile(id,'it')));\n $('count').textContent='0 / '+round.length;updateStreak();\n $('feedback').textContent=round.length?'Tocca una parola e la sua traduzione.':'Scegli almeno un mazzo per iniziare.';\n startTimer();\n}\nchips.forEach(chip=>{chip.onclick=()=>{\n const seconds=Number(chip.dataset.seconds);timerChoice=seconds===timerChoice?0:seconds;\n chips.forEach(c=>c.setAttribute('aria-pressed',String(Number(c.dataset.seconds)===timerChoice)));\n $('feedback').textContent=timerChoice?'Timer per ogni round. Puoi spegnerlo quando vuoi.':'Senza timer. Tutto il tempo che vuoi.';\n startTimer();\n};});\n$('next').onclick=newRound;\nrenderDeckPicker();\nupdateDecks();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script>
'use strict';
const keys=["carte","articoli","aggettivi","verbi","coppie"];
const routes={'index.html':'carte','italiano-flashcards.html':'carte','articoli-esercizi.html':'articoli','articoli-aggettivi.html':'aggettivi','verbi-tempi.html':'verbi','coppie.html':'coppie'};
const files={"carte":"italiano-flashcards.html","articoli":"articoli-esercizi.html","aggettivi":"articoli-aggettivi.html","verbi":"verbi-tempi.html","coppie":"coppie.html"};
const ready=new Set();
function activate(key,focus=false){
 if(!keys.includes(key))key='carte';
 // Typed dictation must own the top-level document and the original tap.
 if(['articoli','aggettivi','verbi'].includes(key)){window.top.location.assign(files[key]+'?v=48');return;}
 keys.forEach(k=>{
  const tab=document.getElementById('tab-'+k),selected=k===key;
  tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;
  const panel=document.getElementById('panel-'+k);if(panel)panel.hidden=!selected;
 });
 const frame=document.getElementById('frame-'+key);
 if(!ready.has(key)){
  ready.add(key);
  frame.addEventListener('load',()=>{
   const doc=frame.contentDocument;
   if(!doc||!doc.querySelector('main'))return;
   if(key==='carte'){
    // Explicit face visibility avoids mirrored backfaces in iOS/WebKit iframe compositing.
    const style=doc.createElement('style');
    style.textContent='.scene .card{transform:none!important;transition:none!important}.scene .face{transform:none!important;backface-visibility:visible!important;-webkit-backface-visibility:visible!important}.scene .back{visibility:hidden}.scene.flipped .front{visibility:hidden}.scene.flipped .back{visibility:visible}';
    doc.head.appendChild(style);
   }
   doc.addEventListener('click',event=>{
    if(event.defaultPrevented||event.target.closest('#direction'))return;
    const link=event.target.closest('a[href]');
    if(!link)return;
    const file=link.getAttribute('href').split('?')[0].split('/').pop();
    if(routes[file]){event.preventDefault();activate(routes[file],true);}
   });
   document.getElementById('loading-'+key).hidden=true;
  });
  frame.srcdoc=JSON.parse(document.getElementById('app-'+key).textContent);
  // srcdoc keeps the hub offline; versioned src is its browser fallback.
  frame.src=files[key]+'?v='+(['carte','coppie'].includes(key)?59:48);
 }
 if(location.hash!=='#'+key)history.replaceState(null,'','#'+key);
 if(focus)document.getElementById('tab-'+key).focus();
}
keys.forEach((key,index)=>{
 const tab=document.getElementById('tab-'+key);
 tab.addEventListener('click',()=>activate(key));
 tab.addEventListener('keydown',event=>{
  let next=index;
  if(event.key==='ArrowRight')next=(index+1)%keys.length;
  else if(event.key==='ArrowLeft')next=(index+keys.length-1)%keys.length;
  else if(event.key==='Home')next=0;
  else if(event.key==='End')next=keys.length-1;
  else return;
  event.preventDefault();activate(keys[next],true);
 });
});
window.addEventListener('hashchange',()=>activate(location.hash.slice(1)));
activate(location.hash.slice(1));
</script>
