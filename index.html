 16 settembre 2026 · Viaggio con Liam · Unità 4 Liguria · Nord/Sud\"},{\"it\":\"Presente: come si formano i verbi regolari?\",\"other\":\"parlare: parlo, parli, parla, parliamo, parlate, parlano. prendere: prendo, prendi, prende, prendiamo, prendete, prendono. dormire: dormo, dormi, dorme, dormiamo, dormite, dormono. Match the subject.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Capire, finire, preferire, pulire: dove va -isc-?\",\"other\":\"capisco, capisci, capisce, capiamo, capite, capiscono. Also: finisco, preferisci, pulisce. No -isc- with noi or voi.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Essere e avere: il presente?\",\"other\":\"essere: sono, sei, è, siamo, siete, sono. avere: ho, hai, ha, abbiamo, avete, hanno. These are also the auxiliaries for passato prossimo.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Andare e venire: il presente?\",\"other\":\"andare: vado, vai, va, andiamo, andate, vanno. venire: vengo, vieni, viene, veniamo, venite, vengono.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Fare e stare: il presente?\",\"other\":\"fare: faccio, fai, fa, facciamo, fate, fanno. stare: sto, stai, sta, stiamo, state, stanno.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Dare e dire: il presente?\",\"other\":\"dare: do, dai, dà, diamo, date, danno. dire: dico, dici, dice, diciamo, dite, dicono. Dà needs an accent; do does not.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Potere, volere, dovere: il presente?\",\"other\":\"posso, puoi, può, possiamo, potete, possono. voglio, vuoi, vuole, vogliamo, volete, vogliono. devo, devi, deve, dobbiamo, dovete, devono (also debbo / debbono).\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Sapere, bere, uscire: il presente?\",\"other\":\"so, sai, sa, sappiamo, sapete, sanno. bevo, bevi, beve, beviamo, bevete, bevono. esco, esci, esce, usciamo, uscite, escono.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Passato prossimo: quali due pezzi servono?\",\"other\":\"Present auxiliary + past participle: io ho mangiato; lei è partita. Both words belong in the answer. A completed event in the past.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Con avere, il participio cambia in queste frasi?\",\"other\":\"No: io ho mangiato; lei ha mangiato; noi abbiamo mangiato. With a following direct object, keep the participle unchanged. Object-pronoun agreement is a separate rule.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Con essere, come concorda il participio?\",\"other\":\"lui è andato; lei è andata; loro sono andati (m. / mixed); loro sono andate (all f.). Match the subject in gender and number.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Andare, venire, uscire, arrivare, partire: l’ausiliare?\",\"other\":\"Use essere here: sono andata, è venuta, siamo usciti, siete arrivati, sono partite. Not every movement verb takes essere: ho camminato.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Essere e stare: il passato prossimo?\",\"other\":\"essere: sono stato / stata; siamo stati / state. stare: sono stato / stata; siamo stati / state. Both use essere + stato, with subject agreement.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Fare, dire, bere: il participio passato?\",\"other\":\"fare → fatto; dire → detto; bere → bevuto. Examples: ho fatto una passeggiata; hai detto la verità; ha bevuto acqua.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Prendere, mettere, vedere: il participio passato?\",\"other\":\"prendere → preso; mettere → messo; vedere → visto (also veduto). Examples: ho preso il treno; ho messo il libro sul tavolo; ho visto un film.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Scrivere, leggere, vivere: il participio passato?\",\"other\":\"scrivere → scritto; leggere → letto; vivere → vissuto. Ho scritto una lettera; ho letto un libro; ho vissuto una bella esperienza. Transitive vivere uses avere.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Potere, volere, dovere, sapere: il participio passato?\",\"other\":\"potuto, voluto, dovuto, saputo. Ho potuto fare una pausa; ho voluto un caffè; ho dovuto pagare il conto; ho saputo la notizia. Modal auxiliary choice can depend on the following infinitive.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Passato prossimo o imperfetto?\",\"other\":\"Ieri ho letto un libro: completed event. Prima leggevo ogni sera: past habit. Mentre leggevo, è arrivata Anna: background action + event.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Imperfetto: quali sono le desinenze?\",\"other\":\"-vo, -vi, -va, -vamo, -vate, -vano. parlavo, prendevi, dormiva; parlavamo, prendevate, dormivano. Keep the conjugation vowel: a / e / i.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Essere, fare, dire, bere: l’imperfetto?\",\"other\":\"ero, eri, era, eravamo, eravate, erano. fare → facevo; dire → dicevo; bere → bevevo. Continue with -vi, -va, -vamo, -vate, -vano.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Futuro semplice: quali sono le desinenze?\",\"other\":\"-ò, -ai, -à, -emo, -ete, -anno. parlerò, parlerai, parlerà, parleremo, parlerete, parleranno. Regular -are changes to -er-; -ere uses -er-; -ire uses -ir-.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Futuro: essere, avere, andare, venire?\",\"other\":\"sarò, avrò, andrò, verrò. Stems: sar-, avr-, andr-, verr-. Add -ò, -ai, -à, -emo, -ete, -anno: lei sarà; noi avremo; loro verranno.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Futuro: fare, dare, stare, bere, volere?\",\"other\":\"farò, darò, starò, berrò, vorrò. Also: potrò, dovrò, saprò, vedrò, vivrò. Mangiare → mangerò, not mangierò.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Condizionale presente: come si forma?\",\"other\":\"Use the future stem + -ei, -esti, -ebbe, -emmo, -este, -ebbero. parlerei, parleresti, parlerebbe, parleremmo, parlereste, parlerebbero.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"Vorrei, potrei, dovrei: quando si usano?\",\"other\":\"Vorrei un caffè: polite wish. Potrei fare una pausa?: polite request / possibility. Dovrei studiare: advice or obligation softened. Se fosse possibile, andrei a Roma. Conditional: sarei, avrei, farei, verrei.\",\"lang\":\"EN\",\"group\":\"Grammatica · verbi\",\"note\":\"Regola · grammar/verbi · IT → EN\",\"tags\":[\"grammar\",\"verbi\"]},{\"it\":\"ghiro\",\"other\":\"dormouse\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Animals and pronunciation · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"gnomo\",\"other\":\"gnome\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Animals and pronunciation · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"sciarpa\",\"other\":\"scarf\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Animals and pronunciation · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"scimmia\",\"other\":\"monkey\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Animals and pronunciation · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"scendere\",\"other\":\"to go down\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Animals and pronunciation · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"il forziere\",\"other\":\"treasure chest\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Fantasy adventures · IT → EN\",\"tags\":[\"liam\",\"vocab\",\"nord-sud\"]},{\"it\":\"il teschio\",\"other\":\"skull\",\"lang\":\"EN\",\"group\":\"Liam · Nord/Sud · Liguria\",\"note\":\"Liam · Full document vocabulary · Fantasy adventures · IT → EN\",\"tag stro)}#rule{font-weight:750;line-height:1.45;font-size:.95rem}#rule-en{color:#dceff1;margin-top:6px}.exercise{padding:22px 23px 24px;border-top:2px dashed var(--line)}.meta{display:flex;justify-content:space-between;gap:10px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--laguna)}#phrase{font-size:clamp(2.05rem,7vw,3.35rem);line-height:1.1;font-weight:850;letter-spacing:-.05em;margin:24px 0 8px;overflow-wrap:anywhere}#phrase .blank,#phrase .given{color:var(--laguna)}#gloss{font-size:.8rem;color:var(--muted);margin:0 0 21px}.answer-label{font-size:.8rem;font-weight:750;display:block;margin-bottom:8px}.input-row{display:flex;gap:8px;min-width:0}input{min-width:0;width:100%;border:1px solid var(--line);border-radius:10px;min-height:48px;padding:11px;background:white;color:var(--inchiostro);font-size:16px}.primary{background:var(--limone);border-color:var(--limone)}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.choices button{font-size:1.15rem;padding:10px 5px}select{padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--carta);color:var(--inchiostro);font-size:16px}#input-method{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;font-size:.78rem;color:var(--muted)}.feedback{margin-top:18px;padding:14px;border-radius:10px;line-height:1.5;background:var(--cielo);min-height:58px;font-size:.86rem}.feedback.good{background:#d6eadf}.feedback.bad{background:#f9e0d7}.feedback strong{display:block}#next{width:100%;margin-top:13px;background:var(--laguna);color:var(--carta);border-color:var(--laguna)}.score{display:flex;justify-content:space-between;gap:12px;font-size:.77rem;margin:14px 3px;color:var(--laguna);font-variant-numeric:tabular-nums}.track{height:6px;border-radius:8px;background:#b6ccc7;overflow:hidden}.track i{display:block;height:100%;background:var(--corallo);width:0}footer{font-size:.73rem;color:var(--muted);line-height:1.5;margin-top:25px}.hidden,[hidden]{display:none!important}@media(max-width:720px){.layout{grid-template-columns:1fr}.lesson{padding:18px}.rules{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}header{align-items:center}.stamp{width:70px;height:70px;font-size:.6rem}main{padding-top:20px}.toolbar #shuffle{margin-left:0;flex-grow:1}.ticket-top,.exercise{padding:18px}}@media(max-width:420px){.rules{display:block}.stamp{display:none}.choices{grid-template-columns:repeat(4,minmax(0,1fr))}.toolbar button{padding:9px 10px;font-size:.85rem}.input-row{flex-wrap:wrap}.input-row .primary{width:100%}}\n\n/* Answer frames stay green until a nonempty answer is checked and rejected. */\n#answer{border:2px solid var(--laguna);background:#f3faf5;opacity:1;-webkit-text-fill-color:var(--inchiostro);}\n#answer:focus{outline:3px solid var(--laguna);outline-offset:3px}\n#answer[data-state=\"bad\"]{border-color:var(--corallo);background:#f9e0d7}\n#answer[data-state=\"bad\"]:focus{outline-color:var(--corallo)}\n#phrase[data-state=\"bad\"] .blank,#phrase[data-state=\"bad\"] .wrong,#phrase[data-state=\"bad\"] .given{color:var(--corallo);border-color:var(--corallo);background:#f9e0d7}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cheader>\u003cdiv>\u003cdiv class=\"eyebrow\">Italiano in tasca · Nadiia · v30\u003c/div>\u003ch1>Piccole parole.\u003cbr>Regole precise.\u003c/h1>\u003cp>Prima la regola, poi la prova: scegli l’articolo o correggi l’errore.\u003c/p>\u003cdiv class=\"legend\" aria-label=\"Tre famiglie di articoli\">\u003cspan class=\"article\">il / lo / l’\u003c/span>\u003cspan class=\"article\">un / uno / un’\u003c/span>\u003cspan class=\"article\">dei / degli / delle\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"stamp\">ARTICOLI\u003cbr>80 PROVE\u003cbr>OFFLINE\u003c/div>\u003c/header>\n\u003cdiv class=\"layout\">\n\u003caside class=\"lesson\" aria-label=\"Regole degli articoli\">\n\u003cp class=\"step\">\u003cspan>1\u003c/span> Leggi la regola\u003c/p>\u003ch2>Genere + numero\u003cbr>+ inizio della parola.\u003c/h2>\n\u003cul class=\"rules\">\n\u003cli>\u003cb>Determinativi = “the”.\u003c/b>\u003cbr>Maschile: \u003cb>il → i\u003c/b>, \u003cb>lo / l’ → gli\u003c/b>.\u003cbr>Femminile: \u003cb>la / l’ → le\u003c/b>.\u003c/li>\n\u003cli>\u003cb>Lo / uno\u003c/b> davanti a \u003cb>s + consonante, z, gn, pn, ps, x, y\u003c/b> consonantica.\u003cbr>\u003cspan class=\"en\">lo studente, uno yogurt; but il signore.\u003c/span>\u003c/li>\n\u003cli>\u003cb>Una\u003c/b> + consonante; \u003cb>un’\u003c/b> + vocale (femminile).\u003cbr>\u003cb>Un\u003c/b> + consonante normale o vocale (maschile).\u003cspan class=\"en\">un’amica, but un amico: no apostrophe for masculine un.\u003c/span>\u003c/li>\n\u003cli>\u003cb>Some\u003c/b>, al plurale: \u003cb>dei\u003c/b> dove usi i; \u003cb>degli\u003c/b> dove usi gli; \u003cb>delle\u003c/b> dove usi le.\u003cspan class=\"en\">Here these are partitive articles = some, not “of the”.\u003c/span>\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"special\">\u003cb>Tre trappole.\u003c/b>\u003cbr>lo yogurt → gli yogurt (invariabile)\u003cbr>la paga → le paghe\u003cbr>il chirurgo → i chirurghi\u003cspan class=\"en\">Use the standard lo / uno forms for pneumatico.\u003c/span>\u003c/div>\n\u003cdetails>\u003csummary>Apri la tabella · 20 parole\u003c/summary>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ccaption>Nomi delle tabelle PDF · forme standard\u003c/caption>\u003cthead>\u003ctr>\u003cth>Singolare\u003c/th>\u003cth>Plurale\u003c/th>\u003cth>Some\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"noun-table\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>\n\u003c/aside>\n\u003csection class=\"practice\" aria-label=\"Esercizi\">\n\u003cdiv class=\"toolbar\" role=\"group\" aria-label=\"Modalità\">\u003cbutton id=\"mode-a\" aria-pressed=\"true\">A · Completa\u003c/button>\u003cbutton id=\"mode-b\" aria-pressed=\"false\">B · Correggi\u003c/button>\u003cbutton id=\"shuffle\">Mescola ↺\u003c/button>\u003c/div>\n\u003cdiv class=\"ticket\">\n\u003cdiv class=\"ticket-top\">\u003cp class=\"step\">\u003cspan>2\u003c/span> Regola di questa prova\u003c/p>\u003cdiv id=\"rule\">\u003c/div>\u003csmall class=\"en\" id=\"rule-en\">\u003c/small>\u003c/div>\n\u003cdiv class=\"exercise\">\n\u003cdiv class=\"meta\">\u003cspan id=\"category\">\u003c/span>\u003cspan id=\"position\">\u003c/span>\u003c/div>\n\u003cdiv id=\"phrase\">\u003cspan class=\"blank\">___ \u003c/span>\u003cspan class=\"noun\">studente\u003c/span>\u003c/div>\u003cp id=\"gloss\">\u003c/p>\n\u003cdiv id=\"input-method\">\u003clabel for=\"method\">Come rispondi?\u003c/label>\u003cselect id=\"method\">\u003coption value=\"choose\">Scegli\u003c/option>\u003coption value=\"type\">Scrivi\u003c/option>\u003c/select>\u003c/div>\n\u003cform id=\"answer-form\">\u003clabel class=\"answer-label\" id=\"answer-label\" for=\"answer\">Scrivi solo l’articolo.\u003c/label>\u003cdiv class=\"input-row\">\u003cinput id=\"answer\" autocomplete=\"off\" autocapitalize=\"none\" spellcheck=\"false\" placeholder=\"Articolo\">\u003cbutton class=\"primary\" type=\"submit\" id=\"check\">Verifica\u003c/button>\u003c/div>\u003c/form>\n\u003cdiv class=\"choices\" id=\"choices\" role=\"group\" aria-label=\"Scegli l’articolo\">\u003c/div>\n\u003cdiv class=\"feedback\" id=\"feedback\" aria-live=\"polite\" aria-atomic=\"true\">Una risposta per prova. La soluzione arriva subito.\u003c/div>\n\u003cbutton id=\"next\" disabled>Prossima →\u003c/button>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"score\">\u003cspan id=\"score\">0 corrette / 0 risposte\u003c/span>\u003cspan id=\"accuracy\">—\u003c/span>\u003c/div>\u003cdiv class=\"track\" aria-label=\"Avanzamento\">\u003ci id=\"progress\">\u003c/i>\u003c/div>\n\u003c/section>\n\u003c/div>\n\u003cfooter>80 prove in ogni modalità · 20 nomi × 4 forme. “Mescola” e il cambio modalità iniziano una nuova sessione. Nessuna connessione, nessun account, nessun dato inviato.\u003c/footer>\n\u003c/main>\n\u003cscript>\n'use strict';\nconst NOUNS=[{\"sg\":\"bambino\",\"pl\":\"bambini\",\"gender\":\"m\",\"kind\":\"normal\",\"en\":\"child\"},{\"sg\":\"signore\",\"pl\":\"signori\",\"gender\":\"m\",\"kind\":\"normal\",\"en\":\"gentleman\"},{\"sg\":\"amico\",\"pl\":\"amici\",\"gender\":\"m\",\"kind\":\"vowel\",\"en\":\"friend (male)\"},{\"sg\":\"studente\",\"pl\":\"studenti\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"student\"},{\"sg\":\"gnocco\",\"pl\":\"gnocchi\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"gnocchi dumpling\"},{\"sg\":\"pneumatico\",\"pl\":\"pneumatici\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"tyre\"},{\"sg\":\"psicologo\",\"pl\":\"psicologi\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"psychologist\"},{\"sg\":\"xilofono\",\"pl\":\"xilofoni\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"xylophone\"},{\"sg\":\"yogurt\",\"pl\":\"yogurt\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"yogurt\"},{\"sg\":\"zaino\",\"pl\":\"zaini\",\"gender\":\"m\",\"kind\":\"special\",\"en\":\"backpack\"},{\"sg\":\"bambina\",\"pl\":\"bambine\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"girl\"},{\"sg\":\"moglie\",\"pl\":\"mogli\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"wife\"},{\"sg\":\"amica\",\"pl\":\"amiche\",\"gender\":\"f\",\"kind\":\"vowel\",\"en\":\"friend (female)\"},{\"sg\":\"paga\",\"pl\":\"paghe\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"wage\"},{\"sg\":\"chirurgo\",\"pl\":\"chirurghi\",\"gender\":\"m\",\"kind\":\"normal\",\"en\":\"surgeon\"},{\"sg\":\"bottiglia\",\"pl\":\"bottiglie\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"bottle\"},{\"sg\":\"portafoglio\",\"pl\":\"portafogli\",\"gender\":\"m\",\"kind\":\"normal\",\"en\":\"wallet\"},{\"sg\":\"borsa\",\"pl\":\"borse\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"bag\"},{\"sg\":\"chiave\",\"pl\":\"chiavi\",\"gender\":\"f\",\"kind\":\"normal\",\"en\":\"key\"},{\"sg\":\"bicchiere\",\"pl\":\"bicchieri\",\"gender\":\"m\",\"kind\":\"normal\",\"en\":\"drinking glass\"}];\nconst FORMS=['def-sg','def-pl','ind-sg','some-pl'];\nconst OPTIONS={'def-sg':['il','lo','la','l’'],'def-pl':['i','gli','le'],'ind-sg':['un','uno','una','un’'],'some-pl':['dei','degli','delle']};\nconst LABELS={'def-sg':'Determinativo · singolare','def-pl':'Determinativo · plurale','ind-sg':'Indeterminativo · singolare','some-pl':'Partitivo · plurale (some)'};\nfunction article(n,f){if(f==='def-sg')return n.kind==='vowel'?'l’':n.gender==='f'?'la':n.kind==='special'?'lo':'il';if(f==='def-pl')return n.gender==='f'?'le':n.kind==='normal'?'i':'gli';if(f==='ind-sg')return n.gender==='f'?(n.kind==='vowel'?'un’':'una'):(n.kind==='special'?'uno':'un');return n.gender==='f'?'delle':n.kind==='normal'?'dei':'degli';}\nfunction join(a,w){return a.endsWith('’')?a+w:a+' '+w;}\nconst ITEMS=NOUNS.flatMap(n=>FORMS.map(form=>({noun:n,form,word:form.endsWith('pl')?n.pl:n.sg,answer:article(n,form)})));\nconst $=id=>document.getElementById(id);\nlet mode='a',order=[],pos=0,answered=false,correct=0,total=0;\nfunction norm(s){return s.trim().toLowerCase().replace(/[’‘`´]/g,\"'\").replace(/\\s*'\\s*/g,\"'\").replace(/\\s+/g,' ').replace(/[.!?]+$/,'');}\nfunction ruleFor(item){const n=item.noun,f=item.form;let it,en;\nif(f==='some-pl'){it=n.gender==='f'?'Tutti i plurali femminili: delle, anche davanti a vocale.':n.kind==='normal'?'Maschile plurale con i → dei.':'Maschile plurale con gli → degli.';en='Plural partitive = some, not “of the”.';}\nelse if(f==='def-pl'){it=n.gender==='f'?'Femminile plurale: le, anche davanti a vocale.':n.kind==='normal'?'Maschile plurale: il diventa i.':'Maschile plurale: lo e l’ diventano gli.';en='Definite plural = the. No apostrophe in le or gli.';}\nelse if(f==='ind-sg'){it=n.gender==='f'?(n.kind==='vowel'?'Femminile + vocale: una diventa un’, con apostrofo.':'Femminile + consonante: una.'):(n.kind==='special'?'Maschile con inizio speciale: uno.':'Maschile: un, anche davanti a vocale; mai l’apostrofo.');en='Indefinite singular = a / an.';}\nelse{it=n.kind==='vowel'?'Davanti a vocale, al singolare: l’ (maschile o femminile).':n.gender==='f'?'Femminile singolare + consonante: la.':n.kind==='special'?'Maschile + s/consonante, z, gn, pn, ps, x, y consonantica: lo.':'Maschile singolare + consonante normale: il.';en='Definite singular = the.';}\nif(n.sg==='signore')it+=' Signore: s + vocale, non s + consonante.';\nif(n.sg==='yogurt')it+=' Yogurt: y consonantica; il plurale non cambia.';\nif(n.sg==='paga'&&f.endsWith('pl'))it+=' Paga → paghe.';\nif(n.sg==='chirurgo'&&f.endsWith('pl'))it+=' Chirurgo → chirurghi.';\nreturn {it,en};}\nfunction wrongFor(item){if(item.form==='ind-sg'&&item.noun.sg==='amico')return 'un’';if(item.form==='ind-sg'&&item.noun.sg==='amica')return 'un';return OPTIONS[item.form].find(a=>a!==item.answer);}\nfunction start(){order=ITEMS.slice();for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;correct=0;total=0;render();}\nfunction updateScore(){$('score').textContent=correct+' corrette / '+total+' risposte';$('accuracy').textContent=total?Math.round(correct/total*100)+'%':'—';$('progress').style.width=total/order.length*100+'%';}\nfunction setAnswerState(state){$('answer').setAttribute('data-state',state);$('phrase').setAttribute('data-state',state);}\nfunction render(){setAnswerState('idle');const item=order[pos];answered=false;const rule=ruleFor(item);$('rule').textContent=rule.it;$('rule-en').textContent=rule.en;$('category').textContent=LABELS[item.form];$('position').textContent=(pos+1)+' / '+order.length;\n$('phrase').textContent='';const lead=document.createElement('span');lead.className=mode==='a'?'blank':'given';const wrong=mode==='b'?wrongFor(item):'';lead.textContent=mode==='a'?'___ ':wrong+(wrong.endsWith('’')?'':' ');const noun=document.createElement('span');noun.className='noun';noun.textContent=item.word;$('phrase').appendChild(lead);$('phrase').appendChild(noun);\n$('gloss').textContent=item.noun.en+' · '+(item.noun.gender==='m'?'maschile':'femminile')+' · '+(item.form.endsWith('pl')?'plurale':'singolare');\nconst choosing=mode==='a'&&$('method').value==='choose';$('input-method').hidden=mode==='b';$('answer-form').hidden=choosing;$('choices').hidden=!choosing;$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('answer-label').textContent=mode==='b'?'Riscrivi tutta la frase con l’articolo corretto.':'Scrivi solo l’articolo.';$('answer').placeholder=mode==='b'?'Articolo + nome':'Articolo';\n$('choices').textContent='';OPTIONS[item.form].forEach(a=>{const b=document.createElement('button');b.type='button';b.textContent=a;b.onclick=()=>submit(a);$('choices').appendChild(b);});\n$('feedback').className='feedback';$('feedback').textContent=mode==='b'?'Correggi l’articolo: il nome è già giusto.':'Scegli o scrivi l’articolo richiesto.';$('next').disabled=true;$('next').textContent=pos===order.length-1?'Vedi il risultato →':'Prossima →';updateScore();}\nfunction submit(value){if(answered)return;if(!norm(value)){setAnswerState('idle');$('feedback').textContent='Scrivi una risposta prima di verificare.';return;}const item=order[pos],expected=mode==='b'?join(item.answer,item.word):item.answer;const good=norm(value)===norm(expected);setAnswerState(good?'good':'bad');answered=true;total++;if(good)correct++;\n$('feedback').textContent='';const strong=document.createElement('strong');strong.textContent=good?'Esatto! '+join(item.answer,item.word):'Non ancora. La forma corretta è '+join(item.answer,item.word)+'.';$('feedback').appendChild(strong);const explain=document.createElement('span');explain.textContent=ruleFor(item).it;$('feedback').appendChild(explain);$('feedback').className='feedback '+(good?'good':'bad');$('answer').disabled=true;$('check').disabled=true;Array.from($('choices').children).forEach(b=>b.disabled=true);$('next').disabled=false;updateScore();}\nfunction finish(){$('phrase').textContent='Sessione finita.';$('gloss').textContent=correct+' / '+order.length+' corrette · '+Math.round(correct/order.length*100)+'%';$('answer-form').hidden=true;$('choices').hidden=true;$('input-method').hidden=true;$('feedback').className='feedback';$('feedback').textContent='Rileggi le regole e premi “Mescola” per ricominciare. Puoi anche cambiare modalità.';$('next').disabled=true;$('next').textContent='Completato';}\nfunction setMode(m){mode=m;$('mode-a').setAttribute('aria-pressed',String(m==='a'));$('mode-b').setAttribute('aria-pressed',String(m==='b'));start();}\n$('mode-a').onclick=()=>setMode('a');$('mode-b').onclick=()=>setMode('b');$('shuffle').onclick=start;\n$('method').onchange=()=>{if(!answered)render();};\n$('answer-form').onsubmit=e=>{e.preventDefault();submit($('answer').value);};\n$('next').onclick=()=>{if(!answered)return;if(pos===order.length-1)finish();else{pos++;render();}};\nNOUNS.forEach(n=>{const tr=document.createElement('tr');[join(article(n,'def-sg'),n.sg),join(article(n,'def-pl'),n.pl),join(article(n,'some-pl'),n.pl)].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.appendChild(td);});$('noun-table').appendChild(tr);});\n$('answer').oninput=()=>setAnswerState('idle');\nstart();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script type="application/json" id="app-aggettivi">"\u003c!DOCTYPE html>\n\u003chtml lang=\"it\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cmeta name=\"theme-color\" content=\"#345b55\">\u003cmeta name=\"build-version\" content=\"v30\">\u003ctitle>Articoli + aggettivi · Nadiia\u003c/title>\n\u003cstyle>\n:root{--ink:#17302d;--green:#345b55;--paper:#fffdf8;--sky:#dceff1;--yellow:#f3d45b;--coral:#e87962;--line:#b6ccc7}*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:1100px;margin:auto;padding:28px clamp(16px,4vw,40px) 45px}.eyebrow,.meta{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--green)}h1{font-size:clamp(2.25rem,7vw,4rem);letter-spacing:-.055em;line-height:1;margin:12px 0}header p{line-height:1.5;max-width:58ch}header{margin-bottom:26px}.layout{display:grid;grid-template-columns:minmax(245px,.8fr) minmax(0,1.4fr);gap:22px;align-items:start}.rules{padding:23px;border:1px solid var(--line);border-radius:16px;background:#ffffff70;font-size:.92rem;line-height:1.55}.rules h2{font-size:1.4rem;line-height:1.15;margin-top:0;letter-spacing:-.03em}.switch{display:grid;grid-template-columns:30px 1fr;gap:10px;margin:18px 0}.switch b:first-child{width:28px;height:28px;display:grid;place-content:center;background:var(--green);color:white;border-radius:50%}.rules table{width:100%;border-collapse:collapse;font-size:.84rem}.rules th,.rules td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}details{margin-top:18px}summary{cursor:pointer;font-weight:750}.example{border-left:4px solid var(--coral);padding:10px 12px;background:var(--paper);margin:16px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button,input{font:inherit}button{min-height:46px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--paper);color:var(--ink);font-weight:750;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55;cursor:default}.toolbar button[aria-pressed=true],#next{background:var(--green);color:white}#shuffle{margin-left:auto;background:transparent}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:3px}.ticket{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 15px 35px #17302d12}.meta{display:flex;justify-content:space-between;gap:10px;padding:18px 22px;border-bottom:1px dashed var(--line);letter-spacing:.04em}.exercise{padding:22px}#lemma{font-size:clamp(3.2rem,10vw,5.2rem);font-weight:850;line-height:1.05;letter-spacing:-.055em;overflow-wrap:anywhere;margin:8px 0 22px}#phrase{font-size:clamp(1.5rem,5vw,2.25rem);font-weight:800;line-height:1.2;letter-spacing:-.03em;overflow-wrap:anywhere}#cue{font-size:1rem;color:var(--green);margin:8px 0 20px}#hint{background:#fff0ca;border-left:4px solid var(--yellow);padding:12px;font-size:.88rem;line-height:1.5;margin-bottom:18px}label{display:block;font-size:.82rem;font-weight:750;margin-bottom:8px}.input-row{display:flex;gap:8px}input{width:100%;min-width:0;min-height:50px;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-size:16px}.primary{background:var(--yellow);border-color:var(--yellow)}.feedback{background:var(--sky);min-height:62px;margin-top:18px;padding:14px;border-radius:10px;line-height:1.5;font-size:.92rem}.feedback.good{background:#d6eadf}.feedback.bad{background:#f9e0d7}#reveal{margin-top:12px;font-size:.85rem}#next{width:100%;margin-top:12px}.score{display:flex;justify-content:space-between;gap:10px;margin:14px 3px;font-size:.8rem;font-variant-numeric:tabular-nums}.track{height:6px;background:var(--line);border-radius:8px;overflow:hidden}.track i{height:100%;display:block;background:var(--coral);width:0}footer{font-size:.76rem;line-height:1.6;margin-top:24px;color:var(--green)}a{color:var(--green)}[hidden]{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.rules{padding:18px}.rules .switch{margin:10px 0}main{padding-top:20px}#shuffle{margin-left:0}.meta,.exercise{padding:18px}}@media(max-width:420px){.input-row{flex-wrap:wrap}.primary{width:100%}.toolbar button{font-size:.86rem;padding:9px 10px}.score{font-size:.73rem}}\n\n/* Answer frames stay green until a nonempty answer is checked and rejected. */\n#answer{border:2px solid var(--green);background:#f3faf5;opacity:1;-webkit-text-fill-color:var(--ink);}\n#answer:focus{outline:3px solid var(--green);outline-offset:3px}\n#answer[data-state=\"bad\"]{border-color:var(--coral);background:#f9e0d7}\n#answer[data-state=\"bad\"]:focus{outline-color:var(--coral)}\n#phrase[data-state=\"bad\"] .blank,#phrase[data-state=\"bad\"] .wrong,#phrase[data-state=\"bad\"] .given{color:var(--coral);border-color:var(--coral);background:#f9e0d7}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003cheader>\u003cdiv class=\"eyebrow\">Italiano in tasca · Nadiia · v30\u003c/div>\u003ch1>Tre interruttori.\u003cbr>Una frase intera.\u003c/h1>\u003cp>Articolo + nome + aggettivo. Completa le forme o correggi l’accordo: piccoli passi, frasi vere.\u003c/p>\u003c/header>\n\u003cdiv class=\"layout\">\u003caside class=\"rules\">\u003ch2>La concordanza è una tabella.\u003cbr>Non è un calcolo.\u003c/h2>\u003cdiv class=\"switch\">\u003cb>1\u003c/b>\u003cdiv>\u003cb>Genere\u003c/b>\u003cbr>Maschile o femminile: il problema, la mano, la foto.\u003c/div>\u003c/div>\u003cdiv class=\"switch\">\u003cb>2\u003c/b>\u003cdiv>\u003cb>Numero\u003c/b>\u003cbr>Singolare o plurale: l’amico alto → gli amici alti.\u003c/div>\u003c/div>\u003cdiv class=\"switch\">\u003cb>3\u003c/b>\u003cdiv>\u003cb>Classe dell’articolo\u003c/b>\u003cbr>il / lo / l’ · i / gli\u003cbr>la / l’ · le\u003cbr>Guarda il suono subito dopo l’articolo.\u003c/div>\u003c/div>\n\u003cdetails>\u003csummary>La tabella degli aggettivi\u003c/summary>\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>m.\u003c/th>\u003cth>f.\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Singolare\u003c/td>\u003ctd>alto\u003c/td>\u003ctd>alta\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Plurale\u003c/td>\u003ctd>alti\u003c/td>\u003ctd>alte\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Singolare in -e\u003c/td>\u003ctd>felice\u003c/td>\u003ctd>felice\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Plurale in -i\u003c/td>\u003ctd>felici\u003c/td>\u003ctd>felici\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>bianco → bianchi / bianche\u003cbr>lungo → lunghi / lunghe\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Prima del nome: bello e buono\u003c/summary>\u003cp>il bel libro · i bei libri\u003cbr>il bell’amico · i begli amici\u003cbr>il bello studente · i begli studenti\u003cbr>la bella casa · le belle case\u003cbr>un buon amico · un buono studente\u003cbr>una buona amica (anche: una buon’amica)\u003c/p>\u003cp>Dopo il nome: il libro bello, i libri belli. L’articolo cambia se l’aggettivo viene prima: \u003cb>lo studente → il bravo studente\u003c/b>.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Questo e quello\u003c/summary>\u003cp>questo libro · quest’amico\u003cbr>questa casa · quest’amica\u003cbr>questi libri · queste amiche\u003cbr>quel libro · quello studente · quell’amico\u003cbr>quei libri · quegli studenti · quegli amici\u003cbr>quella casa · quelle case\u003c/p>\u003cp>Sostituiscono l’articolo: non si dice «il questo libro». Davanti a vocale accettiamo anche questo amico / questa amica.\u003c/p>\u003c/details>\n\u003cdiv class=\"example\">«___ amico ___ (alto)»\u003cbr>→ un amico alto\u003cbr>\u003csmall>Il tipo di articolo è indicato sopra la prova. L’aiuto sul genere arriva solo dopo un errore.\u003c/small>\u003c/div>\u003c/aside>\n\u003csection aria-label=\"Esercizi di concordanza\">\u003cdiv class=\"toolbar\" role=\"group\" aria-label=\"Modalità\">\u003cbutton id=\"mode-a\" aria-pressed=\"true\">A · Completa\u003c/button>\u003cbutton id=\"mode-b\" aria-pressed=\"false\">B · Correggi\u003c/button>\u003cbutton id=\"shuffle\">Mescola ↺\u003c/button>\u003c/div>\u003cdiv class=\"ticket\">\u003cdiv class=\"meta\">\u003cspan id=\"category\">\u003c/span>\u003cspan id=\"position\">\u003c/span>\u003c/div>\u003cdiv class=\"exercise\">\u003cdiv id=\"lemma\">\u003c/div>\u003cdiv id=\"phrase\">\u003c/div>\u003cp id=\"cue\">\u003c/p>\u003cdiv id=\"hint\" hidden>\u003c/div>\u003cform id=\"answer-form\">\u003clabel for=\"answer\">Scrivi la frase completa\u003c/label>\u003cdiv class=\"input-row\">\u003cinput id=\"answer\" autocomplete=\"off\" autocapitalize=\"none\" spellcheck=\"false\" placeholder=\"Articolo + nome + aggettivo\">\u003cbutton id=\"check\" class=\"primary\" type=\"submit\">Verifica\u003c/button>\u003c/div>\u003c/form>\u003cdiv id=\"feedback\" class=\"feedback\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/div>\u003cbutton id=\"reveal\" hidden>Mostra la soluzione\u003c/button>\u003cbutton id=\"next\" disabled>Prossima →\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"score\">\u003cspan id=\"score\">\u003c/span>\u003cspan id=\"accuracy\">\u003c/span>\u003c/div>\u003cdiv class=\"track\" aria-label=\"Avanzamento\">\u003ci id=\"progress\">\u003c/i>\u003c/div>\u003c/section>\u003c/div>\n\u003cfooter>\u003cdiv id=\"inventory\">\u003c/div>Il punteggio conta il primo tentativo. Puoi riprovare senza penalità aggiuntive. «Mescola» e il cambio modalità iniziano una nuova sessione.\u003cbr>\u003ca id=\"flashcards-link\" href=\"italiano-flashcards.html?v=30\">Flashcard: regole di concordanza →\u003c/a> · \u003ca href=\"articoli-esercizi.html?v=30\">Solo articoli · v30 →\u003c/a>\u003cbr>Nessuna connessione, nessun account, nessun dato inviato.\u003c/footer>\n\u003c/main>\u003cscript>'use strict';\nconst NOUNS=[{\"sg\":\"casa\",\"pl\":\"case\",\"gender px;flex-wrap:wrap;margin-top:8px}.accents button{min-height:38px;padding:4px 12px}.feedback{margin-top:18px;padding:14px;border-radius:10px;line-height:1.5;background:var(--cielo);min-height:58px;font-size:.9rem}.feedback.good{background:#d6eadf}.feedback.bad{background:#f9e0d7}.feedback strong{display:block}.en{font-size:.72rem;color:var(--muted);margin:8px 0 0}#next{width:100%;margin-top:13px;background:var(--laguna);color:var(--carta)}.score{display:flex;justify-content:space-between;gap:12px;font-size:.77rem;margin:14px 3px;color:var(--laguna);font-variant-numeric:tabular-nums}.track{height:6px;border-radius:8px;background:var(--line);overflow:hidden}.track i{display:block;height:100%;background:var(--corallo);width:0}footer{font-size:.73rem;color:var(--muted);line-height:1.5;margin-top:25px}[hidden]{display:none!important}@media(max-width:720px){.layout{grid-template-columns:1fr}.lesson{padding:18px}.rules{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.toolbar #shuffle{margin-left:0;flex-grow:1}.ticket-top,.exercise{padding:18px}main{padding-top:20px}}@media(max-width:420px){.rules{display:block}.input-row{flex-wrap:wrap}.input-row .primary{width:100%}.toolbar button{padding:9px 10px;font-size:.85rem}}\n\n/* Answer frames stay green until a nonempty answer is checked and rejected. */\n#answer{border:2px solid var(--laguna);background:#f3faf5;opacity:1;-webkit-text-fill-color:var(--inchiostro);}\n#answer:focus{outline:3px solid var(--laguna);outline-offset:3px}\n#answer[data-state=\"bad\"]{border-color:var(--corallo);background:#f9e0d7}\n#answer[data-state=\"bad\"]:focus{outline-color:var(--corallo)}\n#phrase[data-state=\"bad\"] .blank,#phrase[data-state=\"bad\"] .wrong,#phrase[data-state=\"bad\"] .given{color:var(--corallo);border-color:var(--corallo);background:#f9e0d7}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cheader>\u003cdiv class=\"eyebrow\">Italiano in tasca · Nadiia · v30\u003c/div>\u003ch1>Una frase.\u003cbr>Il verbo giusto.\u003c/h1>\u003cp>Leggi tutta la frase. Guarda infinito, tempo e persona, poi scrivi soltanto la forma del verbo.\u003c/p>\u003c/header>\n\u003cdiv class=\"layout\">\n\u003caside class=\"lesson\" aria-label=\"Regole dei tempi\">\u003ch2>Cinque tempi, una scelta.\u003c/h2>\u003col class=\"rules\">\n\u003cli>\u003cb>Presente\u003c/b>: adesso o un’abitudine.\u003cbr>Io vado, tu fai, lei capisce.\u003c/li>\n\u003cli>\u003cb>Passato prossimo\u003c/b>: un fatto concluso.\u003cbr>Ho mangiato; sono partita.\u003cbr>\u003cb>Avere / essere al presente + participio passato.\u003c/b>\u003c/li>\n\u003cli>\u003cb>Imperfetto\u003c/b>: abitudini, descrizioni, azioni in corso nel passato.\u003cbr>Leggevo, bevevi, eravamo.\u003c/li>\n\u003cli>\u003cb>Futuro semplice\u003c/b>: un fatto futuro.\u003cbr>Andrò, avrai, partirà.\u003c/li>\n\u003cli>\u003cb>Condizionale presente\u003c/b>: desideri, richieste, possibilità.\u003cbr>Vorrei; se fosse possibile, andrei.\u003c/li>\n\u003c/ol>\u003cdiv class=\"note\">\u003cb>Con essere, accorda il participio:\u003c/b>\u003cbr>lui è andato · lei è andata\u003cbr>noi siamo andate (f.)\u003cbr>loro sono andati (m.)\u003cbr>\u003cbr>Con \u003cb>avere\u003c/b>, qui il participio resta in \u003cb>-o\u003c/b>. Leggi il genere indicato per ogni persona.\u003c/div>\u003c/aside>\n\u003csection class=\"practice\" aria-label=\"Esercizi sui verbi\">\n\u003cdiv class=\"toolbar\">\u003cbutton id=\"mode-a\" aria-pressed=\"true\">A · Completa\u003c/button>\u003cbutton id=\"mode-b\" aria-pressed=\"false\">B · Correggi\u003c/button>\u003cbutton id=\"shuffle\">Mescola\u003c/button>\u003c/div>\n\u003cdiv class=\"filter\">\u003clabel for=\"tense\">Tempo\u003c/label>\u003cselect id=\"tense\">\u003coption value=\"all\">Tutti i tempi\u003c/option>\u003coption>presente\u003c/option>\u003coption>passato prossimo\u003c/option>\u003coption>imperfetto\u003c/option>\u003coption>futuro semplice\u003c/option>\u003coption>condizionale presente\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv class=\"ticket\">\u003cdiv class=\"ticket-top\">\u003cstrong id=\"rule\">Infinito → forma coniugata\u003c/strong>\u003cspan id=\"instruction\">Completa lo spazio. Scrivi solo il verbo.\u003c/span>\u003c/div>\n\u003cdiv class=\"exercise\">\u003cdiv class=\"meta\" id=\"count\">Prova 1 / 900\u003c/div>\u003cp id=\"phrase\">Oggi io \u003cspan class=\"blank\">___\u003c/span> al mercato.\u003c/p>\u003cdiv id=\"lemma\">andare · presente · io (femminile)\u003c/div>\n\u003cform id=\"answer-form\">\u003clabel class=\"answer-label\" for=\"answer\">La forma corretta (anche due parole)\u003c/label>\u003cdiv class=\"input-row\">\u003cinput id=\"answer\" autocomplete=\"off\" autocapitalize=\"none\" spellcheck=\"false\" placeholder=\"Scrivi il verbo…\" aria-describedby=\"lemma feedback\">\u003cbutton id=\"check\" class=\"primary\" type=\"submit\">Controlla\u003c/button>\u003c/div>\u003c/form>\n\u003cdiv class=\"accents\" aria-label=\"Lettere accentate\">\u003cbutton type=\"button\" id=\"accent-a\">à\u003c/button>\u003cbutton type=\"button\" id=\"accent-e\">è\u003c/button>\u003cbutton type=\"button\" id=\"accent-ee\">é\u003c/button>\u003cbutton type=\"button\" id=\"accent-i\">ì\u003c/button>\u003cbutton type=\"button\" id=\"accent-o\">ò\u003c/button>\u003cbutton type=\"button\" id=\"accent-u\">ù\u003c/button>\u003c/div>\n\u003cdiv id=\"feedback\" class=\"feedback\" aria-live=\"polite\">Scrivi la forma, poi controlla.\u003c/div>\u003cp id=\"hint\" class=\"en\" hidden>\u003c/p>\u003cbutton id=\"next\" disabled>Avanti →\u003c/button>\n\u003c/div>\u003c/div>\u003cdiv class=\"score\">\u003cspan id=\"score\">Corrette: 0 / 0\u003c/span>\u003cspan id=\"inventory\">30 verbi · 900 prove per modalità\u003c/span>\u003c/div>\u003cdiv class=\"track\" aria-label=\"Avanzamento\">\u003ci id=\"progress\">\u003c/i>\u003c/div>\n\u003c/section>\u003c/div>\u003cfooter>Funziona offline, anche in Safari. Mescola ricomincia il punteggio. Conta solo il primo tentativo; dopo un errore puoi riprovare. Gli accenti fanno parte della risposta.\u003c/footer>\n\u003c/main>\n\u003cscript>\nconst VERBS=[{\"inf\":\"essere\",\"tail\":\"a casa\",\"aux\":\"essere\",\"pp\":\"stato\",\"presente\":[\"sono\",\"sei\",\"è\",\"siamo\",\"siete\",\"sono\"],\"imperfetto\":[\"ero\",\"eri\",\"era\",\"eravamo\",\"eravate\",\"erano\"],\"futuro\":[\"sarò\",\"sarai\",\"sarà\",\"saremo\",\"sarete\",\"saranno\"],\"condizionale\":[\"sarei\",\"saresti\",\"sarebbe\",\"saremmo\",\"sareste\",\"sarebbero\"]},{\"inf\":\"avere\",\"tail\":\"tempo per leggere\",\"aux\":\"avere\",\"pp\":\"avuto\",\"presente\":[\"ho\",\"hai\",\"ha\",\"abbiamo\",\"avete\",\"hanno\"],\"imperfetto\":[\"avevo\",\"avevi\",\"aveva\",\"avevamo\",\"avevate\",\"avevano\"],\"futuro\":[\"avrò\",\"avrai\",\"avrà\",\"avremo\",\"avrete\",\"avranno\"],\"condizionale\":[\"avrei\",\"avresti\",\"avrebbe\",\"avremmo\",\"avreste\",\"avrebbero\"]},{\"inf\":\"fare\",\"tail\":\"una passeggiata\",\"aux\":\"avere\",\"pp\":\"fatto\",\"presente\":[\"faccio\",\"fai\",\"fa\",\"facciamo\",\"fate\",\"fanno\"],\"imperfetto\":[\"facevo\",\"facevi\",\"faceva\",\"facevamo\",\"facevate\",\"facevano\"],\"futuro\":[\"farò\",\"farai\",\"farà\",\"faremo\",\"farete\",\"faranno\"],\"condizionale\":[\"farei\",\"faresti\",\"farebbe\",\"faremmo\",\"fareste\",\"farebbero\"]},{\"inf\":\"andare\",\"tail\":\"al mercato\",\"aux\":\"essere\",\"pp\":\"andato\",\"presente\":[\"vado\",\"vai\",\"va\",\"andiamo\",\"andate\",\"vanno\"],\"imperfetto\":[\"andavo\",\"andavi\",\"andava\",\"andavamo\",\"andavate\",\"andavano\"],\"futuro\":[\"andrò\",\"andrai\",\"andrà\",\"andremo\",\"andrete\",\"andranno\"],\"condizionale\":[\"andrei\",\"andresti\",\"andrebbe\",\"andremmo\",\"andreste\",\"andrebbero\"]},{\"inf\":\"venire\",\"tail\":\"a cena\",\"aux\":\"essere\",\"pp\":\"venuto\",\"presente\":[\"vengo\",\"vieni\",\"viene\",\"veniamo\",\"venite\",\"vengono\"],\"imperfetto\":[\"venivo\",\"venivi\",\"veniva\",\"venivamo\",\"venivate\",\"venivano\"],\"futuro\":[\"verrò\",\"verrai\" (PERSONS[p].gender==='f'?'e':'i'):(PERSONS[p].gender==='f'?'a':'o'));return AUX[v.aux][p]+' '+pp;}return v[t==='futuro semplice'?'futuro':t==='condizionale presente'?'condizionale':t][p];}\nconst ITEMS=[];\nVERBS.forEach(v=>TENSES.forEach(t=>PERSONS.forEach((p,i)=>{const prefix=t==='condizionale presente'?'Se fosse possibile, ':t==='presente'?'Oggi ':t==='passato prossimo'?'Ieri ':t==='imperfetto'?'Una volta, ogni giorno, ':'Domani ';ITEMS.push({inf:v.inf,tense:t,person:p.label,p:i,before:prefix+p.word+' ',after:' '+v.tail+'.',answer:answer(v,t,i),aux:v.aux,pp:v.pp});})));\nconst $=id=>document.getElementById(id);\nlet mode='a',order=[],pos=0,total=0,correct=0,tried=false,solved=false;\nfunction norm(s){return s.normalize('NFC').toLowerCase().trim().replace(/\\s+/g,' ');}\nfunction wrongForm(it){const v=VERBS.find(v=>v.inf===it.inf);if(it.tense==='passato prossimo'){if(it.aux==='essere')return AUX.essere[it.p]+' '+it.pp.slice(0,-1)+(it.p>=3?(PERSONS[it.p].gender==='f'?'i':'e'):(PERSONS[it.p].gender==='f'?'o':'a'));return AUX.essere[it.p]+' '+it.pp;}const other=answer(v,it.tense,(it.p+1)%6);return other!==it.answer?other:v.inf;}\nfunction showSentence(it,form,cls){const el=$('phrase');el.textContent='';el.appendChild(document.createTextNode(it.before));const gap=document.createElement('span');gap.className=cls;gap.textContent=form;el.appendChild(gap);el.appendChild(document.createTextNode(it.after));}\nfunction score(){ $('score').textContent='Corrette al primo tentativo: '+correct+' / '+total;$('progress').style.width=(pos/order.length*100)+'%';}\nfunction setAnswerState(state){$('answer').setAttribute('data-state',state);$('phrase').setAttribute('data-state',state);}\nfunction render(){setAnswerState('idle');tried=false;solved=false;$('answer').value='';$('hint').hidden=true;$('hint').textContent='';$('next').disabled=true;$('feedback').className='feedback';$('feedback').textContent='Scrivi la forma, poi controlla.';$('check').disabled=false;$('answer').disabled=false;\n$('mode-a').setAttribute('aria-pressed',mode==='a');$('mode-b').setAttribute('aria-pressed',mode==='b');$('instruction').textContent=mode==='a'?'Completa lo spazio. Scrivi solo il verbo.':'La forma sottolineata è sbagliata. Scrivi solo il verbo corretto.';\nif(pos>=order.length){$('phrase').textContent='Sessione finita.';$('lemma').textContent='Premi Mescola per ricominciare.';$('count').textContent=order.length+' prove completate';$('check').disabled=true;$('answer').disabled=true;$('feedback').textContent=correct+' risposte corrette al primo tentativo su '+total+'.';score();return;}\nconst it=order[pos];showSentence(it,mode==='a'?'___':wrongForm(it),mode==='a'?'blank':'wrong');$('lemma').textContent=it.inf+' · '+it.tense+' · '+it.person;$('count').textContent='Prova '+(pos+1)+' / '+order.length;score();}\nfunction start(m=mode){mode=m;order=ITEMS.filter(it=>$('tense').value==='all'||!$('tense').value||it.tense===$('tense').value).slice();for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;total=0;correct=0;render();}\nfunction acceptedAnswers(it){const out=[it.answer];if(it.inf==='dovere'&&it.tense==='presente'){if(it.p===0)out.push('debbo');if(it.p===5)out.push('debbono');}if(it.inf==='vedere'&&it.tense==='passato prossimo')out.push(AUX.avere[it.p]+' veduto');return out;}\nfunction submit(value){if(solved||pos>=order.length)return;const text=norm(value);if(!text){setAnswerState('idle');return;}const it=order[pos],ok=acceptedAnswers(it).some(a=>text===norm(a));setAnswerState(ok?'good':'bad');if(!tried){total++;if(ok)correct++;tried=true;}if(ok){solved=true;showSentence(it,it.answer,'solved');$('feedback').className='feedback good';$('feedback').textContent='Corretto! '+it.before+it.answer+it.after;$('next').disabled=false;$('check').disabled=true;$('answer').disabled=true;}else{$('feedback').className='feedback bad';$('feedback').textContent='Forma corretta: '+it.answer+'. Riscrivila e controlla ancora.';$('hint').hidden=false;$('hint').textContent=it.tense==='passato prossimo'?(it.aux==='essere'?'Use essere + past participle; match the shown gender and number.':'Use avere + past participle; keep the participle unchanged here.'):'Match the displayed tense and subject; accents count.';}score();}\n$('mode-a').onclick=()=>start('a');$('mode-b').onclick=()=>start('b');$('shuffle').onclick=()=>start();$('tense').onchange=()=>start();$('answer-form').onsubmit=e=>{e.preventDefault();submit($('answer').value);};$('next').onclick=()=>{if(!solved)return;pos++;render();if(pos\u003corder.length)$('answer').focus();};\n[['accent-a','à'],['accent-e','è'],['accent-ee','é'],['accent-i','ì'],['accent-o','ò'],['accent-u','ù']].forEach(([id,char])=>{$(id).onclick=()=>{const el=$('answer');if(el.disabled)return;const at=el.selectionStart==null?el.value.length:el.selectionStart,end=el.selectionEnd==null?at:el.selectionEnd;el.value=el.value.slice(0,at)+char+el.value.slice(end);setAnswerState('idle');el.focus();el.setSelectionRange(at+1,at+1);};});\n$('answer').oninput=()=>setAnswerState('idle');\nstart();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script>
'use strict';
const keys=["carte","articoli","aggettivi","verbi"];
const routes={'italiano-flashcards.html':'carte','articoli-esercizi.html':'articoli','articoli-aggettivi.html':'aggettivi','verbi-tempi.html':'verbi'};
const ready=new Set();
function activate(key,focus=false){
 if(!keys.includes(key))key='carte';
 keys.forEach(k=>{
  const tab=document.getElementById('tab-'+k),selected=k===key;
  tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;
  document.getElementById('panel-'+k).hidden=!selected;
 });
 const frame=document.getElementById('frame-'+key);
 if(!ready.has(key)){
  ready.add(key);
  frame.addEventListener('load',()=>{
   const doc=frame.contentDocument;
   if(!doc||!doc.querySelector('main'))return;
   if(key==='carte'){
    // Explicit face visibility avoids mirrored backfaces in iOS/WebKit iframe compositing.
    const style=doc.createElement('style');
    style.textContent='.scene .card{transform:none!important;transition:none!important}.scene .face{transform:none!important;backface-visibility:visible!important;-webkit-backface-visibility:visible!important}.scene .back{visibility:hidden}.scene.flipped .front{visibility:hidden}.scene.flipped .back{visibility:visible}';
    doc.head.appendChild(style);
    const select=doc.getElementById('filter');
    const options=Array.from(select.options);
    options.filter(o=>o.value.startsWith('chiara-')).forEach(o=>select.appendChild(o));
    options.filter(o=>!o.value.startsWith('chiara-')).forEach(o=>select.appendChild(o));
    select.value='chiara-23-sett';select.dispatchEvent(new Event('change'));
   }
   doc.addEventListener('click',event=>{
    if(event.defaultPrevented||event.target.closest('#direction'))return;
    const link=event.target.closest('a[href]');
    if(!link)return;
    const file=link.getAttribute('href').split('?')[0].split('/').pop();
    if(routes[file]){event.preventDefault();activate(routes[file],true);}
   });
   document.getElementById('loading-'+key).hidden=true;
  });
  frame.srcdoc=JSON.parse(document.getElementById('app-'+key).textContent);
 }
 if(location.hash!=='#'+key)history.replaceState(null,'','#'+key);
 if(focus)document.getElementById('tab-'+key).focus();
}
keys.forEach((key,index)=>{
 const tab=document.getElementById('tab-'+key);
 tab.addEventListener('click',()=>activate(key));
 tab.addEventListener('keydown',event=>{
  let next=index;
  if(event.key==='ArrowRight')next=(index+1)%keys.length;
  else if(event.key==='ArrowLeft')next=(index+keys.length-1)%keys.length;
  else if(event.key==='Home')next=0;
  else if(event.key==='End')next=keys.length-1;
  else return;
  event.preventDefault();activate(keys[next],true);
 });
});
window.addEventListener('hashchange',()=>activate(location.hash.slice(1)));
activate(location.hash.slice(1));
</script>
