:\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-04\",\"sourceParagraph\":6244,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6245\",\"sourceText\":\"🧙 Folclore Italiano\\nUnità 1\\nLe Streghe d’Italia\\nParte 4 – Superstizioni italiane: tra passato e presente\\n\\n🌞 Prima di leggere\\nVocabolario\\n🧿 il malocchio = evil eye\\n🌶️ il corno rosso = red horn amulet\\n🧂 il sale = salt\\n🪞 lo specchio = mirror\\n🐈‍⬛ il gatto nero = black cat\\n🍀 il portafortuna = lucky charm\\n🤞 incrociare le dita = to cross one’s fingers\\n🎭 la credenza popolare = popular belief\\n🍞 il pane = bread\\n🔮 il destino = destiny\\n\\n📖 Lettura\\nAnche se oggi viviamo in un’epoca dominata dalla scienza e dalla tecnologia, molte superstizioni continuano a far parte della cultura italiana.\\nUna delle più famose è il malocchio. Secondo un’antica credenza popolare, alcune persone potevano provocare sfortuna o malessere semplicemente con uno sguardo invidioso. Ancora oggi qualcuno porta piccoli amuleti per proteggersi, anche se la maggior parte degli italiani considera il malocchio soltanto una tradizione.\\nNel Sud Italia è molto diffuso il corno rosso, chiamato anche cornicello. 🌶️ Molti lo tengono in casa, lo appendono all’automobile oppure lo portano come portachiavi. Secondo la tradizione dovrebbe proteggere dalla sfortuna.\\nUn’altra superstizione riguarda il sale. Se il sale cade accidentalmente sul tavolo o sul pavimento, alcune persone prendono un pizzico di sale e lo lanciano dietro la spalla sinistra. Si pensa che questo gesto possa allontanare la cattiva sorte.\\nMolti italiani evitano anche di aprire un ombrello in casa ☂️ o di appoggiare un cappello sul letto. Queste credenze sono molto antiche e probabilmente hanno origini pratiche o religiose, anche se oggi vengono seguite soprattutto per tradizione.\\nA differenza di altri Paesi, in Italia il numero considerato sfortunato è spesso il 17, non il 13. Una delle spiegazioni più conosciute riguarda il numero romano XVII. Riorganizzando le lettere si ottiene VIXI, parola latina che significa “ho vissuto”, cioè “la mia vita è finita”. Per questo motivo il 17 è stato associato alla sfortuna fin dall’antichità.\\nNonostante queste credenze, la maggior parte degli italiani non prende sul serio queste superstizioni. Molti continuano a rispettarle per gioco, per tradizione familiare o semplicemente “per non rischiare”. È un esempio interessante di come il passato possa continuare a influenzare alcune abitudini del presente.\\n\\n🌍 Curiosità\\n🧿 Il malocchio esiste solo in Italia?\\nNo.\\nCredenze simili esistono anche in:\\n🇬🇷 Grecia\\n🇹🇷 Turchia\\n🇪🇸 Spagna\\n🇵🇹 Portogallo\\n🌍 Medio Oriente\\nMolte culture hanno creato amuleti diversi per proteggersi dalla sfortuna.\\n\\n🪞 Lo specchio\\nSecondo una superstizione molto diffusa, rompere uno specchio porta sette anni di sfortuna.\\nQuesta credenza esiste in molti Paesi europei.\\n\\n🍞 Il pane\\nIn molte famiglie italiane il pane è considerato un simbolo di rispetto.\\nAlcune persone evitano ancora oggi di appoggiarlo capovolto sul tavolo, perché lo considerano un gesto di cattivo auspicio.\\n\\n💬 Hai capito?\\nRispondi.\\nChe cos’è il malocchio?\\nA che cosa serve il cornicello?\\nChe cosa fanno alcune persone se cade il sale?\\nPerché il numero 17 è considerato sfortunato?\\nTutti gli italiani credono davvero a queste superstizioni?\\nQuale superstizione ti ha sorpreso di più?\\n\\n✅ Vero o falso?\\nIl malocchio è una credenza diffusa solo in Italia.\\nIl cornicello è spesso di colore rosso.\\nIn Italia il numero 17 è considerato fortunato.\\nMolti italiani evitano di aprire un ombrello in casa.\\nRompere uno specchio è considerato un segno di buona fortuna.\\nOggi la maggior parte degli italiani considera queste credenze soprattutto tradizioni popolari.\\n\\n📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel passato molte persone __________ al malocchio.\\n (credere)\\nOggi alcuni italiani __________ ancora il cornicello.\\n (portare)\\nMia nonna __________ sempre il sale dietro la spalla.\\n (lanciare)\\nQuando ero bambino, non __________ mai un ombrello in casa.\\n (aprire)\\nNel Medioevo molte superstizioni __________ parte della vita quotidiana.\\n (fare)\\nTu __________ mai sentito parlare del malocchio?\\n (avere)\\n\\n🔄 Ripasso dei tempi\\nTrasforma la frase.\\nFrase\\nMolti italiani portano il cornicello.\\n➡️ Imperfetto\\n\\n➡️ Passato prossimo\\n\\n➡️ Passato remoto\\n\\n📖 Leggiamo insieme\\nLeggi ad alta voce.\\n«Le superstizioni raccontano molto di una società. Anche quando non ci crediamo più, continuano a vivere nelle parole, nei gesti e nelle tradizioni tramandate dalle generazioni precedenti. Per questo motivo gli antropologi le studiano ancora oggi.»\\n\\n🗣️ Parliamone\\nQuali superstizioni esistono nel tuo Paese?\\nPensi che alcune superstizioni abbiano un’origine pratica?\\nPerché le tradizioni sopravvivono anche quando la società cambia?\\nC’è una superstizione che segui “per sicurezza”, anche se non ci credi?\\n\\n✍️ Scrittura\\nUna superstizione del mio Paese\\nScrivi 12–15 frasi.\\nParla di:\\n🌍 dove è diffusa\\n📜 la sua origine (se la conosci)\\n👥 chi ci crede\\n🤔 che cosa ne pensi\\n\\n⭐ Curiosità finali\\n🧙 La parola strega deriva dal latino strix, mentre magia deriva dal greco mageía, che indicava l’arte attribuita agli antichi sacerdoti persiani.\\n📚 Oggi le streghe sono studiate soprattutto da storici, antropologi e studiosi di folklore, perché le leggende raccontano come vivevano e pensavano le persone del passato.\\n🌍 Ogni regione italiana possiede racconti, creature fantastiche e superstizioni proprie. Studiarle significa conoscere non solo la fantasia popolare, ma anche la storia, la religione, la lingua e la cultura delle comunità che le hanno tramandate.\\n🎓 Fine dell’Unità\\nIn queste quattro lezioni abbiamo scoperto che le “streghe” non appartengono soltanto al mondo delle fiabe. Attraverso la loro storia abbiamo parlato di antiche tradizioni, medicina popolare, processi storici, superstizioni e antropologia. Abbiamo anche ripassato il presente, l’imperfetto, il passato prossimo e il passato remoto, imparando a usarli per raccontare sia il presente sia il passato.\\n➡️ Nella prossima unità esploreremo un’altra pagina affascinante della cultura italiana: i castelli, i fantasmi e le leggende medievali, oppure uno dei grandi miti dell’antica Roma.\\n\\n30-09-26 – Nadia\"},{\"it\":\"il malocchio\",\"other\":\"evil eye\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-04\",\"sourceParagraph\":6251,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6252\"},{\"it\":\"il corno rosso\",\"other\":\"red horn amulet\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-04\",\"sourceParagraph\":6252,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6253\"},{\"it\":\"il sale\",\"other\":\"salt\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-04\",\"sourceParagraph\":6253,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6254\"},{\"it\":\"lo specchio\",\"other\":\"mirror\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-04\",\"sourceParagraph\":6254,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6255\"},{\"it\":\"il gatto nero\",\"other\":\"black cat\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-04\",\"sourceParagraph\":6255,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6256\"},{\"it\":\"il portafortuna\",\"other\":\"lucky charm\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-04\",\"sourceParagraph\":6256,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6257\"},{\"it\":\"incrociare le dita\",\"other\":\"to cross one’s fingers\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-04\",\"sourceParagraph\":6257,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6258\"},{\"it\":\"la credenza popolare\",\"other\":\"popular belief\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-04\",\"sourceParagraph\":6258,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6259\"},{\"it\":\"il pane\",\"other\":\"bread\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-04\",\"sourceParagraph\":6259,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6260\"},{\"it\":\"il destino\",\"other\":\"destiny\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-04\",\"sourceParagraph\":6260,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6261\"},{\"it\":\"Che cos’è il malocchio?\",\"other\":\"What is the evil eye?\\n\\nSuggested response based on the reading: A folk belief that an envious look can cause bad luck or illness; the reading presents it as a belief, not an established fact.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-04\",\"sourceParagraph\":6292,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6293\"},{\"it\":\"A che cosa serve il cornicello?\",\"other\":\"What is the cornicello used for?\\n\\nSuggested response based on the reading: Traditionally, the red horn amulet is supposed to protect against bad luck.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-04\",\"sourceParagraph\":6293,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6294\"},{\"it\":\"Che cosa fanno alcune persone se cade il sale?\",\"other\":\"What do some people do when salt is spilled?\\n\\nSuggested response based on the reading: They throw a pinch of salt over their left shoulder.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-04\",\"sourceParagraph\":6294,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6295\"},{\"it\":\"Perché il numero 17 è considerato sfortunato?\",\"other\":\"Why is the number 17 considered unlucky?\\n\\nSuggested response based on the reading: The reading links Roman XVII to VIXI, Latin for “I have lived”, interpreted as “my life is over”.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-04\",\"sourceParagraph\":6295,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6296\"},{\"it\":\"Tutti gli italiani credono davvero a queste superstizioni?\",\"other\":\"Do all Italians really believe in these superstitions?\\n\\nSuggested response based on the reading: No. The reading says most consider them traditions, followed for fun or “just in case”.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-04\",\"sourceParagraph\":6296,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6297\"},{\"it\":\"Quale superstizione ti ha sorpreso di più?\",\"other\":\"Which superstition surprised you most?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-04\",\"sourceParagraph\":6297,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6298\"},{\"it\":\"Quali superstizioni esistono nel tuo Paese?\",\"other\":\"What superstitions exist in your country?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-04\",\"sourceParagraph\":6331,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6332\"},{\"it\":\"Pensi che alcune superstizioni abbiano un’origine pratica?\",\"other\":\"Do you think some superstitions have a practical origin?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-04\",\"sourceParagraph\":6332,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6333\"},{\"it\":\"Perché le tradizioni sopravvivono anche quando la società cambia?\",\"other\":\"Why do traditions survive even when society changes?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-04\",\"sourceParagraph\":6333,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6334\"},{\"it\":\"C’è una superstizione che segui “per sicurezza”, anche se non ci credi?\",\"other\":\"Is there a superstition you follow “just in case”, even though you do not believe in it?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-04\",\"sourceParagraph\":6334,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6335\"},{\"it\":\"Il malocchio è una credenza diffusa solo in Italia.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-04\",\"sourceParagraph\":6300,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6301\"},{\"it\":\"Il cornicello è spesso di colore rosso.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-04\",\"sourceParagraph\":6301,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6302\"},{\"it\":\"In Italia il numero 17 è considerato fortunato.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-04\",\"sourceParagraph\":6302,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6303\"},{\"it\":\"Molti italiani evitano di aprire un ombrello in casa.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-04\",\"sourceParagraph\":6303,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6304\"},{\"it\":\"Rompere uno specchio è considerato un segno di buona fortuna.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-04\",\"sourceParagraph\":6304,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6305\"},{\"it\":\"Oggi la maggior parte degli italiani considera queste credenze soprattutto tradizioni popolari.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-04\",\"sourceParagraph\":6305,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6306\"},{\"it\":\"📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel passato molte persone __________ al malocchio.\\n (credere)\\nOggi alcuni italiani __________ ancora il cornicello.\\n (portare)\\nMia nonna __________ sempre il sale dietro la spalla.\\n (lanciare)\\nQuando ero bambino, non __________ mai un ombrello in casa.\\n (aprire)\\nNel Medioevo molte superstizioni __________ parte della vita quotidiana.\\n (fare)\\nTu __________ mai sentito parlare del malocchio?\\n (avere)\\n\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-04\",\"sourceParagraph\":6307,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6308\"},{\"it\":\"🔄 Ripasso dei tempi\\nTrasforma la frase.\\nFrase\\nMolti italiani portano il cornicello.\\n➡️ Imperfetto\\n\\n➡️ Passato prossimo\\n\\n➡️ Passato remoto\\n\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-04\",\"sourceParagraph\":6316,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · DOCX paragraph 6317\"},{\"it\":\"Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-05\",\"sourceParagraph\":6354,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6355\",\"sourceText\":\"🧙 Folclore Italiano\\nUnità 1\\nLe Streghe d’Italia\\nParte 4 – Superstizioni italiane: tra passato e presente\\n\\n🌞 Prima di leggere\\nVocabolario\\n🧿 il malocchio = evil eye\\n🌶️ il corno rosso = red horn amulet\\n🧂 il sale = salt\\n🪞 lo specchio = mirror\\n🐈‍⬛ il gatto nero = black cat\\n🍀 il portafortuna = lucky charm\\n🤞 incrociare le dita = to cross one’s fingers\\n🎭 la credenza popolare = popular belief\\n🍞 il pane = bread\\n🔮 il destino = destiny\\n\\n📖 Lettura\\nAnche se oggi viviamo in un’epoca dominata dalla scienza e dalla tecnologia, molte superstizioni continuano a far parte della cultura italiana.\\nUna delle più famose è il malocchio. Secondo un’antica credenza popolare, alcune persone potevano provocare sfortuna o malessere semplicemente con uno sguardo invidioso (envious). Ancora oggi qualcuno porta piccoli amuleti per proteggersi, anche se la maggior parte degli italiani considera il malocchio soltanto una tradizione.\\nNel Sud Italia è molto diffuso il corno rosso, chiamato anche cornicello. 🌶️ Molti lo tengono(keep) in casa, lo appendono all’automobile oppure lo portano come portachiavi. Secondo la tradizione dovrebbe proteggere dalla sfortuna.\\nUn’altra superstizione riguarda il sale. Se il sale cade accidentalmente sul tavolo o sul pavimento, alcune persone prendono un pizzico di sale e lo lanciano dietro la spalla sinistra. Si pensa che questo gesto possa allontanare (push away) la cattiva sorte (fate).\\nMolti italiani evitano anche di aprire un ombrello in casa ☂️ o di appoggiare un cappello sul letto. Queste credenze sono molto antiche e probabilmente hanno origini pratiche o religiose, anche se oggi vengono seguite soprattutto per tradizione.\\nA differenza di altri Paesi, in Italia il numero considerato sfortunato è spesso il 17, non il 13. Una delle spiegazioni (explanations) più conosciute riguarda il numero romano XVII. Riorganizzando le lettere si ottiene(obtain) VIXI, parola latina che significa “ho vissuto”, cioè “la mia vita è finita”. Per questo motivo il 17 è stato associato alla sfortuna fin dall’antichità.\\nNonostante queste credenze, la maggior parte degli italiani non prende sul serio queste superstizioni. Molti continuano a rispettarle per gioco, per tradizione familiare o semplicemente “per non rischiare”. È un esempio interessante di come il passato possa continuare a influenzare alcune abitudini del presente.\\n\\n🌍 Curiosità\\n🧿 Il malocchio esiste solo in Italia?\\nNo.\\nCredenze simili esistono anche in:\\n🇬🇷 Grecia\\n🇹🇷 Turchia\\n🇪🇸 Spagna\\n🇵🇹 Portogallo\\n🌍 Medio Oriente\\nMolte culture hanno creato amuleti diversi per proteggersi dalla sfortuna.\\n\\n🪞 Lo specchio\\nSecondo una superstizione molto diffusa, rompere uno specchio porta sette anni di sfortuna.\\nQuesta credenza esiste in molti Paesi europei.\\n\\n🍞 Il pane\\nIn molte famiglie italiane il pane è considerato un simbolo di rispetto.\\nAlcune persone evitano ancora oggi di appoggiarlo capovolto sul tavolo, perché lo considerano un gesto di cattivo auspicio.\\n\\n////////////////\\n///////////\\n//////////////////////////////////\\n\\n\\n💬 Hai capito?\\nRispondi.\\nChe cos’è il malocchio?\\nA che cosa serve il cornicello?\\nChe cosa fanno alcune persone se cade il sale?\\nPerché il numero 17 è considerato sfortunato?\\nTutti gli italiani credono davvero a queste superstizioni?\\nQuale superstizione ti ha sorpreso di più?\\n\\n✅ Vero o falso?\\nIl malocchio è una credenza diffusa solo in Italia.\\nIl cornicello è spesso di colore rosso.\\nIn Italia il numero 17 è considerato fortunato.\\nMolti italiani evitano di aprire un ombrello in casa.\\nRompere uno specchio è considerato un segno di buona fortuna.\\nOggi la maggior parte degli italiani considera queste credenze soprattutto tradizioni popolari.\\n\\n📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel passato molte persone __________ al malocchio.\\n (credere)\\nOggi alcuni italiani __________ ancora il cornicello.\\n (portare)\\nMia nonna __________ sempre il sale dietro la spalla.\\n (lanciare)\\nQuando ero bambino, non __________ mai un ombrello in casa.\\n (aprire)\\nNel Medioevo molte superstizioni __________ parte della vita quotidiana.\\n (fare)\\nTu __________ mai sentito parlare del malocchio?\\n (avere)\\n\\n🔄 Ripasso dei tempi\\nTrasforma la frase.\\nFrase\\nMolti italiani portano il cornicello.\\n➡️ Imperfetto\\nportavano\\n➡️ Passato prossimo\\nHanno portato\\n➡️ Passato remoto\\nportarono\\n📖 Leggiamo insieme\\nLeggi ad alta voce.\\n«Le superstizioni raccontano molto di una società. Anche quando non ci crediamo più, continuano a vivere nelle parole, nei gesti e nelle tradizioni tramandate dalle generazioni precedenti. Per questo motivo gli antropologi le studiano ancora oggi.»\\n\\n🗣️ Parliamone\\nQuali superstizioni esistono nel tuo Paese?\\nPensi che alcune superstizioni abbiano un’origine pratica?\\nPerché le tradizioni sopravvivono anche quando la società cambia?\\nC’è una superstizione che segui “per sicurezza”, anche se non ci credi?\\n\\n\\n\\n✍️ Scrittura\\n //////////////////////////////////////////\\n\\nUna superstizione del mio Paese\\nScrivi 12–15 frasi.\\nParla di:\\n🌍 dove è diffusa\\n📜 la sua origine (se la conosci)\\n👥 chi ci crede\\n🤔 che cosa ne pensi\\n\\n⭐ Curiosità finali\\n🧙 La parola strega deriva dal latino strix, mentre magia deriva dal greco mageía, che indicava l’arte attribuita agli antichi sacerdoti persiani.\\n📚 Oggi le streghe sono studiate soprattutto da storici, antropologi e studiosi di folklore, perché le leggende raccontano come vivevano e pensavano le persone del passato.\\n🌍 Ogni regione italiana possiede racconti, creature fantastiche e superstizioni proprie. Studiarle significa conoscere non solo la fantasia popolare, ma anche la storia, la religione, la lingua e la cultura delle comunità che le hanno tramandate.\\n🎓 Fine dell’Unità\\nIn queste quattro lezioni abbiamo scoperto che le “streghe” non appartengono soltanto al mondo delle fiabe. Attraverso la loro storia abbiamo parlato di antiche tradizioni, medicina popolare, processi storici, superstizioni e antropologia. Abbiamo anche ripassato il presente, l’imperfetto, il passato prossimo e il passato remoto, imparando a usarli per raccontare sia il presente sia il passato.\\n➡️ Nella prossima unità esploreremo un’altra pagina affascinante della cultura italiana: i castelli, i fantasmi e le leggende medievali, oppure uno dei grandi miti dell’antica Roma.\\n\"},{\"it\":\"il malocchio\",\"other\":\"evil eye\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-05\",\"sourceParagraph\":6361,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6362\"},{\"it\":\"il corno rosso\",\"other\":\"red horn amulet\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-05\",\"sourceParagraph\":6362,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6363\"},{\"it\":\"il sale\",\"other\":\"salt\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-05\",\"sourceParagraph\":6363,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6364\"},{\"it\":\"lo specchio\",\"other\":\"mirror\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-05\",\"sourceParagraph\":6364,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6365\"},{\"it\":\"il gatto nero\",\"other\":\"black cat\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-05\",\"sourceParagraph\":6365,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6366\"},{\"it\":\"il portafortuna\",\"other\":\"lucky charm\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-05\",\"sourceParagraph\":6366,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6367\"},{\"it\":\"incrociare le dita\",\"other\":\"to cross one’s fingers\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-05\",\"sourceParagraph\":6367,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6368\"},{\"it\":\"la credenza popolare\",\"other\":\"popular belief\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-05\",\"sourceParagraph\":6368,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6369\"},{\"it\":\"il pane\",\"other\":\"bread\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-05\",\"sourceParagraph\":6369,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6370\"},{\"it\":\"il destino\",\"other\":\"destiny\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-05\",\"sourceParagraph\":6370,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6371\"},{\"it\":\"Che cos’è il malocchio?\",\"other\":\"What is the evil eye?\\n\\nSuggested response based on the reading: A folk belief that an envious look can cause bad luck or illness; the reading presents it as a belief, not an established fact.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-05\",\"sourceParagraph\":6407,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6408\"},{\"it\":\"A che cosa serve il cornicello?\",\"other\":\"What is the cornicello used for?\\n\\nSuggested response based on the reading: Traditionally, the red horn amulet is supposed to protect against bad luck.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-05\",\"sourceParagraph\":6408,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6409\"},{\"it\":\"Che cosa fanno alcune persone se cade il sale?\",\"other\":\"What do some people do when salt is spilled?\\n\\nSuggested response based on the reading: They throw a pinch of salt over their left shoulder.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-05\",\"sourceParagraph\":6409,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6410\"},{\"it\":\"Perché il numero 17 è considerato sfortunato?\",\"other\":\"Why is the number 17 considered unlucky?\\n\\nSuggested response based on the reading: The reading links Roman XVII to VIXI, Latin for “I have lived”, interpreted as “my life is over”.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-05\",\"sourceParagraph\":6410,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6411\"},{\"it\":\"Tutti gli italiani credono davvero a queste superstizioni?\",\"other\":\"Do all Italians really believe in these superstitions?\\n\\nSuggested response based on the reading: No. The reading says most consider them traditions, followed for fun or “just in case”.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-05\",\"sourceParagraph\":6411,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6412\"},{\"it\":\"Quale superstizione ti ha sorpreso di più?\",\"other\":\"Which superstition surprised you most?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-05\",\"sourceParagraph\":6412,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6413\"},{\"it\":\"Quali superstizioni esistono nel tuo Paese?\",\"other\":\"What superstitions exist in your country?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-05\",\"sourceParagraph\":6446,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6447\"},{\"it\":\"Pensi che alcune superstizioni abbiano un’origine pratica?\",\"other\":\"Do you think some superstitions have a practical origin?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-05\",\"sourceParagraph\":6447,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6448\"},{\"it\":\"Perché le tradizioni sopravvivono anche quando la società cambia?\",\"other\":\"Why do traditions survive even when society changes?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-05\",\"sourceParagraph\":6448,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6449\"},{\"it\":\"C’è una superstizione che segui “per sicurezza”, anche se non ci credi?\",\"other\":\"Is there a superstition you follow “just in case”, even though you do not believe in it?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":  Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-05\",\"sourceParagraph\":6419,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6420\"},{\"it\":\"Oggi la maggior parte degli italiani considera queste credenze soprattutto tradizioni popolari.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-05\",\"sourceParagraph\":6420,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6421\"},{\"it\":\"📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel passato molte persone __________ al malocchio.\\n (credere)\\nOggi alcuni italiani __________ ancora il cornicello.\\n (portare)\\nMia nonna __________ sempre il sale dietro la spalla.\\n (lanciare)\\nQuando ero bambino, non __________ mai un ombrello in casa.\\n (aprire)\\nNel Medioevo molte superstizioni __________ parte della vita quotidiana.\\n (fare)\\nTu __________ mai sentito parlare del malocchio?\\n (avere)\\n\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-05\",\"sourceParagraph\":6422,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6423\"},{\"it\":\"🔄 Ripasso dei tempi\\nTrasforma la frase.\\nFrase\\nMolti italiani portano il cornicello.\\n➡️ Imperfetto\\nportavano\\n➡️ Passato prossimo\\nHanno portato\\n➡️ Passato remoto\\nportarono\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-05\",\"sourceParagraph\":6431,\"note\":\"Liam · Lettura · Parte 4 – Superstizioni italiane: tra passato e presente · versione annotata · DOCX paragraph 6432\"},{\"it\":\"Le Grandi Leggende · programma completo\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-06\",\"sourceParagraph\":6472,\"note\":\"Liam · Lettura · Le Grandi Leggende · programma completo · DOCX paragraph 6473\",\"sourceText\":\"📚 Le Grandi Leggende delle Streghe Italiane\\n\\n📖 Parte 1 — Il Noce di Benevento 🌰\\n\\nLa leggenda più famosa d'Italia sulle streghe.\\n\\nArgomenti:\\n• La storia del Noce di Benevento.\\n• I racconti delle persone che dicevano di vedere luci e danze notturne.\\n• Il sabba delle streghe.\\n• Le possibili origini longobarde e pagane della leggenda.\\n• Come il mito è cambiato nel corso dei secoli.\\n• Che cosa pensano oggi gli storici.\\n\\n────────────────────────\\n\\n📖 Parte 2 — Matteuccia di Todi 🐐\\n\\nUna delle prime donne realmente processate per stregoneria in Italia.\\n\\nArgomenti:\\n• Chi era Matteuccia.\\n• Il processo del 1428.\\n• Le accuse.\\n• L'unguento magico.\\n• Il presunto volo sul caprone.\\n• La formula magica riportata negli atti del processo.\\n• Perché oggi gli storici ritengono poco affidabili queste confessioni.\\n\\n────────────────────────\\n\\n📖 Parte 3 — Le Janare di Benevento 🏠\\n\\nLe storie più inquietanti del folclore campano.\\n\\nArgomenti:\\n• Le Janare che entravano nelle case.\\n• Le scope lasciate davanti alla porta.\\n• Il sale per fermare le Janare.\\n• I racconti delle persone che dicevano di essersi svegliate senza riuscire a muoversi.\\n• Il collegamento moderno con la paralisi del sonno.\\n• Perché questa leggenda è sopravvissuta così a lungo.\\n\\n────────────────────────\\n\\n📖 Parte 4 — Le Masche del Piemonte 🐈\\n\\nLe misteriose streghe delle montagne.\\n\\nArgomenti:\\n• Le Masche.\\n• Le trasformazioni in animali.\\n• I gatti neri.\\n• I lupi.\\n• Le maledizioni.\\n• I racconti dei contadini.\\n• I processi realmente avvenuti.\\n• Le interpretazioni degli antropologi.\\n\\n────────────────────────\\n\\n📖 Parte 5 — Triora, il paese delle streghe 🏰\\n\\nLa \\\"Salem italiana\\\".\\n\\nArgomenti:\\n• Il piccolo borgo ligure di Triora.\\n• I processi del 1587–1589.\\n• Le confessioni.\\n• Le accuse tra vicini.\\n• La carestia che alimentò la paura.\\n• Le prigioni.\\n• Le presunte apparizioni.\\n• Il Museo Regionale Etnografico e della Stregoneria.\\n• Come il paese conserva ancora oggi questa parte della sua storia.\\n\\n────────────────────────\\n\\n📖 Parte 6 — I luoghi più misteriosi d'Italia 🌙\\n\\nUn viaggio tra storia e leggenda.\\n\\nArgomenti:\\n• Il Noce di Benevento.\\n• Triora.\\n• Il Lago di Pilato.\\n• Il Monte Sibilla.\\n• Il Bosco del Cansiglio.\\n• La Val Camonica.\\n• Le leggende nate in questi luoghi.\\n• Che cosa raccontano oggi gli abitanti.\\n\\n────────────────────────\\n\\n📖 Parte 7 (Bonus) — Le streghe nel mondo 🌍\\n\\nConfronto tra le tradizioni.\\n\\n• Italia – Janare\\n• Francia – Sorcières\\n• Germania – Hexen\\n• Russia – Baba Jaga\\n• Romania – Strigoi\\n• Grecia – Lamia\\n• Giappone – Yamauba\\n\\nDomande:\\n• Perché quasi tutte le culture hanno inventato figure simili?\\n• Quali elementi hanno in comune?\\n• Quali sono le differenze?\\n• Che cosa ci raccontano queste leggende sulle paure e sulle credenze delle diverse società?\\n\\n────────────────────────\\n\\n💡 Idea extra\\n\\nAlla fine di ogni lezione inserire un \\\"Documento storico\\\" con brevi estratti autentici (di pubblico dominio) da:\\n\\n• Verbali dei processi alle streghe.\\n• Cronache medievali.\\n• Raccolte di leggende popolari dell'Ottocento.\\n• Opere come il Malleus Maleficarum (1487), sempre presentandolo come documento storico e non come prova dell'esistenza della stregoneria.\\n\\n\"},{\"it\":\"• Perché quasi tutte le culture hanno inventato figure simili?\",\"other\":\"Why have almost all cultures invented similar figures?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-06\",\"sourceParagraph\":6579,\"note\":\"Liam · Lettura · Le Grandi Leggende · programma completo · DOCX paragraph 6580\"},{\"it\":\"• Quali elementi hanno in comune?\",\"other\":\"What elements do they have in common?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-06\",\"sourceParagraph\":6580,\"note\":\"Liam · Lettura · Le Grandi Leggende · programma completo · DOCX paragraph 6581\"},{\"it\":\"• Quali sono le differenze?\",\"other\":\"What are the differences?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-06\",\"sourceParagraph\":6581,\"note\":\"Liam · Lettura · Le Grandi Leggende · programma completo · DOCX paragraph 6582\"},{\"it\":\"• Che cosa ci raccontano queste leggende sulle paure e sulle credenze delle diverse società?\",\"other\":\"What do these legends tell us about the fears and beliefs of different societies?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-06\",\"sourceParagraph\":6582,\"note\":\"Liam · Lettura · Le Grandi Leggende · programma completo · DOCX paragraph 6583\"},{\"it\":\"Parte 1 – Il Noce di Benevento\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-07\",\"sourceParagraph\":6596,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6597\",\"sourceText\":\"🧙 Le Grandi Leggende delle Streghe Italiane\\nParte 1 – Il Noce di Benevento\\nNota storica\\n\\nLa storia che leggerai è basata su una delle più famose leggende italiane. Esistono documenti storici che dimostrano come questa leggenda fosse molto diffusa già nel Medioevo, ma non esistono prove storiche che gli eventi soprannaturali siano realmente accaduti.\\n\\n🌞 Prima di leggere\\nVocabolario\\n\\n🌰 il noce = walnut tree\\n🌕 la luna piena = full moon\\n🧙 il sabba = witches’ gathering (secondo il folclore)\\n🪄 l’incantesimo = spell\\n🌙 il crepuscolo = twilight\\n🔥 il falò = bonfire\\n🌲 il bosco = forest\\n👀 il testimone = witness\\n🏇 il cavaliere = horseman\\n📜 la cronaca = chronicle\\n\\n📖 Il mistero del Noce di Benevento\\nPer oltre mille anni, nessun luogo in Italia è stato associato alle streghe quanto la città di Benevento, in Campania.\\nTutto iniziò molti secoli fa.\\nSecondo alcune antiche cronache, vicino alla città cresceva un enorme albero di noce.\\nDi giorno sembrava un albero come tutti gli altri.\\nMa quando arrivava la notte…\\n…cominciavano i racconti.\\nAlcuni contadini dicevano di aver visto strane luci muoversi tra i rami.\\nAltri raccontavano di aver sentito musica provenire dal bosco, anche se nessun musicista era presente.\\nQualcuno giurava perfino di aver visto donne vestite di bianco danzare intorno all’albero.\\nSecondo queste testimonianze, esse arrivavano quando la luna era piena.\\nAccendevano grandi falò.\\nCantavano.\\nBallavano.\\nPoi, poco prima dell’alba, scomparivano senza lasciare traccia.\\nCon il passare dei secoli, la leggenda divenne sempre più ricca.\\nSi iniziò a raccontare che quelle donne fossero streghe.\\nAlcuni dicevano che cavalcassero animali fantastici.\\nAltri sostenevano che il diavolo apparisse sotto forma di un grande caprone nero.\\nOgni generazione aggiungeva nuovi particolari.\\nCosì il racconto diventava sempre più misterioso.\\n/////////////////////////////////////////////////////////////////////////////\\n///////////////////////////\\n\\n📖 Da dove nasce questa leggenda?\\nGli storici hanno cercato di capire perché proprio Benevento sia diventata la città delle streghe.\\nUna teoria riguarda(is about, concerns) i Longobardi, un popolo germanico che conquistò Benevento nel VI secolo.\\nAlcuni autori medievali raccontavano che i Longobardi praticassero riti religiosi vicino a un albero sacro.\\nSecondo queste cronache, i guerrieri appendevano pelli di animali ai rami e compivano cerimonie in onore delle loro antiche divinità.\\nQuando il Cristianesimo si diffuse nella regione, questi riti furono considerati pagani.\\nCon il passare del tempo, la memoria di quelle antiche cerimonie potrebbe essersi trasformata nella leggenda del sabba delle streghe.\\nGli storici, però, non possono confermare che questo sia realmente accaduto: si tratta di una delle spiegazioni (explainations) proposte per l’origine del mito.\\n\\n🌍 Curiosità\\n🌰 Esiste ancora il famoso noce?\\nNo.\\nNon sappiamo con certezza dove si trovasse l’albero originale.\\nSecondo alcune tradizioni fu abbattuto molti secoli fa.\\nOggi nessuno può dire con certezza quale fosse il vero “Noce di Benevento”.\\n\\n🧙 Perché proprio un noce?\\nIn molte culture europee il noce era considerato un albero misterioso.\\nLa sua ombra era molto fitta e si credeva che fosse abitato da spiriti o creature soprannaturali.\\nPer questo compare (appears) spesso nelle antiche leggende.\\n\\n🏛️ Benevento oggi\\nOggi Benevento ricorda questa tradizione con:\\n🌰 statue\\n🧙 eventi culturali\\n🎭 spettacoli\\n🏛️ negozi dedicati alle Janare\\nLa città considera questa leggenda parte del proprio patrimonio storico e culturale.\\n\\n💬 Hai capito?\\nRispondi.\\nDove si trovava il famoso noce?\\nChe cosa raccontavano i contadini?\\nChe cosa facevano, secondo la leggenda, le streghe?\\nPerché la storia cambiava nel corso dei secoli?\\nQuale popolo potrebbe aver dato origine alla leggenda?\\nGli storici possono dimostrare che il sabba sia realmente esistito?\\n\\n////////////////////////////////////////////////////////////////////////////\\n//////////////////////////////////////////////////////////\\n//////////////////////////\\n\\n✅ Vero o falso?\\nIl Noce di Benevento si trovava in Toscana.\\nMolte persone dicevano di aver visto luci misteriose.\\nLe cronache raccontano di antichi riti longobardi.\\nGli storici sono certi che le streghe si riunissero davvero sotto il noce.\\nOggi Benevento valorizza questa leggenda come parte della sua cultura.\\nIl noce originale esiste ancora con certezza.\\n\\n📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nMolti contadini __________ di aver visto strane luci.\\n (dire)\\nLe cronache medievali __________ questa leggenda.\\n (raccontare)\\nOggi molti turisti __________ Benevento.\\n (visitare)\\nNel Medioevo alcune persone __________ alle streghe.\\n (credere)\\nGli storici __________ ancora oggi l’origine della leggenda.\\n (studiare)\\nTu __________ mai sentito parlare del Noce di Benevento?\\n (avere)\\n\\n✍️ Scrittura\\nSe fossi vissuta nel Medioevo…\\nScrivi 12–15 frasi.\\nImmagina di vivere a Benevento nel XV secolo.\\nUna sera alcuni abitanti del villaggio raccontano di aver visto strane luci nel bosco.\\nChe cosa penseresti?\\nAndresti a vedere?\\nAvresti paura?\\nOppure cercheresti una spiegazione razionale?\\n\\n📜 Documento storico\\nLo storico longobardo Paolo Diacono, nella sua Historia Langobardorum (VIII secolo), racconta che i Longobardi praticavano antichi riti religiosi vicino ad alberi considerati sacri. Nei secoli successivi alcuni autori collegarono questi racconti alla nascita della leggenda del Noce di Benevento. Non sappiamo se questo collegamento sia corretto, ma mostra come storia e tradizione possano influenzarsi a vicenda.\\n\\n⭐ Curiosità finale\\nAncora oggi Benevento è conosciuta in tutta Italia come “la città delle streghe”.\\nNei negozi è possibile acquistare libri, souvenir e perfino il famoso liquore Strega, prodotto dal 1860. Il suo nome richiama la leggenda cittadina, anche se la ricetta non ha alcun legame con la magia.\\n➡️ Nella prossima lezione conosceremo una donna realmente esistita: Matteuccia di Todi, una delle prime persone processate per stregoneria in Italia. La sua storia è documentata dagli atti originali del tribunale e rappresenta uno dei casi più famosi del Quattrocento.\"},{\"it\":\"il noce\",\"other\":\"walnut tree\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-07\",\"sourceParagraph\":6605,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6606\"},{\"it\":\"la luna piena\",\"other\":\"full moon\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-07\",\"sourceParagraph\":6606,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6607\"},{\"it\":\"il sabba\",\"other\":\"witches’ gathering (secondo il folclore)\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-07\",\"sourceParagraph\":6607,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6608\"},{\"it\":\"l’incantesimo\",\"other\":\"spell\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-07\",\"sourceParagraph\":6608,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6609\"},{\"it\":\"il crepuscolo\",\"other\":\"twilight\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-07\",\"sourceParagraph\":6609,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6610\"},{\"it\":\"il falò\",\"other\":\"bonfire\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-07\",\"sourceParagraph\":6610,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6611\"},{\"it\":\"il bosco\",\"other\":\"forest\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-07\",\"sourceParagraph\":6611,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6612\"},{\"it\":\"il testimone\",\"other\":\"witness\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-07\",\"sourceParagraph\":6612,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6613\"},{\"it\":\"il cavaliere\",\"other\":\"horseman\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-07\",\"sourceParagraph\":6613,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6614\"},{\"it\":\"la cronaca\",\"other\":\"chronicle\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-07\",\"sourceParagraph\":6614,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6615\"},{\"it\":\"Dove si trovava il famoso noce?\",\"other\":\"Where was the famous walnut tree?\\n\\nSuggested response based on the reading: Near Benevento, in Campania; its original exact location is uncertain.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-07\",\"sourceParagraph\":6671,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6672\"},{\"it\":\"Che cosa raccontavano i contadini?\",\"other\":\"What did the farmers report?\\n\\nSuggested response based on the reading: Strange lights, music and women dressed in white dancing around the tree.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-07\",\"sourceParagraph\":6672,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6673\"},{\"it\":\"Che cosa facevano, secondo la leggenda, le streghe?\",\"other\":\"What did the witches do, according to the legend?\\n\\nSuggested response based on the reading: They gathered at full moon, lit bonfires, sang and danced, then disappeared before dawn.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-07\",\"sourceParagraph\":6673,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6674\"},{\"it\":\"Perché la storia cambiava nel corso dei secoli?\",\"other\":\"Why did the story change over the centuries?\\n\\nSuggested response based on the reading: Each generation added new details.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-07\",\"sourceParagraph\":6674,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6675\"},{\"it\":\"Quale popolo potrebbe aver dato origine alla leggenda?\",\"other\":\"Which people might have given rise to the legend?\\n\\nSuggested response based on the reading: The Lombards and their possible sacred-tree rituals; the reading explicitly calls this an unconfirmed theory.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-07\",\"sourceParagraph\":6675,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6676\"},{\"it\":\"Gli storici possono dimostrare che il sabba sia realmente esistito?\",\"other\":\"Can historians prove that the witches’ gathering really existed?\\n\\nSuggested response based on the reading: No. The existence of the legend is documented, not the alleged supernatural events.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-07\",\"sourceParagraph\":6676,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6677\"},{\"it\":\"Che cosa penseresti?\",\"other\":\"What would you think?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-07\",\"sourceParagraph\":6704,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6705\"},{\"it\":\"Andresti a vedere?\",\"other\":\"Would you go and look?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-07\",\"sourceParagraph\":6705,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6706\"},{\"it\":\"Avresti paura?\",\"other\":\"Would you be afraid?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-07\",\"sourceParagraph\":6706,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6707\"},{\"it\":\"Oppure cercheresti una spiegazione razionale?\",\"other\":\"Or would you look for a rational explanation?\\n\\nOpen response: give your own answer in Italian. There is no single correct answer.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"open\",\"reading\":\"lettura-07\",\"sourceParagraph\":6707,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6708\"},{\"it\":\"Il Noce di Benevento si trovava in Toscana.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-07\",\"sourceParagraph\":6683,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6684\"},{\"it\":\"Molte persone dicevano di aver visto luci misteriose.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-07\",\"sourceParagraph\":6684,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6685\"},{\"it\":\"Le cronache raccontano di antichi riti longobardi.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-07\",\"sourceParagraph\":6685,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6686\"},{\"it\":\"Gli storici sono certi che le streghe si riunissero davvero sotto il noce.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-07\",\"sourceParagraph\":6686,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6687\"},{\"it\":\"Oggi Benevento valorizza questa leggenda come parte della sua cultura.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-07\",\"sourceParagraph\":6687,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6688\"},{\"it\":\"Il noce originale esiste ancora con certezza.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-07\",\"sourceParagraph\":6688,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6689\"},{\"it\":\"📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nMolti contadini __________ di aver visto strane luci.\\n (dire)\\nLe cronache medievali __________ questa leggenda.\\n (raccontare)\\nOggi molti turisti __________ Benevento.\\n (visitare)\\nNel Medioevo alcune persone __________ alle streghe.\\n (credere)\\nGli storici __________ ancora oggi l’origine della leggenda.\\n (studiare)\\nTu __________ mai sentito parlare del Noce di Benevento?\\n (avere)\\n\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-07\",\"sourceParagraph\":6690,\"note\":\"Liam · Lettura · Parte 1 – Il Noce di Benevento · DOCX paragraph 6691\"},{\"it\":\"Parte 2 – Matteuccia di Todi: il processo del 1428\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-08\",\"sourceParagraph\":6716,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6717\",\"sourceText\":\"🧙 Le Grandi Leggende delle Streghe Italiane\\nParte 2 – Matteuccia di Todi: il processo del 1428\\nNota storica\\n\\nMatteuccia di Francesco, conosciuta come Matteuccia di Todi, fu una persona realmente esistita. Gran parte di ciò che sappiamo proviene dagli atti del suo processo del 1428. Le confessioni contenute nei documenti sono oggi considerate dagli storici poco affidabili, perché in quell’epoca gli interrogatori potevano essere accompagnati da forti pressioni o torture.\\n\\n🌞 Prima di leggere\\nVocabolario\\n⚖️ il tribunale = court\\n📜 il processo = trial\\n🧴 l’unguento = ointment\\n🐐 il caprone = he-goat\\n🧹 la scopa = broom\\n🪄 la formula magica = magical formula\\n🗣️ la confessione = confession\\n😨 l’accusato = accused person\\n🔥 il rogo = stake\\n📖 il manoscritto = manuscript\\n\\n📖 Una donna chiamata Matteuccia\\nNella primavera del 1428, la città umbra di Todi fu scossa da un processo destinato a diventare uno dei più famosi della storia italiana.\\nL’imputata si chiamava Matteuccia di Francesco.\\nEra una donna che conosceva le erbe medicinali e preparava rimedi per curare alcune malattie. Come accadeva spesso nel Medioevo, molte persone si rivolgevano a lei quando non esistevano medici nelle vicinanze.\\nCon il passare del tempo, però, iniziarono a circolare strane voci.\\nAlcuni abitanti sostenevano che le sue cure fossero troppo misteriose.\\nAltri dicevano che parlasse con forze oscure.\\nBen presto queste dicerie arrivarono alle autorità.\\nMatteuccia fu arrestata e portata davanti al tribunale.\\n\\n🐐 Il racconto del volo\\nDurante il processo comparve una delle confessioni più sorprendenti della storia della stregoneria italiana.\\nSecondo gli atti processuali, Matteuccia avrebbe dichiarato di preparare un particolare unguento.\\nDopo averlo spalmato sul corpo, avrebbe pronunciato una formula magica.\\nSuccessivamente sarebbe salita in groppa a un caprone e avrebbe volato nella notte per raggiungere altre streghe.\\nNegli atti del processo compare anche una formula che, secondo il documento, avrebbe recitato prima del volo.\\nPer secoli questo racconto fu considerato una prova dell’esistenza delle streghe.\\nOggi, invece, gli storici invitano a leggerlo con molta prudenza.\\n\\n📜 Che cosa pensano gli storici?\\nQuasi tutti gli studiosi moderni ritengono che confessioni di questo tipo non possano essere considerate prove storiche.\\nNel Quattrocento gli interrogatori erano molto diversi da quelli di oggi.\\nIn molti tribunali europei gli accusati venivano minacciati o torturati.\\nPer questo motivo alcune persone confessavano qualunque cosa pur di far terminare il processo.\\nGli storici ritengono inoltre che molte idee sul volo delle streghe fossero già diffuse nella cultura dell’epoca.\\nÈ possibile che gli inquisitori suggerissero inconsapevolmente alcune immagini durante gli interrogatori, oppure che gli accusati ripetessero racconti popolari già conosciuti.\\nPer questo motivo il caso di Matteuccia è importante non tanto perché dimostrerebbe l’esistenza della magia, ma perché ci mostra come funzionava la giustizia nel Quattrocento e quali paure fossero presenti nella società.\\n\\n🌍 Curiosità\\n📖 La formula magica\\nNegli atti del processo compare una breve formula che Matteuccia avrebbe pronunciato prima del volo.\\nÈ uno dei più antichi testi italiani collegati alla stregoneria arrivati fino a noi.\\nGli studiosi lo analizzano oggi come documento linguistico e storico.\\n\\n🌿 Guaritrice o strega?\\nNel Medioevo il confine tra medicina popolare, superstizione e magia era spesso poco chiaro.\\nMolte persone che preparavano rimedi naturali potevano essere rispettate da alcuni e temute da altri.\\n\\n⚖️ Un documento prezioso\\nIl processo di Matteuccia è uno dei documenti più importanti per comprendere la nascita dell’immagine della strega nell’Italia del Quattrocento.\\n\\n💬 Hai capito?\\nChi era Matteuccia?\\nPerché molte persone si rivolgevano a lei?\\nChe cosa racconta la confessione?\\nPerché gli storici non la considerano una prova affidabile?\\nChe cosa ci insegna questo processo?\\nPerché il caso di Matteuccia è ancora studiato oggi?\\n\\n✅ Vero o falso?\\nMatteuccia visse nel Quindicesimo secolo.\\nEra conosciuta per l’uso delle erbe medicinali.\\nGli storici credono che la confessione dimostri l’esistenza della magia.\\nIl processo è documentato da fonti storiche.\\nNel Medioevo gli interrogatori erano identici a quelli moderni.\\nIl caso di Matteuccia è ancora studiato dagli storici.\\n\\n📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel 1428 Matteuccia __________ davanti al tribunale.\\n (comparire)\\nMolte persone __________ da lei per chiedere aiuto.\\n (andare)\\nGli storici __________ ancora oggi questo processo.\\n (studiare)\\nDurante il Medioevo molti abitanti __________ alle streghe.\\n (credere)\\nMatteuccia __________ rimedi con le erbe.\\n (preparare)\\nTu __________ mai sentito parlare di questo processo?\\n (avere)\\n\\n📜 Documento storico\\nNegli atti del processo compare questa frase, attribuita a Matteuccia:\\n«Unguento, unguento, mandami al noce di Benevento, sopra l’acqua e sopra il vento, e sopra ogni altro maltempo.»\\nQuesta è una delle testimonianze più celebri della stregoneria italiana.\\nGli storici ricordano però che non sappiamo se queste parole siano state davvero pronunciate da Matteuccia o se siano state registrate sotto pressione durante gli interrogatori.\\n\\n⭐ Curiosità finale\\nIl processo di Matteuccia avvenne quasi settant’anni prima che il fenomeno delle grandi cacce alle streghe raggiungesse il suo apice in molte regioni d’Europa.\\nPer questo motivo è considerato uno dei casi più antichi e importanti della storia della stregoneria italiana.\\n➡️ Nella prossima lezione entreremo nelle case delle Janare di Benevento e leggeremo alcune testimonianze raccolte tra il Seicento e l’Ottocento da persone convinte di averle incontrate durante la notte.\"},{\"it\":\"il tribunale\",\"other\":\"court\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6724,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6725\"},{\"it\":\"il processo\",\"other\":\"trial\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6725,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6726\"},{\"it\":\"l’unguento\",\"other\":\"ointment\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6726,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6727\"},{\"it\":\"il caprone\",\"other\":\"he-goat\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6727,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6728\"},{\"it\":\"la scopa\",\"other\":\"broom\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6728,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6729\"},{\"it\":\"la formula magica\",\"other\":\"magical formula\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6729,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6730\"},{\"it\":\"la confessione\",\"other\":\"confession\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6730,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6731\"},{\"it\":\"l’accusato\",\"other\":\"accused person\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6731,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6732\"},{\"it\":\"il rogo\",\"other\":\"stake\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6732,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6733\"},{\"it\":\"il manoscritto\",\"other\":\"manuscript\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"vocabulary\",\"reading\":\"lettura-08\",\"sourceParagraph\":6733,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6734\"},{\"it\":\"Chi era Matteuccia?\",\"other\":\"Who was Matteuccia?\\n\\nSuggested response based on the reading: Matteuccia di Francesco, a woman from Todi who knew medicinal herbs and prepared remedies; she was tried in 1428.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6777,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6778\"},{\"it\":\"Perché molte persone si rivolgevano a lei?\",\"other\":\"Why did many people turn to her?\\n\\nSuggested response based on the reading: For remedies and help with illnesses, particularly when no doctor was nearby.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6778,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6779\"},{\"it\":\"Che cosa racconta la confessione?\",\"other\":\"What does the confession describe?\\n\\nSuggested response based on the reading: An ointment, a magical formula and a supposed night flight on a he-goat to meet other witches; these are recorded allegations, not proven events.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6779,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6780\"},{\"it\":\"Perché gli storici non la considerano una prova affidabile?\",\"other\":\"Why do historians not consider it reliable evidence?\\n\\nSuggested response based on the reading: Interrogations could involve pressure or torture, and confessions could repeat existing stories or suggestions.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6780,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6781\"},{\"it\":\"Che cosa ci insegna questo processo?\",\"other\":\"What does this trial teach us?\\n\\nSuggested response based on the reading: How justice worked in the fifteenth century and what fears existed in society, not that magic existed.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6781,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6782\"},{\"it\":\"Perché il caso di Matteuccia è ancora studiato oggi?\",\"other\":\"Why is Matteuccia’s case still studied today?\\n\\nSuggested response based on the reading: It is an early documented case, important for the history of trials, beliefs and the developing image of the witch.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"comprehension\",\"reading\":\"lettura-08\",\"sourceParagraph\":6782,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6783\"},{\"it\":\"Matteuccia visse nel Quindicesimo secolo.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6785,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6786\"},{\"it\":\"Era conosciuta per l’uso delle erbe medicinali.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6786,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6787\"},{\"it\":\"Gli storici credono che la confessione dimostri l’esistenza della magia.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6787,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6788\"},{\"it\":\"Il processo è documentato da fonti storiche.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6788,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6789\"},{\"it\":\"Nel Medioevo gli interrogatori erano identici a quelli moderni.\",\"other\":\"According to the reading: False (falso).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6789,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6790\"},{\"it\":\"Il caso di Matteuccia è ancora studiato dagli storici.\",\"other\":\"According to the reading: True (vero).\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"truefalse\",\"reading\":\"lettura-08\",\"sourceParagraph\":6790,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6791\"},{\"it\":\"📚 Ripassiamo la grammatica\\nCompleta con il tempo corretto.\\nNel 1428 Matteuccia __________ davanti al tribunale.\\n (comparire)\\nMolte persone __________ da lei per chiedere aiuto.\\n (andare)\\nGli storici __________ ancora oggi questo processo.\\n (studiare)\\nDurante il Medioevo molti abitanti __________ alle streghe.\\n (credere)\\nMatteuccia __________ rimedi con le erbe.\\n (preparare)\\nTu __________ mai sentito parlare di questo processo?\\n (avere)\\n\",\"other\":\"Complete the original grammar or tense-transformation task in Italian. The full source task, including its options and any learner annotations, is preserved on the front. Check the tense and subject agreement; no original answer key is supplied for this task.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"exercise\",\"reading\":\"lettura-08\",\"sourceParagraph\":6792,\"note\":\"Liam · Lettura · Parte 2 – Matteuccia di Todi: il processo del 1428 · DOCX paragraph 6793\"},{\"it\":\"Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case\",\"other\":\"Read the complete original passage, including its historical cautions, vocabulary and exercises. Then answer its questions in Italian. This is a reading task, not an English translation of the passage.\",\"lang\":\"EN\",\"group\":\"Liam · Lettura\",\"tags\":[\"liam\",\"lettura\"],\"kind\":\"reading\",\"reading\":\"lettura-09\",\"sourceParagraph\":6811,\"note\":\"Liam · Lettura · Parte 3 – Le Janare di Benevento: le streghe che entravano nelle case · DOCX paragraph 6812\",\"sourceText\":\"🧙 Le Grandi Leggende delle Streghe Italiane\\nParte 3 – Le Janare di Benevento: le streghe che entravano nelle case\\nNota storica\\n\\nLe Janare appartengono al folclore della Campania, soprattutto della zona di Benevento. Le storie che seguono provengono da racconti popolari tramandati per secoli e da testimonianze raccolte tra il Seicento e l’Ottocento. Non esistono prove storiche che gli eventi soprannaturali descritti siano realmente accaduti.\\n\\n🌞 Prima di leggere\\nVocabolario\\n🏠 la soglia = doorstep\\n🧹 la scopa = broom\\n🧂 il sale = salt\\n🛏️ il letto = bed\\n😱 la paralisi = paralysis\\n🌙 l’incubo = nightmare\\n🔑 la serratura = lock\\n🚪 la porta = door\\n👣 l’impronta = footprint\\n🌑 il buio = darkness\\n\\n📖 «La Janara è entrata in casa»\\nNel Settecento un contadino della provincia di Benevento raccontò una storia che sarebbe stata ripetuta per generazioni.\\nUna sera chiuse bene porte e finestre.\\nPrima di andare a dormire, sua moglie lasciò una scopa davanti all’ingresso della casa.\\nEra un gesto che molte famiglie facevano quasi automaticamente.\\nSecondo la tradizione, se durante la notte fosse arrivata una Janara, sarebbe stata costretta a fermarsi per contare tutti i fili della scopa.\\nIl contadino rise.\\nDisse che erano soltanto superstizioni.\\nQuella notte, però, accadde qualcosa che lo spaventò.\\nSi svegliò all’improvviso.\\nLa stanza era silenziosa.\\nSentiva chiaramente qualcuno camminare vicino al letto.\\nProvò ad alzarsi.\\nNon ci riuscì.\\nTentò di gridare.\\nNessun suono uscì dalla sua bocca.\\nRaccontò di aver visto una figura femminile vicino alla finestra.\\nPochi istanti dopo tutto scomparve.\\nLa mattina seguente disse ai vicini:\\n«La Janara è entrata in casa.»\\nDa quel giorno nessuno della famiglia dimenticò più di lasciare la scopa davanti alla porta.\\n\\n📖 Il sale sul pavimento\\nIn un altro paese della Campania circolava una storia simile.\\nUna donna anziana sosteneva che una Janara cercasse spesso di entrare nella sua casa.\\nUn vicino le consigliò un rimedio molto semplice.\\n«Lascia cadere un pugno di sale davanti alla porta.»\\nSecondo la credenza popolare, la Janara avrebbe dovuto raccogliere o contare tutti i granelli di sale uno per uno.\\nLa donna raccontò che, il mattino seguente, il sale era ancora sul pavimento ma nessuno aveva aperto la porta durante la notte.\\nPer lei quella era la prova che il rimedio aveva funzionato.\\nOggi gli storici interpretano racconti come questo come esempi di tradizioni popolari tramandate oralmente per secoli.\\n\\n📖 Una spiegazione moderna\\nMolte testimonianze sulle Janare hanno un elemento in comune.\\nLe persone raccontavano di:\\nsvegliarsi improvvisamente;\\nnon riuscire a muoversi;\\nsentire una presenza nella stanza;\\navere paura;\\nvedere figure oscure.\\nOggi la medicina conosce un fenomeno chiamato paralisi del sonno.\\nDurante questo episodio una persona può essere cosciente ma incapace di muoversi per alcuni secondi o minuti.\\nAlcune persone riferiscono anche allucinazioni molto realistiche.\\nMolti studiosi ritengono che almeno una parte delle antiche storie sulle Janare possa essere spiegata in questo modo.\\nNaturalmente non possiamo sapere che cosa abbiano realmente vissuto le persone che raccontarono queste esperienze secoli fa.\\n\\n🌍 Curiosità\\n🧹 Perché proprio una scopa?\\nIn molte tradizioni europee si pensava che alcuni spiriti o esseri soprannaturali fossero ossessionati dal contare.\\nLasciare una scopa davanti alla porta significava costringerli a contare tutti i fili di saggina prima di entrare.\\nCon l’arrivo dell’alba sarebbero stati costretti ad andarsene.\\nQuesta credenza esiste, con alcune varianti, anche in altri Paesi europei.\\n\\n🧂 Il sale\\nIl sale era considerato un simbolo di protezione molto prima del Cristianesimo.\\nPe
